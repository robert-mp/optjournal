/* THE METER: one reading placed on the indicator's own fixed scale.
 *
 * It earns its place by making the position readable without reading the number --
 * which is the gradient's job, and the reason the track is not a plain bar: the
 * knob's distance from the centre says how far the arm has run, and the hue behind
 * it says which way. Both scale ends are printed, because a picture whose bounds are
 * not on screen is a picture that could be showing anything.
 *
 * GEOMETRY ATTRIBUTES, NEVER A `style`. Inline styles are forbidden anywhere in this
 * page (a rule with a test behind it), and they are also invisible to the layout
 * assertions, so a knob positioned by CSS would be a knob nothing could check. SVG
 * attributes are what the performance chart and the replay chart already use.
 *
 * NO COLOUR IN THE MARKUP EITHER, which is why the gradient's three stops carry
 * CLASSES and no `stop-color` attribute. A presentation attribute cannot hold a
 * `var()`, so a hex in one is a colour that survives a theme swap unchanged -- the
 * exact defect the performance chart shipped, with Leather's own background
 * hardcoded into a stroke and worn on every theme.
 *
 * `meterKnob` returns null for an absent reading rather than a knob at the left end,
 * because that end is a POSITION and the strongest reading the meter can show. A
 * symbol inside its warm-up window gets the dash and its reason, and no picture. */
function wmeter(w){
  const knob=meterKnob(w.bx_daily,WMETER);
  if(knob==null) return '';
  const mid=WMETER.x+WMETER.w/2;
  return `<svg class="wmeter" viewBox="0 0 168 30" role="img"
    aria-label="${esc(`${num(w.bx_daily,1)} on a fixed scale from ${
      num(WMETER.lo,0)} to +${num(WMETER.hi,0)}`)}">
    <defs><linearGradient id="wmg" x1="0" y1="0" x2="1" y2="0">
      <stop class="lo" offset="0"/><stop class="mid" offset="0.5"/>
      <stop class="hi" offset="1"/></linearGradient></defs>
    <rect x="${WMETER.x}" y="6" width="${WMETER.w}" height="7" rx="3.5"
      fill="url(#wmg)"/>
    <line class="wmzero" x1="${mid}" y1="3" x2="${mid}" y2="16"/>
    <circle class="wmknob ${w.bx_daily>0?'pos':w.bx_daily<0?'neg':''}"
      cx="${knob.toFixed(2)}" cy="9.5" r="5"/>
    <text class="wmend" x="${WMETER.x}" y="28">${num(WMETER.lo,0)}</text>
    <text class="wmend wmr" x="${WMETER.x+WMETER.w}" y="28">+${
      num(WMETER.hi,0)}</text></svg>`;
}

/* THE RING: the rank as a proportion, drawn from 12 o'clock clockwise.
 *
 * Three elements, and each is load-bearing. The TRACK, because an arc with nothing
 * behind it cannot be read as a proportion -- 40% of a circle and 40% of nothing
 * look identical. The ARC, whose length is a fraction of the circumference
 * (`ringArc`), rotated -90 degrees about its own centre so it begins at the top and
 * runs clockwise: a dasharray carries a length and says nothing about where the
 * stroke starts, so the direction is stated here and pinned by `ringPoint`'s tests.
 * The TICK, because the picture and the filter chips must agree about where the cut
 * point is, and it comes from the same `IVR_HIGH` the chips are labelled from.
 *
 * THE TRACK AND THE TICK ARE DRAWN EVEN WITH NO RANK, and the arc is not. An empty
 * ring beside a dash reads as "the scale exists, the reading does not", which is the
 * honest picture on a symbol whose year is still filling in; drawing nothing at all
 * would leave the tile's caption explaining an absence with no shape to attach it
 * to. A rank of 0 draws the same empty arc and is a different fact, so the two are
 * told apart where it counts: the figure beside the ring, and this element's own
 * accessible name. */
function wring(w){
  const ir=ivrOf(w.symbol);
  const value=ir?ir.rank:null;
  const arc=ringArc(value,WRING.r);
  const tin=ringPoint(IVR_HIGH/100,WRING.r-5);
  const tout=ringPoint(IVR_HIGH/100,WRING.r+5);
  return `<svg class="wring" viewBox="0 0 68 68" role="img"
    aria-label="${esc(value==null
      ?'no IV rank yet, so the ring is empty'
      :`${num(value,1)} of 100, with a mark at ${num(IVR_HIGH,0)}`)}">
    <circle class="wrtrack" cx="${WRING.cx}" cy="${WRING.cy}" r="${WRING.r}"/>
    ${arc?`<circle class="wrarc" cx="${WRING.cx}" cy="${WRING.cy}" r="${WRING.r}"
      stroke-dasharray="${arc.on.toFixed(2)} ${arc.off.toFixed(2)}"
      transform="rotate(-90 ${WRING.cx} ${WRING.cy})"/>`:''}
    <line class="wrtick" x1="${(WRING.cx+tin.x).toFixed(2)}"
      y1="${(WRING.cy+tin.y).toFixed(2)}" x2="${(WRING.cx+tout.x).toFixed(2)}"
      y2="${(WRING.cy+tout.y).toFixed(2)}"/></svg>`;
}

/* The detail pane: the open row, with every figure's provenance beside it.
 *
 * Its own grid (`.wdet`), not `.stats`: that row is `display:flex` with an 18%
 * basis and lays equal tiles across one line, and `statCard` emits label ABOVE
 * value with no slot for a delta beside the figure and no way to make one tile
 * wider than its neighbours.
 *
 * Every absent figure is an em dash whose title names the count it waits on,
 * because `sweep.check_no_junk_bindings` fails on `undefined` or `NaN` anywhere in
 * the rendered text and the sweep is the only executed check of this tab.
 */
function watchDetail(w){
  const wq=(S.quotes||{})[w.symbol];
  /* The SAME derivation the row uses, from the same module and with the same
     marker. A pane reading `w.last` beside a row reading `qs[sym].price` is the
     strongest rule in this codebase broken, not a cosmetic slip -- see watch.js
     for the browser-caught defect that produced the rule. */
  const px=shownPrice(w,wq);
  const name=wq&&wq.name?wq.name:'';
  /* Read ONCE per render and passed nowhere: `wring` reads it again through the
     same helper rather than taking it as an argument, so the tile's figure and the
     ring's arc are two reads of one object and cannot describe different symbols. */
  const ivr=ivrOf(w.symbol);
  const way=bxDirection(w.bx_daily_delta);
  const pc=v=>v==null?wdash('not enough stored sessions to measure a change over '
    +'that span'):num(v,2)+'%';

  const daily=wtile('bxtrender · daily',
    w.bx_daily==null?wdash(`${w.closes} of ${BX_SETTLED} sessions stored: inside `
      +`that window the reading is a warm-up figure and its sign can be wrong. `
      +`Run optjournal bars`):num(w.bx_daily,1),
    {klass:'wide',big:true,tint:cls(w.bx_daily),cap:PARAMS_CAPTION,kids:wmeter(w),
     delta:w.bx_daily_delta==null?'':`<span class="${cls(w.bx_daily_delta)}">${
       num(w.bx_daily_delta,1)}</span>${way?WDIR[way]:''}`});
  /* The rank, with the sentence it can print about itself: a min-max rank states
     its own meaning in one line, which is most of why it is the statistic here
     rather than a percentile. The ring above the caption is the same figure as a
     picture; the caption is what makes it readable, and what a ring cannot say. */
  const ring=wtile('ivr · iv rank, 1y',
    ivr?num(ivr.rank,1):wdash(ivrWhy(w.symbol)),
    {klass:'tall',big:true,kids:wring(w),
     /* Every term of the rank, because the rank alone is unfalsifiable: the same
        76.7 inside a two-point year is a different fact from one inside a
        seventy-point year, and the reader cannot tell which without the bounds.
        The provenance sentence rides here too -- this is CBOE's figure, and the
        one place it is guaranteed to be read is beside the number itself. */
     cap:ivr?`implied vol is ${num(ivr.iv30,1)}%, ${num(ivr.rank,1)}% of the way `
       +`from this year's low, ${num(ivr.low,1)}%, to its high, `
       +`${num(ivr.high,1)}%. ${IVR_SOURCE}, as of ${ivr.as_of}`
       :ivrWhy(w.symbol)});
  /* The typed date, and the field that records one. The panel is where the table's
     dash sends the reader, so the field has to be here or that title is a lie. An
     empty value CLEARS: `_watchlist_write` reads a present-and-empty field as
     NULL, which is how a date that has gone by is removed. */
  const earnings=wtile('earnings',
    w.earnings_on?esc(w.earnings_on):wdash(`no earnings date recorded for ${
      w.symbol}; the field below records one`),
    {delta:w.earnings_in_days==null?'':`<span class="dim">${esc(
       w.earnings_in_days<0?'recorded, now past'
       :w.earnings_in_days===0?'today':'in '+w.earnings_in_days+'d')}</span>`,
     cap:'recorded by you, not fetched: no source this journal reaches publishes '
       +'an earnings date, so the days beside it are counted from the ET trading '
       +'day on every load and never stored',
     kids:`<form class="wed" data-wsave="${esc(w.symbol)}"
       data-wfield="earnings_on"><input id="wearn" data-subject="${esc(w.symbol)}"
       value="${esc(w.earnings_on||'')}" placeholder="YYYY-MM-DD" maxlength="10"
       autocomplete="off" spellcheck="false">
       <button class="btn sm" type="submit">Save</button></form>`});
  /* The weekly arm, and its week NAMED and COUNTED. The newest ISO week is
     normally partial and a figure over it repaints every session -- measured on
     TSLA: -19.02, -18.63, -19.71 across one week's three sessions -- so the count
     travels with the value and this tile never prints a bare figure. */
  const weekly=wtile('bxtrender · weekly',
    w.bx_weekly==null?wdash(`${w.weeks} of ${BX_SETTLED} ISO weeks stored`)
      :num(w.bx_weekly,1),
    {tint:cls(w.bx_weekly),
     cap:w.bx_weekly_week==null?'no closes stored yet, so there is no week to read'
       :`${w.bx_weekly_week}, ${w.bx_weekly_sessions||0} session(s) stored of a `
         +`full week's five: the newest week is usually partial, and a figure over `
         +`it repaints as its sessions land`});

  /* Which contracts, not just "held": the strike and the side are the reason to
     look at this name rather than at a chart. Through `strike()`, which keeps a
     half-strike -- 267.5 and 268 are different contracts, and the table cell this
     replaced rounded them together. */
  const opts=(w.options||[]).map(wo=>
    `<div class="mono">${wo.quantity>0?'+':''}${wo.quantity} ${
      wo.strike!=null?strike(wo.strike):''}${wo.put_call||''}${wo.expiry?
      ` <span class="dim">expires ${esc(wo.expiry)}</span>`:''}</div>`).join('');
  return `<div class="wdpane">
    <div class="kicker">underlying</div>
    <div class="wdh"><span class="wdsym">${esc(w.symbol)}</span>
      <span class="big">${wprice(px,w)}</span>
      ${name?`<span class="dim">${esc(name)}</span>`
        :`<span class="dim2">press Refresh prices for the company name</span>`}</div>
    <div class="wdet">${daily}${ring}${earnings}${weekly}</div>
    <div class="stats c3 mt-3">
      ${wtile('1d',pc(px.chg1),{tint:cls(px.chg1),cap:px.live
        ?'from the quote\'s own previous close, so it describes the same session '
          +'as the price above'
        :'from the stored closes, the same series as the price above'})}
      ${wtile('5d',pc(w.change_5d),{tint:cls(w.change_5d),
        cap:'over five stored sessions, from the closes'})}
      ${wtile('realised vol',w.realised_vol==null
        ?wdash(`${w.closes} session(s) stored; six closes is the fewest a `
          +`standard deviation is worth reporting over`)
        :num(w.realised_vol,1)+'%',
        /* The REALISED rank lives here, in the caption of the realised figure it
           ranks, rather than in a second ring. Two rings cut at two different
           points would be a reader's problem, not a feature -- and the pairing is
           the useful part: an implied rank high while the realised rank is low is
           the market charging more than this stock has lately delivered, which is
           the comparison the two numbers exist to support. */
        {cap:'annualised from the stored daily closes'
          +(w.expected_move_5d==null?''
            :`, which implies ±${num(w.expected_move_5d,2)} over five sessions `
              +`-- one standard deviation of what the stock DID`)
          +(w.rv_rank==null?`. No realised rank: ${wrankwhy(w)}`
            :`. That is ${num(w.rv_rank,1)} of 100 against its own year, `
              +`${num(w.rv_rank_low,1)}% to ${num(w.rv_rank_high,1)}% over `
              +`${w.rv_rank_windows} windows`)})}
    </div>
    <div class="wblk"><div class="wk">your positions</div>
      ${opts||`<div class="dim">no open option position on ${esc(w.symbol)} —
        a name you are watching, not one you hold</div>`}</div>
    <div class="mt-3"><button class="wrm" data-wrm="${esc(w.symbol)}"
      title="stop watching ${esc(w.symbol)}: the note and the earnings date go
      with it">stop watching ${esc(w.symbol)}</button></div>
  </div>`;
}

function watchlist(){
  const ws=S.state.watchlist||[];
  /* The add field lives in the header, so editing happens where you are looking.
     Rendered even when the list is empty -- an empty state that only tells you to
     run a CLI command is a dead end when the control could be right there. */
  const adder=`<form id="waddf" class="wadd">
    <input id="wadd" placeholder="+ add symbol" maxlength="24"
      autocomplete="off" spellcheck="false">
    <button class="btn sm" type="submit">Add</button></form>`;
  /* EXACTLY TWO children in the `.crow`: a title cluster and an actions cluster.
     It is `justify-content:space-between` with a two-child assumption, and the old
     header's four children are why the "3 symbol(s)" pill floated to the middle of
     it. That pill is retired rather than moved: once a filter row exists,
     "12 symbol(s)" beside a table showing 7 rows contradicts itself.
     `<h2>`, not the old `<h3>`: app.css styles `.card h2` and styles no h3 at all,
     so this title wore the user agent's size and its 1em margins. BETA is the
     `.pill.gap` the lifecycle headings already use for an inline label, and
     Refresh is a labelled `.btn.sm` -- the Economic Calendar's precedent for a
     section action, and a control whose accessible name is its own text. */
  const header=`<div class="crow">
    <div class="wtitle"><h2>Watchlist</h2><span class="pill gap">BETA</span></div>
    <div class="wacts">${adder}
      <button id="wquote" class="btn sm">Refresh prices</button></div></div>`;

  if(!ws.length) return `<div class="card">${header}
    <div class="empty">nothing watched yet — add a symbol above, or run
      <code>optjournal watch AAPL</code></div></div>`;

  /* Filtered THEN sorted, in `watchRows`, so the row that opens is the first row of
     what is actually on screen. */
  const rows=watchRows();
  /* Which row is open: the reader's choice when they have made one, else the first
     row of the list AS IT IS SORTED AND FILTERED. Derived rather than stored, so the
     URL stays clean until a row is clicked and a re-sort carries the default with it.
     draw() has already healed a symbol the payload no longer holds, so the find can
     only miss when the reader has chosen nothing -- or when the filter is hiding the
     row they chose, which is the one case with NO first row to fall back to and the
     reason both panes have an empty state. `S.wsym` is left standing through it. */
  const wopen=rows.find(w=>w.symbol===S.wsym)||rows[0]||null;
  /* The symbols with no realised vol at all, named in the footer. With the read
     window at 1100 calendar days this is the one instruction that turns this tab's
     dashes into numbers, so it stays a sentence rather than only a title.
     Counted over the WHOLE list rather than the filtered one: the remedy is a `bars`
     run, which is about what the journal stores and not about what is on screen. */
  const thin=ws.filter(w=>w.realised_vol==null).map(w=>w.symbol);
  return `<div class="card">${header}
    ${quoteNote()}
    ${watchFilters(rows.length,ws.length)}
    <div class="wsplit">
      <div class="wtpane">${watchTable(rows,wopen?wopen.symbol:'')}</div>
      ${wopen?watchDetail(wopen):watchNone()}
    </div>
    <div class="dim mkattr">realised vol is what the stock DID; IVR is what the
      market CHARGES for what it might do, ranked against its own year${
      thin.length?` · no vol yet for ${esc(thin.join(', '))}: run
      <code>optjournal bars</code>`:''} · earnings dates are ones you recorded, not
      fetched ones — the days beside them are counted on every load</div>
  </div>`;
}

/* Open one row in the detail pane. A pure redraw and no request: every figure is
   already in the payload.
   Re-selecting the OPEN row does nothing rather than clearing it -- the market
   strip's rule rather than the calendar's toggle, because this panel always shows
   SOME row and clearing would leave the pane empty with no way back but a reload.
   That early return is also what makes the row's own click and the bubbled click
   from the button inside it one selection instead of two renders. */
function selectWatch(symbol){
  if(!symbol||symbol===S.wsym) return;
  S.wsym=symbol;
  draw();
}

/* How old the fetched quotes are, in words.
 *
 * A price with no age is the whole problem this feature could introduce. Run on a
 * Saturday the source returns Friday's 16:00 close for every symbol -- 22 hours
 * old, perfectly correct, and nothing a page may call "live". So the age is
 * stated, and past a session's length it says the DATE instead of a duration:
 * "22h ago" invites you to read a stale number as nearly current.
 *
 * Deliberately not "market open/closed": the chart response carries no such
 * field (checked), so that would be inferred from a clock this page does not
 * own -- a guess presented beside measurements. */
function quoteNote(){
  const meta=S.quotesAt;
  if(!meta) return `<div class="dim wnote">prices are stored daily closes —
    press <b>Refresh prices</b> for a quote</div>`;
  const ages=Object.values(S.quotes||{}).map(wq=>wq.at).filter(a=>a!=null);
  if(!ages.length) return `<div class="dim wnote">no quote came back</div>`;
  const newest=Math.max.apply(null,ages), age=meta-newest;
  const when=age<90?'just now'
    :age<3600?Math.round(age/60)+'m ago'
    :age<6*3600?Math.round(age/3600)+'h ago'
    :new Date(newest*1000).toISOString().slice(0,16).replace('T',' ')+' UTC';
  const stale=age>=6*3600;
  return `<div class="dim wnote">quotes ${esc(when)}${
    stale?' — <b>the market was closed</b>, so this is the last session\'s close'
    :''}</div>`;
}

/* ------------------------------------------------ 0DTE calculator
 *
 * THE ONE TAB WHOSE FIGURES ARE NOT THE JOURNAL'S. Every other surface here
 * reports what IBKR stated, and the pricing quarantine in docs/design-notes.md
 * exists to keep it that way. This one is an instrument rather than a report: it
 * opens on the feed's S&P close and VIX, and the reader may RETYPE either, because
 * a ladder is checked against a tape that is already moving and the stored close
 * is an hour old by 10:30. A typed reading is marked as typed and the feed's own is
 * always one click away; nothing here is ever written to the journal.
 *
 * The arithmetic is all in /static/zdte.js, which `node --test` runs against the
 * reference implementation's own screen. This function does markup only.
 *
 * WHY THE LADDER IS ONE TABLE WITH THE STRIKE DOWN THE MIDDLE. A seller is
 * choosing a distance from the money in two directions at once, and the two
 * choices are not independent -- a strangle is one decision. So the strikes are a
 * single sorted column with the current level marked inside it, calls read
 * leftward and puts rightward, and the row a level sits between is visible in both
 * directions without scrolling between two tables. It is also the shape the
 * platform this journal is checked against uses, which matters when the two are
 * open side by side.
 */
/* What each of `zdte.sessionEvents`' three tiers MEANS, in the reader's words. Here
   rather than in the module because it is wording, and the module is arithmetic and
   policy: it decides which tier a release is in and says nothing about English. */
const ZTIER=['the session is about this','moves the open, or the range','background'];

function odte(){
  const od=S.state.odte;
  if(!od) return `<div class="card"><div class="empty">no data</div></div>`;
  const oc=od.context;
  /* A null context is a real state -- no `bars` fetch has landed the index closes
     yet -- and it says how to fix it rather than drawing an empty ladder. */
  if(!oc) return `<div class="card">
    <div class="crow"><div><h2>0DTE calculator</h2>
      <div class="sub">Strike by strike, from the S&amp;P 500 close and the
      VIX.</div></div></div>
    <div class="note"><b>Not available yet.</b> The calculator opens on the S&amp;P
      and VIX daily closes, which arrive with the price bars — run
      <code>optjournal bars</code> (the daily job fetches them too) and it fills in
      from the next session.</div></div>`;

  /* What the fields hold: what was typed, or the feed's reading where nothing has
     been. `zread` owns that rule for the handlers too -- see its own comment. */
  const spx=zread('spx'), vix=zread('vix');
  const zm=expectedMove(spx,vix);
  const {rows:zrows,hidden:zhidden}=ladderRows(spx,vix,
    {showAll:S.zall,desc:S.zsort==='desc'});
  const marks=scratchLines(zrows,S.zcall,S.zput);
  /* A VIX read on an older session than the S&P close is a fact, not an error: say
     which session each figure is from and let the reader judge, rather than
     printing one date over two figures. */
  const stale=oc.vix_date!==oc.spx_date;

  /* One typed reading, its provenance, and a way back to the feed's. The reset is
     PER FIELD and only appears on the field that was touched: overriding the close
     to a live quote while leaving the VIX as fetched is the ordinary case, so one
     button restoring both would undo a reading the reader still wants. */
  const field=(key,id,label,typed,feed,day)=>`<div class="zfield">
    <label class="zk" for="${id}">${esc(label)}</label>
    <input id="${id}" class="tin zin" inputmode="decimal" maxlength="12"
      autocomplete="off" spellcheck="false" data-zread="${key}"
      aria-describedby="${id}from" value="${esc(zread(key))}">
    <div class="wcap" id="${id}from">${typed==null
      ?`the feed's reading, ${esc(day)}`
      :`typed — the feed read <b>${level(feed)}</b> on ${esc(day)}
        <button class="zlink" data-zreset="${key}">use it</button>`}</div>
  </div>`;

  /* A scratch pad: a level you have sold, read against the close. Three figures
     because they answer three different questions a fill does not -- how far out
     it is in points, the same distance as a percentage (which is what compares to
     the expected move), and which listed contract that level actually is. */
  const pad=(side,zs)=>`<div class="zpad ${side==='call'?'zpadcall':'zpadput'}">
    <div class="zpadh">
      <label class="zk" for="z${side}">Scratch pad ${side} sold</label>
      <button class="zpop" data-zpop="${side}" ${zs?'':'disabled'}
        aria-label="Open the Broker Companion window"
        title="${zs?'Broker Companion — float this pad over your broker'
          :'Enter a sold level first'}">⧉</button>
    </div>
    <input id="z${side}" class="tin zin" inputmode="decimal" maxlength="12"
      autocomplete="off" spellcheck="false" data-zread="${side}"
      placeholder="Enter sold ${side} level" value="${esc(zread(side))}">
    <div class="zreads">
      <div class="zread"><div class="zk">Points from SPX</div>
        <div class="zv">${zs?level(zs.points):'—'}</div></div>
      <div class="zread"><div class="zk">Percent from SPX</div>
        <div class="zv">${zs?pct(zs.pct,2):'—'}</div></div>
      <div class="zread"><div class="zk">Closest $5 strike</div>
        <div class="zv">${zs?level(zs.strike,0):'—'}</div></div>
    </div>
    ${zs&&zs.side!==(side==='call'?'above':'below')
      /* Said out loud rather than refused. A call typed below the level is either
         a typo or a deliberate in-the-money short, and the figures above are true
         about it either way -- what the pad must not do is imply it is an
         out-of-the-money strike. */
      ?`<div class="wcap zwarn">That level is ${esc(zs.side)} the current level,
        so this is an in-the-money ${side}.</div>`:''}
  </div>`;

  /* Spelled out per side rather than assembled from a tag, so every class this
     page can write down is written down: `app.css` is held to the page in BOTH
     directions (tests/test_web.py), and a name built out of fragments is invisible
     to the check that would otherwise catch a rule nobody reaches. */
  const edge=(mark,call)=>mark==='top'?(call?' zctop':' zptop')
    :mark==='bottom'?(call?' zcbot':' zpbot'):'';
  const row=(zr,zl)=>{
    if(zr.current) return `<tr class="zcur">
      <td colspan="3"></td>
      <td class="center fig"><span class="zk">current</span>
        ${level(zr.strike,0)} <span class="zk">current</span></td>
      <td colspan="3"></td></tr>`;
    const call=zr.side==='call';
    const cc=`n zc${edge(zl.call,true)}`, pc=`zp${edge(zl.put,false)}`;
    return `<tr class="${zr.base?'zbase':''}${zl.call==='on'?' zoncall':''}${
      zl.put==='on'?' zonput':''}">
      <td class="${cc}">${call?level(zr.exact):''}</td>
      <td class="${cc}">${call?pct(zr.pct,2):''}</td>
      <td class="${cc}">${call?level(zr.points):''}</td>
      <td class="center zstrike${edge(zl.call,true)}${edge(zl.put,false)}"
        draggable="true" data-zstrike="${zr.strike}"
        title="Drag — or double-click — into a scratch pad">${level(zr.strike,0)}</td>
      <td class="${pc}">${call?'':level(zr.points)}</td>
      <td class="${pc}">${call?'':pct(zr.pct,2)}</td>
      <td class="${pc}">${call?'':level(zr.exact)}</td></tr>`;
  };

  /* Which releases this tab shows is `zdte.sessionEvents`' decision, not this
     function's: US only, ranked by what moves the S&P, and the morning's four Fed
     speakers folded into one chip. Policy that can be wrong while the markup
     renders perfectly belongs where node can run it -- see the module's section.

     THE DOT IS THE JOURNAL'S TIER, and each chip's title says so and names the
     feed's grade beside it. The two disagree most of the time and the disagreement
     is the point: the feed grades every Fed speaker Low, level with gas storage,
     which is the ranking this strip exists to correct. Attributed rather than
     silently substituted -- the Market tab still shows the feed's own view. */
  const {shown:events,hidden:extra}=sessionEvents(oc.events_today);
  return `<div class="card zcalc">
    <div class="crow"><div><h2>0DTE calculator<span class="info tipped"
      tabindex="0"><span class="tip wide">The <b>1σ</b> rows are tinted: they are
      the expected move's own strikes, and the opening view runs outward from them.
      Rails inside the expected move exist on a high-VIX day and are collapsed, not
      dropped — <b>Show more strikes</b> has them. Double-click or drag a strike
      into a scratch pad to read it as a sold level; the coloured line in the ladder
      is where that level falls. Round-trip history for trades opened on their
      expiry date is under <b>Trades</b> with the <b>0DTE</b> filter, and the cohort
      comparison is on the <b>Dashboard</b>.</span>i</span></h2>
      <div class="sub">Where a same-day move lands for <b>${esc(oc.today)}</b>,
      strike by strike. Index levels, not ${esc(BASE())}.</div></div></div>
    ${events.length?`<div class="zevents">${events.map(oe=>`<span
      class="zevent" title="${ZTIER[oe.tier-1]} — the journal's ranking; the feed grades it
        ${esc(oe.impact)}${oe.count>1?`, the highest of the ${oe.count} releases
        this chip merges`:''}. ${oe.count>1?'First at':'At'} ${esc(oe.at)} in the
        market zone."><span class="mkimp ${oe.tier===1?'hi':oe.tier===2?'md':'lo'}"
        ></span><b class="mono">${esc(oe.at)}</b>
      ${esc(oe.title)}</span>`).join('')}
      ${extra>0?`<span class="zevent dim2" title="US releases only, ranked by what
        moves the S&amp;P rather than by the feed's general-audience grade. The
        Market tab lists the whole day, every country, as the feed sends it."
        >+${extra} more US</span>`:''}</div>`
    /* A print at 08:30 is the most common reason a quiet tape turns into a 2% day,
       so its absence is worth stating too -- silence here would read as "not
       checked" rather than as "nothing scheduled". */
    :`<div class="wcap zevents">No US release on the calendar today — a lighter
      tape than a print day, though nothing rules out an intraday headline.</div>`}
    <div class="zfeed">
      ${field('spx','zspx','Most recent closing SPX price',
        S.zspx,oc.spx_prev_close,oc.spx_date)}
      ${field('vix','zvix','Current VIX price',S.zvix,oc.vix,oc.vix_date)}
    </div>
    <div class="zmove">${zm
      /* THE FIGURE STAYS, THE REASONING HIDES. What the expected move IS is a
         number a seller reads at a glance and then sizes against; why the VIX
         de-annualises by 16, what one sigma promises, and why a strike's Move %
         is not quite its rail's are each true once and then in the way. So the
         line carries the reading and the `i` carries the argument -- the idiom
         the Statistics heading already uses for the same reason. */
      ?`<span class="zk">expected move</span>
      <b class="zfig">±${pct(zm.pct,2)}</b><span class="dim2">·</span>
      <b class="zfig">±${level(zm.points)}</b><span class="dim">points</span>
      <span class="zsig">1σ</span><span class="info tipped" tabindex="0"><span
        class="tip wide">A VIX of <b>${level(parseNumber(vix))}</b> read as one
        session — the desk's <b>÷ ${VIX_DIVISOR}</b>, not the textbook root of 252
        — is an expected move of <b>±${pct(zm.pct,2)}</b>, or
        <b>±${level(zm.points)}</b> points. That is ONE SIGMA: roughly two closes
        in three land inside it, which is a probability and not a limit. Each rail
        below is a percentage of the level resolved to the nearest listed <b>$5</b>
        strike, so a strike's <b>Move %</b> is the distance to the CONTRACT and
        reads a little either side of the rail that produced it.${stale? ` The VIX
        is from ${esc(oc.vix_date)} while the S&amp;P close is
        ${esc(oc.spx_date)}; the next fetch aligns them.`:''}</span>i</span>`
      /* An instruction, not an explanation, so it stays on screen: there is no
         figure to hide it behind and nothing on the tab works until it is
         followed. */
      :`<span class="dim2">Enter a closing SPX level and a VIX to draw the
        ladder.</span>`}</div>
    <div class="zpads">
      ${pad('call',scratchRead(spx,S.zcall))}
      ${pad('put',scratchRead(spx,S.zput))}
    </div>
    ${zrows.length?`<div class="zladwrap"><table class="zlad"><thead><tr>
      <th class="n zc">Call exact</th><th class="n zc">Move %</th>
      <th class="n zc">Points</th>
      <th class="center"><button class="wsb" data-zsort
        title="Sort the strike column the other way">Strike <span class="wsg"
        >${S.zsort==='desc'?'▼':'▲'}</span></button></th>
      <th class="zp">Points</th><th class="zp">Move %</th>
      <th class="zp">Put exact</th></tr></thead>
      <tbody>${zrows.map((zr,i)=>row(zr,marks[i])).join('')}</tbody></table>
      ${zhidden||S.zall?`<div class="zmore"><button class="btn sm" data-zall
        >${S.zall?'Show fewer strikes'
        :`Show ${zhidden} more strike${zhidden===1?'':'s'}`}</button></div>`:''}</div>`
    :`<div class="empty">no ladder yet — both readings above have to be
      numbers</div>`}
    ${zscore(od.history)}
  </div>`;
}

/* HOW OFTEN EACH RAIL ACTUALLY HELD, which is the one thing the ladder above
 * cannot tell you. The expected move is quoted as "roughly two closes in three",
 * and a journal that prints that figure for months without ever checking it
 * against its own index is repeating a textbook rather than measuring anything.
 * This counts.
 *
 * SCORED FROM THE BARS, NOT FROM A SNAPSHOT TABLE. The reference implementation
 * stores a row per session with its ten derived levels and so can only count from
 * the day its calculator was first opened. `price_bars` already holds every daily
 * S&P and VIX close, so `zdte.railScores` re-draws each past band from the same
 * `RAIL_PCTS` this tab uses and the whole history is scorable at once. A rail that
 * is recomputed cannot disagree with the rail on screen.
 *
 * THE CAVEAT IS ON SCREEN RATHER THAN IN A COMMENT. These bands are drawn from the
 * PRIOR session's VIX close, because a daily series has no intraday reading, while
 * the ladder above uses the live one. Near enough to be worth counting, different
 * enough that the reader has to be told, so the note says it in place of implying
 * the score is exactly what this tab showed that morning. */
function zscore(history){
  const {sessions,rails}=railScores(history);
  if(!rails.length) return `<div class="zscore"><div class="empty">no settled
    sessions to score yet — two sessions of price bars and the rails start
    keeping a record</div></div>`;
  const sigma=rails.find((r)=>r.label===SIGMA_LABEL);
  return `<div class="zscore">
    <div class="crow"><div><h3>How often each rail held</h3>
      <div class="sub">${sessions.length} settled session${
        sessions.length===1?'':'s'}, scored against what the index did next.</div>
    </div></div>
    <table class="zsc"><thead><tr><th>Rail</th><th class="n">Held</th>
      <th class="n">Of</th><th class="n">Rate</th></tr></thead>
      <tbody>${rails.map((r)=>`<tr${r.label===SIGMA_LABEL?' class="zsig-row"':''}
        ><td>${esc(r.label)}</td><td class="n">${r.held}</td>
        <td class="n">${r.tested}</td>
        <td class="n">${pct(r.rate*100,0)}</td></tr>`).join('')}</tbody></table>
    <div class="note">${sigma?`The 1σ held <b>${pct(sigma.rate*100,0)}</b> of
      ${sigma.tested} session${sigma.tested===1?'':'s'}, against the <b>≈68%</b>
      one sigma implies. `:''}A record, not a promise.${infoTip(`Each band here is
      drawn from the <b>previous</b> session's VIX close, because stored daily bars
      carry no intraday reading. The ladder above uses the <b>live</b> VIX, so
      these are the rails the last settled readings would have drawn rather than
      the exact ones this tab showed that morning. Close enough to be worth
      counting, and far enough apart to say so: the same S&amp;P close can carry a
      settled VIX of 16.33 against a 15.67 read intraday.`)}</div>
  </div>`;
}

/* 0DTE against the rest of the book, on the DASHBOARD rather than on its own tab.
 *
 * It was the top of the 0DTE tab until the calculator took that tab over, and the
 * move is the honest place for it: this is a scoreboard reading -- the same
 * question the cards above it answer, asked of one cohort -- while the calculator
 * is a pre-open instrument that shares only the acronym. The round-trip LIST that
 * travelled with it is gone rather than moved: Trades with the 0DTE filter is that
 * list, re-summed server-side, so keeping a second copy here meant two renderings
 * of one query that could disagree about what the filter means.
 */
function odteCohorts(){
  const od=S.state.odte;
  if(!od) return '';
  const closedTotal=od.cohort.episodes+od.rest.episodes+od.unknown_dte;
  /* Nothing closed at all means there is no cohort to compare, and two all-zero
     blocks are noise. Silent rather than empty: this card is a comparison, and a
     journal with no closed round trip has not made one yet. */
  if(!closedTotal) return '';
  /* A cohort of one against a cohort of eight will always show a difference in win
     rate, and it means nothing. Flagged rather than hidden, because the numbers are
     real and worth showing -- what is not real is the comparison. Ten is a
     judgement call, stated as such on screen: a defensible threshold would need a
     significance test this tool has no business claiming to run. */
  const thin=Math.min(od.cohort.episodes,od.rest.episodes)<10;
  const block=co=>`<div class="card">
    <h2 class="sub2">${esc(co.label)}</h2>
    <div class="stats c2">
      ${statCard('Round trips',co.episodes,`${co.contracts} contracts`,'sm')}
      ${statCard('Win rate',pct(co.win_rate),`${co.wins}W / ${co.losses}L`,'sm')}
      ${statCard('Net P&L',moneyOf(co.net_pnl),'realised, net of commission',
        'sm '+cls(co.net_pnl.base))}
      ${statCard('Avg per trip',co.avg_pnl==null?'—':moneyOf(co.avg_pnl),
        'wins and losses together','sm '+cls(co.avg_pnl?.base))}
    </div></div>`;
  return `<div class="card">
    <div class="crow"><div><h2>Zero days to expiration${infoTip(
      `<b>Avg per trip</b> is the figure that decides whether the cohort is worth
       trading, not the win rate: a better win rate with a worse average is a losing
       strategy. That is why the rest of the book is shown beside it — a high 0DTE
       win rate means nothing on its own.
       <br><br>Counted per contract ROUND TRIP here, not per position as in the
       scoreboard above. A 0DTE cohort is defined by a contract's expiry and a
       rolled position spans several, so it has no single DTE to sort it by. The two
       win rates are different questions and need not match.`)}</h2>
      <div class="sub">Contracts opened on their own expiry date, against everything
      else. Whole journal, whatever the month filter says. ${esc(ccyNote())}</div></div>
      <div class="pills"><span class="pill">0DTE <b>${od.cohort.episodes}</b></span>
        <span class="pill dim">rest of book <b>${od.rest.episodes}</b></span></div></div>
    ${thin?`<div class="note"><b>Too few round trips to conclude anything.</b>
      ${od.cohort.episodes} 0DTE against ${od.rest.episodes} other.${infoTip(
      `A difference in win rate across samples this small is noise, not evidence.
       The threshold is a rule of thumb, not a significance test.`)}</div>`:''}
    <div class="duo">${block(od.cohort)}${block(od.rest)}</div>
    ${od.unknown_dte?`<div class="note">${od.unknown_dte} closed round trip(s) carry no
      expiry, so their DTE is unknown rather than non-zero. They are excluded from both
      columns above.</div>`:''}
  </div>`;
}

/* THE READING IN FORCE: what was typed, or the feed's where nothing has been.
 *
 * One function because the view and the handlers must not disagree about which
 * number is on screen. A double-click deciding "above the current level" against
 * the payload's close while the ladder was drawn around a typed one would put a
 * strike in the wrong pad, and the two rules sitting six hundred lines apart is
 * exactly how that happens. */
const zread=key=>{
  const oc=((S.state||{}).odte||{}).context;
  if(key==='spx') return S.zspx==null?zfeed(oc&&oc.spx_prev_close):S.zspx;
  if(key==='vix') return S.zvix==null?zfeed(oc&&oc.vix):S.zvix;
  return (key==='call'?S.zcall:S.zput)||'';
};

/* The feed's own reading, as the two decimals a platform quotes it in.
 *
 * `toFixed`, NOT `level()`: this string goes into an <input>, and `level` formats
 * for the reader's locale -- where a decimal comma is correct on screen and would
 * be stripped by the field's own digits-and-one-dot mask into 770603. The stored
 * close is a float32 from the bar feed, so it arrives as 7706.02978515625: two
 * decimals is both what the index is quoted to and what keeps every rail below
 * derived from a number the reader can see in full. */
const zfeed=value=>value==null?'':Number(value).toFixed(2);

/* Set one field's state AND the live node, then redraw.
 *
 * The node matters, and this is the one non-obvious thing about the calculator's
 * wiring. `preserveInputs` carries every field's text across the render by reading
 * the DOM first and writing it back after -- which is what makes typing survive a
 * whole-body re-render -- so a handler that changed only the STATE would have its
 * new value rendered into the markup and then immediately overwritten by the stale
 * text still sitting in the old input. Setting both keeps the two agreeing at the
 * only moment the preserver looks. */
function zfill(key,value){
  if(key==='spx') S.zspx=value;
  else if(key==='vix') S.zvix=value;
  else if(key==='call') S.zcall=value;
  else S.zput=value;
  const el=$('#z'+key);
  if(el) el.value=value==null?zread(key):value;
  draw();
}

/* Every control on this tab is a PURE REDRAW. The ladder is four typed fields and
   a payload already in hand, so nothing here costs a request -- which is also why
   typing can afford to redraw on every keystroke. */
function bindZdte(){
  document.querySelectorAll('input[data-zread]').forEach(el=>{
    const key=el.dataset.zread;
    el.oninput=()=>{
      /* Masked as it is typed, not validated on blur: a stray letter has to be
         refused at the moment it would otherwise blank the ladder. The caret then
         goes back where it was, less whatever the mask removed -- without that,
         typing into the middle of a number jumps the cursor to the end. */
      const was=el.value, clean=sanitizeLevel(was);
      if(clean!==was){
        const at=Math.max(0,(el.selectionStart||clean.length)-(was.length-clean.length));
        el.value=clean;
        try{ el.setSelectionRange(at,at); }catch(err){ /* unsupported type */ }
      }
      zfill(key,clean);
    };
    /* A strike dragged from the ladder lands in a PAD, never in a reading: the two
       readings are what the ladder is drawn from, and dropping one of its own rows
       back into them would be a loop with no meaning. */
    if(key!=='call'&&key!=='put') return;
    el.ondragover=ev=>{ev.preventDefault();};
    el.ondrop=ev=>{
      ev.preventDefault();
      const text=ev.dataTransfer?ev.dataTransfer.getData('text/plain'):'';
      if(text) zfill(key,sanitizeLevel(text));
    };
  });
  /* Two ways to move a strike into a pad, because the mouse gesture people reach
     for differs: drag when the target is in sight, double-click when it is not.
     Which pad is decided by the SIDE the strike is on, not by which pad is empty --
     a level below the market is a put whatever the reader has typed so far. */
  document.querySelectorAll('[data-zstrike]').forEach(el=>{
    el.ondragstart=ev=>{
      if(ev.dataTransfer) ev.dataTransfer.setData('text/plain',el.dataset.zstrike||'');
    };
    el.ondblclick=()=>{
      const at=parseNumber(el.dataset.zstrike), close=parseNumber(zread('spx'));
      if(at==null||close==null||at===close) return;
      zfill(at>close?'call':'put',String(at));
    };
  });
  document.querySelectorAll('[data-zreset]').forEach(b=>
    b.onclick=()=>zfill(b.dataset.zreset,null));
  document.querySelectorAll('[data-zsort]').forEach(b=>
    b.onclick=()=>{S.zsort=S.zsort==='desc'?'asc':'desc';draw();});
  document.querySelectorAll('[data-zall]').forEach(b=>
    b.onclick=()=>{S.zall=!S.zall;draw();});
  document.querySelectorAll('[data-zpop]').forEach(b=>
    b.onclick=()=>openCompanion());
}

/* THE BROKER COMPANION: the scratch pads in a window of their own.
 *
 * The one thing this page does that a tab cannot. A 0DTE seller works in the
 * broker's order ticket, not in a journal, and the figure they need while doing it
 * is how far the level they are about to sell sits from the close -- so it goes in
 * a small always-visible window over the ticket, and the ladder stays here.
 *
 * `/companion` is its own document rather than this page in a narrow window: the
 * shell alone is a header slab, nine tabs and a payload fetch, none of which is
 * wanted at 320 pixels, and the companion needs no payload at all -- the two
 * levels and the close travel in its hash. It carries the reader's theme for the
 * same reason the favicon carries its own colours: it renders outside this page,
 * where nothing here reaches it.
 *
 * ONE WINDOW, REUSED. Named, so a second click focuses the window already floating
 * over the broker instead of opening another, and `noopener` is deliberately
 * absent: `companionPost` needs the handle to keep the floating figures in step
 * with what is typed here. Same origin both ways, and the message is two numbers.
 */
function companionUrl(){
  const hs=new URLSearchParams();
  hs.set('spx',zread('spx'));
  if(S.zcall) hs.set('call',S.zcall);
  if(S.zput) hs.set('put',S.zput);
  /* Leather is what `:root` carries, so the default stays out -- the rule the
     page's own hash follows for every default it holds. */
  if(S.theme&&S.theme!==THEMES[0][0]) hs.set('theme',S.theme);
  return '/companion#'+hs;
}
function openCompanion(){
  if(S.zpop&&!S.zpop.closed){
    /* Already floating: post the current figures into it and bring it forward,
       rather than reloading a window the reader has already positioned. */
    companionPost();
    S.zpop.focus();
    return;
  }
  /* Tall enough for two pads only when there are two. A window sized for what is
     not there is a window covering the ticket it is meant to sit beside. */
  const both=!!(S.zcall&&S.zput);
  S.zpop=window.open(companionUrl(),'bitacora-companion',
    `width=330,height=${both?392:236}`);
}
/* Called from `draw()`, so the floating pad follows every keystroke here and the
   two surfaces cannot show different levels. A no-op until a window exists, and
   after the reader closes one. */
function companionPost(){
  if(!S.zpop||S.zpop.closed) return;
  S.zpop.postMessage({spx:zread('spx'),call:S.zcall||'',put:S.zput||'',
    theme:S.theme||THEMES[0][0]},location.origin);
}

/* ------------------------------------------------ settings panel

   TWO CARDS, and the split is the point. This panel was one card holding version
   strings, absolute paths, a 25-row archive inventory and a timestamp -- every
   one of them read-only. It was labelled Settings and let a reader change
   nothing, which is a worse answer than having no panel: someone looking for
   where to put their Flex query id found a table that displayed it.

   So: SETTINGS is the things a person can change, and each control writes
   through and says so. ADVANCED is the diagnostics that were here before, behind
   a <details> because their audience is someone debugging, not someone
   configuring -- and the archive table is 25 rows on this journal, which is a
   scroll nobody asked for on the way to two buttons. */
/* SAYS SO WHEN A HEADLINE CONTAINS AN ESTIMATE.

   Every other figure this journal reports is broker-stated -- see
   docs/design-notes.md, which quarantines modelled numbers so none can reach a
   card. Same-session fills are the sanctioned exception: a Trade Confirmation
   carries no FX rate, so their base-currency figures are converted at a live rate
   fetched at ingest. The exception is only defensible if the page admits it, which
   is what this is.

   Silent when there is nothing provisional, which is the steady state: a journal
   whose confirms have all been superseded shows no banner at all. */
function provisionalBanner(){
  const pv=(S.state&&S.state.provisional)||{};
  if(!pv.unsettled) return '';
  /* IBKR sends `20260924`; every other date on this page is dashed, and a caption
     mixing the two spellings reads like a leaked internal field. */
  const raw=String(pv.newest||'');
  const iso=/^\d{8}$/.test(raw)
    ? `${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}` : raw.slice(0,10);
  const day=iso?` (newest ${esc(iso)})`:'';
  /* TWO COUNTS, and the wording follows whichever is the stronger claim. An
     estimated rate makes the money approximate; an unsettled fill merely has no
     realised P&L yet. Reporting only the second would understate it. */
  return pv.fills
    ? ` <b class="warn2">${pv.fills} same-session fill(s)${day}</b> —
      base-currency figures are estimated at a live FX rate and no realised P&L
      exists yet; tomorrow's statement restates them.`
    : ` <b class="warn2">${pv.unsettled} same-session fill(s)${day}</b> —
      no realised P&L exists for these yet; tomorrow's statement settles them.`;
}

function settingsPanel(){
  const st=S.state, se=st.settings||{};
  const src=se.query_id_source;
  const overridden=src==='override';
  const tok=se.token;
  /* The token is PRESENCE only, fetched on demand -- see the Settings typedef on
     why it is not on the payload. Three states, not two: null means nobody has
     asked yet, and rendering that as "missing" would tell a reader with a
     perfectly good token to go and re-enter it. */
  const tokLine=tok===null||tok===undefined
    ? `<span class="dim2">not checked</span>`
    : tok.present===true
      ? `<span class="pos">stored</span> <span class="dim">for ${esc(tok.account||'')}</span>`
      : tok.present===false
        ? `<span class="neg">missing</span> <span class="dim">— run
           <code>optjournal setup</code></span>`
        : `<span class="neg">unreadable</span> <span class="dim">${esc(
           tok.message||'')}</span>`;
  return `<div class="card">
    <div class="crow"><div><h2>Settings</h2>
      <div class="sub">Stored beside the journal in <code>.optjournal.json</code>,
      so they survive a restart. The Flex <b>token</b> is the exception: it goes to
      the OS keyring, and this page can replace it but never read it back.
      </div></div></div>

    <h2 class="sub3 mt-5">IBKR connection</h2>
    <div class="setrow">
      <label class="flabel" for="qid">Flex Query ID</label>
      <input id="qid" class="tin mono" inputmode="numeric" maxlength="32"
        value="${esc(se.query_id||'')}" placeholder="1591754"
        ${overridden?'disabled':''}>
      <button id="qidsave" ${overridden?'disabled':''}>Save</button>
      <span id="qidmsg" class="dim"></span>
    </div>
    ${overridden?`<div class="note">This id comes from a
      <code>--query-id</code> flag or <code>$OPTJOURNAL_QUERY_ID</code>, which
      outrank anything saved here — so the field is read-only rather than
      accepting a value that would not take effect. Drop the flag to edit it
      from this page.</div>`
      :src==='unset'?`<div class="note"><b>No query id yet.</b> Client Portal →
        Performance &amp; Reports → Flex Queries. Sync stays disabled until this
        is set.</div>`:''}
    <div class="setrow mt-4">
      <label class="flabel" for="cqid">Confirms Query ID</label>
      <input id="cqid" class="tin mono" inputmode="numeric" maxlength="32"
        value="${esc(se.confirm_query_id||'')}" placeholder="optional">
      <button id="cqidsave">Save</button>
      <span id="cqidmsg" class="dim"></span>
    </div>
    <div class="note">Optional. A <b>Trade Confirmation</b> query makes today's fills
    appear within minutes.${infoTip(
    `A confirm reports fills the SAME session, where the Activity Statement above is
     next-day. With one set, the journal polls it through market hours.
     <br><br>Those fills are marked <b>provisional</b>, because a confirm carries no
     realised P&amp;L and no FX rate.
     <br><br>Leave it empty for statement-only, which is what every figure here was
     built on.`)}</div>

    <div class="setrow mt-4">
      <label class="flabel" for="tok">Flex token</label>
      <input id="tok" class="tin mono" type="password" autocomplete="off"
        placeholder="paste to replace">
      <button id="toksave">Save</button>
      <span id="tokmsg" class="dim"></span>
    </div>
    <div class="setrow">
      <span class="flabel"></span>
      <span>${tokLine}</span>
      <button id="tokcheck">Check keyring</button>
      <span class="dim">presence only, and never the value</span>
    </div>
    <div class="note">Client Portal → Settings → Flex Web Service. Press
    <b>Sync</b> after saving.${infoTip(
    `An expired token still reads as <b>stored</b> here: the keyring holds whatever
     it was given, and only a real fetch can say whether IBKR still accepts it.`
    )}</div>

    ${scoringRow()}
    ${tileChooser()}

    <details class="adv mt-5"${st.dev?' open':''}>
      <summary>Advanced — journal details and archive</summary>
      <div class="note">Diagnostics, not settings: nothing here is editable, and
      it is what you want when something looks wrong rather than when you are
      setting the journal up.</div>
      <table><tbody>
        <tr><td class="dim">version</td><td class="mono">${esc(st.version)}</td></tr>
        <tr><td class="dim">database</td><td class="mono">${esc(st.db)}</td></tr>
        <tr><td class="dim">archive</td><td class="mono">${esc(st.archive)}</td></tr>
        <tr><td class="dim">last fetch</td><td class="mono">${esc(st.sync.last_fetch||'never')}</td></tr>
        <tr><td class="dim">fetch cooldown</td><td class="mono">${st.sync.cooldown_s}s
          (${st.sync.cooldown_remaining_s}s remaining)</td></tr>
        <tr><td class="dim">generated</td><td class="mono">${esc(st.generated_at)}</td></tr>
      </tbody></table>
      <h2 class="sub3 mt-5">Archive — ${(st.statements||[]).length} statement(s)</h2>
      <table><thead><tr><th>file</th><th>period</th><th class="n">bytes</th>
        <th>ingested</th><th>assets</th></tr></thead><tbody>
        ${(st.statements||[]).map(stm=>`<tr><td class="mono">${esc(stm.file)}</td>
          <td class="dim">${esc(stm.from_date||'?')} → ${esc(stm.to_date||'?')}</td>
          <td class="n">${(stm.bytes||0).toLocaleString()}</td>
          <td class="${stm.ingested?'pos':'dim2'}">${stm.ingested?'yes':'no'}</td>
          <td class="dim">${esc(stm.asset_filter||'-')}</td></tr>`).join('')}
      </tbody></table>
      <div class="note"><b>Needs the Flex query template:</b>
        <i>Gain % of Net Liq</i> reads the Equity Summary section — enable it on the
        query and sync, and the figure fills in from the next statement. <i>Trade
        Replay</i> needs intraday underlying prices, implied volatility and greeks —
        none of which a statement carries.</div>
    </details>
  </div>`;
}

/* ------------------------------------------------ view state in the URL

   The filter, the month and the tab live in the hash so a reload lands on the
   view you left, and so a link carries it. Persisting only the trade filter
   would have been worse than persisting nothing: reload would restore the 0DTE
   scope while silently dropping the month and jumping to the Dashboard, a
   combination that was never on screen.

   `replaceState`, not `location.hash = ...`: assigning pushes a history entry
   per click, so toggling a filter a few times buries the page under back-button
   history. Nothing here is a navigation. */
const HASH_TABS=()=>TABS.map(t=>t[0]);
function applyHash(){
  /* Not `h` -- that is the history payload everywhere else in this page, and
     one name for two shapes is what blinds the payload guard to both. */
  const hs=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const tab=hs.get('tab');
  /* Validated against the enabled tabs rather than trusted: an unknown or
     disabled id would otherwise render "nothing here yet" from a URL. An
     ABSENT key must reset to the default, not leave the current tab standing:
     the back button lands on entries whose hash has no tab key, and keeping
     the old tab made syncHash rewrite it into the entry just navigated to. */
  S.tab=(tab&&HASH_TABS().includes(tab))?tab:'dashboard';
  S.type=hs.get('type')||null;
  S.month=hs.get('month')||null;
  S.ccy=(hs.get('ccy')||'').toUpperCase()||null;
  /* The drill-down selection was the one piece of view state the URL did not
     carry, so a link to "that day" was unshareable and a reload silently
     dropped the panel while leaving the calendar looking untouched. Validated
     against the payload in draw(), not here: a day from another month means
     nothing in this one, and applyHash runs before the state it would check. */
  S.calday=hs.get('calday')||null;
  S.replay=hs.get('replay')||null;
  /* Upper-cased, because that is how `_watchlist_write` stores a symbol and how
     the payload sends it back: `#wsym=dell` from a hand-typed URL would otherwise
     match no row and heal away, silently losing a link that was almost right.
     Validated in draw() against the payload rather than here, for calday's
     reason -- applyHash runs before the state it would check exists. */
  S.wsym=(hs.get('wsym')||'').toUpperCase()||null;
  /* Validated against the registry, like the tab: an unknown id would otherwise
     put an unstyled `data-theme` on <html>, where the attribute matches no block
     and the page silently falls back to `:root` while the chip claims the bogus
     name. Healing to null instead means the chip and the palette agree. */
  const th=(hs.get('theme')||'').toLowerCase();
  S.theme=THEME_IDS().includes(th)?th:null;
  /* Repeated key, not a delimited string: `#cost=OPT&cost=CASH`. URLSearchParams
     already models a repeated key, and `getAll` is the whole parser -- inventing
     a separator would mean the page and the server each carrying a split rule
     that has to agree. Empty stays null ("not chosen") rather than becoming an
     empty array, which the server would read as a selection of nothing. */
  const cost=hs.getAll('cost').filter(Boolean);
  S.cost=cost.length?cost:null;
  /* Validated against the two units the server knows, like the tab and the
     theme: an unknown value would otherwise put a chip in an impossible state
     while the server quietly served the default, so the control would disagree
     with the figures beside it. */
  const sco=(hs.get('scoring')||'').toLowerCase();
  S.scoring=SCORINGS.includes(sco)?sco:null;
  /* THE CALCULATOR'S TYPED FIELDS RIDE IN THE HASH, like the tab and the filter,
     and for both of the reasons stated at the top of this section: a reload lands
     on the view you left, and a link carries it. The second one earns its keep
     here more than anywhere else on the page -- "the ladder around 7706 with my
     short call at 7780" is a thing worth sending to yourself, and the four fields
     are the whole of it.
     Run through the same mask the keystroke handler uses, because a hash is
     hand-editable: `#spx=seven` would otherwise sit in the address bar describing
     a ladder the page cannot draw. An empty result reads as null (the feed's
     reading stands) rather than as a cleared field, since a URL carrying `spx=`
     was not a reader clearing anything. */
  const typed=key=>{
    const raw=sanitizeLevel(hs.get(key)||'');
    return raw===''?null:raw;
  };
  S.zspx=typed('spx');S.zvix=typed('vix');
  S.zcall=typed('call');S.zput=typed('put');
  S.zall=hs.get('strikes')==='all';
  S.zsort=hs.get('strikesort')==='desc'?'desc':'asc';
}
function syncHash(push){
  const hs=new URLSearchParams();
  /* Defaults are omitted so the common case has a clean URL, and so a stale
     key cannot outlive the state it described. The display currency's default
     is the account base, so only a restatement is worth recording. */
  if(S.tab&&S.tab!=='dashboard') hs.set('tab',S.tab);
  if(S.type) hs.set('type',S.type);
  if(S.month) hs.set('month',S.month);
  if(S.ccy&&S.ccy!==BASE()) hs.set('ccy',S.ccy);
  if(S.calday) hs.set('calday',S.calday);
  if(S.replay) hs.set('replay',S.replay);
  /* Only an EXPLICIT selection is recorded. The pane's default is the first row
     of the sorted list, derived on every render, so writing it here would put a
     symbol in every watchlist URL to say "the one you would have got anyway" --
     the rule the theme and the display currency already follow for their
     defaults, and it also stops a re-sort from rewriting the address bar. */
  if(S.wsym) hs.set('wsym',S.wsym);
  /* Leather is what `:root` already carries, so recording it would put a key in
     every URL to say "the default" -- the same rule the display currency follows
     for the account base. */
  if(S.theme&&S.theme!==THEMES[0][0]) hs.set('theme',S.theme);
  /* `append`, so the multi-select round-trips as the repeated key applyHash
     reads. `set` would keep only the last one and silently narrow a four-way
     selection to one on the next reload. */
  (S.cost||[]).forEach(c=>hs.append('cost',c));
  /* Only the non-default, like the theme and the display currency: recording
     'position' would put a key in every URL to say what the server already
     assumes. */
  if(S.scoring&&S.scoring!==SCORINGS[0]) hs.set('scoring',S.scoring);
  /* Only what was TYPED, and only while it differs from the feed -- `draw()` heals
     a reading that has come back into agreement with the payload, so this writes
     an override and never a restatement of what the server already sent. The two
     view switches follow the theme's rule: the default stays out of the URL. */
  if(S.zspx!=null) hs.set('spx',S.zspx);
  if(S.zvix!=null) hs.set('vix',S.zvix);
  if(S.zcall!=null) hs.set('call',S.zcall);
  if(S.zput!=null) hs.set('put',S.zput);
  if(S.zall) hs.set('strikes','all');
  if(S.zsort==='desc') hs.set('strikesort','desc');
  const next=hs.toString()?'#'+hs:'';
  if(next===(location.hash||'')) return;
  /* A tab jump is a navigation, so it pushes and the back button walks tabs.
     Everything else -- filter, month, currency -- mutates the current entry:
     those are adjustments to the view you are on, and pushing them would bury
     the tab trail under one entry per click. Clicking the current tab is a
     no-op by the guard above, so it cannot mint duplicate entries. */
  if(push) history.pushState(null,'',location.pathname+next);
  else history.replaceState(null,'',location.pathname+next);
}

/* ------------------------------------------------ shell */
function draw(push){
  /* A currency the account has no quote for falls back to base on display
     (DISP does that); clearing it makes the hash heal to match. Healed here
     rather than in load() because a hash edit is a same-document navigation
     -- load() never runs for it, only the hashchange -> draw path does. */
  if(S.ccy&&S.state&&S.ccy!==BASE()&&!QUOTES().some(qo=>qo.code===S.ccy)) S.ccy=null;
  /* A day the payload holds no fills for cannot be drilled into, so it heals
     out of the URL rather than sitting there describing nothing -- the same
     discipline the display currency follows. Checked HERE, before syncHash:
     dayDetail's own guard runs during render, by which point the stale key has
     already been written to the address bar. */
  if(S.calday&&S.state&&!(((S.state.stats||{}).days)||[])
      .some(dy=>dy.day===S.calday)) S.calday=null;
  /* Same discipline for the replay key: a lifecycle that the current trade-type
     filter excludes leaves its key describing nothing, and a key that outlives
     its panel is how the old registry rotted. Checked before syncHash so the
     address bar never carries a key the page cannot open. */
  if(S.replay&&S.state&&!((S.state.replays||{})[S.replay])) S.replay=null;
  /* And the same for the watched symbol, which has one edge the other two do not:
     the reader can DELETE the row that is open. Stop watching DELL and the payload
     reloads without it, so without this heal the URL keeps naming DELL, the pane
     falls back to the first row, and the address bar describes a symbol the
     journal no longer holds. Before syncHash, like both of its siblings. */
  if(S.wsym&&S.state&&!((S.state.watchlist||[])
      .some(w=>w.symbol===S.wsym))) S.wsym=null;
  /* A typed reading that AGREES with the feed is not an override, so it heals out
     of the URL -- the same discipline the display currency and the theme follow
     for their defaults. Nothing moves on screen when it does: the field falls back
     to the payload's reading, which is the number that was just typed. */
  if(S.state){
    const oc=(S.state.odte||{}).context;
    if(oc){
      /* Compared as the STRING the field would hold without an override, which is
         the feed's reading at two decimals -- not the stored float, which no
         reader can retype (7706.02978515625). */
      if(S.zspx===zfeed(oc.spx_prev_close)) S.zspx=null;
      if(S.zvix===zfeed(oc.vix)) S.zvix=null;
    }
  }
  /* A running playback drives element ids that this render is about to
     replace, so it has to die with them. */
  replayStop();
  syncHash(push);
  renderRail();
  /* Before the body renders, not after: the attribute drives every colour on the
     page, so setting it later would paint one frame in the old palette. */
  applyTheme();
  renderKicker();
  renderPeriod();
  renderViewOptions();
  const views={dashboard,calendar,trades,positions,costs,annual,review,odte,market,
    watchlist};
  const v=views[S.tab];
  /* WHAT THE USER WAS TYPING SURVIVES THE RENDER.
   *
   * This page re-renders by replacing #body's innerHTML wholesale, which was free
   * of consequence while every tab was read-only. The watchlist's add field is the
   * first <input>, and it broke immediately: typing `AAP` and then any redraw
   * discarded the text, the focus and the node. Verified in a browser, not
   * reasoned about -- and the trigger is not exotic, `loadQuotes()` calls draw()
   * on its own when the tab opens.
   *
   * So the value and cursor are carried across, keyed by element id. Generic
   * rather than special-cased to #wadd: the next input must not have to rediscover
   * this. A framework's reconciliation is the other answer to this problem, and
   * for one field it is not worth a build step -- see the note in README. */
  const keep=preserveInputs();
  /* A VIEW THAT THROWS MUST NOT LEAVE A BLANK PAGE.
   *
   * Every view function reads deep into the payload -- `s.month`, `lc.proceeds.base`
   * -- so one unexpected shape throws a TypeError halfway through building the
   * string. `innerHTML` is then never assigned, #body keeps the PREVIOUS tab's
   * markup or nothing at all, the binders below never run, and the only evidence is
   * a stack trace in a console the reader is not looking at. Found by handing
   * `/api/state` a reply with no `stats` key: the page went blank and said nothing.
   *
   * The catch does not swallow it. The error is re-thrown on a later task so the
   * console still gets the trace with its original stack, and the reader gets a
   * banner naming the tab that failed. A journal that renders half a screen and
   * stays silent is worse than one that says it could not read the reply --
   * silence, here, looks like "there is no data", which is a different claim. */
  let html;
  try{
    html=(S.showCog?settingsPanel():'')+subnav()+(v?v():
      `<div class="card"><div class="empty">nothing here yet</div></div>`);
  }catch(err){
    note(`Could not render the ${esc(S.tab)} tab: ${esc(String(err&&err.message||err))}`
      +'. The reply may be from a different version of the server — restart it with'
      +' <code>optjournal serve</code>. The browser console has the full trace.','bad');
    html=`<div class="card"><div class="empty">this tab could not be rendered from `
      +`the server's reply</div></div>`;
    setTimeout(()=>{throw err;},0);
  }
  $('#body').innerHTML=html;
  restoreInputs(keep);
  /* One binder for the rail and the sub-view switcher, bound HERE rather than in
     `renderRail` because the switcher is part of the body that has only just been
     written. Both are navigation, so both push a history entry and the back button
     walks them. */
  document.querySelectorAll('[data-tab]').forEach(b=>
    b.onclick=()=>{S.tab=b.dataset.tab;draw(true);});
  /* The month stepper goes through load(), never a redraw: the stats are
     aggregated server-side per period, so a step that only redrew would show a
     month the server never filtered for. `all` is All time. */
  document.querySelectorAll('button[data-month]').forEach(b=>
    b.onclick=()=>{
      S.calday=null; /* a selection from the old month means nothing in the new */
      /* Landing back on the current month is the default again, not a pin:
         the URL stays clean and follows the calendar forward. */
      const m=b.dataset.month||null;
      S.month=m===(S.state.month_range||[])[0]?null:m;load();});
  /* Day drill-down: pure redraw, no request -- the leg data is already in the
     payload. Clicking the selected day again clears it (toggle). */
  document.querySelectorAll('[data-calday]').forEach(el=>
    el.onclick=()=>{const k=el.dataset.calday;
      S.calday=S.calday===k?null:k;draw();});
  /* Market day: pure redraw, no request -- every event is already in the
     payload. Not a toggle, unlike the calendar: the market view always shows
     SOME day, so clearing the selection would leave the panel empty with no way
     back except reloading. role=button means Enter and Space have to work. */
  document.querySelectorAll('[data-marketday]').forEach(el=>{
    const pick=()=>{S.marketday=el.dataset.marketday;draw();};
    el.onclick=pick;
    el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();}};
  });
  /* Replay drill-down: same toggle, same pure redraw. Every bar is already in
     the payload, so opening a chart costs no request. */
  document.querySelectorAll('[data-replay]').forEach(el=>
    el.onclick=()=>{const k=el.dataset.replay;
      S.replay=S.replay===k?null:k;draw();});
  bindReplayControls();
  bindJournal();
  document.querySelectorAll('[data-calday-clear]').forEach(el=>
    el.onclick=()=>{S.calday=null;draw();});
  /* Server-side like the month filter, so the aggregations are recomputed
     rather than the page trying to re-sum a filtered subset of totals. */
  document.querySelectorAll('.seg button[data-type]').forEach(b=>
    b.onclick=()=>{const t=b.dataset.type||null;
      if(t===S.type)return; S.type=t; load();});
  /* The cost scope TOGGLES rather than selects: this is a multi-select, so a
     click flips one option and leaves the rest alone. Seeded from the scope the
     server reported rather than from S.cost, which is null until the reader has
     touched anything -- reading it would make the first click discard the default
     selection instead of adding to it.

     Deselecting the last option leaves an EMPTY array, not null: "nothing
     selected" is a real answer and shows an empty state, where null would silently
     restore the default and make the click look ignored. A reload costs a request
     because commission is summed server-side under the new predicate. */
  /* The scoreboard unit, wired here rather than in `cog()` because the panel is
     re-rendered by `draw()` like every other view and a handler attached during
     render would be lost with the node.

     `load()`, not `draw()`: the other reading is a different COUNT, and only the
     server holds the campaign linkage that produces it. Deriving it here would
     be a second implementation of campaigns.py in the page -- the exact
     duplication that module exists to prevent. */
  document.querySelectorAll('button[data-scoring]').forEach(b=>
    b.onclick=async()=>{
      const unit=b.dataset.scoring;
      /* The default is stored as null, so the hash and the request omit it and
         one spelling of "position" cannot disagree with the server's. */
      S.scoring=unit===SCORINGS[0]?null:unit;
      /* PERSISTED as well as applied, because this is a settings page: a control
         in a panel labelled Settings that forgets on restart is the complaint
         this panel exists to answer. The hash still carries it so a link works,
         and `load()` below re-reads the stored value either way -- so a failed
         save leaves the view and the file agreeing, not diverging. */
      await save({scoring:unit});
      load();
    });
  /* The tile chooser edits a draft; nothing here reaches the server until Save.
     Every handler copies the draft, changes the copy, and redraws, so the list on
     screen is always a rendering of `S.tiledraft` and never a DOM the page has
     rearranged under its own state. */
  const moveTile=(key,to)=>{
    const order=tileDraft().slice(), from=order.findIndex(dr=>dr.key===key);
    if(from<0||to<0||to>=order.length||from===to) return;
    const [it]=order.splice(from,1); order.splice(to,0,it);
    S.tiledraft=order; draw();
  };
  document.querySelectorAll('input[data-tilecheck]').forEach(el=>
    el.onchange=()=>{
      S.tiledraft=tileDraft().map(dr=>dr.key===el.dataset.tilecheck?{...dr,on:el.checked}:dr);
      draw();});
  document.querySelectorAll('button[data-tilemove]').forEach(b=>
    b.onclick=()=>{const k=b.dataset.tilemove;
      moveTile(k,tileDraft().findIndex(dr=>dr.key===k)+Number(b.dataset.dir));});
  /* Native drag and drop. The dragged key rides in dataTransfer as well as in a
     closure, because Firefox starts no drag at all without `setData`. `dragover`
     must cancel its default or the row refuses the drop; the highlight is a
     class, never a style write, which this page does not make. */
  document.querySelectorAll('[data-tilerow]').forEach(el=>{
    el.ondragstart=ev=>{S.tiledrag=el.dataset.tilerow;
      ev.dataTransfer.setData('text/plain',el.dataset.tilerow);};
    el.ondragover=ev=>{ev.preventDefault();el.classList.add('over');};
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=ev=>{ev.preventDefault();
      const k=S.tiledrag||ev.dataTransfer.getData('text/plain'); S.tiledrag=null;
      moveTile(k,tileDraft().findIndex(dr=>dr.key===el.dataset.tilerow));};
  });
  const tilesave=$('#tilesave');
  if(tilesave) tilesave.onclick=async()=>{
    const res=await save({tiles:tileDraft().filter(dr=>dr.on).map(dr=>dr.key)});
    /* The server's reason on refusal, not a local guess, as the query-id form
       does: it owns the rule, and the page restating it is two rules to keep in
       step. */
    if(!res||!res.ok){note(esc((res&&res.message)||'could not save the tiles'),'bad');return;}
    S.tiledraft=null; note('Dashboard tiles saved.','ok'); load();
  };
  const tilereset=$('#tilereset');
  if(tilereset) tilereset.onclick=async()=>{
    const res=await save({tiles:null});
    if(!res||!res.ok){note(esc((res&&res.message)||'could not reset the tiles'),'bad');return;}
    S.tiledraft=null; load();
  };
  const qidsave=$('#qidsave');
  if(qidsave) qidsave.onclick=async()=>{
    const el=$('#qid'), msg=$('#qidmsg');
    if(msg) msg.textContent='saving...';
    const res=await save({query_id:(el&&el.value||'').trim()});
    /* The SERVER's message, not a local guess: it holds the shape rule (digits,
       length) and repeating it here would be two rules to keep in step. */
    if(msg) msg.textContent=res&&res.ok?'saved':((res&&res.message)||'failed');
    if(res&&res.ok) load();
  };
  const cqidsave=$('#cqidsave');
  if(cqidsave) cqidsave.onclick=async()=>{
    const el=$('#cqid'), msg=$('#cqidmsg');
    if(msg) msg.textContent='saving...';
    /* An EMPTY value is a real choice -- it turns the intraday poll off -- so this
       sends the blank rather than refusing it the way the token field does. */
    const res=await save({confirm_query_id:(el&&el.value||'').trim()});
    if(msg) msg.textContent=res&&res.ok?'saved':((res&&res.message)||'failed');
    if(res&&res.ok) load();
  };
  const toksave=$('#toksave');
  if(toksave) toksave.onclick=async()=>{
    const el=$('#tok'), msg=$('#tokmsg');
    const token=(el&&el.value||'').trim();
    if(!token){if(msg) msg.textContent='paste a token first';return;}
    toksave.disabled=true;
    if(msg) msg.textContent='storing...';
    try{
      /* NOT through `save()`: that helper posts to /api/settings, and this is a
         different endpoint with a different reply. Its own path because it writes
         a credential to the OS keyring rather than a preference to a file. */
      const r=await fetch('/api/settings/token',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:token})});
      const tok=await r.json();
      if(!tok.ok){
        /* The SERVER's message, and no `draw()`: a redraw rebuilds this panel
           from state and would wipe the one thing the reader needs to read. */
        if(msg) msg.textContent=tok.message||'failed';
        return;
      }
      /* CLEARED, so the credential is not still sitting in a form field in a tab
         left open for the rest of the day. Kept on failure, above: the reader
         would otherwise go back to Client Portal to fix one stray character. */
      if(el) el.value='';
      /* The reply IS a token status, so it lands where the Check button's answer
         lands and the line below reports "stored" for itself -- rather than the
         page claiming it from the fact that a request came back. */
      if(S.state&&S.state.settings) S.state.settings.token=tok;
      draw();
    }catch(err){
      if(msg) msg.textContent='could not reach the journal: '+err;
    }finally{
      toksave.disabled=false;
    }
  };
  const tokcheck=$('#tokcheck');
  if(tokcheck) tokcheck.onclick=async()=>{
    tokcheck.disabled=true;
    try{
      /* A GET, and the one place the keyring is touched from the page. Held on
         `S.state.settings` rather than in a variable so the next `draw()` still
         shows the answer -- and never persisted, because a keyring can change
         under a running server. */
      const r=await fetch('/api/settings/token');
      const j=await r.json();
      if(S.state&&S.state.settings) S.state.settings.token=j;
    }catch(err){
      note('Could not reach the journal to check the keyring: '+err,'bad');
    }finally{
      tokcheck.disabled=false;
    }
    draw();
  };
  document.querySelectorAll('.multi button[data-cost]').forEach(b=>
    b.onclick=()=>{
      const csc=(S.state.broker_costs||{}).scope||{};
      const on=new Set(csc.categories||[]);
      if(csc.subset) on.add(csc.subset);
      const key=b.dataset.cost;
      if(on.has(key)) on.delete(key); else on.add(key);
      S.cost=[...on];
      load();
    });
  /* The calendar's filter chips are a PURE REDRAW: every event is already in the
     payload and both axes are filtered client-side, so narrowing costs no request.
     Unlike the cost scope above, which reloads: that predicate is summed
     server-side, whereas every calendar event is already here.
     Clearing the day selection is the point -- the chosen day may hold nothing
     under the new filter, and a stale selection would open an empty panel.

     The Set is REBUILT rather than mutated in place, because `S.mkcountries` may
     still be null (meaning "the server's default"), and mutating the Set that
     `market()` derived from the payload would edit a value the state does not own
     yet. `mkFacet` reads the current selection back out of the same payload the
     view did, so the two cannot disagree about what was showing. */
  const mkFacet=axis=>{
    const mk=S.state.market||{};
    const held=axis==='country'?S.mkcountries:S.mkimpacts;
    if(held instanceof Set) return new Set(held);
    const facets=axis==='country'?mk.countries:mk.impacts;
    return new Set((facets||[]).filter(mf=>mf.default).map(mf=>mf.value));
  };
  const mkPut=(axis,next)=>{
    if(axis==='country') S.mkcountries=next; else S.mkimpacts=next;
    S.marketday=null; draw();
  };
  document.querySelectorAll('[data-mkaxis]').forEach(b=>
    b.onclick=()=>{const axis=b.dataset.mkaxis, value=b.dataset.mkvalue;
      const next=mkFacet(axis);
      if(next.has(value)) next.delete(value); else next.add(value);
      mkPut(axis,next);});
  /* Reset goes back to NULL rather than to a copy of the defaults, so the page
     keeps deferring to the server on what "default" means -- a copied Set would
     silently stop tracking a change to `events.DEFAULT_COUNTRIES`. */
  document.querySelectorAll('[data-mkreset]').forEach(b=>
    b.onclick=()=>{S.mkcountries=null; S.mkimpacts=null; S.marketday=null; draw();});
  /* All is an EMPTY Set on both axes, which filters nothing out -- see `passes` in
     `market()`. Not "every value selected": a new country arriving in the feed
     would then be excluded until the reader noticed. */
  document.querySelectorAll('[data-mkall]').forEach(b=>
