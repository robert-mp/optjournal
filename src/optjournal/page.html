      <span class="flabel">Flex token</span>
      <span>${tokLine}</span>
      <button id="tokcheck">Check keyring</button>
      <span class="dim">presence only, and never the value</span>
    </div>

    ${scoringRow()}

    <details class="adv mt-5">
      <summary>Advanced — journal details and archive</summary>
      <div class="note">Diagnostics, not settings: nothing here is editable, and
      it is what you want when something looks wrong rather than when you are
      setting the journal up.</div>
      <table><tbody>
        <tr><td class="dim">version</td><td class="mono">${esc(st.version)}</td></tr>
        <tr><td class="dim">database</td><td class="mono">${esc(st.db)}</td></tr>
        <tr><td class="dim">archive</td><td class="mono">${esc(st.archive)}</td></tr>
        <tr><td class="dim">last fetch</td><td class="mono">${esc(st.sync.last_fetch||'never')}</td></tr>
        <tr><td class="dim">fetch cooldown</td><td class="mono">${st.sync.cooldown_s}s
          (${st.sync.cooldown_remaining_s}s remaining)</td></tr>
        <tr><td class="dim">generated</td><td class="mono">${esc(st.generated_at)}</td></tr>
      </tbody></table>
      <h2 class="sub3 mt-5">Archive — ${(st.statements||[]).length} statement(s)</h2>
      <table><thead><tr><th>file</th><th>period</th><th class="n">bytes</th>
        <th>ingested</th><th>assets</th></tr></thead><tbody>
        ${(st.statements||[]).map(stm=>`<tr><td class="mono">${esc(stm.file)}</td>
          <td class="dim">${esc(stm.from_date||'?')} → ${esc(stm.to_date||'?')}</td>
          <td class="n mono">${(stm.bytes||0).toLocaleString()}</td>
          <td class="${stm.ingested?'pos':'dim2'}">${stm.ingested?'yes':'no'}</td>
          <td class="dim">${esc(stm.asset_filter||'-')}</td></tr>`).join('')}
      </tbody></table>
      <div class="note"><b>Needs the Flex query template:</b>
        <i>Gain % of Net Liq</i> reads the Equity Summary section — enable it on the
        query and sync, and the figure fills in from the next statement. <i>Trade
        Replay</i> needs intraday underlying prices, implied volatility and greeks —
        none of which a statement carries.</div>
    </details>
  </div>`;
}

/* ------------------------------------------------ view state in the URL

   The filter, the month and the tab live in the hash so a reload lands on the
   view you left, and so a link carries it. Persisting only the trade filter
   would have been worse than persisting nothing: reload would restore the 0DTE
   scope while silently dropping the month and jumping to the Dashboard, a
   combination that was never on screen.

   `replaceState`, not `location.hash = ...`: assigning pushes a history entry
   per click, so toggling a filter a few times buries the page under back-button
   history. Nothing here is a navigation. */
const HASH_TABS=()=>TABS.map(t=>t[0]);
function applyHash(){
  /* Not `h` -- that is the history payload everywhere else in this page, and
     one name for two shapes is what blinds the payload guard to both. */
  const hs=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const tab=hs.get('tab');
  /* Validated against the enabled tabs rather than trusted: an unknown or
     disabled id would otherwise render "nothing here yet" from a URL. An
     ABSENT key must reset to the default, not leave the current tab standing:
     the back button lands on entries whose hash has no tab key, and keeping
     the old tab made syncHash rewrite it into the entry just navigated to. */
  S.tab=(tab&&HASH_TABS().includes(tab))?tab:'dashboard';
  S.type=hs.get('type')||null;
  S.month=hs.get('month')||null;
  S.ccy=(hs.get('ccy')||'').toUpperCase()||null;
  /* The drill-down selection was the one piece of view state the URL did not
     carry, so a link to "that day" was unshareable and a reload silently
     dropped the panel while leaving the calendar looking untouched. Validated
     against the payload in draw(), not here: a day from another month means
     nothing in this one, and applyHash runs before the state it would check. */
  S.calday=hs.get('calday')||null;
  S.replay=hs.get('replay')||null;
  /* Upper-cased, because that is how `_watchlist_write` stores a symbol and how
     the payload sends it back: `#wsym=dell` from a hand-typed URL would otherwise
     match no row and heal away, silently losing a link that was almost right.
     Validated in draw() against the payload rather than here, for calday's
     reason -- applyHash runs before the state it would check exists. */
  S.wsym=(hs.get('wsym')||'').toUpperCase()||null;
  /* Validated against the registry, like the tab: an unknown id would otherwise
     put an unstyled `data-theme` on <html>, where the attribute matches no block
     and the page silently falls back to `:root` while the chip claims the bogus
     name. Healing to null instead means the chip and the palette agree. */
  const th=(hs.get('theme')||'').toLowerCase();
  S.theme=THEME_IDS().includes(th)?th:null;
  /* Repeated key, not a delimited string: `#cost=OPT&cost=CASH`. URLSearchParams
     already models a repeated key, and `getAll` is the whole parser -- inventing
     a separator would mean the page and the server each carrying a split rule
     that has to agree. Empty stays null ("not chosen") rather than becoming an
     empty array, which the server would read as a selection of nothing. */
  const cost=hs.getAll('cost').filter(Boolean);
  S.cost=cost.length?cost:null;
  /* Validated against the two units the server knows, like the tab and the
     theme: an unknown value would otherwise put a chip in an impossible state
     while the server quietly served the default, so the control would disagree
     with the figures beside it. */
  const sco=(hs.get('scoring')||'').toLowerCase();
  S.scoring=SCORINGS.includes(sco)?sco:null;
}
function syncHash(push){
  const hs=new URLSearchParams();
  /* Defaults are omitted so the common case has a clean URL, and so a stale
     key cannot outlive the state it described. The display currency's default
     is the account base, so only a restatement is worth recording. */
  if(S.tab&&S.tab!=='dashboard') hs.set('tab',S.tab);
  if(S.type) hs.set('type',S.type);
  if(S.month) hs.set('month',S.month);
  if(S.ccy&&S.ccy!==BASE()) hs.set('ccy',S.ccy);
  if(S.calday) hs.set('calday',S.calday);
  if(S.replay) hs.set('replay',S.replay);
  /* Only an EXPLICIT selection is recorded. The pane's default is the first row
     of the sorted list, derived on every render, so writing it here would put a
     symbol in every watchlist URL to say "the one you would have got anyway" --
     the rule the theme and the display currency already follow for their
     defaults, and it also stops a re-sort from rewriting the address bar. */
  if(S.wsym) hs.set('wsym',S.wsym);
  /* Leather is what `:root` already carries, so recording it would put a key in
     every URL to say "the default" -- the same rule the display currency follows
     for the account base. */
  if(S.theme&&S.theme!==THEMES[0][0]) hs.set('theme',S.theme);
  /* `append`, so the multi-select round-trips as the repeated key applyHash
     reads. `set` would keep only the last one and silently narrow a four-way
     selection to one on the next reload. */
  (S.cost||[]).forEach(c=>hs.append('cost',c));
  /* Only the non-default, like the theme and the display currency: recording
     'position' would put a key in every URL to say what the server already
     assumes. */
  if(S.scoring&&S.scoring!==SCORINGS[0]) hs.set('scoring',S.scoring);
  const next=hs.toString()?'#'+hs:'';
  if(next===(location.hash||'')) return;
  /* A tab jump is a navigation, so it pushes and the back button walks tabs.
     Everything else -- filter, month, currency -- mutates the current entry:
     those are adjustments to the view you are on, and pushing them would bury
     the tab trail under one entry per click. Clicking the current tab is a
     no-op by the guard above, so it cannot mint duplicate entries. */
  if(push) history.pushState(null,'',location.pathname+next);
  else history.replaceState(null,'',location.pathname+next);
}

/* ------------------------------------------------ shell */
function draw(push){
  /* A currency the account has no quote for falls back to base on display
     (DISP does that); clearing it makes the hash heal to match. Healed here
     rather than in load() because a hash edit is a same-document navigation
     -- load() never runs for it, only the hashchange -> draw path does. */
  if(S.ccy&&S.state&&S.ccy!==BASE()&&!QUOTES().some(qo=>qo.code===S.ccy)) S.ccy=null;
  /* A day the payload holds no fills for cannot be drilled into, so it heals
     out of the URL rather than sitting there describing nothing -- the same
     discipline the display currency follows. Checked HERE, before syncHash:
     dayDetail's own guard runs during render, by which point the stale key has
     already been written to the address bar. */
  if(S.calday&&S.state&&!(((S.state.stats||{}).days)||[])
      .some(dy=>dy.day===S.calday)) S.calday=null;
  /* Same discipline for the replay key: a lifecycle that the current trade-type
     filter excludes leaves its key describing nothing, and a key that outlives
     its panel is how the old registry rotted. Checked before syncHash so the
     address bar never carries a key the page cannot open. */
  if(S.replay&&S.state&&!((S.state.replays||{})[S.replay])) S.replay=null;
  /* And the same for the watched symbol, which has one edge the other two do not:
     the reader can DELETE the row that is open. Stop watching DELL and the payload
     reloads without it, so without this heal the URL keeps naming DELL, the pane
     falls back to the first row, and the address bar describes a symbol the
     journal no longer holds. Before syncHash, like both of its siblings. */
  if(S.wsym&&S.state&&!((S.state.watchlist||[])
      .some(w=>w.symbol===S.wsym))) S.wsym=null;
  /* A running playback drives element ids that this render is about to
     replace, so it has to die with them. */
  replayStop();
  syncHash(push);
  renderTabs();
  /* Before the body renders, not after: the attribute drives every colour on the
     page, so setting it later would paint one frame in the old palette. */
  applyTheme();
  renderKicker();
  renderCcy();
  const views={dashboard,calendar,trades,positions,costs,annual,odte,market,
    watchlist};
  const v=views[S.tab];
  /* WHAT THE USER WAS TYPING SURVIVES THE RENDER.
   *
   * This page re-renders by replacing #body's innerHTML wholesale, which was free
   * of consequence while every tab was read-only. The watchlist's add field is the
   * first <input>, and it broke immediately: typing `AAP` and then any redraw
   * discarded the text, the focus and the node. Verified in a browser, not
   * reasoned about -- and the trigger is not exotic, `loadQuotes()` calls draw()
   * on its own when the tab opens.
   *
   * So the value and cursor are carried across, keyed by element id. Generic
   * rather than special-cased to #wadd: the next input must not have to rediscover
   * this. A framework's reconciliation is the other answer to this problem, and
   * for one field it is not worth a build step -- see the note in README. */
  const keep=preserveInputs();
  $('#body').innerHTML=(S.showCog?settingsPanel():'')+(v?v():
    `<div class="card"><div class="empty">nothing here yet</div></div>`);
  restoreInputs(keep);
  const sel=$('#month');
  if(sel) sel.onchange=()=>{S.month=sel.value||null;load();};
  document.querySelectorAll('button[data-calmonth]').forEach(b=>
    b.onclick=()=>{if(b.dataset.calmonth){
      S.calday=null; /* a selection from the old month means nothing in the new */
      S.month=b.dataset.calmonth;load();}});
  /* Day drill-down: pure redraw, no request -- the leg data is already in the
     payload. Clicking the selected day again clears it (toggle). */
  document.querySelectorAll('[data-calday]').forEach(el=>
    el.onclick=()=>{const k=el.dataset.calday;
      S.calday=S.calday===k?null:k;draw();});
  /* Market day: pure redraw, no request -- every event is already in the
     payload. Not a toggle, unlike the calendar: the market view always shows
     SOME day, so clearing the selection would leave the panel empty with no way
     back except reloading. role=button means Enter and Space have to work. */
  document.querySelectorAll('[data-marketday]').forEach(el=>{
    const pick=()=>{S.marketday=el.dataset.marketday;draw();};
    el.onclick=pick;
    el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();}};
  });
  /* Replay drill-down: same toggle, same pure redraw. Every bar is already in
     the payload, so opening a chart costs no request. */
  document.querySelectorAll('[data-replay]').forEach(el=>
    el.onclick=()=>{const k=el.dataset.replay;
      S.replay=S.replay===k?null:k;draw();});
  bindReplayControls();
  bindJournal();
  document.querySelectorAll('[data-calday-clear]').forEach(el=>
    el.onclick=()=>{S.calday=null;draw();});
  /* Server-side like the month filter, so the aggregations are recomputed
     rather than the page trying to re-sum a filtered subset of totals. */
  document.querySelectorAll('.seg button[data-type]').forEach(b=>
    b.onclick=()=>{const t=b.dataset.type||null;
      if(t===S.type)return; S.type=t; load();});
  /* The cost scope TOGGLES rather than selects: this is a multi-select, so a
     click flips one option and leaves the rest alone. Seeded from the scope the
     server reported rather than from S.cost, which is null until the reader has
     touched anything -- reading it would make the first click discard the default
     selection instead of adding to it.

     Deselecting the last option leaves an EMPTY array, not null: "nothing
     selected" is a real answer and shows an empty state, where null would silently
     restore the default and make the click look ignored. A reload costs a request
     because commission is summed server-side under the new predicate. */
  /* The scoreboard unit, wired here rather than in `cog()` because the panel is
     re-rendered by `draw()` like every other view and a handler attached during
     render would be lost with the node.

     `load()`, not `draw()`: the other reading is a different COUNT, and only the
     server holds the campaign linkage that produces it. Deriving it here would
     be a second implementation of campaigns.py in the page -- the exact
     duplication that module exists to prevent. */
  document.querySelectorAll('button[data-scoring]').forEach(b=>
    b.onclick=async()=>{
      const unit=b.dataset.scoring;
      /* The default is stored as null, so the hash and the request omit it and
         one spelling of "position" cannot disagree with the server's. */
      S.scoring=unit===SCORINGS[0]?null:unit;
      /* PERSISTED as well as applied, because this is a settings page: a control
         in a panel labelled Settings that forgets on restart is the complaint
         this panel exists to answer. The hash still carries it so a link works,
         and `load()` below re-reads the stored value either way -- so a failed
         save leaves the view and the file agreeing, not diverging. */
      await save({scoring:unit});
      load();
    });
  const qidsave=$('#qidsave');
  if(qidsave) qidsave.onclick=async()=>{
    const el=$('#qid'), msg=$('#qidmsg');
    if(msg) msg.textContent='saving...';
    const res=await save({query_id:(el&&el.value||'').trim()});
    /* The SERVER's message, not a local guess: it holds the shape rule (digits,
       length) and repeating it here would be two rules to keep in step. */
    if(msg) msg.textContent=res&&res.ok?'saved':((res&&res.message)||'failed');
    if(res&&res.ok) load();
  };
  const tokcheck=$('#tokcheck');
  if(tokcheck) tokcheck.onclick=async()=>{
    tokcheck.disabled=true;
    try{
      /* A GET, and the one place the keyring is touched from the page. Held on
         `S.state.settings` rather than in a variable so the next `draw()` still
         shows the answer -- and never persisted, because a keyring can change
         under a running server. */
      const r=await fetch('/api/settings/token');
      const j=await r.json();
      if(S.state&&S.state.settings) S.state.settings.token=j;
    }catch(err){
      note('Could not reach the journal to check the keyring: '+err,'bad');
    }finally{
      tokcheck.disabled=false;
    }
    draw();
  };
  document.querySelectorAll('.multi button[data-cost]').forEach(b=>
    b.onclick=()=>{
      const csc=(S.state.broker_costs||{}).scope||{};
      const on=new Set(csc.categories||[]);
      if(csc.subset) on.add(csc.subset);
      const key=b.dataset.cost;
      if(on.has(key)) on.delete(key); else on.add(key);
      S.cost=[...on];
      load();
    });
  /* The calendar's filter chips are a PURE REDRAW: every event is already in the
     payload and both axes are filtered client-side, so narrowing costs no request.
     Unlike the cost scope above, which reloads: that predicate is summed
     server-side, whereas every calendar event is already here.
     Clearing the day selection is the point -- the chosen day may hold nothing
     under the new filter, and a stale selection would open an empty panel.

     The Set is REBUILT rather than mutated in place, because `S.mkcountries` may
     still be null (meaning "the server's default"), and mutating the Set that
     `market()` derived from the payload would edit a value the state does not own
     yet. `mkFacet` reads the current selection back out of the same payload the
     view did, so the two cannot disagree about what was showing. */
  const mkFacet=axis=>{
    const mk=S.state.market||{};
    const held=axis==='country'?S.mkcountries:S.mkimpacts;
    if(held instanceof Set) return new Set(held);
    const facets=axis==='country'?mk.countries:mk.impacts;
    return new Set((facets||[]).filter(mf=>mf.default).map(mf=>mf.value));
  };
  const mkPut=(axis,next)=>{
    if(axis==='country') S.mkcountries=next; else S.mkimpacts=next;
    S.marketday=null; draw();
  };
  document.querySelectorAll('[data-mkaxis]').forEach(b=>
    b.onclick=()=>{const axis=b.dataset.mkaxis, value=b.dataset.mkvalue;
      const next=mkFacet(axis);
      if(next.has(value)) next.delete(value); else next.add(value);
      mkPut(axis,next);});
  /* Reset goes back to NULL rather than to a copy of the defaults, so the page
     keeps deferring to the server on what "default" means -- a copied Set would
     silently stop tracking a change to `events.DEFAULT_COUNTRIES`. */
  document.querySelectorAll('[data-mkreset]').forEach(b=>
    b.onclick=()=>{S.mkcountries=null; S.mkimpacts=null; S.marketday=null; draw();});
  /* All is an EMPTY Set on both axes, which filters nothing out -- see `passes` in
     `market()`. Not "every value selected": a new country arriving in the feed
     would then be excluded until the reader noticed. */
  document.querySelectorAll('[data-mkall]').forEach(b=>
    b.onclick=()=>{S.mkcountries=new Set(); S.mkimpacts=new Set();
      S.marketday=null; draw();});
  bindMarketFetch();
  bindWatchlist();
  bindJobRuns();
  /* First view of the Watchlist fetches quotes once, so the tab is useful without
     a click -- and NOT on any later redraw, because each quote is an HTTP request
     and a redraw happens on every toggle, filter and edit. `quotesAt` is the
     latch; Refresh is the way to ask again. */
  if(S.tab==='watchlist'&&!S.quotesAt&&(S.state.watchlist||[]).length) loadQuotes(false);
  const st=S.state;
  $('#foot').textContent=`optjournal ${st.version} · ${st.db} · loopback only, no authentication`;
  const b=$('#sync'), rem=st.sync.cooldown_remaining_s;
  b.classList.remove('busy');
  if(!st.sync.configured){b.disabled=true;b.title='No query id — start with --query-id';}
  else if(rem>0){b.disabled=true;
    b.title=`Cooldown: ${Math.ceil(rem/60)}m left. Prevents spending an IBKR request for data that cannot have changed.`;}
  else {b.disabled=false;b.title='Fetch from IBKR — spends one request';}
}

/* Read every text field's value, selection and focus before a render.
 *
 * Keyed by `id` because that is what survives innerHTML replacement: the NODES do
 * not, so nothing can be held by reference. A field with no id is skipped rather
 * than guessed at -- a wrong restore would put one field's text in another.
 *
 * `input,textarea,select`. The textarea half was removed once, when the panel that
 * carried a note editor went, on the argument that a selector matching nothing is a
 * mechanism no test can reach -- with the note that a textarea arriving later
 * restores one word here. The journal form is that arrival: eleven of its fields
 * are textareas and one is a select, and without them a redraw mid-sentence
 * discards writing that nothing in this database can rebuild. `select` is here for
 * completeness rather than urgency -- a dropdown cannot be mid-edit -- but a value
 * silently reverting is the same class of surprise.
 *
 * `data-subject` is the other half, and it is a different failure. An id is unique
 * per RENDER, not per subject: `#wearn` is the earnings field whatever row is open,
 * so selecting another symbol restored the previous symbol's typed date under the
 * new symbol's heading -- and pressing Save would then have written it there. A
 * field may name what it is editing, and a restore across subjects is refused
 * rather than reconciled. Generic, like the rest of this helper: nothing here knows
 * the watchlist exists. */
function preserveInputs(){
  const keep={};
  document.querySelectorAll('#body input,#body textarea,#body select').forEach(el=>{
    if(!el.id) return;
    keep[el.id]={value:el.value,subject:el.dataset.subject||'',
      start:el.selectionStart,end:el.selectionEnd,
      focused:document.activeElement===el};
  });
  return keep;
}

/* Put it back on the freshly rendered nodes.
 *
 * A field the new render does not contain is simply dropped: the tab changed, and
 * carrying text into a different panel would be worse than losing it. So is one
 * whose subject changed under it, for the same reason one level finer. setSelectionRange
 * is guarded because it throws on input types that do not support selection. */
function restoreInputs(keep){
  Object.keys(keep||{}).forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    const was=keep[id];
    if((el.dataset.subject||'')!==was.subject) return;
    el.value=was.value;
    if(was.focused){
      el.focus();
      try{ el.setSelectionRange(was.start,was.end); }catch(e){ /* unsupported type */ }
    }
  });
}

/* A CLASS, not three inline colour pairs. This used to set `style.background`,
   `style.color` and `style.border` from a literal table -- six hex values and an
   rgba border that no stylesheet could see and no theme could repaint, so every
   banner stayed Leather-coloured on every theme. Inline styles also outrank any
   rule, which is what made this unfixable from app.css.
   The kind is now a class and the colours live in the theme blocks. */
/* How long a SUCCESS stays up. `ok` is the only kind that self-dismisses, and
   that asymmetry is the whole design: "market ok -- 74 fetched, 74 stored" has
   been read the moment it appears and then sits there claiming the page's
   attention forever, but a failure the reader looked away from must still be
   there when they look back. A dismissed error is an error nobody saw. */
const NOTE_MS=6000;
let noteTimer=null;
function note(text,kind){
  const m=$('#msg'); m.innerHTML=text;
  const k=['bad','warn','ok'].includes(kind)?kind:'ok';
  /* No `fading`: a new note always arrives fully opaque, including one that
     lands while a previous banner is mid-fade. */
  m.className='show '+k;
  /* Cleared unconditionally, BEFORE the branch: without this, an `ok` followed
     by a `bad` inside the window leaves the first banner's timer running, and it
     hides the error mid-read. The bug is in the sequence, not in either call. */
  if(noteTimer){clearTimeout(noteTimer);noteTimer=null;}
  if(k!=='ok') return;
  noteTimer=setTimeout(()=>{
    noteTimer=null;
    /* Re-read the element rather than closing over `m`, and check it is still
       showing THIS kind: a redraw can replace #msg, and a later `bad` that
       arrives after the timer was cleared must not be wiped by a stale closure. */
    const el=$('#msg');
    if(!el||!el.classList.contains('ok')) return;
    el.classList.add('fading');
    /* Hidden only after the fade has run, so the element leaves the layout
       instead of holding an invisible gap above the panels below it. `once`, so
       repeated notes cannot stack listeners on one element. */
    el.addEventListener('transitionend',()=>{
      if(el.classList.contains('fading')) el.className='';
    },{once:true});
  },NOTE_MS);
}

/* Run a registered job from the page. The reason the strip exists.
 *
 * WHICH BUTTON ASKS FOR CONFIRMATION IS DECIDED SERVER-SIDE, by
 * `JobRow.spends_request`, which comes from the registry's
 * `spends_broker_request`. The page holds no list of which jobs touch the broker,
 * for the same reason it holds no copy of the calendar's default filter: a second
 * copy of a fact is a copy that drifts. Only `sync` spends one of IBKR's rate-limited
 * requests today; the others hit a public chart endpoint or a calendar feed where
 * an extra call costs nothing, and a dialogue on all four would train you to click
 * through the one that matters.
 *
 * EVERY REPLY THE ENDPOINT CAN SEND IS RENDERED AS ITSELF. 409 means the job is
 * already running -- a working system, not an error -- so it polls the run already
 * in flight instead of showing a failure. 503 means the journal is locked by
 * another writer and waiting will fix it, which is exactly what the browser could
 * not say before the guard existed: the connection was dropped after 16 seconds
 * with no response at all. */
function bindJobRuns(){
  document.querySelectorAll('button.jrun').forEach(b=>{
    b.onclick=async()=>{
      const job=b.dataset.job;
      const spends=(((S.state.scheduler||{}).jobs)||[])
        .some(j=>j.job===job&&j.spends_request);
      if(spends&&!confirm(
        `Run ${job}? This spends one IBKR Flex request against a rate-limited `
        +`budget.`)) return;
      b.disabled=true; b.classList.add('busy'); b.textContent='running';
      try{
        const r=await fetch('/api/jobs/run',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({job})});
        const jres=await r.json();
        if(r.status===409){
          note(`<b>${esc(job)}</b> is already running — watching that run.`,'warn');
          await pollRun(jres.run_id);
        }else if(r.status===503){
          note('The journal is locked by another writer: '
            +esc(jres.message||'')+' Try again in a moment.','warn');
        }else if(!jres.ok){
          note(`Could not run ${esc(job)}: `+esc(jres.message||''),'bad');
        }else{
          await pollRun(jres.run_id);
        }
      }catch(e){note(`Could not run ${esc(job)}: `+esc(e),'bad');}
      await load();
    };
  });
}

/* Follow one run to its terminal state.
 *
 * Polls rather than streams, because the run is synchronous today -- the POST has
 * already returned by the time this starts, so the first read is usually the last.
 * The loop is for step 6, when the runner moves to a thread and a 202 genuinely
 * means "started". Bounded, so a `running` row whose process died (which the flock
 * probe resolves on the next page load) cannot spin here forever. */
async function pollRun(id){
  if(!id) return;
  for(let i=0;i<40;i++){
    let jres;
    try{
      const r=await fetch(`/api/jobs/run?id=${encodeURIComponent(id)}`);
      jres=await r.json();
    }catch(e){note('Lost track of the run: '+esc(e),'warn'); return;}
    if(!jres.ok) return;
    if(jres.status!=='running'){
      /* The four terminal statuses read differently on purpose. `nothing` is a
         healthy empty run -- the normal outcome for a bars poll outside the
         session -- and reporting it as success or failure is exactly the
         conflation that let three cron jobs look fine for two days. */
      const kind=jres.status==='ok'?'ok'
        :jres.status==='nothing'?'warn':'bad';
      note(`<b>${esc(jres.job)}</b> ${esc(jres.status)}`
        +(jres.detail?` — ${esc(jres.detail)}`:''),kind);
      return;
    }
    await new Promise(r=>setTimeout(r,500));
  }
  note('The run is taking longer than expected — it is still recorded.','warn');
}

/* Refresh the calendar from the feed.
 *
 * No confirm(), unlike Sync: this spends no IBKR request and touches no lockout
 * budget, so a dialogue would train you to click through dialogues. It IS
 * rate-limited by the feed, which comes back as its own kind and reads as "try
 * later" rather than as a failure -- nothing is lost, the same week is served
 * tomorrow. */
function bindMarketFetch(){
  const b=$('#mkfetch'); if(!b) return;
  b.onclick=async()=>{
    b.disabled=true; b.classList.add('busy');
    try{
      const r=await fetch('/api/market/fetch',{method:'POST'});
      const mres=await r.json();
      if(mres.kind==='throttled') note('Calendar: '+esc(mres.message||'rate limited')
        +' — nothing lost, the same week is served later.','warn');
      else if(!mres.ok) note('Calendar refresh failed: '+esc(mres.message||''),'bad');
      else note(`Calendar refreshed — <b>${mres.stored}</b> of ${mres.fetched} event(s) stored.`,'ok');
    }catch(e){note('Calendar refresh failed: '+esc(e),'bad');}
    await load();
  };
}

/* Add, remove, and fetch prices. Three buttons, one shape: POST, then reload.
 *
 * A reload rather than a local splice, so the table always shows what the
 * DATABASE holds -- a row spliced in optimistically would show a symbol with no
 * bars, no vol and no options as though those were measured and empty. */
function bindWatchlist(){
  const wf=$('#waddf');
  if(wf) wf.onsubmit=async ev=>{
    ev.preventDefault();
    const input=$('#wadd'), symbol=(input.value||'').trim();
    if(!symbol) return;
    input.disabled=true;
    await watchWrite({symbol:symbol,action:'add'});
  };
  document.querySelectorAll('[data-wrm]').forEach(el=>
    el.onclick=async()=>{
      const symbol=el.dataset.wrm;
      /* Confirmed, because removing drops the note with it and there is no undo.
         Cheap to re-add, but the note is typed by hand and gone for good. */
      if(!confirm(`Stop watching ${symbol}?`)) return;
      el.disabled=true;
      await watchWrite({symbol:symbol,action:'remove'});
    });
  const qb=$('#wquote'); if(qb) qb.onclick=()=>loadQuotes(true);
  /* Selection: a pure redraw, no request -- every figure is already in the
     payload, so opening a row costs nothing. Both the `<tr>` and the `<button>`
     in its symbol cell carry `data-wsel`, so ONE handler serves mouse and
     keyboard: the button brings Enter and Space with it, and the click that
     bubbles from it up to the row is a no-op because `selectWatch` returns early
     on the symbol already open. */
  document.querySelectorAll('[data-wsel]').forEach(el=>
    el.onclick=()=>selectWatch(el.dataset.wsel));
  /* Sorting, also a pure redraw. A click on the SORTED column reverses it; a click
     on a new one starts DESCENDING for the four derived columns, because the
     interesting end of a B-Xtrender reading or a rank is the top, and ASCENDING
     for the symbol, because that is alphabetical. Stated once here so the rule is
     not rediscovered per header. */
  document.querySelectorAll('[data-wsort]').forEach(b=>
    b.onclick=()=>{
      const key=b.dataset.wsort, was=String(S.wsort||'').split(':');
      S.wsort=key===was[0]?key+':'+(was[1]==='desc'?'asc':'desc')
        :key+':'+(key==='symbol'?'asc':'desc');
      draw();
    });
  /* The filter row. Every one of these is a pure redraw with no request, for the
     same reason selection and sorting are: they narrow a list the payload has
     already delivered in full.
     The search box redraws on every keystroke, which it can afford to because
     `preserveInputs` carries its text, its focus and its caret across the render --
     that is why `#wsearch` has an id, and why it carries no `data-subject`: a search
     box is not editing one symbol. */
  const sb=$('#wsearch');
  if(sb) sb.oninput=()=>{S.wsearch=sb.value;draw();};
  /* Both segmented filters are single-select, and All is the ABSENCE of a value
     rather than a fourth state: `data-wbx=""` gives back the empty string, which maps
     to null, which is what `watchRows` reads as "no bucket chosen". */
  document.querySelectorAll('[data-wbx]').forEach(b=>
    b.onclick=()=>{S.wbx=b.dataset.wbx||null;draw();});
  document.querySelectorAll('[data-wivr]').forEach(b=>
    b.onclick=()=>{S.wivr=b.dataset.wivr||null;draw();});
  /* A toggle, so it flips rather than reading a value out of the attribute:
     "exclude the ones reporting soon" has no second setting. */
  document.querySelectorAll('[data-wearn]').forEach(b=>
    b.onclick=()=>{S.wearn=!S.wearn;draw();});
  /* The way out of an empty table, offered in BOTH panes. It clears all four rather
     than the one that emptied the list: the reader pressed it because nothing is
     showing, and leaving a second filter standing would answer that with a second
     empty table. `S.wsym` is untouched, so the row that was open comes back.
     THE FIELD IS EMPTIED IN THE DOM TOO, and that line is not redundant. Caught in a
     browser: clearing left the table showing all three rows with "nvidnvidzzz" still
     sitting in the search box, because `preserveInputs` carries what the reader was
     typing across the render and put it back over the freshly rendered empty value.
     The box then described a filter that was no longer applied, which is this
     project's own defect shape in a control instead of in a number. */
  document.querySelectorAll('[data-wclear]').forEach(b=>
    b.onclick=()=>{if(sb) sb.value='';
      S.wsearch='';S.wbx=null;S.wivr=null;S.wearn=false;draw();});
  /* The typed fields, one form each and one handler for all of them: the form names
     its column in `data-wfield`, so a second typed field is a tile rather than a
     second code path. It stays generic now that only the earnings date is left,
     because `_WATCH_FIELDS` still carries two columns and `note` is still writable
     from the CLI -- the handler lost a caller, not its reason. The value is sent
     UNMODIFIED, which is what makes clearing possible: `_watchlist_write` reads a
     present-and-empty field as NULL, and an emptied box is how a stale date goes. */
  document.querySelectorAll('form[data-wsave]').forEach(wf=>
    wf.onsubmit=async ev=>{
      ev.preventDefault();
      const el=wf.querySelector('input');
      if(!el||!wf.dataset.wfield) return;
      const body={symbol:wf.dataset.wsave};
      body[wf.dataset.wfield]=el.value;
      await watchWrite(body,`Saved <b>${esc(wf.dataset.wsave)}</b>.`);
    });
}

/* One POST for every setting, returning the server's own reply rather than
   raising or banner-ing: each caller in the settings panel reports differently
   (the query id writes into a field's own status span, the scoring toggle just
   reloads), and a helper that decided that for them would make one of the two
   wrong. A transport failure still answers the same SHAPE as a refusal, so no
   caller has to distinguish "no reply" from "no". */
async function save(body){
  try{
    const r=await fetch('/api/settings',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    return await r.json();
  }catch(e){
    return {ok:false,message:'could not reach the journal: '+e};
  }
}

/* `said` overrides the toast, because these three writes are not one act: an add
   and a remove announce themselves by what they did to the LIST, while saving a
   field changed one row that is already on screen -- and "Watching DELL." after
   editing a note describes something that did not happen. Pre-escaped by the
   caller, since it carries markup. */
async function watchWrite(body,said){
  try{
    const r=await fetch('/api/watchlist',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const wres=await r.json();
    if(!wres.ok){note(esc(wres.message||'watchlist write failed'),'bad');return;}
    if(wres.action==='remove'&&!wres.changed)
      note(`${esc(wres.symbol)} was not on the watchlist.`,'warn');
    else note(said||(wres.action==='add'?`Watching <b>${esc(wres.symbol)}</b>.`
      :`Stopped watching <b>${esc(wres.symbol)}</b>.`),'ok');
  }catch(e){note('Watchlist write failed: '+esc(e),'bad');return;}
  await load();
  /* Quotes are keyed by symbol, so an added row simply has none until the next
     refresh -- which is honest, and cheaper than spending a request per add. */
  if(S.quotesAt) await loadQuotes(false);
}

/* One HTTP request PER SYMBOL, so this is never automatic beyond the first view.
 *
 * `announce` is false for the implicit refresh after an edit: a toast saying
 * "prices updated" when you only removed a symbol is noise. */
async function loadQuotes(announce){
  const b=$('#wquote'); if(b){b.disabled=true;b.classList.add('busy');}
  try{
    const r=await fetch('/api/quotes');
    const qres=await r.json();
    S.quotes=qres.quotes||{}; S.quotesAt=qres.asked_at||null;
    /* Set even when `ranks` is empty, because the OBJECT is the signal: null means
       never asked and `{}` means asked-and-nothing-came-back, and only the second
       one lets the IV rank chips enable themselves honestly. */
    S.ivr={ranks:qres.ranks||{},unranked:qres.unranked||[],
           ranks_failed:qres.ranks_failed||[]};
    if(qres.failed&&qres.failed.length)
      note('No quote for '+esc(qres.failed.join(', ')),'warn');
    else if(qres.ranks_failed&&qres.ranks_failed.length)
      note('No IV rank for '+esc(qres.ranks_failed.join(', '))
        +' — the request failed, not the symbol.','warn');
    else if(announce) note('Prices updated.','ok');
  }catch(e){note('Quote fetch failed: '+esc(e),'bad');}
  draw();
}

/* Keys this page reads off `stats` that a SERVER TOO OLD to send them would omit.
   Deliberately a short hand-picked list rather than every Stats key: the point is
   to catch a stale process, and one key per payload change is enough to do that.
   Held to the typedef by `test_web`, so a name here that stops existing fails a
   test rather than silently guarding nothing.

   `decided_campaigns` and `inflight_realized` are the two most recent additions.
   Both produced the exact failure this exists for: the server re-reads page.html
   on every request but loads its PYTHON at import, so a process left running
   across a merge serves NEW markup against an OLD payload. The Trades card read
   `undefined` on a headline figure, which reads as data loss rather than as a
   process that needs restarting -- and the fix is a restart, which nothing on
   screen said. */
const STATS_KEYS_REQUIRED=['decided_campaigns','inflight_realized','scoring'];

/* Says so, in the banner that already exists for things the reader must act on.
   Not a console warning (nobody has devtools open on their own journal) and not a
   thrown error (the rest of the page is fine and still worth reading): the
   numbers that DO arrive are correct, so the page renders and says which figures
   cannot be trusted and what to do about it. */
function staleServerCheck(state){
  const s=state&&state.stats;
  if(!s) return;
  const missing=STATS_KEYS_REQUIRED.filter(k=>!(k in s));
  if(!missing.length) return;
  note('This page is newer than the server process it is talking to, so some '
    +'figures will read <b>undefined</b>. The server re-reads the page on every '
    +'request but loads its Python once, at startup — so restart it: '
    +'<code>optjournal serve</code>. '
    +`(missing: ${missing.map(esc).join(', ')})`,'bad');
}

async function load(){
  /* Not `q` -- that name is the FX quote everywhere else in this page, and one
     name for two shapes is what makes the payload guard unable to check either. */
  const qs=new URLSearchParams();
  if(S.month) qs.set('month',S.month);
  if(S.type) qs.set('type',S.type);
  /* Same repeated key on the wire as in the hash, so one vocabulary spans URL,
     request and payload -- `parse_qs` hands the server the list directly. */
  (S.cost||[]).forEach(c=>qs.append('cost',c));
  /* Sent only when it is not the default, matching the hash: an omitted key and
     'position' mean the same thing to the server, and one spelling of a default
     is one fewer place for the page and stats.py to disagree. */
  if(S.scoring) qs.set('scoring',S.scoring);
  const r=await fetch('/api/state'+(qs.toString()?'?'+qs:''));
  if(!r.ok){note('Could not read state: HTTP '+r.status,'bad');return;}
  S.state=await r.json();
  staleServerCheck(S.state);
  if(S.month===null && S.state.selected_month) S.month=S.state.selected_month;
  /* A month outside the account's lifetime heals away (the server answers with
     selected_month null rather than inventing one). Months WITH no fills are
     legitimate now -- validated against month_range, not the fills-only list,
     or picking one would revert on the very next load. */
  if(S.month && !((S.state.month_range||S.state.months||[]).includes(S.month)))
    S.month=S.state.selected_month;
  /* Server-resolved, so an unrecognised type falls back to everything here too
     instead of leaving the button set out of step with the numbers. */
  S.type=S.state.trade_type==='all'?null:S.state.trade_type;
  draw();
}

$('#cog').onclick=()=>{S.showCog=!S.showCog;draw();};
/* The edition chip IS the theme control. `draw()` without a push, because
   recolouring is an adjustment to the view you are on rather than a navigation --
   the same rule the currency toggle and the filters follow, and pushing here
   would bury the tab trail under one entry per click. */
$('#edition').onclick=()=>{S.theme=nextTheme();draw();};
$('#sync').onclick=async()=>{
  if(!confirm('Fetch from IBKR now?\n\nThis spends one request against your Flex '
    +'request budget. IBKR locks out clients that ask too often.')) return;
  const b=$('#sync'); b.disabled=true; b.classList.add('busy');
  try{
    const r=await fetch('/api/sync',{method:'POST'});
    const res=await r.json();
    if(res.kind==='cooldown') note(esc(res.message),'warn');
    else if(!res.ok) note(esc(res.message||'Sync failed'),'bad');
    else if(res.new_trades||res.new_cash)
      note(`Synced — <b>${res.new_trades}</b> new trade(s), <b>${res.new_cash}</b> new cash row(s).`,'ok');
    else note('Synced. Nothing new'+(res.reused_archive
      ?' — payload identical to the last statement, so no duplicate was archived.':'.'),'ok');
    if(res.warnings&&res.warnings.length) note(esc(res.warnings.join(' · ')),'warn');
  }catch(e){note('Sync failed: '+esc(e),'bad');}
  await load();
};

/* An edited or externally set hash is honoured, so the URL is the source of
   truth rather than a write-only echo of it. `replaceState` does not fire
   hashchange, so `syncHash` cannot feed this back into a loop.

   Reloads only when the server-side keys moved: the tab is drawn from state
   already in hand, and refetching for it would spend a request to render the
   same payload. */
window.onhashchange=()=>{
  const was=[S.type,S.month].join('|');
  applyHash();
  if([S.type,S.month].join('|')!==was) load(); else draw();
};

applyHash();
load();
</script></body></html>
