    <h2 style="font-size:16px">Journal details</h2>
    <table><tbody>
      <tr><td class="dim">version</td><td class="mono">${esc(st.version)}</td></tr>
      <tr><td class="dim">database</td><td class="mono">${esc(st.db)}</td></tr>
      <tr><td class="dim">archive</td><td class="mono">${esc(st.archive)}</td></tr>
      <tr><td class="dim">query id</td><td class="mono">${esc(st.sync.query_id||'not set')}</td></tr>
      <tr><td class="dim">last fetch</td><td class="mono">${esc(st.sync.last_fetch||'never')}</td></tr>
      <tr><td class="dim">fetch cooldown</td><td class="mono">${st.sync.cooldown_s}s
        (${st.sync.cooldown_remaining_s}s remaining)</td></tr>
      <tr><td class="dim">generated</td><td class="mono">${esc(st.generated_at)}</td></tr>
    </tbody></table>
    <h2 style="font-size:16px;margin-top:18px">Archive</h2>
    <table><thead><tr><th>file</th><th>period</th><th class="n">bytes</th>
      <th>ingested</th><th>assets</th></tr></thead><tbody>
      ${(st.statements||[]).map(stm=>`<tr><td class="mono">${esc(stm.file)}</td>
        <td class="dim">${esc(stm.from_date||'?')} → ${esc(stm.to_date||'?')}</td>
        <td class="n mono">${(stm.bytes||0).toLocaleString()}</td>
        <td class="${stm.ingested?'pos':'dim2'}">${stm.ingested?'yes':'no'}</td>
        <td class="dim">${esc(stm.asset_filter||'-')}</td></tr>`).join('')}
    </tbody></table>
    <div class="note"><b>Needs the Flex query template:</b>
      <i>Gain % of Net Liq</i> reads the Equity Summary section — enable it on the
      query and sync, and the figure fills in from the next statement. <i>Trade
      Replay</i> needs intraday underlying prices, implied volatility and greeks —
      none of which a statement carries.</div>
  </div>`;
}

/* ------------------------------------------------ view state in the URL

   The filter, the month and the tab live in the hash so a reload lands on the
   view you left, and so a link carries it. Persisting only the trade filter
   would have been worse than persisting nothing: reload would restore the 0DTE
   scope while silently dropping the month and jumping to the Dashboard, a
   combination that was never on screen.

   `replaceState`, not `location.hash = ...`: assigning pushes a history entry
   per click, so toggling a filter a few times buries the page under back-button
   history. Nothing here is a navigation. */
const HASH_TABS=()=>TABS.filter(t=>!t[2]).map(t=>t[0]);
function applyHash(){
  /* Not `h` -- that is the history payload everywhere else in this page, and
     one name for two shapes is what blinds the payload guard to both. */
  const hs=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const tab=hs.get('tab');
  /* Validated against the enabled tabs rather than trusted: an unknown or
     disabled id would otherwise render "nothing here yet" from a URL. An
     ABSENT key must reset to the default, not leave the current tab standing:
     the back button lands on entries whose hash has no tab key, and keeping
     the old tab made syncHash rewrite it into the entry just navigated to. */
  S.tab=(tab&&HASH_TABS().includes(tab))?tab:'dashboard';
  S.type=hs.get('type')||null;
  S.month=hs.get('month')||null;
  S.ccy=(hs.get('ccy')||'').toUpperCase()||null;
  /* The drill-down selection was the one piece of view state the URL did not
     carry, so a link to "that day" was unshareable and a reload silently
     dropped the panel while leaving the calendar looking untouched. Validated
     against the payload in draw(), not here: a day from another month means
     nothing in this one, and applyHash runs before the state it would check. */
  S.calday=hs.get('calday')||null;
}
function syncHash(push){
  const hs=new URLSearchParams();
  /* Defaults are omitted so the common case has a clean URL, and so a stale
     key cannot outlive the state it described. The display currency's default
     is the account base, so only a restatement is worth recording. */
  if(S.tab&&S.tab!=='dashboard') hs.set('tab',S.tab);
  if(S.type) hs.set('type',S.type);
  if(S.month) hs.set('month',S.month);
  if(S.ccy&&S.ccy!==BASE()) hs.set('ccy',S.ccy);
  if(S.calday) hs.set('calday',S.calday);
  const next=hs.toString()?'#'+hs:'';
  if(next===(location.hash||'')) return;
  /* A tab jump is a navigation, so it pushes and the back button walks tabs.
     Everything else -- filter, month, currency -- mutates the current entry:
     those are adjustments to the view you are on, and pushing them would bury
     the tab trail under one entry per click. Clicking the current tab is a
     no-op by the guard above, so it cannot mint duplicate entries. */
  if(push) history.pushState(null,'',location.pathname+next);
  else history.replaceState(null,'',location.pathname+next);
}

/* ------------------------------------------------ shell */
function draw(push){
  /* A currency the account has no quote for falls back to base on display
     (DISP does that); clearing it makes the hash heal to match. Healed here
     rather than in load() because a hash edit is a same-document navigation
     -- load() never runs for it, only the hashchange -> draw path does. */
  if(S.ccy&&S.state&&S.ccy!==BASE()&&!QUOTES().some(qo=>qo.code===S.ccy)) S.ccy=null;
  /* A day the payload holds no fills for cannot be drilled into, so it heals
     out of the URL rather than sitting there describing nothing -- the same
     discipline the display currency follows. Checked HERE, before syncHash:
     dayDetail's own guard runs during render, by which point the stale key has
     already been written to the address bar. */
  if(S.calday&&S.state&&!(((S.state.stats||{}).days)||[])
      .some(dy=>dy.day===S.calday)) S.calday=null;
  syncHash(push);
  renderTabs();
  renderCcy();
  const views={dashboard,calendar,trades,positions,costs,annual,odte};
  const v=views[S.tab];
  $('#body').innerHTML=(S.showCog?cog():'')+(v?v():
    `<div class="card"><div class="empty">nothing here yet</div></div>`);
  const sel=$('#month');
  if(sel) sel.onchange=()=>{S.month=sel.value||null;load();};
  document.querySelectorAll('button[data-calmonth]').forEach(b=>
    b.onclick=()=>{if(b.dataset.calmonth){
      S.calday=null; /* a selection from the old month means nothing in the new */
      S.month=b.dataset.calmonth;load();}});
  /* Day drill-down: pure redraw, no request -- the leg data is already in the
     payload. Clicking the selected day again clears it (toggle). */
  document.querySelectorAll('[data-calday]').forEach(el=>
    el.onclick=()=>{const k=el.dataset.calday;
      S.calday=S.calday===k?null:k;draw();});
  document.querySelectorAll('[data-calday-clear]').forEach(el=>
    el.onclick=()=>{S.calday=null;draw();});
  /* Server-side like the month filter, so the aggregations are recomputed
     rather than the page trying to re-sum a filtered subset of totals. */
  document.querySelectorAll('.seg button[data-type]').forEach(b=>
    b.onclick=()=>{const t=b.dataset.type||null;
      if(t===S.type)return; S.type=t; load();});
  const st=S.state;
  $('#foot').textContent=`optjournal ${st.version} · ${st.db} · loopback only, no authentication`;
  const b=$('#sync'), rem=st.sync.cooldown_remaining_s;
  b.classList.remove('busy');
  if(!st.sync.configured){b.disabled=true;b.title='No query id — start with --query-id';}
  else if(rem>0){b.disabled=true;
    b.title=`Cooldown: ${Math.ceil(rem/60)}m left. Prevents spending an IBKR request for data that cannot have changed.`;}
  else {b.disabled=false;b.title='Fetch from IBKR — spends one request';}
}

function note(text,kind){
  const m=$('#msg'); m.innerHTML=text; m.className='show';
  const c={bad:['#3a1f22','#f0a0a8'],warn:['#3a3122','#e8cd85'],ok:['#183328','#9fe3c4']}[kind||'ok'];
  m.style.background=c[0]; m.style.color=c[1]; m.style.border='1px solid rgba(255,255,255,.07)';
}

async function load(){
  /* Not `q` -- that name is the FX quote everywhere else in this page, and one
     name for two shapes is what makes the payload guard unable to check either. */
  const qs=new URLSearchParams();
  if(S.month) qs.set('month',S.month);
  if(S.type) qs.set('type',S.type);
  const r=await fetch('/api/state'+(qs.toString()?'?'+qs:''));
  if(!r.ok){note('Could not read state: HTTP '+r.status,'bad');return;}
  S.state=await r.json();
  if(S.month===null && S.state.selected_month) S.month=S.state.selected_month;
  /* A month outside the account's lifetime heals away (the server answers with
     selected_month null rather than inventing one). Months WITH no fills are
     legitimate now -- validated against month_range, not the fills-only list,
     or picking one would revert on the very next load. */
  if(S.month && !((S.state.month_range||S.state.months||[]).includes(S.month)))
    S.month=S.state.selected_month;
  /* Server-resolved, so an unrecognised type falls back to everything here too
     instead of leaving the button set out of step with the numbers. */
  S.type=S.state.trade_type==='all'?null:S.state.trade_type;
  draw();
}

$('#cog').onclick=()=>{S.showCog=!S.showCog;draw();};
$('#sync').onclick=async()=>{
  if(!confirm('Fetch from IBKR now?\n\nThis spends one request against your Flex '
    +'request budget. IBKR locks out clients that ask too often.')) return;
  const b=$('#sync'); b.disabled=true; b.classList.add('busy');
  try{
    const r=await fetch('/api/sync',{method:'POST'});
    const res=await r.json();
    if(res.kind==='cooldown') note(esc(res.message),'warn');
    else if(!res.ok) note(esc(res.message||'Sync failed'),'bad');
    else if(res.new_trades||res.new_cash)
      note(`Synced — <b>${res.new_trades}</b> new trade(s), <b>${res.new_cash}</b> new cash row(s).`,'ok');
    else note('Synced. Nothing new'+(res.reused_archive
      ?' — payload identical to the last statement, so no duplicate was archived.':'.'),'ok');
    if(res.warnings&&res.warnings.length) note(esc(res.warnings.join(' · ')),'warn');
  }catch(e){note('Sync failed: '+esc(e),'bad');}
  await load();
};

/* An edited or externally set hash is honoured, so the URL is the source of
   truth rather than a write-only echo of it. `replaceState` does not fire
   hashchange, so `syncHash` cannot feed this back into a loop.

   Reloads only when the server-side keys moved: the tab is drawn from state
   already in hand, and refetching for it would spend a request to render the
   same payload. */
window.onhashchange=()=>{
  const was=[S.type,S.month].join('|');
  applyHash();
  if([S.type,S.month].join('|')!==was) load(); else draw();
};

applyHash();
load();
</script></body></html>
