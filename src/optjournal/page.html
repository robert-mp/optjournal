    sks.some(sk=>String(sk.put_call).toUpperCase()==='C')
      ?'<span class="lg call">—</span> call strike':'',
    sks.some(sk=>sk.side==='long')?'<span class="dim2">dashed = bought</span>':'',
    '<span class="lg px">—</span> underlying',
    dd?'<span class="lg dl">···</span> eff Δ (right)':'',
    edges.upper.length?'<span class="lg em">▬</span> expected move (1 SD)':'',
  ].filter(Boolean).join('<span class="dim2"> · </span>');
  return `<div class="rkey">${key}</div>
  <div class="rwrap">
  <svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet"
    ><title>${esc(rp.underlying||'')} ${num(pts[0][1],dp)} → ${
      num(pts[pts.length-1][1],dp)} across ${pts.length} ${
      rp.bar_size==='1h'?'hourly':'daily'} bars</title>
    <defs><clipPath id="rclip"><rect id="rclipr" x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>
    ${yticks}${dax}${breaks}
    <line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${T+ih}"/>
    <line class="ax" x1="${L}" y1="${T+ih}" x2="${L+iw}" y2="${T+ih}"/>
    <g clip-path="url(#rclip)">${band}${strikes}${
      edge(geo.at(rp.opened_ts),'edge in','entry')}${
      edge(geo.at(rp.closed_ts),'edge out','exit')}${dline}<polyline class="pxline" points="${
      line}"/>${dots}</g>
    <line id="rcross" class="cross" x1="${geo.xs[pts.length-1].toFixed(1)}" y1="${T}" x2="${
      geo.xs[pts.length-1].toFixed(1)}" y2="${T+ih}"/>
    ${xticks}</svg>
  <div class="rfocus" id="rfocus"></div></div>
  <div class="rctl">
    <button class="rbtn" data-rseek="0" title="to the start">|◀</button>
    <button class="rbtn" data-rplay="1">▶ play</button>
    <button class="rbtn" data-rseek="${pts.length-1}" title="to the end">▶|</button>
    <input class="rscrub" id="rscrub" type="range" min="0" max="${pts.length-1}"
      value="${pts.length-1}" step="1" aria-label="replay position">
    <!-- A MULTIPLIER of the whole replay's duration, not milliseconds per bar.
         The old values were ms/bar, which made one setting mean a different
         promise on every trade: at "1x" a 24-bar strangle took 6s and a 461-bar
         LEAP took nearly two minutes. Now 1x is REPLAY_SECONDS end to end
         whatever the length, and the multiplier divides it -- see barsPerMs. -->
    <select class="rspeed" id="rspeed" aria-label="playback speed">
      <option value="1">1×</option><option value="2">2×</option>
      <option value="4">4×</option><option value="10">10×</option>
    </select>
    <label class="rauto"><input type="checkbox" id="rloop"> loop</label>
    <!-- Halting at each decision is the DEFAULT: the cards exist to be read, and
         at 4x an event card used to be lit for a third of a second. Unchecking
         it plays the trade straight through. -->
    <label class="rauto" title="halt at each decision so its card can be read"
      ><input type="checkbox" id="rstops" checked> stop on events</label>
    <span class="rread mono" id="rread">${replayReadout(opening,rp.bar_size,dp)}</span>
  </div>${replayEvents(rp,pts)}`;
}

/* One card per decision on the timeline. Rendered once and toggled by class as
   the replay reaches each one -- rebuilding the strip on every scrub tick would
   discard the DOM 240 times a second during playback to change one attribute.

   Each card seeks to its own event, which makes the strip a table of contents
   for the trade: click "Short put close" to jump the chart to the buyback. */
function replayEvents(rp,pts){
  const evs=timedEvents(rp);
  if(!evs.length) return '';
  return `<div class="evs">${evs.map(e=>{
    const legs=(e.legs||[]).map(l=>
      `<div><span class="${actClass(l.buy_sell)}">${esc(actLabel(l))}</span> ${
        num(l.quantity,0)} × ${strike(l.strike)}${esc(l.put_call||'')} @ ${
        num(l.avg_price,2)}</div>`).join('');
    /* Credit or debit named rather than shown as a signed number: "−$780" is
       ambiguous about whether the trade received or paid, and which one it was
       is the first thing you want off a closing card. */
    const flow=!e.cash?'':`${Number(e.cash.native)<0?'debit':'credit'} ${
      moneyOf(e.cash)}`;
    /* Δ before → after, where NULL on either side means "no position", not zero:
       an opening event has no before, and a closing one has no after. Naming the
       empty side "flat" rather than dropping the row is what makes a close state
       the exposure it removed -- the row used to vanish entirely whenever `after`
       was null, which is exactly the closing event whose delta matters most. */
    const dnum=v=>v==null?'flat':num(v,2);
    const dl=(e.delta_before==null&&e.delta_after==null)?''
      :`Δ ${e.delta_before==null?'':dnum(e.delta_before)+' → '}${
        dnum(e.delta_after)}`;
    const bits=[flow,
      e.commission?`comm ${moneyOf(e.commission)}`:'',
      e.realized?`realised <b class="${cls(e.realized.native)}">${
        moneyOf(e.realized)}</b>`:'',
      dl].filter(Boolean).join('<span class="dim2"> · </span>');
    return `<div class="evc" data-rts="${e.ts}" data-rseek="${
      indexOfTs(pts,e.ts)}" role="button" tabindex="0"
      title="jump the replay here"><div class="evh"><span class="evk ${
      esc(e.kind)}">${esc(e.kind)}</span><span class="evt">${
      esc(e.label||'')}</span><span class="evw mono">${esc(e.at||'')}</span></div>
      <div class="evl mono">${legs}</div><div class="evm">${bits}</div></div>`;
  }).join('')}</div>`;
}

/* The event the replay is PARKED on, over the chart.

   An overlay rather than only the strip below, because playback now halts here:
   a stop the reader has to look away from the chart to understand is a stop that
   reads as a stall. It states what changed at this instant and waits.

   One node, rewritten per stop, rather than one per event kept in the DOM. The
   strip is already the full table of contents; this is the single card for the
   single moment playback is holding, so there is nothing to toggle and no set to
   keep in sync -- and the reader dismisses it to see the chart underneath.

   Every figure is the strip card's, read off the same event object. Two
   renderers over one event could disagree about a roll's credit, and the panel
   would then contradict itself depending on where you looked. */
function replayFocus(e,resume){
  const host=$('#rfocus');
  if(!host) return;
  if(!e){host.innerHTML='';host.classList.remove('on');return;}
  /* Strikes as the roll itself reads: what closed, then what opened. A roll's
     whole content is that substitution, and naming both sides is what makes the
     card answer "why did that line move" without the reader inferring it. */
  const legOf=m=>(e.legs||[]).filter(l=>
    String(l.open_close||'').toUpperCase()===m)
    .map(l=>`${strike(l.strike)}${esc(l.put_call||'')}`).join(' + ');
  const closed=legOf('C'), opened=legOf('O');
  const moved=closed&&opened?`${closed} <span class="fa">→</span> ${opened}`
    :(opened||closed);
  /* Same rule as the strip card, and the same reason: null is "no position", so
     it reads "flat" rather than dropping the row or printing 0.00. A closing
     event's whole point is the exposure it removed. */
  const dnum=v=>v==null?'flat':num(v,2);
  const rows=[
    (e.delta_before==null&&e.delta_after==null)?null:['eff Δ', `${
      e.delta_before==null?'':dnum(e.delta_before)+' <span class="fa">→</span> '
      }${dnum(e.delta_after)}`],
    moved?['strikes', moved]:null,
    /* Named, not signed: "−$780" is ambiguous about who paid whom, and that is
       the first thing wanted off a closing card. Matches the strip exactly. */
    !e.cash?null:[Number(e.cash.native)<0?'debit':'credit',
      `<b class="${Number(e.cash.native)<0?'neg':'pos'}">${moneyOf(e.cash)}</b>`],
    !e.realized?null:['realised',
      `<b class="${cls(e.realized.native)}">${moneyOf(e.realized)}</b>`],
    !e.commission?null:['commission', moneyOf(e.commission)],
  ].filter(Boolean).map(([k,v])=>
    `<div class="fr"><span class="fk">${k}</span><span class="fv mono">${v}</span></div>`
  ).join('');
  host.innerHTML=`<div class="fcard" role="dialog" aria-label="${
    esc(e.label||'event')}"><div class="fh"><span class="ft">${esc(e.label||'')}</span>
    <button class="fx" id="rfx" aria-label="dismiss and continue">×</button></div>
    <div class="fw mono">${esc(e.at||'')}</div>${rows}</div>`;
  host.classList.add('on');
  /* Dismissing RESUMES. The card is what playback stopped for, so closing it is
     the reader saying "read it, carry on" -- and the aria-label has always said
     "dismiss and continue". Leaving it merely cleared meant the only way onward
     was the play button, which put the one control that matters at this moment
     somewhere other than where the reader is already looking.

     Guarded on `resume` so this stays true only of the parked-by-playback case:
     a card raised by CLICKING an event in the strip is a lookup, not a pause, and
     starting playback from it would march the chart away from the bar just asked
     for. replayFocus(null) also passes no resume, so every programmatic clear
     (a scrub, pressing play) still just hides the card.

     Not `x` for the button -- that name is bound to an Episode in the payload
     contract, and one name for two shapes blinds the binding guard to both. */
  const dismiss=$('#rfx');
  if(dismiss) dismiss.onclick=()=>{replayFocus(null);if(resume) resume();};
}

/* The scrubbed bar in words. Shared by the initial render and every seek, so the
   two cannot drift into disagreeing about the same frame. */
function replayReadout(fr,size,dp){
  const when=`${esc(rstamp(fr.ts,size))} · ${num(fr.price,dp)}`;
  if(fr.pnl==null) return `${when} · <span class="dim2">no mark</span>`;
  /* money(), not cash(): the modelled figure is in the CONTRACT's currency, and
     cash() restates a base-currency amount into the display one. Running a USD
     model output through it would relabel dollars as euros without converting
     them -- the exact class of error the Money type exists to prevent, which is
     why this figure is never mixed into a base-currency total. */
  /* "flat" rather than "Δ 0.00" off-position. Delta is null on a bar holding
     nothing, and num(null) is null -- which would print the word "null" beside a
     real P&L. Naming the state is also the more useful readout: the figure is
     absent because there is no position, not because the exposure was zero. */
  const dl=fr.delta==null?'<span class="dim2">flat</span>':`Δ ${num(fr.delta,2)}`;
  return `${when} · <b class="${cls(fr.pnl)}">${money(fr.pnl,'USD',2)}</b> `
    +`<span class="dim2">est. P&L · </span>${dl}`;
}

/* Scrubber, playback and readout. These mutate the open panel IN PLACE rather
   than going through draw(): a click is a state change worth re-rendering for,
   a continuous drag is not, and re-rendering the whole page per scrub tick
   would rebuild every card to move one rect. */
function replaySeek(i){
  if(!RGEO) return;
  /* All the arithmetic is frameAt's, in the unit-tested module. This function is
     the DOM half and nothing else: which attributes to set, on which elements.
     That division is what lets "scrubbing to bar 7 selects bar 7" be a test
     rather than something only a human clicking can confirm. */
  const fr=frameAt(RGEO,i);
  const clip=$('#rclipr'), cross=$('#rcross'), read=$('#rread');
  if(clip) clip.setAttribute('width', fr.revealWidth.toFixed(1));
  if(cross){cross.setAttribute('x1',fr.x.toFixed(1));
    cross.setAttribute('x2',fr.x.toFixed(1));}
  if(read) read.innerHTML=replayReadout(fr,RGEO.size,RGEO.dp);
  /* Which cards the replay has reached is reachedEvents' decision, in the tested
     module -- it is the half that has to agree with the clip on the fill dots.
     `now` marks the most recent one, so during playback the strip reads as a
     cursor moving through the trade rather than as a set that only grows. */
  const reached=reachedEvents(RGEO.events||[],fr.ts);
  const latest=reached.length?reached[reached.length-1]:null;
  document.querySelectorAll('.evc').forEach(el=>{
    const ts=Number(el.dataset.rts);
    el.classList.toggle('on',reached.includes(ts));
    el.classList.toggle('now',ts===latest);
  });
  return fr.index;
}
function bindReplayControls(){
  const scrub=$('#rscrub'), speed=$('#rspeed'), play=document.querySelector('[data-rplay]');
  if(!scrub) return;
  /* Sync once on open. The cards render hidden and are revealed by replaySeek, so
     without this the strip would stay blank until the first interaction even
     though the scrubber already sits at the end with everything reached. One
     source of truth for "what is revealed at frame i" rather than two. */
  replaySeek(Number(scrub.value));
  /* Dragging dismisses the parked card: the reader has taken the timeline back
     into their own hands, and a card naming the instant they scrubbed away from
     would be describing somewhere the chart no longer is. */
  scrub.oninput=()=>{replayStop();if(play)play.textContent='▶ play';
    replayFocus(null);replaySeek(Number(scrub.value));};
  if(play) play.onclick=()=>{
    if(RTIMER!==null){replayStop();play.textContent='▶ play';return;}
    /* Restart from the beginning when the cursor is already at the end,
       otherwise pressing play on a finished replay does nothing visible. */
    if(Number(scrub.value)>=Number(scrub.max)) scrub.value='0';
    play.textContent='❚❚ pause';
    /* Pressing play dismisses the parked card. It is the answer to "I have read
       this, continue" -- leaving it up would have it hang over a moving chart
       and describe an instant the replay has left. */
    replayFocus(null);
    const max=Number(scrub.max);
    let position=Number(scrub.value), last=null;
    /* Bars per millisecond from the LENGTH, so the setting means "this replay in
       REPLAY_SECONDS/speed" rather than "this many ms per bar". A fixed ms/bar
       made 1x take 6s on a strangle and nearly two minutes on the LEAP. */
    const rate=barsPerMs(RGEO?RGEO.points.length:max+1,
                         REPLAY_SECONDS, Number((speed&&speed.value)||1));
    /* The bar to halt on, decided once per play rather than tested per frame:
       nextStop is exclusive of where we stand, so re-deriving it mid-flight
       would keep finding the same stop and never move. null means run to the
       end. Unchecking the box opts out entirely.

       `from` is the CURRENT bar, not one behind it. nextStop is already
       exclusive, so passing position-1 asked "what comes after the bar before
       this one" and got back the stop we are parked ON -- play halted instantly
       at the same bar and the replay could never be resumed past its first
       event. Caught by driving the real page, which is why this is the value the
       test now pins. */
    const stops=$('#rstops');
    const halt=(stops&&stops.checked)&&RGEO
      ?nextStop(RGEO.events||[],RGEO.points,Math.round(position)):null;
    const tick=(now)=>{
      if(RTIMER===null) return;                    /* stopped mid-frame */
      if(last===null) last=now;
      position+=(now-last)*rate;
      last=now;
      /* A stop is honoured BEFORE the end check, so an event on the last bar
         parks on its card instead of being overtaken by the finish. */
      if(halt!==null&&position>=halt){
        scrub.value=String(halt);replaySeek(halt);
        replayStop();play.textContent='▶ play';
        /* The card for the bar just landed on, by the same timestamp the strip
           uses -- one lookup, so the overlay cannot describe a different event
           than the one highlighted below it. */
        const at=(RGEO.events||[]).filter(e=>
          indexOfTs(RGEO.points,e.ts)===halt);
        /* Closing THIS card carries on, because playback is what raised it. The
           resume is `play.onclick` itself rather than a copy of the loop: one
           entry point, so dismissing a card and pressing play cannot diverge --
           and the handler already re-derives the next stop from where we now
           stand, which is what carries the replay to the following event. */
        replayFocus(at.length?at[at.length-1]:null,()=>play.onclick());
        return;
      }
      if(position>=max){
        /* Loop rather than stop, when asked. A short trade is 20-odd bars, which
           is over in a few seconds -- watching it twice is often how the shape
           registers. */
        const loop=$('#rloop');
        if(loop&&loop.checked){position=0;}
        else{scrub.value=String(max);replaySeek(max);
             replayStop();play.textContent='▶ play';return;}
      }
      /* The range input is integral, so it tracks the nearest bar while the
         drawing follows the fraction -- the scrubber stays a bar selector. */
      scrub.value=String(Math.round(position));
      replaySeek(position);
      RTIMER=requestAnimationFrame(tick);
    };
    RTIMER=requestAnimationFrame(tick);
  };
  if(speed) speed.onchange=()=>{ if(RTIMER!==null&&play){play.onclick();play.onclick();} };
  /* Jump to either end, or to an event. Stops playback first: leaving a timer
     running would have it march away from the position just asked for. The
     annotation cards carry data-rseek too, which makes the strip a table of
     contents -- and since they are role=button, Enter and Space have to work. */
  document.querySelectorAll('[data-rseek]').forEach(el=>{
    const seek=()=>{replayStop();if(play)play.textContent='▶ play';
      scrub.value=el.dataset.rseek;replaySeek(Number(scrub.value));
      /* Clicking an event's own card raises the overlay for it; the end/start
         buttons carry no timestamp and simply clear it. Same lookup as the
         playback halt, so both routes to a card show the identical one. */
      const ts=Number(el.dataset.rts);
      const at=(RGEO&&Number.isFinite(ts))
        ?(RGEO.events||[]).filter(e=>e.ts===ts):[];
      replayFocus(at.length?at[0]:null);};
    el.onclick=seek;
    if(el.getAttribute('role')==='button')
      el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();seek();}};
  });
}

function replayPanel(rp,label,valueHtml){
  const bars=rp.bar_size==='1h'?'hourly bars':rp.bar_size==='1d'?'daily bars':'no bars';
  const when=rp.opened_at?`${esc(String(rp.opened_at).slice(0,16))}${
    rp.closed_at?` → ${esc(String(rp.closed_at).slice(0,16))}`:' → open'}`
    :'entry date unknown — every bar held';
  return `<div class="replay"><div class="crow">
    <div><div class="kicker">replay · ${esc(rp.underlying||'?')} underlying</div>
      <div class="sub mono">${when} · ${esc(bars)} · times ET</div></div>
    <div class="pills"><span class="pill">${esc(label)} ${valueHtml}</span></div>
  </div>${replayChart(rp)}
  <div class="note">The line is the UNDERLYING's price, not the option's — it is
    what the strikes are read against. Each strike spans only the period it was
    held; hue says put or call, and a dashed one was bought rather than sold.
    Everything that states a fact about the trade is hidden ahead of the
    scrubber, so a replay cannot show you its own outcome. Expected move and
    eff Δ are modelled from the vol implied by the option's own closes AND by
    your fills, so they are estimates: the card above states the figure the
    broker billed.</div></div>`;
}

function trades(){
  /* One card per POSITION LIFECYCLE: a short put opened in July and bought
     back in August is one position with two events, not two unrelated
     trades. The linkage is the episode layer's, not a display heuristic --
     the open and the close share a FIFO episode keyed by conid, so the
     grouping can never join two different contracts or split one. Below the
     lifecycle, each EVENT (the strategy-grouped orders from strategies.py)
     stays fully visible with its legs, so the order-level truth is intact.
     Realised P&L and commission are episode-sourced and appear only once
     the lifecycle is closed -- the same rule the Dashboard follows. */
  const lcs=S.state.lifecycles||[];
  if(!lcs.length) return `${filters()}<div class="card"><div class="empty">no option orders</div></div>`;
  return filters()+lcs.map(lc=>{
    const evs=lc.events||[];
    const legs=evs.flatMap(g=>(g.orders||[]).flatMap(o=>o.legs||[]));
    const nat=legs[0]?legs[0].currency:'';
    const openLc=lc.status==='open';
    const when=openLc?`opened ${esc((lc.opened_at||'').slice(0,10))} · still open`
      :`${esc((lc.opened_at||'').slice(0,10))} → ${esc((lc.closed_at||'').slice(0,10))}`;
    /* Unrealised for an open lifecycle comes from the position snapshot, summed
       over the legs this lifecycle holds -- realised money does not exist until
       the position is flat, the same rule the Dashboard and the stat cards
       follow. Summed in base through `.base` because two legs can be quoted in
       different currencies, which is what the Money gate exists to catch. */
    const rp=(S.state.replays||{})[lc.replay_key];
    const shown=S.replay===lc.replay_key;
    let uz=0; (S.state.positions||[]).forEach(pos=>{
      if((lc.conids||[]).map(String).includes(String(pos.conid)))
        uz+=(pos.unrealized.base||0);});
    const score=openLc?['Unrealised',`<b class="${cls(uz)}">${cash(uz)}</b>`]
      :['Realised',`<b class="${cls(lc.realized_pnl?.base)}">${
        lc.realized_pnl!=null?moneyOf(lc.realized_pnl):'—'}</b>`];
    return `<div class="card">
      <div class="crow${rp?' rk':''}"${rp?` data-replay="${esc(lc.replay_key)}"`:''}><div><h2>${
        esc(lc.underlying||'?')}
        <span class="dim lbl">${esc(lc.label)}</span>
        <span class="pill gap"
          >${openLc?'OPEN':'CLOSED'}</span></h2>
        <div class="sub mono">${when} · ${lc.fills} fill(s) · ${evs.length} event(s)</div></div>
        ${rp?`<div class="rhint">${shown?'hide replay':'replay'
          } <span class="caret${shown?' open':''}">▸</span></div>`:''}
      </div>
      ${shown&&rp?replayPanel(rp,score[0],score[1]):''}
      <div class="stats">
        ${statCard('Proceeds', moneyOf(lc.proceeds),
          nat&&nat!==DISP()?`${money(legs.reduce((a,l)=>a+(l.proceeds||0),0),nat)} as filled`:'',
          'sm '+cls(lc.proceeds.base))}
        ${statCard('Comms & Fees',
          lc.commission!=null?moneyOf(lc.commission):'—',
          openLc?'lands with the outcome, on close':'all legs, whole lifecycle',
          'sm '+cls(lc.commission?.base))}
        ${statCard('Realised P&L',
          lc.realized_pnl!=null?moneyOf(lc.realized_pnl):'—',
          openLc?'nothing counts until the position is flat':'net of commission',
          'sm '+cls(lc.realized_pnl?.base))}
      </div>
      ${evs.map(g=>{
        const glegs=(g.orders||[]).flatMap(o=>o.legs||[]);
        /* Inside its own card, an event whose shape merely repeats the
           card's is noise: a "Short put" lifecycle does not need its events
           captioned "Short put" and "Short put close" -- those are "Opened"
           and "Closed" here. An event that carries NEW information (a Roll,
           a different shape added to a campaign) keeps its full name. Pure
           presentation: g.label itself is unchanged everywhere else the
           payload is read (the calendar drill-down has no card context, so
           it needs the full name). */
        const evl=g.label===lc.label?'Opened'
          :g.label===lc.label+' close'?'Closed':g.label;
        return `<div class="grp">
        <div class="gh"><span class="gl">${esc((g.first_fill_at||'').slice(0,10))} — ${
          esc(evl)} <span class="dim2 mono">order${(g.order_ids||[]).length>1?'s':''} ${
          esc((g.order_ids||[]).join(', '))}</span></span>
          <span class="mono ${cls(g.proceeds.base)}">${moneyOf(g.proceeds)}</span></div>
        ${glegs.map(l=>legRow(l)).join('')}
      </div>`;}).join('')}
      ${legs.length>1?'':`<div class="note">One leg, so this is a single-leg
        position rather than a strategy. Legs placed together on one underlying
        group into a named strategy the day it happens.</div>`}
    </div>`;
  }).join('');
}

/* ------------------------------------------------ positions */
function positions(){
  const ps=S.state.positions||[], h=S.state.history||{};
  const open=(h.open||[]);
  /* Cost basis comes from the snapshot row itself, which carries it for every
     position. This used to read only from the history payload's open episodes,
     where cost_basis is set exclusively for snapshot-only ones -- so the short
     put, which has fills on record, rendered a dash even though the snapshot
     held -1569.907847. The history lookup stays as a fallback for a snapshot
     row that lacks the column. */
  let val=0; ps.forEach(pos=>val+=(pos.value.base||0));
  /* Snapshot rows grouped by the LIFECYCLE that opened them, via conid --
     the same episode-exact linkage the Trades tab uses, so the strangle is
     one position with two contract rows beneath it. Rows no open lifecycle
     claims (snapshot-only contracts from before the archive) group under
     their own heading rather than being forced into a strategy story the
     data cannot back. */
  const lcByConid={};
  (S.state.lifecycles||[]).forEach(lc=>{
    if(lc.status==='open') (lc.conids||[]).forEach(cid=>lcByConid[cid]=lc);});
  const buckets=[]; const seen={};
  ps.forEach(pos=>{
    const lc=lcByConid[String(pos.conid)];
    const key=lc?'lc:'+lc.conids.join(','):'solo:'+pos.conid;
    if(!seen[key]){seen[key]={lc,rows:[]};buckets.push(seen[key]);}
    seen[key].rows.push(pos);
  });
  /* A row resolves to its LIFECYCLE's replay where an open one claims it, so
     clicking either leg of a strangle opens one chart showing both strikes --
     the position is the strategy, not the contract. `lcByConid` is the same map
     the grouping above uses and carries the same open-only rule the payload
     applied, so the two agree on who claims what by construction. A row nothing
     claims falls back to its own single-strike replay: that is the snapshot-only
     case, which has no lifecycle anywhere and is otherwise the position with the
     most history and no way to see it. */
  const rkeyOf=pos=>{const lc=lcByConid[String(pos.conid)];
    const key=(lc&&lc.replay_key)||('pos:'+pos.conid);
    return (S.state.replays||{})[key]?key:null;};
  /* Which row OWNS the open panel, when several share one replay. A strangle is
     two position rows pointing at ONE trade, so both used to render the panel and
     the page emitted two charts of the same position -- and with them two
     #rscrub, two #rfocus and two #rclipr. `$()` takes the first, so the second
     chart was inert: dragging its scrubber moved the first one's crosshair.
     Panels are addressed by fixed id precisely because only one is ever open, so
     the guard belongs here at the only place that can open two.

     The FIRST row in table order claims it, which is also the one whose subtotal
     the reader is reading down from. */
  const owner={};
  ps.forEach(pos=>{const k=rkeyOf(pos);
    if(k&&owner[k]===undefined) owner[k]=String(pos.conid);});
  const row=pos=>{const ep=open.find(x=>x.conid===pos.conid)||{};
    const key=rkeyOf(pos);
    const shown=key&&S.replay===key&&owner[key]===String(pos.conid);
    return `<tr${key?` class="rk" data-replay="${esc(key)}"`:''}><td class="mono">${
      esc(pos.symbol)}</td>
    <td class="side ${String(pos.side).toLowerCase()==='short'?'sell':'buy'}">${esc(pos.side)}</td>
    <td class="n mono ${cls(pos.position)}">${pos.position}</td>
    <td class="n mono">${money(pos.mark_price,pos.currency)}</td>
    <td class="n mono">${moneyOf(pos.value)}</td>
    <td class="n mono">${moneyOf(pos.cost_basis)}</td>
    <td class="n mono ${cls(pos.unrealized.base)}">${moneyOf(pos.unrealized)}</td>
    <td class="dim">${esc(pos.currency)}</td>
    <td class="dim2">${ep.snapshot_only?'snapshot only':ep.entry_outside_window?'partial':'complete'}</td>
  </tr>${shown?`<tr class="rpanel"><td colspan="9">${
    replayPanel((S.state.replays||{})[key],'Unrealised',
      `<b class="${cls(pos.unrealized.base)}">${moneyOf(pos.unrealized)}</b>`)}</td></tr>`:''}`;};
  const grpRow=bkt=>{
    /* Not `b` -- that name is the DOM button binding elsewhere in this page,
       and one name for two shapes blinds the payload guard to both. */
    const label=bkt.lc?`${bkt.lc.underlying||''} — ${bkt.lc.label}, opened ${
      String(bkt.lc.opened_at||'').slice(0,10)}`:'Ungrouped — no opening fills in the archive';
    let uv=0; bkt.rows.forEach(pos=>uv+=(pos.value.base||0));
    /* The subtotal sums `value`, so it sits in the `value` column. It used to
       ride a colspan=8 label and land in column 9 -- under `record` -- four
       columns adrift of the figures it totals, which is exactly the "total in
       a column that is not its own" failure this table is meant to make
       checkable. Label spans contract..mark, the subtotal takes value, and a
       trailing span covers cost basis..record.

       The label span covers contract..mark, so it must equal the count of
       columns before `value`. It is derived from the header in a test rather
       than trusted, because a column added or removed anywhere to the left
       slides the subtotal into a neighbouring column -- which is exactly the
       "total in a column that is not its own" defect this comment records
       fixing, and it has already happened once. */
    return `<tr class="grp"><td colspan="4" class="dim">${esc(label)}</td>
      <td class="n mono ${cls(uv)}">${cash(uv)}</td>
      <td colspan="4"></td></tr>${bkt.rows.map(row).join('')}`;};
  return `<div class="card">
    <div class="crow"><div><h2>Option book</h2>
      <div class="sub">From the ${esc((ps[0]&&ps[0].report_date)||'latest')} position
      snapshot — the only cost-basis source for anything opened before the archive
      starts. Grouped by the strategy each position was opened as.</div></div>
      <div class="pills"><span class="pill">book value
        <b class="${cls(val)}">${cash(val)}</b></span></div></div>
    ${ps.length?`<table><thead><tr><th>contract</th><th>side</th><th class="n">qty</th>
      <th class="n">mark</th><th class="n">value</th><th class="n">cost basis</th>
      <th class="n">unrealised</th><th>price ccy</th><th>record</th></tr></thead><tbody>
      ${buckets.map(grpRow).join('')}</tbody></table>`:'<div class="empty">no open options</div>'}
    ${open.some(ep=>ep.snapshot_only)?`<div class="note">A position marked
      <b>snapshot only</b> was opened before the earliest archived statement, so no
      opening fill exists anywhere and its entry price and holding period are
      unknown. The cost basis shown comes from the snapshot.</div>`:''}
  </div>`;
}

/* ------------------------------------------------ costs */
function costs(){
  const c=(S.state.costs||[])[0];
  if(!c) return `<div class="card"><div class="empty">no statement to analyse</div></div>`;
  const T=c.totals;
  const scope=c.journal_asset||'OPT';
  /* Two blocks, not one. T.commission_base spans the whole IBKR account, so
     showing it as "Commission" under a journal scoped to options presented
     stock cost as this journal's. journal_* is the attributable figure. */
  /* Same as-charged rule the Dashboard uses: the figure IBKR billed, when the
     reader is already in that currency. Costs is where this matters most --
     the tab exists to answer what trading actually cost. */
  const jrows=[[scope+' commission', moneyOf(T.journal_commission),
    isNative(T.journal_commission)?'as charged':'stated']];
  if(T.journal_taxes.base) jrows.push([scope+' taxes',moneyOf(T.journal_taxes),
    isNative(T.journal_taxes)?'as charged':'stated']);
  /* Per contract, not a repeat of the total. With commission as the only
     component, a "journal friction" card would restate the figure beside
     itself; the per-unit rate is the one that predicts cost at volume. */
  /* One Money, so the per-unit figure cannot be as-charged over a restated
     divisor -- serialize divides both halves by the same quantity. */
  if(T.journal_per_unit!=null)
    jrows.push(['Per contract',
      isNative(T.journal_per_unit)
        ? money(T.journal_per_unit.native,T.journal_per_unit.ccy,4)
        : cash(T.journal_per_unit.base,4),
      'charged per unit, not per euro']);
  else jrows.push(['Journal friction',moneyOf(T.journal_friction),'stated only']);
  /* No account-level block by request: commission on other instruments and
     account fees are not options information. The FX table below stays — AutoFX
     markup is a cost of converting to trade at all, not a stock cost. */
  return `<div class="card">
    <div class="crow"><div><h2>Cost &amp; friction</h2>
      <div class="sub">${esc(c.from_date)} → ${esc(c.to_date)} ·
        ${esc(S.state.costs_source||'')} · ${esc(scope)}-attributable costs and FX only</div></div>
      <div class="pills"><span class="pill">${esc(scope)} <b>${
        moneyOf(T.journal_friction)}</b></span></div>
    </div>
    <h2 class="sub2 mt-2">${esc(scope)} — attributable to this journal</h2>
    <div class="stats">
      ${jrows.map(r=>statCard(r[0],r[1],r[2],'sm')).join('')}
    </div>
    <div class="card inner">
      <h2 class="sub2">FX conversions</h2>
      <table><thead><tr><th>pair</th><th class="n">n</th><th class="n">notional</th>
        <th class="n">AutoFX</th><th class="n">markup @3bps</th></tr></thead><tbody>
        ${c.fx.map(f=>`<tr><td class="mono">${esc(f.symbol)}</td>
          <td class="n mono">${f.conversions}</td>
          <td class="n mono">${cash(f.notional_base)}</td>
          <td class="n mono">${f.autofx_conversions}</td>
          <td class="n mono">${cash(f.autofx_spread_base)}</td></tr>`).join('')}
      </tbody></table>
      <div class="note">${esc(c.fx_caveat||'')}</div>
    </div>
  </div>`;
}

/* ------------------------------------------------ annual */
/* The Annual and Month tables print the same stats payload, and used to spell
   the row and the header out twice each -- ten to twelve <td>s in the same order,
   diverging only in the first cell and in whether the avg-win/avg-loss pair is
   shown. Two copies of a column ORDER is the dangerous kind: swap two <th>s in
   one table and every figure below them still renders, just under the wrong
   heading, which no test and no glance catches.

   `wide` adds the avg pair to both the header and the row together, which is
   what makes them impossible to disagree about. */
const statsHead=(first,wide)=>`<tr><th>${first}</th><th class="n">fills</th>
  <th class="n">orders</th><th class="n">closed</th><th class="n">W</th>
  <th class="n">L</th><th class="n">win rate</th><th class="n">net P&amp;L</th>
  ${wide?`<th class="n">avg win</th><th class="n">avg loss</th>`:''}
  <th class="n">commission</th><th class="n">green/red</th></tr>`;

function statsRow(s,{label,wide=false,klass=''}={}){ return `<tr${klass?` class="${klass}"`:''}>
  <td class="mono">${esc(label)}</td>
  <td class="n mono">${s.total_trades}</td>
  <td class="n mono">${s.orders}</td>
  <td class="n mono">${s.closed_episodes}</td>
  <td class="n mono pos">${s.wins}</td>
  <td class="n mono neg">${s.losses}</td>
  <td class="n mono">${pct(s.win_rate)}</td>
  <td class="n mono ${cls(s.net_pnl.base)}">${moneyOf(s.net_pnl)}</td>
  ${wide?`<td class="n mono">${s.avg_win==null?'—':moneyOf(s.avg_win)}</td>
  <td class="n mono">${s.avg_loss==null?'—':moneyOf(s.avg_loss)}</td>`:''}
  <td class="n mono">${moneyOf(s.commissions)}</td>
  <td class="n mono"><span class="pos">${s.green_days}</span>/<span
    class="neg">${s.red_days}</span></td></tr>`; }

function annual(){
  const yrs=S.state.annual||[], tot=S.state.annual_total||{};
  if(!yrs.length) return `<div class="card"><div class="empty">no trades to summarise</div></div>`;
  /* Every row is a stats payload of the same shape the Dashboard reads, built
     by the same summations over a year-wide period rather than a parallel
     aggregation. The total row is `annual_total`, computed independently of the
     years -- so if they ever stop accounting for everything the discrepancy is
     on screen. Not `all_time`: that one follows the Trade Types filter, which
     this tab does not show, and using it made the total shrink below the sum
     of its own rows whenever the filter was on. */
  let best=yrs[0];
  yrs.forEach(s=>{if(s.net_pnl.base>best.net_pnl.base)best=s;});
  const row=(s,klass)=>statsRow(s,{
    label:s.month==='ALL'?'all time':s.month, wide:true, klass:klass||''});
  return `<div class="card">
    <div class="crow"><div><h2>Year by year</h2>
      <div class="sub">${esc(ccyNote())} A round trip counts in the year it
      <b>closed</b>, the same rule the month selector uses — so a position opened in
      December and closed in January is a January outcome.</div></div>
      <div class="pills">
        <span class="pill">years <b>${yrs.length}</b></span>
        ${yrs.length>1?`<span class="pill">best <b>${esc(best.month)}</b>
          <b class="${cls(best.net_pnl.base)}">${moneyOf(best.net_pnl)}</b></span>`:''}
      </div></div>
    <table><thead>${statsHead('year',true)}</thead><tbody>
      ${yrs.map(s=>row(s)).join('')}
      ${row(tot,'grp')}
    </tbody></table>
    <div class="note"><b>fills</b> counts executions and <b>closed</b> counts round
      trips, which is why they differ: an order filled in two parts is two fills but
      one outcome. Win rate is computed over closed round trips only, so a year that
      traded without closing anything shows a row with no rate rather than 0%.</div>
    ${monthlyTable()}
  </div>`;
}

function monthlyTable(){
  /* The same rows the month selector produces one at a time -- one call, one
     period string -- so a reader who picks March on the Dashboard sees the
     figures printed here. Deliberately does not repeat the year totals: they
     are in the table directly above, which is what makes the month rows
     checkable against them. */
  const mons=S.state.monthly||[];
  if(mons.length<2) return '';
  let year=null; const out=[];
  mons.forEach(s=>{
    const y=String(s.month).slice(0,4);
    if(y!==year){year=y;
      out.push(`<tr class="grp"><td class="mono dim" colspan="10">${esc(y)}</td></tr>`);}
    out.push(statsRow(s,{label:monthLabel(s.month)}));
  });
  return `<h2 class="sub2 mt-6">Month by month</h2>
    <div class="note">Grouped under the year each month belongs to, so the rows
      above them can be checked by adding these up. A month with fills but nothing
      closed shows no win rate rather than 0%.</div>
    <table><thead>${statsHead('month',false)}</thead>
      <tbody>${out.join('')}</tbody></table>`;
}

/* ------------------------------------------------ 0DTE */
/* Market Awareness: the week ahead, and what lands on each day.
 *
 * Read-only. The page never fetches the calendar -- `optjournal market --fetch`
 * does, from the nightly cron, because the feed rate limits (429 with a
 * retry-after) and a tab reload is not a reason to spend a request against it.
 *
 * Every timestamp arrives ALREADY RENDERED in the payload's zone (`mk.zone`), so
 * this function parses no dates and knows nothing about timezones. Deriving the
 * week here would put a second calendar in a second language; serialize owns it.
 */
function market(){
  const mk=S.state.market;
  if(!mk) return `<div class="card"><div class="empty">no calendar data</div></div>`;

  /* THE FILTER. 82 of a real week's 99 events are Low impact and 25 are EUR rows
     that are all Low, so showing everything buries the four releases an options
     book reacts to. `mev.key` and `d.key_events` are decided SERVER-SIDE from the
     same constants the CLI uses -- the page holds no copy of "USD high-impact" to
     drift from, and the toggle's label comes from `default_scope`. */
  const all=S.mktall===true;
  const evs=(mk.events||[]).filter(mev=>all||mev.key);
  const countOf=d=>all?d.events:d.key_events;

  /* Which day is expanded, chosen from the days that have events UNDER THE
     CURRENT FILTER -- otherwise switching to Key could leave a day selected that
     is now empty, which reads as the calendar being broken rather than filtered.

     FORWARD FIRST, then back. Today when it qualifies, else the next qualifying
     day, and only then the most recent past one. A calendar is consulted to learn
     what is COMING, so the earliest cell of the week is the worst default: seen
     in the browser on a Saturday, the Key view opened Monday the 3rd -- five days
     gone -- purely because it was first in the array. Falling back to the LATEST
     past day rather than the earliest also means a week whose events have all
     happened opens on the most recent one. */
  const withEvents=(mk.week||[]).filter(d=>countOf(d)>0).map(d=>d.day);
  const ahead=withEvents.filter(d=>d>=mk.today);
  const behind=withEvents.filter(d=>d<mk.today);
  const sel=S.marketday&&withEvents.includes(S.marketday)?S.marketday
    :(ahead[0]||behind[behind.length-1]||null);

  const cells=(mk.week||[]).map(d=>{
    /* The dot row is a preview, capped at three: a 20-event day would otherwise
       make one cell taller than the rest and break the strip's grid. */
    const mine=evs.filter(mev=>mev.day===d.day);
    const shown=mine.slice(0,3);
    const dots=shown.map(mev=>
      `<div class="mkdot"><span class="mkimp ${
        mev.impact==='High'?'hi':mev.impact==='Medium'?'md':'lo'}"></span>${
        esc(mev.title.length>22?mev.title.slice(0,21)+'…':mev.title)}</div>`).join('');
    const more=mine.length>shown.length?
      `<div class="mkdot dim">+${mine.length-shown.length} more</div>`:'';
    const quiet=mine.length?'':`<div class="mkdot dim">—</div>`;
    return `<div class="day${d.day===sel?' selected':''}${
      d.today?' mktoday':''}" data-marketday="${d.day}" role="button" tabindex="0">
      <div class="top"><span class="dim">${esc(d.label)}</span><b>${d.dom}</b></div>
      <div class="mkdots">${dots}${more}${quiet}</div></div>`;
  }).join('');

  const chosen=evs.filter(mev=>mev.day===sel);
  const rows=chosen.map(mev=>{
    /* forecast and previous are null when unpublished, which is NOT zero -- a
       holiday has no forecast and a release forecast of 0 would be a number. */
    const figs=[['fc',mev.forecast],['prev',mev.previous]]
      .filter(([,v])=>v!=null&&v!=='')
      .map(([k,v])=>`${k} <b>${esc(v)}</b>`).join(' · ');
    return `<div class="mkrow">
      <div class="mkrow-h">
        <span class="mkimp ${mev.impact==='High'?'hi':mev.impact==='Medium'?'md':'lo'}"
          ></span><b>${esc(mev.title)}</b>
        <span class="pill">${esc(mev.country)}</span>
        <span class="dim">${esc(mev.at)}</span>
      </div>${figs?`<div class="dim mkfig">${figs}</div>`:''}</div>`;
  }).join('');

  /* How many rows the other view would show, so the toggle states what it costs
     rather than making you press it to find out. */
  const hidden=(mk.total_events||0)-(mk.key_events||0);
  const seg=`<div class="seg mktoggle">
    <button data-mktall="0" class="${all?'':'on'}">${esc(mk.default_scope)}</button>
    <button data-mktall="1" class="${all?'on':''}">all ${mk.total_events||0}</button>
  </div>`;

  /* The empty state distinguishes "nothing stored" from "nothing MATCHED", which
     are different problems: the first needs a fetch, the second needs the toggle.
     Conflating them is how a working calendar reads as broken. */
  const empty=(mk.total_events||0)===0
    ? `<div class="empty">no events stored for this week —
        <b>Refresh</b> above, or run <code>optjournal market --fetch</code></div>`
    : `<div class="empty">no ${esc(mk.default_scope)} events this week.
        ${hidden} other event(s) are stored — switch to
        <b>all ${mk.total_events||0}</b> to see them.</div>`;

  return `<div class="card">
    <div class="crow"><h3>Economic Calendar</h3>
      <span class="pill">${esc(mk.from_day)} – ${esc(mk.to_day)}</span>
      ${seg}
      <button id="mkfetch" class="btn sm">Refresh</button></div>
    <div class="cal">${cells}</div>
    ${sel?`<div class="crow mksel"><h3>${esc(sel)}</h3>
      <span class="dim">${chosen.length} event(s)${
        all?'':` · ${hidden} hidden`}</span></div>${rows}`
      :empty}
    <div class="dim mkattr">impact is ${esc(mk.impact_source)}'s assessment, not
      this journal's · times in ${esc(mk.zone)}</div>
  </div>`;
}

/* Watchlist: symbols being watched, with what this journal knows about them.
 *
 * The last two columns are the reason this is not a quote screen. A broker app
 * shows a price; only this journal can say "you are short the 520 put on it".
 *
 * `realised_vol` is REALISED, and the header says so. Implied vol is not
 * reachable for a symbol this journal does not hold -- it is solved from an
 * OPTION's own closes, and a watched name has none (see vol.py). Labelling
 * realised vol as IV would fit the column and be wrong.
 */
function watchlist(){
  const ws=S.state.watchlist||[];
  const pct=v=>v==null?'<span class="dim">—</span>':
    `<span class="${v>=0?'g':'r'}">${v>=0?'+':''}${num(v,2)}%</span>`;

  /* The add field lives in the header, so editing happens where you are looking.
     Rendered even when the list is empty -- an empty state that only tells you to
     run a CLI command is a dead end when the button could be right there. */
  const adder=`<form id="waddf" class="wadd">
    <input id="wadd" placeholder="+ add symbol" maxlength="24"
      autocomplete="off" spellcheck="false">
    <button class="btn sm" type="submit">Add</button></form>`;

  if(!ws.length) return `<div class="card">
    <div class="crow"><h3>Watchlist</h3>${adder}</div>
    <div class="empty">nothing watched yet — add a symbol above, or run
      <code>optjournal watch AAPL</code></div></div>`;

  /* Quotes arrive from a SEPARATE request (/api/quotes), because each one costs an
     HTTP call and the payload is shared by every tab. Absent until asked for, so
     every read here tolerates undefined. */
  const qs=S.quotes||{};
  const rows=ws.map(w=>{
    /* Which contracts, not just "held": the strike and side are the reason to
       look at this row rather than a chart. */
    const opts=(w.options||[]).map(wo=>
      `${wo.quantity>0?'+':''}${wo.quantity} ${
        wo.strike!=null?num(wo.strike,0):''}${wo.put_call||''}`).join(', ');
    const wq=qs[w.symbol];
    /* The live price, when one has been fetched, else the stored close. Labelled
       by WHICH it is: the two differed by 0.50% on the real journal, and a column
       headed `last` showing yesterday's close is the defect this closes. */
    const shown=wq&&wq.price!=null?wq.price:w.last;
    const live=!!(wq&&wq.price!=null);
    /* 1d MUST come from the same session as the price beside it. Caught in the
       browser: showing the fetched quote (773.26) next to a change computed from
       stored bars (-0.16%) put two DIFFERENT sessions in one row, because the
       bars ended Thursday and the quote was Friday's. The quote carries its own
       `previous_close`, so when a quote is shown the change is derived from it and
       the row is internally consistent; without one, both fall back to the bars.
       5d has no quote-side equivalent and stays on the bars either way -- it is a
       week, so one session of drift does not misdescribe it. */
    const chg1=live&&wq.previous_close?
      (wq.price-wq.previous_close)/wq.previous_close*100 : w.change_1d;
    return `<tr>
      <td><b>${esc(w.symbol)}</b>${w.note?
        `<div class="dim wnote">${esc(w.note)}</div>`:''}</td>
      <td class="mono r">${shown==null?'<span class="dim">—</span>'
        :num(shown,2)+(live?'':'<span class="dim wstale" title="stored close; press Refresh for a quote">*</span>')}</td>
      <td class="mono r">${pct(chg1)}</td>
      <td class="mono r">${pct(w.change_5d)}</td>
      <td class="mono r">${w.realised_vol==null?
        `<span class="dim" title="${w.closes} daily close(s) stored; 6 is the minimum"
          >—</span>`:num(w.realised_vol,1)+'%'}</td>
      <td class="mono r">${w.expected_move_5d==null?'<span class="dim">—</span>':
        '&plusmn;'+num(w.expected_move_5d,2)}</td>
      <td class="mono">${opts?esc(opts):'<span class="dim">—</span>'}</td>
      <td class="r"><button class="wrm" data-wrm="${esc(w.symbol)}"
        title="stop watching ${esc(w.symbol)}">&times;</button></td>
    </tr>`;
  }).join('');
  const thin=ws.filter(w=>w.realised_vol==null).map(w=>w.symbol);
  return `<div class="card">
    <div class="crow"><h3>Watchlist</h3>
      <span class="pill">${ws.length} symbol(s)</span>
      ${adder}
      <button id="wquote" class="btn sm">Refresh prices</button></div>
    ${quoteNote()}
    <table class="tbl"><thead><tr>
      <th>symbol</th><th class="r">last</th><th class="r">1d</th><th class="r">5d</th>
      <th class="r">realised vol</th><th class="r">move 5d</th><th>your options</th>
      <th></th>
    </tr></thead><tbody>${rows}</tbody></table>
    <div class="dim mkattr">realised vol is what the stock DID, not what the market
      charges for what it might do — implied vol needs an option chain this journal
      cannot reach${thin.length?` · no vol yet for ${esc(thin.join(', '))}: run
      <code>optjournal bars</code>`:''}</div>
  </div>`;
}

/* How old the fetched quotes are, in words.
 *
 * A price with no age is the whole problem this feature could introduce. Run on a
 * Saturday the source returns Friday's 16:00 close for every symbol -- 22 hours
 * old, perfectly correct, and nothing a page may call "live". So the age is
 * stated, and past a session's length it says the DATE instead of a duration:
 * "22h ago" invites you to read a stale number as nearly current.
 *
 * Deliberately not "market open/closed": the chart response carries no such
 * field (checked), so that would be inferred from a clock this page does not
 * own -- a guess presented beside measurements. */
function quoteNote(){
  const meta=S.quotesAt;
  if(!meta) return `<div class="dim wnote">prices are stored daily closes —
    press <b>Refresh prices</b> for a quote</div>`;
  const ages=Object.values(S.quotes||{}).map(wq=>wq.at).filter(a=>a!=null);
  if(!ages.length) return `<div class="dim wnote">no quote came back</div>`;
  const newest=Math.max.apply(null,ages), age=meta-newest;
  const when=age<90?'just now'
    :age<3600?Math.round(age/60)+'m ago'
    :age<6*3600?Math.round(age/3600)+'h ago'
    :new Date(newest*1000).toISOString().slice(0,16).replace('T',' ')+' UTC';
  const stale=age>=6*3600;
  return `<div class="dim wnote">quotes ${esc(when)}${
    stale?' — <b>the market was closed</b>, so this is the last session\'s close'
    :''}</div>`;
}

function odte(){
  const od=S.state.odte, h=S.state.history||{};
  if(!od) return `<div class="card"><div class="empty">no data</div></div>`;
  const odtes=(h.closed||[]).filter(x=>x.is_odte===true);
  /* Classified server-side: 0DTE means the contract expired on the day it was
     opened, which is not the same question as holding_days === 0. A 45-day
     option opened and closed in one afternoon is a day trade at 45 DTE. The
     two coincide often enough that deriving this from the holding period would
     look right on most data and be wrong on exactly the trades that matter. */
  const block=(co,klass)=>`<div class="card">
    <h2 class="sub2">${esc(co.label)}</h2>
    <div class="stats">
      ${statCard('Round trips',co.episodes,`${co.contracts} contracts`,'sm')}
      ${statCard('Win rate',pct(co.win_rate),`${co.wins}W / ${co.losses}L`,'sm')}
      ${statCard('Net P&L',moneyOf(co.net_pnl),'realised, net of commission',
        'sm '+cls(co.net_pnl.base))}
      ${statCard('Avg per trip',co.avg_pnl==null?'—':moneyOf(co.avg_pnl),
        'wins and losses together','sm '+cls(co.avg_pnl?.base))}
    </div></div>`;
  const closedTotal=od.cohort.episodes+od.rest.episodes+od.unknown_dte;
  /* A cohort of one against a cohort of eight will always show a difference in
     win rate, and it means nothing. Flagged rather than hidden, because the
     numbers are real and worth showing -- what is not real is the comparison.
     Ten is a judgement call, stated as such on screen: a defensible threshold
     would need a significance test this tool has no business claiming to run. */
  const thin=Math.min(od.cohort.episodes,od.rest.episodes)<10;
  /* Two different empty states, because they are different facts. With nothing
     closed at all there is no cohort to compare and the two all-zero blocks are
     noise; with closed trips but no same-day expiries among them, the count is
     the informative part. Saying "nothing was opened on its expiry date" in the
     first case implies a search that found nothing, when nothing was searched. */
  if(!closedTotal) return `<div class="card">
    <div class="crow"><div><h2>Zero days to expiration</h2>
      <div class="sub">Contracts opened on their own expiry date.</div></div></div>
    <div class="empty">no closed round trips yet, so there is no cohort to compare</div>
    <div class="note">A 0DTE trade is one opened on the day its contract expires —
      not simply one opened and closed the same day, which is a day trade at whatever
      the contract's remaining life happens to be. This tab fills in once a round trip
      opened on an expiry date has closed.</div>
  </div>`;
  return `<div class="card">
    <div class="crow"><div><h2>Zero days to expiration</h2>
      <div class="sub">Contracts opened on their own expiry date. ${esc(ccyNote())}</div></div>
      <div class="pills"><span class="pill">0DTE <b>${od.cohort.episodes}</b></span>
        <span class="pill dim">rest of book <b>${od.rest.episodes}</b></span></div></div>
    <div class="note">A high 0DTE win rate means nothing on its own, so the rest of
      the book is shown beside it. <b>Avg per trip</b> is the figure that decides
      whether the cohort is worth trading: a better win rate with a worse average is
      a losing strategy.</div>
    ${thin?`<div class="note"><b>Too few round trips to conclude anything.</b>
      ${od.cohort.episodes} 0DTE against ${od.rest.episodes} other — a difference in
      win rate across samples this small is noise, not evidence. The threshold is a
      rule of thumb, not a significance test.</div>`:''}
    <div class="duo">
      ${block(od.cohort)}${block(od.rest)}
    </div>
    ${odtes.length?`<h2 class="sub2 mt-4">0DTE round trips</h2>
    <table><thead><tr><th>contract</th><th>opened</th><th>closed</th>
      <th class="n">qty</th><th class="n">realised</th><th class="n">commission</th>
      <th>how</th></tr></thead><tbody>
      ${odtes.map(ep=>`<tr><td class="mono">${esc(ep.symbol)}</td>
        <td class="dim mono">${esc(String(ep.opened_at||'').slice(0,16))}</td>
        <td class="dim mono">${esc(String(ep.closed_at||'').slice(0,16))}</td>
        <td class="n mono">${ep.contracts}</td>
        <td class="n mono ${cls(ep.realized_pnl.base)}">${moneyOf(ep.realized_pnl)}</td>
        <td class="n mono">${moneyOf(ep.commission)}</td>
        <td class="dim2">${esc(ep.status)}</td></tr>`).join('')}
    </tbody></table>`
    :`<div class="empty mt-4">none of the ${closedTotal} closed
      round trips was opened on its own expiry date</div>`}
    ${od.unknown_dte?`<div class="note">${od.unknown_dte} closed round trip(s) carry no
      expiry, so their DTE is unknown rather than non-zero. They are excluded from both
      columns above.</div>`:''}
  </div>`;
}

/* ------------------------------------------------ view state in the URL

   The filter, the month and the tab live in the hash so a reload lands on the
   view you left, and so a link carries it. Persisting only the trade filter
   would have been worse than persisting nothing: reload would restore the 0DTE
   scope while silently dropping the month and jumping to the Dashboard, a
   combination that was never on screen.

   `replaceState`, not `location.hash = ...`: assigning pushes a history entry
   per click, so toggling a filter a few times buries the page under back-button
   history. Nothing here is a navigation. */
const HASH_TABS=()=>TABS.map(t=>t[0]);
function applyHash(){
  /* Not `h` -- that is the history payload everywhere else in this page, and
     one name for two shapes is what blinds the payload guard to both. */
  const hs=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const tab=hs.get('tab');
  /* Validated against the enabled tabs rather than trusted: an unknown or
     disabled id would otherwise render "nothing here yet" from a URL. An
     ABSENT key must reset to the default, not leave the current tab standing:
     the back button lands on entries whose hash has no tab key, and keeping
     the old tab made syncHash rewrite it into the entry just navigated to. */
  S.tab=(tab&&HASH_TABS().includes(tab))?tab:'dashboard';
  S.type=hs.get('type')||null;
  S.month=hs.get('month')||null;
  S.ccy=(hs.get('ccy')||'').toUpperCase()||null;
  /* The drill-down selection was the one piece of view state the URL did not
     carry, so a link to "that day" was unshareable and a reload silently
     dropped the panel while leaving the calendar looking untouched. Validated
     against the payload in draw(), not here: a day from another month means
     nothing in this one, and applyHash runs before the state it would check. */
  S.calday=hs.get('calday')||null;
  S.replay=hs.get('replay')||null;
}
function syncHash(push){
  const hs=new URLSearchParams();
  /* Defaults are omitted so the common case has a clean URL, and so a stale
     key cannot outlive the state it described. The display currency's default
     is the account base, so only a restatement is worth recording. */
  if(S.tab&&S.tab!=='dashboard') hs.set('tab',S.tab);
  if(S.type) hs.set('type',S.type);
  if(S.month) hs.set('month',S.month);
  if(S.ccy&&S.ccy!==BASE()) hs.set('ccy',S.ccy);
  if(S.calday) hs.set('calday',S.calday);
  if(S.replay) hs.set('replay',S.replay);
  const next=hs.toString()?'#'+hs:'';
  if(next===(location.hash||'')) return;
  /* A tab jump is a navigation, so it pushes and the back button walks tabs.
     Everything else -- filter, month, currency -- mutates the current entry:
     those are adjustments to the view you are on, and pushing them would bury
     the tab trail under one entry per click. Clicking the current tab is a
     no-op by the guard above, so it cannot mint duplicate entries. */
  if(push) history.pushState(null,'',location.pathname+next);
  else history.replaceState(null,'',location.pathname+next);
}

/* ------------------------------------------------ shell */
function draw(push){
  /* A currency the account has no quote for falls back to base on display
     (DISP does that); clearing it makes the hash heal to match. Healed here
     rather than in load() because a hash edit is a same-document navigation
     -- load() never runs for it, only the hashchange -> draw path does. */
  if(S.ccy&&S.state&&S.ccy!==BASE()&&!QUOTES().some(qo=>qo.code===S.ccy)) S.ccy=null;
  /* A day the payload holds no fills for cannot be drilled into, so it heals
     out of the URL rather than sitting there describing nothing -- the same
     discipline the display currency follows. Checked HERE, before syncHash:
     dayDetail's own guard runs during render, by which point the stale key has
     already been written to the address bar. */
  if(S.calday&&S.state&&!(((S.state.stats||{}).days)||[])
      .some(dy=>dy.day===S.calday)) S.calday=null;
  /* Same discipline for the replay key: a lifecycle that the current trade-type
     filter excludes leaves its key describing nothing, and a key that outlives
     its panel is how the old registry rotted. Checked before syncHash so the
     address bar never carries a key the page cannot open. */
  if(S.replay&&S.state&&!((S.state.replays||{})[S.replay])) S.replay=null;
  /* A running playback drives element ids that this render is about to
     replace, so it has to die with them. */
  replayStop();
  syncHash(push);
  renderTabs();
  renderCcy();
  const views={dashboard,calendar,trades,positions,costs,annual,odte,market,
    watchlist};
  const v=views[S.tab];
  /* WHAT THE USER WAS TYPING SURVIVES THE RENDER.
   *
   * This page re-renders by replacing #body's innerHTML wholesale, which was free
   * of consequence while every tab was read-only. The watchlist's add field is the
   * first <input>, and it broke immediately: typing `AAP` and then any redraw
   * discarded the text, the focus and the node. Verified in a browser, not
   * reasoned about -- and the trigger is not exotic, `loadQuotes()` calls draw()
   * on its own when the tab opens.
   *
   * So the value and cursor are carried across, keyed by element id. Generic
   * rather than special-cased to #wadd: the next input must not have to rediscover
   * this. A framework's reconciliation is the other answer to this problem, and
   * for one field it is not worth a build step -- see the note in README. */
  const keep=preserveInputs();
  $('#body').innerHTML=(S.showCog?cog():'')+(v?v():
    `<div class="card"><div class="empty">nothing here yet</div></div>`);
  restoreInputs(keep);
  const sel=$('#month');
  if(sel) sel.onchange=()=>{S.month=sel.value||null;load();};
  document.querySelectorAll('button[data-calmonth]').forEach(b=>
    b.onclick=()=>{if(b.dataset.calmonth){
      S.calday=null; /* a selection from the old month means nothing in the new */
      S.month=b.dataset.calmonth;load();}});
  /* Day drill-down: pure redraw, no request -- the leg data is already in the
     payload. Clicking the selected day again clears it (toggle). */
  document.querySelectorAll('[data-calday]').forEach(el=>
    el.onclick=()=>{const k=el.dataset.calday;
      S.calday=S.calday===k?null:k;draw();});
  /* Market day: pure redraw, no request -- every event is already in the
     payload. Not a toggle, unlike the calendar: the market view always shows
     SOME day, so clearing the selection would leave the panel empty with no way
     back except reloading. role=button means Enter and Space have to work. */
  document.querySelectorAll('[data-marketday]').forEach(el=>{
    const pick=()=>{S.marketday=el.dataset.marketday;draw();};
    el.onclick=pick;
    el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();}};
  });
  /* Replay drill-down: same toggle, same pure redraw. Every bar is already in
     the payload, so opening a chart costs no request. */
  document.querySelectorAll('[data-replay]').forEach(el=>
    el.onclick=()=>{const k=el.dataset.replay;
      S.replay=S.replay===k?null:k;draw();});
  bindReplayControls();
  document.querySelectorAll('[data-calday-clear]').forEach(el=>
    el.onclick=()=>{S.calday=null;draw();});
  /* Server-side like the month filter, so the aggregations are recomputed
     rather than the page trying to re-sum a filtered subset of totals. */
  document.querySelectorAll('.seg button[data-type]').forEach(b=>
    b.onclick=()=>{const t=b.dataset.type||null;
      if(t===S.type)return; S.type=t; load();});
  /* The calendar's Key/all toggle is a PURE REDRAW: every event is already in the
     payload, and `mev.key` was decided server-side, so filtering costs no request.
     Clearing the day selection is the point -- the chosen day may hold nothing
     under the other filter, and a stale selection would open an empty panel. */
  document.querySelectorAll('.mktoggle button[data-mktall]').forEach(b=>
    b.onclick=()=>{const want=b.dataset.mktall==='1';
      if(want===(S.mktall===true))return; S.mktall=want; S.marketday=null; draw();});
  bindMarketFetch();
  bindWatchlist();
  /* First view of the Watchlist fetches quotes once, so the tab is useful without
     a click -- and NOT on any later redraw, because each quote is an HTTP request
     and a redraw happens on every toggle, filter and edit. `quotesAt` is the
     latch; Refresh is the way to ask again. */
  if(S.tab==='watchlist'&&!S.quotesAt&&(S.state.watchlist||[]).length) loadQuotes(false);
  const st=S.state;
  $('#foot').textContent=`optjournal ${st.version} · ${st.db} · loopback only, no authentication`;
  const b=$('#sync'), rem=st.sync.cooldown_remaining_s;
  b.classList.remove('busy');
  if(!st.sync.configured){b.disabled=true;b.title='No query id — start with --query-id';}
  else if(rem>0){b.disabled=true;
    b.title=`Cooldown: ${Math.ceil(rem/60)}m left. Prevents spending an IBKR request for data that cannot have changed.`;}
  else {b.disabled=false;b.title='Fetch from IBKR — spends one request';}
}

/* Read every text input's value, selection and focus before a render.
 *
 * Keyed by `id` because that is what survives innerHTML replacement: the NODES do
 * not, so nothing can be held by reference. An input with no id is skipped rather
 * than guessed at -- a wrong restore would put one field's text in another. */
function preserveInputs(){
  const keep={};
  document.querySelectorAll('#body input').forEach(el=>{
    if(!el.id) return;
    keep[el.id]={value:el.value,
      start:el.selectionStart,end:el.selectionEnd,
      focused:document.activeElement===el};
  });
  return keep;
}

/* Put it back on the freshly rendered nodes.
 *
 * A field the new render does not contain is simply dropped: the tab changed, and
 * carrying text into a different panel would be worse than losing it. setSelectionRange
 * is guarded because it throws on input types that do not support selection. */
function restoreInputs(keep){
  Object.keys(keep||{}).forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    const was=keep[id];
    el.value=was.value;
    if(was.focused){
      el.focus();
      try{ el.setSelectionRange(was.start,was.end); }catch(e){ /* unsupported type */ }
    }
  });
}

function note(text,kind){
  const m=$('#msg'); m.innerHTML=text; m.className='show';
  const c={bad:['#3a1f22','#f0a0a8'],warn:['#3a3122','#e8cd85'],ok:['#183328','#9fe3c4']}[kind||'ok'];
  m.style.background=c[0]; m.style.color=c[1]; m.style.border='1px solid rgba(255,255,255,.07)';
}

/* Refresh the calendar from the feed.
 *
 * No confirm(), unlike Sync: this spends no IBKR request and touches no lockout
 * budget, so a dialogue would train you to click through dialogues. It IS
 * rate-limited by the feed, which comes back as its own kind and reads as "try
 * later" rather than as a failure -- nothing is lost, the same week is served
 * tomorrow. */
function bindMarketFetch(){
  const b=$('#mkfetch'); if(!b) return;
  b.onclick=async()=>{
    b.disabled=true; b.classList.add('busy');
    try{
      const r=await fetch('/api/market/fetch',{method:'POST'});
      const mres=await r.json();
      if(mres.kind==='throttled') note('Calendar: '+esc(mres.message||'rate limited')
        +' — nothing lost, the same week is served later.','warn');
      else if(!mres.ok) note('Calendar refresh failed: '+esc(mres.message||''),'bad');
      else note(`Calendar refreshed — <b>${mres.stored}</b> of ${mres.fetched} event(s) stored.`,'ok');
    }catch(e){note('Calendar refresh failed: '+esc(e),'bad');}
    await load();
  };
}

/* Add, remove, and fetch prices. Three buttons, one shape: POST, then reload.
 *
 * A reload rather than a local splice, so the table always shows what the
 * DATABASE holds -- a row spliced in optimistically would show a symbol with no
 * bars, no vol and no options as though those were measured and empty. */
function bindWatchlist(){
  const wf=$('#waddf');
  if(wf) wf.onsubmit=async ev=>{
    ev.preventDefault();
    const input=$('#wadd'), symbol=(input.value||'').trim();
    if(!symbol) return;
    input.disabled=true;
    await watchWrite({symbol:symbol,action:'add'});
  };
  document.querySelectorAll('[data-wrm]').forEach(el=>
    el.onclick=async()=>{
      const symbol=el.dataset.wrm;
      /* Confirmed, because removing drops the note with it and there is no undo.
         Cheap to re-add, but the note is typed by hand and gone for good. */
      if(!confirm(`Stop watching ${symbol}?`)) return;
      el.disabled=true;
      await watchWrite({symbol:symbol,action:'remove'});
    });
  const qb=$('#wquote'); if(qb) qb.onclick=()=>loadQuotes(true);
}

async function watchWrite(body){
  try{
    const r=await fetch('/api/watchlist',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const wres=await r.json();
    if(!wres.ok){note(esc(wres.message||'watchlist write failed'),'bad');return;}
    if(wres.action==='remove'&&!wres.changed)
      note(`${esc(wres.symbol)} was not on the watchlist.`,'warn');
    else note(wres.action==='add'?`Watching <b>${esc(wres.symbol)}</b>.`
      :`Stopped watching <b>${esc(wres.symbol)}</b>.`,'ok');
  }catch(e){note('Watchlist write failed: '+esc(e),'bad');return;}
  await load();
  /* Quotes are keyed by symbol, so an added row simply has none until the next
     refresh -- which is honest, and cheaper than spending a request per add. */
  if(S.quotesAt) await loadQuotes(false);
}

/* One HTTP request PER SYMBOL, so this is never automatic beyond the first view.
 *
 * `announce` is false for the implicit refresh after an edit: a toast saying
 * "prices updated" when you only removed a symbol is noise. */
async function loadQuotes(announce){
  const b=$('#wquote'); if(b){b.disabled=true;b.classList.add('busy');}
  try{
    const r=await fetch('/api/quotes');
    const qres=await r.json();
    S.quotes=qres.quotes||{}; S.quotesAt=qres.asked_at||null;
    if(qres.failed&&qres.failed.length)
      note('No quote for '+esc(qres.failed.join(', ')),'warn');
    else if(announce) note('Prices updated.','ok');
  }catch(e){note('Quote fetch failed: '+esc(e),'bad');}
  draw();
}

async function load(){
  /* Not `q` -- that name is the FX quote everywhere else in this page, and one
     name for two shapes is what makes the payload guard unable to check either. */
  const qs=new URLSearchParams();
  if(S.month) qs.set('month',S.month);
  if(S.type) qs.set('type',S.type);
  const r=await fetch('/api/state'+(qs.toString()?'?'+qs:''));
  if(!r.ok){note('Could not read state: HTTP '+r.status,'bad');return;}
  S.state=await r.json();
  if(S.month===null && S.state.selected_month) S.month=S.state.selected_month;
  /* A month outside the account's lifetime heals away (the server answers with
     selected_month null rather than inventing one). Months WITH no fills are
     legitimate now -- validated against month_range, not the fills-only list,
     or picking one would revert on the very next load. */
  if(S.month && !((S.state.month_range||S.state.months||[]).includes(S.month)))
    S.month=S.state.selected_month;
  /* Server-resolved, so an unrecognised type falls back to everything here too
     instead of leaving the button set out of step with the numbers. */
  S.type=S.state.trade_type==='all'?null:S.state.trade_type;
  draw();
}

$('#cog').onclick=()=>{S.showCog=!S.showCog;draw();};
$('#sync').onclick=async()=>{
  if(!confirm('Fetch from IBKR now?\n\nThis spends one request against your Flex '
    +'request budget. IBKR locks out clients that ask too often.')) return;
  const b=$('#sync'); b.disabled=true; b.classList.add('busy');
  try{
    const r=await fetch('/api/sync',{method:'POST'});
    const res=await r.json();
    if(res.kind==='cooldown') note(esc(res.message),'warn');
    else if(!res.ok) note(esc(res.message||'Sync failed'),'bad');
    else if(res.new_trades||res.new_cash)
      note(`Synced — <b>${res.new_trades}</b> new trade(s), <b>${res.new_cash}</b> new cash row(s).`,'ok');
    else note('Synced. Nothing new'+(res.reused_archive
      ?' — payload identical to the last statement, so no duplicate was archived.':'.'),'ok');
    if(res.warnings&&res.warnings.length) note(esc(res.warnings.join(' · ')),'warn');
  }catch(e){note('Sync failed: '+esc(e),'bad');}
  await load();
};

/* An edited or externally set hash is honoured, so the URL is the source of
   truth rather than a write-only echo of it. `replaceState` does not fire
   hashchange, so `syncHash` cannot feed this back into a loop.

   Reloads only when the server-side keys moved: the tab is drawn from state
   already in hand, and refetching for it would spend a request to render the
   same payload. */
window.onhashchange=()=>{
  const was=[S.type,S.month].join('|');
  applyHash();
  if([S.type,S.month].join('|')!==was) load(); else draw();
};

applyHash();
load();
</script></body></html>
