<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora — optjournal</title>
<!-- The favicon is a file under /static/, not a `data:` URI: the CSP's
     `default-src 'self'` permits a same-origin URL and blocks a `data:` one.
     Serving it also required the static handler to stop answering
     `text/javascript` for everything -- see web.py.
     (The full policy is `default-src 'self'; script-src 'self' 'unsafe-inline'`.
     This comment quoted only the first half for a while, which understated what
     was actually being allowed -- the exemption is real, and it is for the inline
     module at the foot of this file. `data:` is blocked either way, so the
     conclusion held. Written WITHOUT the literal tag name in angle brackets on
     purpose: two separate tools here find the page's code by regex, and a comment
     that mentions the tag defeats both -- see browser._strip_code.) -->
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css"></head><body>
<!-- THE RAIL SITS OUTSIDE THE CONTENT COLUMN, which is the whole reason this
     wrapper exists. `.wrap` caps content at 1480px and that cap is a page-wide
     measurement -- every table on every tab is laid out against it. A rail
     nested inside would have taken its ~96px out of that 1480, narrowing the
     Trades and Costs tables that docs/design-notes.md already records as
     overflowing at the narrow end. So the shell is a two-column grid, the rail
     takes its own gutter, and the content column is the width it always was. -->
<div class="shell">

  <!-- A <nav> rather than the <div> the horizontal strip used, because a landmark
       is worth what it costs here: the rail is now the page's only navigation and
       a screen reader can jump to it. `aria-label` because there is no heading
       inside to name it. Filled by `renderRail`, empty in the markup for the
       kicker's reason -- placeholder nav that flashes and is replaced is a wrong
       answer on screen, however briefly. -->
  <nav class="rail" id="rail" aria-label="Sections"></nav>

  <div class="wrap">

  <div class="brand">
    <!-- Decorative: the name sits in text immediately beside it, so an alt
         text here would only make a screen reader say it twice. -->
    <div class="logo">
      <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <!-- The binnacle ring. Nothing is drawn inside r=13 except the star,
             because an inner ring at this size crossed the needles and turned
             the whole mark to mud at 38px. -->
        <circle class="ring" cx="20" cy="20" r="16"/>
        <!-- Four ordinal ticks at the diagonals, short enough to sit between
             the ring and the star without touching either. -->
        <g class="ticks">
          <path d="M20 5.4 V8.2" transform="rotate(45 20 20)"/>
          <path d="M20 5.4 V8.2" transform="rotate(135 20 20)"/>
          <path d="M20 5.4 V8.2" transform="rotate(225 20 20)"/>
          <path d="M20 5.4 V8.2" transform="rotate(315 20 20)"/>
        </g>
        <!-- The star, as one kite rotated four times rather than four sets of
             hand-computed coordinates: the shape is defined once, so the arms
             cannot drift out of symmetry when it is tuned. Each arm is split
             along its spine into a lit and a shadowed half, which is what
             makes a flat mark read as a faceted compass card.

             Arms are listed N, S, E, W so the vertical pair paints UNDER the
             horizontal pair -- north stays the most legible thing in the mark
             at favicon size, where everything else collapses. -->
        <g class="star">
          <g transform="rotate(180 20 20)"><path class="fl" d="M20 6 L20 20 L16.4 17.6 Z"/><path class="fd" d="M20 6 L20 20 L23.6 17.6 Z"/></g>
          <g transform="rotate(90 20 20)"><path class="fl" d="M20 6 L20 20 L16.4 17.6 Z"/><path class="fd" d="M20 6 L20 20 L23.6 17.6 Z"/></g>
          <g transform="rotate(270 20 20)"><path class="fl" d="M20 6 L20 20 L16.4 17.6 Z"/><path class="fd" d="M20 6 L20 20 L23.6 17.6 Z"/></g>
          <path class="fl" d="M20 6 L20 20 L16.4 17.6 Z"/><path class="fd" d="M20 6 L20 20 L23.6 17.6 Z"/>
        </g>
        <circle class="pivot" cx="20" cy="20" r="1.5"/>
      </svg>
    </div>
    <div class="brandhead">
      <!-- The dateline of a ship's log, which is what a bitácora is.
           Two rejected strings sat here before it, and both failed the same
           way. "Cuaderno de Bitácora" translated the title directly beneath
           it. "Strikes · Fills · Round trips" then named the journal's
           contents -- but that is identical for every reader on every load,
           and the tab strip two lines down already says Trades, Positions and
           Costs. A fixed string in the page's most prominent small slot is
           read once and then permanently ignored.

           So this slot now carries the one thing only THIS journal can say:
           which day of the log it is, since when, and what the book is
           carrying. Filled by `renderKicker` from the payload -- empty here
           rather than holding placeholder text, because a hardcoded day number
           flashing before the real one is a wrong figure on screen. -->
      <div class="kicker" id="kicker"></div>
      <!-- The edition chip is the THEME control, so it is a <button> rather than
           the <span> it used to be: it was a decorative label reading "Leather
           Edition" whatever the page looked like, and now it names the active
           palette and switches it. A real button because a clickable span is
           unreachable by keyboard and unannounced to a screen reader -- the
           focus ring, the Enter key and the role all come free from the element.
           Its text is written by `applyTheme`; the markup carries the default so
           the chip is never momentarily blank. -->
      <div class="title">Bitácora <button class="edition" id="edition"
        title="Switch theme">Leather Edition</button></div>
    </div>
    <!-- The period and its result: a month stepper and the Net P&L it selects.
         Empty on every tab it does not drive, and that is the invariant in
         docs/design-notes.md rather than a layout choice -- a tab's numbers move
         only with a control that tab displays, so a stepper on Positions would be
         a control that changes nothing on screen. Filled by `renderPeriod`. -->
    <div class="period" id="period"></div>
    <div class="hdr-actions">
      <!-- The view-options button, which opens #vpop. Rendered rather than static
           because its label IS the current state ("Options · €EUR"), so a reader
           sees the choices in force without opening anything. -->
      <div id="vbtn"></div>
      <div class="hdr-icons">
        <button class="icobtn" id="sync" title="Sync from IBKR">⟳</button>
        <button class="icobtn" id="cog" title="Journal details">⚙</button>
      </div>
    </div>
  </div>

  <!-- The view options: display currency everywhere, trade type and account on
       the three tabs they drive. A `popover` rather than a <dialog> or a
       hand-rolled panel, because the platform then owns everything a panel like
       this gets wrong: Escape closes it, a click outside closes it, the invoker
       announces expanded/collapsed, and it paints in the top layer above every
       card -- with no JavaScript for any of it and no `.style` write to position
       it. It is outside #body so a redraw refills it without closing it:
       choosing Equities reloads the payload and the panel stays open on the new
       state rather than vanishing under the reader's pointer. -->
  <div class="vpop" id="vpop" popover role="dialog" aria-label="View options"></div>

  <div id="msg"></div>
  <div id="body"></div>
  <div class="note" id="foot"></div>
  </div>
</div>

<!-- A module, not a classic script: the chart's arithmetic lives in
     /static/replay.js so `node --test` can import and unit-test it, which
     rendering the page in a browser cannot do. Module scripts are deferred and
     execute in order, so the import resolves before anything below runs. There
     are no inline on* attributes anywhere in this page, so nothing depended on
     these functions being global. -->
<script type="module">
/* Only what the page actually calls. `clampIndex`, `domainOf` and `markAt` were
   imported here and never used: each is called INSIDE replay.js (by frameAt and
   plotGeometry) and unit-tested there directly, so they stay exported -- it was
   only this import list that had gone stale. A stale name here reads as "the
   page uses this", which is how the reader's map of what the page does drifts
   from what it does. test_frontend pins the list against the calls. */
import {
  MIN_POINTS, bandEdges, barsPerMs, deltaDomain, deltaSegments, frameAt,
  indexOfTs, niceTicks, nextStop, reachedEvents, plotGeometry, sessionBreaks,
  strikeSpan,
} from '/static/replay.js';
/* The watchlist's derivations and its gauge geometry, in their own module for the
   same reason: each takes data and returns data. `shownPrice` is imported ONCE and
   called by two surfaces (the table row and the detail pane), which is what makes
   it structurally impossible for them to print a price from one session beside a
   change from another -- see its docstring for the browser-caught defect.
   The three geometry functions are there because a gauge is the one drawing that
   can be arithmetically wrong while every check here still passes: an inverted
   knob or an arc scaled by the radius renders a well-formed picture with no
   `undefined` in it. Only an executed test sees those, so the numbers live where
   node can run them and this file keeps the markup they position. */
import {bxDirection, earningsSoon, meterKnob, ringArc, ringPoint,
  shownPrice} from '/static/watch.js';
import {cls, dayLabel, dp, esc, level, money, monthLabel, num, pct, strike, sym}
  from '/static/format.js';
import {chooseMarketDay, eventPasses, facetsAtDefault, seedFacets}
  from '/static/market.js';
import {SIGMA_LABEL, VIX_DIVISOR, expectedMove, ladderRows, parseNumber,
  railScores, sanitizeLevel, scratchLines, scratchRead,
  sessionEvents} from '/static/zdte.js';

/* ===================== the payload contract =====================
   Everything this page reads, declared beside the code that reads it. The
   suite DERIVES its guards from these blocks (tests/test_web.py) instead of
   keeping a registry of its own:

     * every typedef below is checked BOTH WAYS against a real /api/state
       payload -- a required key the API stops sending fails, and a key the
       API sends but these blocks omit fails, so the contract can neither
       rot optimistic nor fall behind the server;
     * every `binding.key` read in this script must be a declared key of
       the shape that binding is bound to in the tables at the end;
     * every binding name read with a dot must appear in those tables, and
       every name in the tables must still exist in the code -- a stale
       entry fails, so the table cannot outlive the code it describes.

   Types and |null are documentation for the reader (the nullability is
   real: format a null without guarding and the cell renders junk); key
   PRESENCE and [optional] brackets are what the suite enforces. A name
   whose only reads are camelCase methods (x.forEach) is invisible to the
   read-scanner -- the same blindness the guards have always had -- and
   needs no declaration.

   Change recipe: a new payload key is one line here plus its serializer;
   a new binding is one token in the tables below, in the same diff as the
   code that introduces it. */

/** @typedef {Object} State -- the /api/state payload (web.build_state)
 * @property {string} version
 * @property {string} generated_at
 * @property {boolean} dev -- developer-only surfaces on (settings.dev). Off
 *   unless OPTJOURNAL_DEV or the stored flag says so; the web API cannot set it
 * @property {string} asset_category -- the journal's home category, OPT
 * @property {Object} asset_counts -- fills per category; derives offerable Trade Types
 * @property {string} db
 * @property {string} archive
 * @property {Array} months -- months with fills in the current scope
 * @property {Array} month_range -- every month of the account's life, newest first
 * @property {string|null} selected_month -- null means the all-time view
 * @property {string} trade_type
 * @property {string} trade_type_label
 * @property {Stats} stats -- the selected period
 * @property {Stats} all_time
 * @property {Array} positions -- Position rows, newest snapshot
 * @property {Allocation} allocation -- the account by holding (serialize.allocation_data)
 * @property {Array} orders -- Order rows in scope
 * @property {Array} strategies -- StrategyGroup rows: same orders, grouped
 * @property {Array} lifecycles -- Lifecycle rows: strategies linked by episode
 * @property {History} history
 * @property {Array} statements -- Statement rows, the archive inventory
 * @property {Market} market -- the economic calendar (serialize.market_data)
 * @property {Array} watchlist -- Watch rows (serialize.watchlist_data)
 * @property {Scheduler} scheduler -- what the jobs did, and whether the loop is
 *   alive (serialize.jobs_data). Two separate questions: see the typedef
 * @property {Audit} audit -- did the last session's perishable bars land
 *   (serialize.audit_data). Computed on EVERY load, because when this was a cron
 *   the watchdog and the thing it watched stopped together
 * @property {Logbook} logbook -- the header dateline (serialize.logbook_data).
 *   Whole-journal, so it moves with neither the month nor the trade-type filter
 * @property {Journal} journal -- what the reader wrote, plus the vocabulary the
 *   form writes it in (serialize.journal_data)
 * @property {Array} annual -- Stats per year, ignores both filters
 * @property {Array} monthly -- Stats per month, ignores both filters
 * @property {Stats} annual_total -- whole-book total row, deliberately not all_time
 * @property {Object} replays -- Replay by key; rows resolve into it (replay.attach)
 * @property {OdteBlock} odte
 * @property {FxBlock} fx
 * @property {Array} costs -- Costs per statement section, may be empty
 * @property {string} [costs_source] -- only when an archive statement was readable
 * @property {string} [costs_error] -- only when reading it failed
 * @property {BrokerCosts} broker_costs -- what the broker cost, from the DATABASE:
 *   the journal's whole history, narrowed to the reader's selection. Distinct from
 *   `costs`, which is one statement's own 30-day window (serialize.broker_costs_data)
 * @property {Sync} sync
 * @property {Settings} settings -- what the settings page edits
 * @property {Provisional} provisional -- how much of this journal is same-session
 *   rather than settled (web._provisional). Whole-journal, deliberately: a caption
 *   that came and went with the month filter would read as a glitch
 */

/** @typedef {Object} Provisional -- same-session fills, and what they cost in
 *  certainty (web._provisional)
 * @property {number} fills -- rows whose FX rate was ESTIMATED, so every
 *   base-currency total that sums them is approximate
 * @property {number} unsettled -- rows from a Trade Confirmation at all. A fill
 *   quoted in the base currency needs no conversion and is still missing its
 *   realised P&L until the Activity Statement lands, so this is the larger set
 * @property {string|null} newest -- the newest such trade date, for the caption
 */

/** @typedef {Object} Settings -- editable preferences (web.build_state)
 * @property {string|null} query_id -- the id a sync would actually use
 * @property {string|null} confirm_query_id -- the Trade Confirmation query, or
 *   null when no intraday feed is configured. Absent is the normal state: only the
 *   Activity Statement is required for this journal to work
 * @property {string} query_id_source -- 'stored', 'override' or 'unset'.
 *   'override' means a --query-id flag or $OPTJOURNAL_QUERY_ID outranks the
 *   stored value, so the form must not offer to edit what would not take effect
 * @property {string} scoring -- the scoreboard unit in force, same value as
 *   stats.scoring; here so the settings form reads its own block
 * @property {string[]|null} tiles -- the dashboard tiles shown, in order; null is
 *   the default arrangement (settings.tiles, validated by web._settings_write)
 * @property {Object|null} token -- ALWAYS null on load. The keyring has been
 *   measured at 8.2s with a locked keychain, so presence is never read on a page
 *   load: it arrives from /api/settings/token, either from the check button or as
 *   a save's reply, and is held here afterwards
 */

/** @typedef {Object} TokenStatus -- /api/settings/token: the GET's reply
 *  (web._token_status) and the POST's (web._token_write). ONE SHAPE FOR BOTH, so
 *  saving a token updates the same line that checking for one does, and there is
 *  no second reply for the page to keep in step.
 * @property {boolean} ok
 * @property {string} kind
 * @property {boolean|null} present -- true, false, or NULL when the keyring
 *   itself could not be read. Three states, because "unreadable" must not be
 *   reported as "missing": that would send a reader with a perfectly good token
 *   off to re-enter it
 * @property {string} account -- the OS user the entry is filed under
 * @property {string} message
 */

/** @typedef {Object} BrokerCosts -- the Costs tab's whole payload
 * @property {string} base_currency
 * @property {string|null} from_date -- first and last fill IN SCOPE, not a
 *   statement's window: with nothing in scope both are null
 * @property {string|null} to_date
 * @property {CostSelection} scope -- echoed back, so a caption names the scope the
 *   figures were measured over rather than whatever the page's state says now
 * @property {Array<CategoryCost>} by_category
 * @property {Array<FxPairCost>} fx
 * @property {Array<FeeGroup>} fees
 * @property {Array<Withholding>} withholding
 * @property {CostTotals} totals
 */

/** @typedef {Object} CostSelection
 * @property {Array<string>} categories -- asset categories in scope, sorted
 * @property {boolean} is_everything -- no narrowing asked for
 * @property {string} subset -- "0DTE" when a fill-level subset is in force, else ""
 * @property {boolean} is_subset
 */

/** @typedef {Object} CategoryCost -- execution cost for one asset category
 * @property {string} category
 * @property {number} fills
 * @property {number} orders
 * @property {number} quantity -- contracts or shares; 0 for conversions
 * @property {Charge} commission
 * @property {Charge} taxes
 * @property {Charge} total
 * @property {Charge|null} per_unit -- null where a per-unit cost is not a rate
 *   anyone charges: a conversion's quantity is an amount of money
 * @property {number} credit_fills
 */

/** @typedef {Object} FxPairCost -- one pair, split manual against automatic
 * @property {string} symbol
 * @property {number} conversions
 * @property {number} notional_base
 * @property {Charge} commission -- STATED commission, both legs
 * @property {number|null} commission_bps -- comparable with totals.autofx.bps
 * @property {FxLeg} auto -- IBKR's auto-conversion service: no commission, a
 *   markup embedded in the rate instead
 * @property {FxLegManual} manual
 */

/** @typedef {Object} FxLeg
 * @property {number} conversions
 * @property {number} notional_base
 * @property {number} markup_base -- ESTIMATED at the published bps. A bare
 *   number, not a Charge: no currency was ever billed for it
 * @property {number} markup_high_base -- the same estimate at the measured bps
 */

/** @typedef {Object} FxLegManual
 * @property {number} conversions
 * @property {number} notional_base
 * @property {Charge} commission
 */

/** @typedef {Object} FeeGroup -- account-level fees. NO asset attribution, ever
 * @property {string} name
 * @property {number} count
 * @property {Charge} total
 * @property {Array<string>} examples
 */

/** @typedef {Object} Withholding
 * @property {string} symbol
 * @property {string} currency
 * @property {Charge} gross
 * @property {Charge} withheld
 * @property {number|null} effective_rate -- null with no matching dividend
 */

/** @typedef {Object} CostTotals -- the three-way split the tab is built on
 * @property {Charge} attributable -- narrows with the scope
 * @property {Charge} unattributable -- cannot be attributed at all, so never narrows
 * @property {number} fills
 * @property {number} credit_fills
 * @property {AutoFx} autofx
 * @property {FrictionTotals} friction
 */

/** @typedef {Object} AutoFx
 * @property {number} conversions
 * @property {number} notional_base
 * @property {number} bps -- IBKR's published markup
 * @property {number} measured_bps -- what a year of real conversions implied
 */

/** @typedef {Object} FrictionTotals -- measured and estimated, kept apart
 * @property {Charge} stated -- what IBKR billed
 * @property {number} estimated_low_base -- at the published bps
 * @property {number} estimated_mid_base -- what the headline prints
 * @property {number} estimated_high_base -- at the measured bps
 * @property {number} total_low_base
 * @property {number} total_mid_base
 * @property {number} total_high_base
 * @property {boolean} is_estimated -- whether any part was never billed
 */

/** @typedef {Object} Charge -- a cost, and the currencies it was BILLED in
 *   (money.Charge). Money's three keys, plus the ledger behind them: `charged`
 *   survives a mixed-currency scope where `native` must be withheld, which is
 *   what lets the tab lead with one figure and dissect it without a request.
 * @property {number} base
 * @property {number|null} native -- as charged, when one currency accounts for all
 * @property {string|null} ccy
 * @property {Object<string,number>} charged -- amount per billing currency
 */

/** @typedef {Object} Stats -- one period's numbers (stats.month_stats via stats_data)
 * @property {string} month -- "ALL" or "YYYY-MM" or "YYYY"
 * @property {string} base_currency
 * @property {string} asset_category
 * @property {number} total_trades -- FILLS: how many executions, not outcomes
 * @property {number} orders
 * @property {Money} net_pnl -- options: closed round trips only, net of commission
 * @property {Money} commissions -- options: commission of round trips CLOSED here
 * @property {Money} fees -- account-level, not attributable to the journal
 * @property {number} closed_episodes -- contract round trips closed here: the
 *   MONEY's unit, since net_pnl and commissions are attributed by it
 * @property {number} open_episodes -- open CONTRACTS; a strangle is two
 * @property {number} open_positions -- open positions, grouping a multi-leg
 *   strategy into one. Attached by web.build_state, not month_stats: it needs
 *   the campaign grouping, which is built after the stats are
 * @property {string} scoring -- 'position' or 'contract': which unit the five
 *   figures below count. Read for LABELS, never to recompute -- the server has
 *   already counted in this unit, and a page that re-derived the other reading
 *   would be a second implementation of campaigns.py
 * @property {number} decided_campaigns -- the headline trade count for options,
 *   and the scoreboard's unit: under 'position', positions whose every contract
 *   is closed (a roll continues one, so this sits below closed_episodes while
 *   one is in flight); under 'contract', each closed round trip. Always equals
 *   wins + losses
 * @property {number} wins -- decided outcomes that netted up, in `scoring`'s unit
 * @property {number} losses
 * @property {number|null} win_rate -- null until anything was decided
 * @property {Money|null} avg_win -- null without wins; an average of no
 *   outcomes is undefined, and zero would read as break-even
 * @property {Money|null} avg_loss -- null without losses
 * @property {Money|null} avg_pnl -- mean decided outcome; null with nothing decided
 * @property {number|null} profit_factor -- gross won over gross lost; null without losses
 * @property {Money|null} largest_win -- the best single decided outcome
 * @property {Money|null} largest_loss -- the worst single decided outcome
 * @property {StrategyRank|null} best_strategy -- set by web.build_state from the
 *   lifecycles (stats.strategy_ranking); null with nothing decided
 * @property {StrategyRank|null} worst_strategy -- null unless two or more
 *   strategies decided, since one would repeat best_strategy
 * @property {Money} inflight_realized -- the part of net_pnl that closed inside a
 *   position still running (a roll's near contract). In the money, out of the
 *   scoreboard; provenance, not a forecast, since it can fall
 * @property {Money} open_premium -- excluded from P&L until positions close
 * @property {Money} open_commission -- excluded the same way
 * @property {number|null} net_liq_base -- null until equity summaries exist
 * @property {string|null} net_liq_date
 * @property {number|null} gain_pct_of_net_liq
 * @property {Money} options_friction -- magnitude of commissions, currency carried
 * @property {number} account_friction_base
 * @property {number} total_friction_base
 * @property {number} green_days
 * @property {number} red_days
 * @property {Array} days -- Day rows for the calendar
 */

/** @typedef {Object} Day -- one calendar cell (stats.DayPnl)
 * @property {string} day
 * @property {number} trades
 * @property {Money} realized
 */

/** @typedef {Object} Allocation -- what the account holds, by name, against net
 *  liquidation (serialize.allocation_data). Rows plus cash sum to `nav`
 * @property {string|null} as_of -- the newest snapshot read
 * @property {number|null} nav -- the broker's net liquidation, base currency
 * @property {string|null} nav_date
 * @property {number|null} cash
 * @property {number|null} cash_share -- null without a net liquidation figure
 * @property {Array} rows -- AllocationRow, largest absolute net first
 */

/** @typedef {Object} AllocationRow -- one holding: the stock, or the underlying an
 *  option is written on
 * @property {string} holding
 * @property {number} stock -- base currency
 * @property {number} options -- base; a short option is negative, a liability
 * @property {number} net -- stock plus options
 * @property {number|null} share -- net over net liquidation; negative for a short
 * @property {number} lines -- snapshot rows folded in
 */

/** @typedef {Object} Position -- one open-position snapshot row (serialize.positions_data)
 * @property {string} report_date
 * @property {string} conid
 * @property {string} account_id
 * @property {string} broker -- which broker the row came from ('ibkr' today)
 * @property {string} symbol
 * @property {string} asset_category
 * @property {string|null} underlying_symbol -- null on stock rows
 * @property {string|null} put_call
 * @property {number|null} strike
 * @property {string|null} expiry
 * @property {number} multiplier
 * @property {number} position
 * @property {number} mark_price
 * @property {number} position_value
 * @property {number} position_value_base -- raw column; read `value` instead
 * @property {number} cost_basis_money -- raw column; read `cost_basis` instead
 * @property {number} cost_basis_price
 * @property {number} fifo_pnl_unrealized -- raw column; read `unrealized` instead
 * @property {Money} value -- market value, native and base
 * @property {Money} cost_basis -- falls back to the open episode's basis
 * @property {Money} unrealized -- no base column exists; derived at the row rate
 * @property {string} side
 * @property {string|null} open_date_time
 * @property {string} currency
 * @property {number} fx_rate_to_base
 * @property {string} raw
 * @property {string} source_file
 * @property {string} ingested_at
 */

/** @typedef {Object} Order -- one broker order with its fills folded (serialize.orders_data)
 * @property {string} broker -- which broker filled it; an order id is only unique within one
 * @property {string} ib_order_id
 * @property {string} account_id
 * @property {string} asset_category
 * @property {number} leg_count
 * @property {number} fills
 * @property {string} first_fill_at
 * @property {string} last_fill_at

 *  the guard to both. Declared here, in the file being edited, in the same
 *  diff as the code that introduces the name.
 * @payload st:State s:Stats best:Stats alt:Stats x:Episode ep:Episode dy:Day
 * @payload se:Settings tok:TokenStatus pv:Provisional
 * @payload rk:StrategyRank
 * @payload pos:Position o:Order l:Leg h:History al:Allocation ar:AllocationRow
 * @payload stm:Statement fx:FxBlock q:FxQuote qo:FxQuote
 * @payload mo:Money
 * @payload bc:BrokerCosts CT:CostTotals F:FrictionTotals A:AutoFx ch:Charge
 * @payload csc:CostSelection cc:CategoryCost fxr:FxPairCost fee:FeeGroup
 * @payload whr:Withholding
 * @payload od:OdteBlock co:Cohort g:StrategyGroup lc:Lifecycle olc:Lifecycle

 * @payload zr:StrikeRow zl:ScratchLine zs:Scratch zm:Move
 * @payload res:SyncResponse sync:Sync pt:ChartPoint bkt:Bucket rp:Replay sk:Strike
 * @payload e:Annotation
 * @payload mk:Market d:MarketDay mev:MarketEvent mf:MarketFacet
 * @payload w:Watch wo:WatchOption wopen:Watch wa:Watch wb:Watch
 * @payload mres:MarketFetch wres:WatchWrite qres:QuoteReply wq:Quote
 * @payload ivr:IvRank ir:IvRank
 * @payload sc:Scheduler j:JobRow run:JobRun au:Audit jres:JobReply
 * @payload lb:Logbook
 * @payload je:JournalEntry jf:JField trg:Trigger jnres:JournalWrite lkres:LinkWrite
 * @payload rv:JournalReview ty:Tally tt:TriggerTally
 * @local Math S TABS RAIL THEMES b m r el location window qs hs ids
 * @local leaves PERIOD_TABS pop quotes steps TILES
 * @local draft dr order known tilesave tilereset Array
 * @local JFIELDS entered closed options STATE_KEYS_REQUIRED
 * @local cells days buckets evs glegs lcs legs mons month
 * @local open opts out ps pts rows yrs active shown
 * @local RGEO geo edges fr xy sks dd sp dsegs seg

 * @local shownByDay next picked

 * @local COST_OPTIONS bits cost fees on wh

const $=s=>document.querySelector(s);
const S={tab:'dashboard',month:null,state:null,showCog:false,ccy:null,type:null,
  /* Selected calendar day for the drill-down, and the open replay's key. Both
     ARE in the URL hash: which drill-down is open is navigational -- a link to
     "that day" or "that trade's chart" should survive a reload, and before the
     day was recorded a refresh silently dropped the panel while leaving the
     calendar looking untouched. Both are healed in draw() against the payload,
     because a selection from another month or another scope means nothing here.
     A future scrubber POSITION would not belong in the hash: that is an
     inspection inside an open panel, not which panel is open. */
  calday:null,replay:null,
  /* The Costs tab's scope: an ARRAY, because it is a multi-select and the four
     options are not mutually exclusive. Null means "not chosen", which the
     server answers with its own default (the journal's own category) -- so the
     page does not carry a duplicate of that decision and cannot disagree with
     it. Kept out of `type`, which is the single-select filter the other tabs
     share: one control that means "pick one" and another that means "pick any"
     cannot share a state key without one of them lying about the other. */
  cost:null,
  /* The active theme id, IN the hash for the same reason the display currency
     is: it is a presentation choice a reload should not silently discard, and a
     link then carries the palette you were looking at. Deliberately not
     localStorage -- this page persists no other preference that way, and one
     setting stored somewhere the URL cannot express is a setting that
     disagrees with a shared link. */
  theme:null,
  /* Which market day is expanded. NOT in the hash, unlike calday:
     the market strip always has a sensible default (today, or the
     first day with events), so there is no state a reload could
     silently lose -- and a link to "the calendar" means the week,
     not one cell of it. */
  marketday:null,
  /* Which decision's journal editor is open, by anchor. NOT in the hash, and
     that is the `marketday` reasoning taken one step further: an open form is
     not a view of the data, it is an unfinished act. A reload restoring it would
     restore an EMPTY form -- the typing is not in the URL and could not be --
     which looks like the writing was lost. A link to "that trade" is `replay`,
     which is in the hash and shows what happened. */
  jrnl:null,
  /* Which card's roll-link picker is open, by anchor. Not in the hash for the
     `jrnl` reason: it is an unfinished act, not a view. */
  lnk:null,
  /* Calendar filter, TWO INDEPENDENT AXES: a Set of countries and a Set of
     impacts, each holding the values currently shown.

     NULL means "whatever the server calls default" -- not an empty Set, which
     means "nothing selected, show nothing". The distinction matters because the
     page cannot name the defaults itself (they live in `events.py` and arrive as
     `MarketFacet.default`), so it stays null until the payload can seed it. An
     empty Set is a legitimate state a reader can reach by deselecting, and it
     must not silently spring back to the default.

     Not in the hash, for the same reason as marketday: a link to "the calendar"
     means the week, not one reading of it. */
  mkcountries:null,mkimpacts:null,
  /* Which watched symbol the detail pane is showing. IN the hash, unlike
     marketday and for the opposite reason: the market strip always has a
     sensible default day, while "DELL on the watchlist" is a view worth linking
     to and a reload that dropped it would leave the pane showing a different
     symbol from the one being read. Healed in draw() against State.watchlist
     BEFORE syncHash, the `replay` discipline, so the address bar never carries a
     symbol the page cannot open -- a removed row is exactly how that happens.
     NULL means "no explicit choice", not "nothing selected": the pane then shows
     the first row of the sorted list, derived rather than stored, so the URL
     stays clean until the reader picks a row. */
  wsym:null,
  /* The table's sort, as "column:dir" -- one string, because the two halves are
     never useful apart and two keys would let a column arrive without a
     direction. NOT in the hash: a sort narrows nothing and changes no figure, it
     reorders a list already delivered, which is the same reasoning that keeps the
     calendar's filter axes out (`mkcountries`). Symbol-ascending by default
     because that is `serialize.watchlist_data`'s own ORDER BY and the CLI's, so
     the page and the terminal agree about which row is first -- defaulting to a
     derived column, as the mockup's IVR-descending does, would make which row
     opens depend on a figure that is absent for five of six real symbols. */
  wsort:'symbol:asc',
  /* The watchlist's four filters. NONE of them is in the hash, and that is the
     `mkcountries`/`mkimpacts` precedent rather than an oversight: each narrows a
     list the payload has already delivered in full and changes no figure in it,
     where `wsym` names a view worth linking to. A link to "the watchlist" means
     the watchlist.

     `wsearch` is the search box's text, and it is spelled out rather than shortened
     to `wq` for a measured reason: the contract table above already binds `wq` to a
     `Quote` in this file, and one two-letter name on two concepts is the defect
     shape this project hunts, in an identifier instead of in a label.

     `wbx` and `wivr` are single-select (null means All), because a bucket and a
     band each partition their range -- picking two of three buckets is a question
     nobody asks, and `.seg` is the page's shape for "pick one". `wearn` is a
     boolean toggle, since "exclude the ones reporting soon" has no second value.

     A row whose bucket or band is NULL is hidden by a chosen bucket or band, which
     is the honest reading: an unmeasured symbol is not quietly inside the set the
     reader believes was measured. The empty-state prose names whichever control is
     doing it. */
  wsearch:'',wbx:null,wivr:null,wearn:false,
  /* Live quotes, keyed by symbol, and the server clock when they were asked for.
     NOT part of `state`: they come from their own endpoint because each one costs
     an HTTP request, so they must not ride along on every payload reload. Null
     until the Watchlist tab asks. */
  quotes:null,quotesAt:null,
  /* The scoreboard's unit: null means "the server's default" (position), the
     same convention `cost` uses, so the page carries no duplicate of a decision
     that lives in stats.py and cannot drift from it.

     IN the hash, and a SERVER round trip when it changes -- unlike the display
     currency, which restates client-side. Wins and losses are counted from the
     campaign linkage, so the other reading is not derivable from a payload
     already summarised in one unit: asking the server is the only way to get it
     without reimplementing campaigns.py here, which is exactly the duplication
     that module exists to prevent. */
  scoring:null,
  /* IV ranks, from the SAME reply as the quotes, and the whole reply rather than
     just its ranks: `{ranks, unranked, ranks_failed}`. The two lists are kept
     because they are what lets a dash say WHICH absence it is -- not fetched, not
     carried, or failed -- and those have three different remedies. Null, not `{}`,
     until a fetch has happened: null means "never asked" and an empty `ranks` means
     "asked, and nothing came back", which the empty-state prose distinguishes. */
  ivr:null,
  /* THE 0DTE CALCULATOR'S FOUR TYPED FIELDS, and they are STRINGS, not numbers.
     A field being edited holds "77", "7706." and "" on the way to 7706.03, none
     of which is a number, and coercing on every keystroke would blank the ladder
     mid-entry and move the caret. `zdte.js` parses; the page carries what was
     typed.

     Null, not '': null means "nothing has been typed, so the feed's reading
     stands" and '' means "the reader cleared the field", which draws the empty
     ladder rather than silently restoring the feed. The distinction is what makes
     the reset control honest about whether there is anything to reset.

     `zsort` and `zall` are the ladder's two view switches -- which way the strike
     column runs, and whether the rails inside the expected move and beyond the
     fifth row are collapsed. */
  zspx:null,zvix:null,zcall:null,zput:null,zsort:'asc',zall:false,
  /* The Broker Companion window, once opened. Held so a second click focuses the
     window that is already floating over the broker rather than opening another,
     and so a typed change can be posted into it. */
  zpop:null};

/* ---- display currency -------------------------------------------------
   Base is canonical: every *_base figure is IBKR's own conversion, performed
   at that row's own trade or snapshot date. Choosing another display currency
   RESTATES those totals at a single snapshot rate, so it is a presentation
   choice rather than a reconciliation -- on this account the order-implied USD
   rate and the snapshot rate differ by 1.4%. The header names the rate in use.

   Contract prices are never restated. A TSLA 270 strike is 270 dollars
   whatever currency you total in, so strike, mark and fill prices always
   render in the instrument's own currency. */
const BASE=()=>{const fx=(S.state&&S.state.fx)||{};
  return fx.base||(S.state&&S.state.stats&&S.state.stats.base_currency)||'';};
const QUOTES=()=>((S.state&&S.state.fx&&S.state.fx.quotes)||[]);
const DISP=()=>{const c=S.ccy;
  return c&&QUOTES().some(q=>q.code===c)?c:BASE();};
const QUOTE=()=>QUOTES().find(q=>q.code===DISP())||null;

/* Restate a base-currency amount into the display currency. */
const conv=v=>{if(v==null)return null;const q=QUOTE();
  return q?Number(v)*q.per_base:Number(v);};
/* The inverse of `conv`: a display-currency amount back into base. Needed
   because the chart CHOOSES its axis ticks in the currency the reader sees -- a
   round number has to be round in display space, or a tidy €500 tick renders
   "$568.63" under a USD toggle -- and then has to position them on a scale built
   from base-currency values. Same rate, same direction of travel, so it round
   trips exactly rather than through a second quote. */
const unconv=v=>{if(v==null)return null;const q=QUOTE();
  return q&&q.per_base?Number(v)/q.per_base:Number(v);};
/* An amount already in base currency: restate and symbol in one step. */
const cash=(v,d)=>money(conv(v),DISP(),d);

/* ---- commission: a charge, not an analytic total ----------------------
   Commission is billed in one currency and debited in that currency -- IBKR
   takes dollars for a US option, never euros. `commissions_base` is therefore
   an accounting translation, and restating it into a display currency sends a
   USD charge on a round trip through two different rates (its own trade-date
   rate to EUR at ingest, then one snapshot rate back out), which does not
   return: $6.9652 billed read $7.0021 on screen.

   So when the reader is already looking at the currency the commission was
   charged in, show the charge. `commissions_native` is null whenever the scope
   spans currencies -- this account's stock trades span USD, SEK, EUR and KRW,
   and those cannot share a number -- and then the restatement is the honest
   best available, exactly as before.

   One helper, used by the Dashboard card and both tables, because the same
   figure reading differently on two tabs is the defect this replaced. */
/* One rule for every as-charged figure: show the charge when the reader is
   already in the currency it was charged in, else the restatement. Written
   once because figures that share a sentence must share a basis -- "as charged
   · $2.83 on open positions" is a contradiction if only one of them is.

   `chargeOf` is the rule; `moneyOf` applies it to a Money-shaped payload key.
   Four near-identical wrappers (commissionOf, openCommissionOf, openPremiumOf,
   frictionOf) existed only to bind three flat field names each, and vanished
   when the payload started sending one nested object per figure. */
const isNativeCharge=(nat,ccy)=>nat!=null&&ccy===DISP();
const chargeOf=(nat,ccy,base)=>isNativeCharge(nat,ccy)
  ? money(Math.abs(nat),ccy) : cash(Math.abs(base));
/** @param {Money|null} mo */
/* SIGNED. A Money is P&L, proceeds or a value far more often than a charge, and
   routing every one through `chargeOf` dropped the minus from every loss: a red
   "€4,946.13" for a month down 4,946.13, since `.signed` draws only the `+` and
   leaves the minus to `money()`. Measured on the live journal the first month it
   closed down. Commission keeps the unsigned form it was written for, below. */
const moneyOf=mo=>mo==null?cash(null)
  :isNativeCharge(mo.native,mo.ccy)?money(mo.native,mo.ccy):cash(mo.base);
/** A commission: a charge, shown unsigned in the currency it was billed in. */
const chargeMo=mo=>mo==null?cash(null):chargeOf(mo.native,mo.ccy,mo.base);
/** @param {Money|null} mo */
const isNative=mo=>mo!=null&&isNativeCharge(mo.native,mo.ccy);
/* Which basis the figure on screen actually uses -- three states, not two.
   "restated" is a claim, and it is false when the reader is looking at the
   base currency: that figure is IBKR's own conversion, unrestated, and saying
   otherwise undersells it. */
const basisOf=m=>isNative(m)?'as charged'
  :DISP()===BASE()?`IBKR's figure in ${BASE()}`:`restated from ${BASE()}`;

/* ------------------------------------------------ tabs */
/* [id, label]. There used to be a third slot carrying a per-tab "disabled
   reason", rendered as `disabled title="..."`. It was null in every entry, and
   deliberately so: the one real reason it ever held was a hardcoded "No 0DTE
   trades in this account" that contradicted the data -- the same defect
   `odteSelectable` was written to fix. Gating a VIEW is not the same question as
   gating a FILTER, and only the filter bar can answer it, because only it is
   re-derived from the payload on every render. The slot, the `disabled?` branch
   it fed, HASH_TABS' filter over it and `.tab:disabled` all went together; a
   mechanism kept "in case" is a mechanism nobody has tested.

   THIS LIST IS STILL THE NINE LEAVES, and that is what makes the rail below a
   cheap change rather than a routing rewrite. `views` dispatches on these keys,
   `HASH_TABS` validates the URL against them and `sweep.TABS` mirrors them, so
   folding nine views into seven destinations left every `#tab=costs` link
   resolving and every one of the nine renders still visited by the browser
   sweep. A second registry naming the destinations was the smaller change than
   teaching this one to be a tree. */
const TABS=[
  ['dashboard','Dashboard'],
  ['calendar','Calendar'],
  ['trades','Trades'],
  ['positions','Positions'],
  ['costs','Costs'],
  ['annual','Annual'],
  ['review','Journal'],
  ['odte','0DTE'],
  ['market','Market'],
  ['watchlist','Watchlist'],
];

/* ------------------------------------------------ the rail

   [id, label, leaves]. Seven destinations, two of which carry more than one leaf:
   Trades holds the book closed and open, Analysis holds the two whole-history
   aggregates. Those are the two pairs that answer one question between them,
   which is the test a fold has to pass -- Calendar and Annual are both time
   views and were NOT folded, because "this month day by day" and "every year
   side by side" are two questions, not one asked twice.

   Seven is what fits a vertical rail. Nine items read as a list to be scanned;
   seven with two of them grouped reads as a shape to be learned, which is the
   whole point of moving the navigation off the header's second row.

   The icons sit in their own table rather than a fourth slot here, so this stays
   a list a reader can check against the rail in front of them. */
const RAIL=[
  ['dashboard','Dashboard',['dashboard']],
  ['calendar','Calendar',['calendar']],
  ['trades','Trades',['trades','positions']],
  ['analysis','Analysis',['costs','annual','review']],
  ['odte','0DTE',['odte']],
  ['market','Market',['market']],
  ['watchlist','Watchlist',['watchlist']],
];

/* Path data on a 24x24 grid, stroked and unfilled, drawn from the same two
   primitives throughout (a box and a rule) so seven glyphs read as one set.
   Deliberately NOT a <symbol> + <use> sprite: `<use>` clones into a shadow tree
   that only inherited properties cross, so the glyphs take their colour by
   inheritance either way, and a sprite would buy nothing while adding a second
   place to look for the shape. No fill or stroke attribute on the paths -- the
   colour is `.railico`'s in app.css, which is what keeps every colour in this
   page inside a theme block. */
const RAIL_ICONS={
  dashboard:'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z',
  calendar:'M4 6h16v14H4z M4 11h16 M9 3v4 M15 3v4',
  trades:'M4 9h13 M14 6l3 3-3 3 M20 15H7 M10 12l-3 3 3 3',
  analysis:'M4 20h16 M7 20v-5 M12 20V8 M17 20v-9',
  odte:'M6 3h12v18H6z M9 7h6 M9 11h1 M14 11h1 M9 15h1 M14 15h1',
  market:'M4 9h16v11H4z M3 9l2-5h14l2 5 M9 20v-6h6v6',
  watchlist:'M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
};
/* A leaf's label, read from TABS rather than restated, so a rename lands once. */
const LEAF_LABEL=id=>(TABS.find(t=>t[0]===id)||[id,id])[1];
/* Which destination owns a leaf. Falls back to the first rather than throwing:
   `S.tab` is already validated against HASH_TABS, so an unowned leaf means a leaf
   was added to TABS and not to RAIL, and the rail rendering with nothing marked
   is a quieter failure than the page not rendering at all. */
const RAIL_OF=id=>RAIL.find(r=>r[2].includes(id))||RAIL[0];

function renderRail(){
  const here=RAIL_OF(S.tab)[0];
  $('#rail').innerHTML=RAIL.map(([id,label,leaves])=>{
    const on=id===here;
    /* An ACTIVE destination points at the leaf you are on, so clicking it is the
       no-op `syncHash` already guards against minting a history entry for. An
       inactive one points at its first leaf, which is the view that names it.
       Derived, not remembered: a stored "last sub-view per destination" is state
       the URL cannot express, and this page keeps its view coordinates in the
       hash for exactly that reason. */
    return `<button class="tab${on?' on':''}" data-tab="${on?S.tab:leaves[0]}"${
      on?' aria-current="page"':''}><span class="railtile"><svg class="railico"
      viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${
      RAIL_ICONS[id]}"/></svg></span>${esc(label)}</button>`;
  }).join('');
}

/* The sub-view switcher, shown only where a destination has more than one leaf.
   `.seg` rather than a second row of tabs, because that shape already means "pick
   one" everywhere else on this page and a reader should not have to learn that
   two controls with different silhouettes do the same thing. Empty string, not a
   hidden element, for the five destinations that have one leaf: a control that is
   always there and sometimes inert is a control a reader has to test. */
function subnav(){
  const leaves=RAIL_OF(S.tab)[2];
  if(leaves.length<2) return '';
  return `<div class="seg subnav">${leaves.map(id=>
    `<button data-tab="${id}" class="${S.tab===id?'on':''}"
      >${esc(LEAF_LABEL(id))}</button>`).join('')}</div>`;
}

/* ------------------------------------------------ themes

   [id, label]. The id is the `data-theme` attribute value, and app.css holds one
   block per id -- so adding a theme is a CSS block plus a line here, with no
   JavaScript to touch. Leather is first because it is what `:root` carries: a
   page whose attribute is absent or unrecognised is already fully styled in it,
   which is why an unknown id in the URL can heal to nothing rather than needing
   a fallback stylesheet.

   The label is what the edition chip shows, so it reads "Leather Edition" --
   which is what that chip claimed statically before any of this existed. It is
   now true rather than decorative, and it is the control that changes it. */
const THEMES=[
  ['leather','Leather'],
  ['admiralty','Admiralty'],
  ['ledger','Ledger'],
];
const THEME_IDS=()=>THEMES.map(t=>t[0]);
const themeLabel=id=>(THEMES.find(t=>t[0]===id)||THEMES[0])[1];
/* On <html>, not <body>: `:root` is where the default block lives, so both the
   default and every override then resolve against the same element and a theme
   cannot half-apply to a page whose body has not parsed yet. */
function applyTheme(){
  document.documentElement.dataset.theme=S.theme||THEMES[0][0];
  const chip=$('#edition');
  if(chip) chip.textContent=themeLabel(S.theme||THEMES[0][0])+' Edition';
}
/* Cycles rather than opening a menu. Three themes is too few to earn a dropdown
   -- and the chip is 10.5px, so a caret on it would be decoration rather than an
   affordance. `title` says what it does, because a chip that reads as a label is
   not obviously clickable. */
function nextTheme(){
  const ids=THEME_IDS();
  return ids[(ids.indexOf(S.theme||ids[0])+1)%ids.length];
}

/* ------------------------------------------------ the log's dateline

   What the header's kicker says, and the reason it is computed rather than
   written: see the note on #kicker in the markup. Three clauses, each dropped
   rather than faked when its fact is absent, so the line never states something
   the journal cannot back:

     LOG DAY 348 · SINCE 28 AUG 2025 · CARRYING TSLA GOOG META PLTR
     LOG DAY 348 · SINCE 28 AUG 2025 · FLAT          <- nothing open
     BITÁCORA                                        <- empty journal

   `CARRYING` names UNDERLYINGS, not contracts and not a count. A strangle is
   two contracts on one name, so "6" here would have contradicted the Positions
   tab's three cards -- the exact disagreement `open_position_count` was written
   to end. Names sidestep the question: two legs on GOOG are one GOOG either
   way. Read from `state.positions`, the same snapshot rows the Positions tab
   renders, so the header cannot drift from the tab. */
const KICKER_NAMES=4;
function logbookLine(){
  const st=S.state||{}, lb=st.logbook||{};
  /* No first day means nothing has happened in this account, so there is no
     log to be on day N of. The title alone carries the header. */
  if(!lb.day) return 'Bitácora';
  const parts=['Log day '+lb.day];
  if(lb.opened){
    const[y,m,d]=String(lb.opened).split('-');
    if(y&&m&&d) parts.push('since '+dayLabel(lb.opened)+' '+y);
  }
  /* Distinct, in first-appearance order. `positions_data` sorts its rows by
     expiry then strike, so the name holding the nearest expiry lands first and
     the soonest thing to need a decision leads the line. A Set preserves
     insertion order, which is what makes that free rather than a second sort. */
  const names=[...new Set((st.positions||[])
    .map(pos=>pos.underlying_symbol||pos.symbol||'')
    .filter(Boolean))];
  /* Truncated rather than allowed to wrap under the title: this is a 10.5px
     letterspaced line in a fixed header, and a book of a dozen names would
     push the title down the page. The overflow is counted, not silently
     dropped -- "+3 more" is honest about what is not shown. */
  if(!names.length) parts.push('flat');
  else parts.push('carrying '+names.slice(0,KICKER_NAMES).join(' ')
    +(names.length>KICKER_NAMES?' +'+(names.length-KICKER_NAMES)+' more':''));
  return parts.join(' · ');
}
function renderKicker(){
  const el=$('#kicker'); if(!el)return;
  el.textContent=logbookLine();
}

/* ------------------------------------------------ display-currency toggle */
/* The display-currency toggle, as markup for the view-options panel. It returns
   a string rather than writing into the page because it no longer owns a slot:
   `renderViewOptions` places it and binds it along with the controls beside it.

   Nothing at all without a quote. A toggle offering only the base currency is a
   control with one position, which reads as broken rather than as "there is
   nothing to restate into" -- and the section's absence is what lets the panel's
   button disappear on a tab where nothing else is left to choose. */
function ccyControl(){
  const base=BASE(), quotes=QUOTES();
  if(!base||!quotes.length) return '';
  const opts=[{code:base}].concat(quotes);
  const row=opts.map(qo=>{
    const on=qo.code===DISP();
    const tip=qo.per_base
      ? `Totals restated from ${base} at ${num(qo.per_base,4)} ${qo.code} per `
        +`${base} (${qo.source} ${qo.as_of}). Contract prices stay in their own currency.`
      : `${base} is the account base currency — IBKR's own conversions, unrestated.`;
    return `<button data-ccy="${esc(qo.code)}" class="${on?'on':''}"
      title="${esc(tip)}">${esc(sym(qo.code)||'')}${esc(qo.code)}</button>`;
  }).join('');
  const q=QUOTE();
  return `<div><div class="flabel">Currency</div><div id="ccywrap">
    <div class="ccytog">${row}</div>${q
    ? `<div class="ccynote">restated at ${esc(num(q.per_base,4))}
       ${esc(q.code)}/${esc(base)} · ${esc(q.as_of)}</div>`
    : ''}</div></div>`;
}

/* ------------------------------------------------ the period and view options

   The three tabs whose figures the month and the trade type move. Named once,
   because two things key on it: the period stepper appears only here, and the
   view-options panel offers the trade type only here. Everywhere else those
   controls would change nothing on screen, which is the invariant in
   docs/design-notes.md -- a tab's numbers move only with a control it displays --
   read in the direction it is easy to forget: a control it displays must move
   its numbers. `trades` is the leaf, not the destination; Positions shares the
   rail item and ignores both controls, so it gets neither. */
const PERIOD_TABS=['dashboard','calendar','trades'];
const TYPE_LABEL={'':'Options',equities:'Equities',odte:'0DTE'};

/* THE MONTH STEPPER. It replaces the month dropdown and the calendar's own
   chevrons, which were two controls writing the same `S.month` through the same
   `load()` -- so on the Calendar there were two ways to do one thing, one of them
   inside the card and one above it.

   The walk is All time, then the account's life oldest to newest. The CURRENT
   month is the default, as the reference app opens on it (checked on a fresh
   launch of IAG 2.0.16: Sep 2026, forward greyed), so a fresh page has the
   forward button disabled. All time is one step before the oldest month.
   `S.month` is null for that default, which keeps the URL clean and lets a
   bookmark follow the calendar into next month; All time is spelled `all`. Walking `month_range` rather than the fills-only `months` for
   the reason the dropdown did: with one traded month the walk would have one
   stop, and an empty month is still a real answer, rendered as honest zeros.

   A month with no fills in scope is dimmed, not skipped. The dropdown said
   "— no fills" in words; a stepper label that grew and shrank would move both
   buttons under the pointer, so the words went to the tooltip and the label
   keeps its width. */
function monthSteps(){
  const range=S.state.month_range||S.state.months||[];
  return ['all'].concat([...range].reverse());
}
function renderPeriod(){
  const el=$('#period');
  if(!PERIOD_TABS.includes(S.tab)||!S.state){el.innerHTML='';return;}
  const steps=monthSteps(), cur=S.month||S.state.selected_month||'all';
  const i=steps.indexOf(cur);
  /* A hand-edited month outside the range has no neighbours to step to. Both
     buttons still lead somewhere sensible: back to the newest month, forward to
     All time -- which is where the healed page is heading anyway. */
  const prev=i>0?steps[i-1]:i<0?'all':null;
  const next=i>=0&&i<steps.length-1?steps[i+1]:i<0?(steps[steps.length-1]??null):null;
  const has=cur==='all'||(S.state.months||[]).includes(cur);
  const label=cur==='all'?'All time':monthLabel(cur);
  const tipFor=m=>m==='all'?'All time':monthLabel(m);
  const s=S.state.stats;
  el.innerHTML=`<div class="pstep">
      <button data-month="${prev??''}" ${prev===null?'disabled':''}
        title="${prev===null?'account start':esc(tipFor(prev))}"
        aria-label="Previous period">‹</button>
      <span class="plabel${has?'':' nofill'}"${has?'':' title="No fills in this month"'}
        >${esc(label)}</span>
      <button data-month="${next??''}" ${next===null?'disabled':''}
        title="${next===null?'most recent':esc(tipFor(next))}"
        aria-label="Next period">›</button>
    </div>${s?`<div class="pfig"><span class="plk">Net P&amp;L</span>
      <span class="ppl ${cls(s.net_pnl.base)}">${moneyOf(s.net_pnl)}</span></div>`:''}`;
}

/* The view options and the button that opens them. The button's LABEL is the
   state in force -- "Options · €EUR" -- so the choices are on screen without the
   panel being open, which is what keeps a restated page honest now that the
   currency toggle is no longer permanently in view. No button at all when the
   panel would be empty: one-currency accounts on a tab with no trade type. */
function renderViewOptions(){
  const pop=$('#vpop'), btn=$('#vbtn');
  /* No payload yet, no options: a hash change can reach draw() before the first
     reply lands -- found by switching tabs quickly on a phone-width page, where
     this read `S.state.asset_category` off null and threw. `renderPeriod` has
     always had this guard; this function shipped without it. */
  if(!S.state){btn.innerHTML='';pop.innerHTML='';return;}
  const onPeriod=PERIOD_TABS.includes(S.tab);
  const ccy=ccyControl();
  const parts=[];
  if(onPeriod) parts.push(TYPE_LABEL[S.type||'']);
  if(ccy) parts.push(`${sym(DISP())||''}${DISP()}`);
  if(!parts.length){
    btn.innerHTML=''; pop.innerHTML='';
    if(pop.matches(':popover-open')) pop.hidePopover();
    return;
  }
  btn.innerHTML=`<button class="btn vbtn" popovertarget="vpop"
    title="View options">${esc(parts.join(' · '))} ▾</button>`;
  pop.innerHTML=(onPeriod?`<div><div class="flabel">Trade type</div>
      <div class="seg">
        <button data-type="" class="${S.type?'':'on'}"
          title="Every ${esc(S.state.asset_category)} trade in the journal."
          >Options</button>
        <button data-type="equities" class="${S.type==='equities'?'on':''}"
          ${equitiesSelectable()?'':'disabled'} title="${esc(equitiesNote())}"
          >Equities</button>
        <button data-type="odte" class="${S.type==='odte'?'on':''}"
          ${odteSelectable()?'':'disabled'} title="${esc(odteFilterNote())}">0DTE</button>
      </div></div>`:'')
    +ccy
    +(onPeriod?`<div><div class="flabel">Account</div>
      <div class="vacct">${esc(accountLabel())}</div></div>`:'');
  pop.querySelectorAll('button[data-ccy]').forEach(b=>
    b.onclick=()=>{S.ccy=b.dataset.ccy;draw();});
}

/* ------------------------------------------------ scoreboard unit toggle */
/* The two units, first one default -- the same order `stats.SCORINGS` declares,
   because applyHash and syncHash both treat element 0 as the value not worth
   recording in a URL. */
const SCORINGS=['position','contract'];
const SCORING=()=>S.scoring||SCORINGS[0];
/* Whether the journal holds any position made of more than one contract. When
   nothing is grouped the two readings are ARITHMETICALLY IDENTICAL, and a
   toggle that visibly changes nothing reads as broken rather than as agreement
   -- so it says so instead of offering a choice with no consequence.

   Derived from the payload the same way the 0DTE and Equities buttons are:
   closed_episodes exceeds decided_campaigns exactly when grouping merged
   something. Read off `all_time`, never the selected month: a single month may
   group nothing while the journal does, and the control is global. */
function groupingMatters(){
  const alt=(S.state||{}).all_time;
  if(!alt) return false;
  /* Under contract scoring the two are equal BY CONSTRUCTION, so this test
     cannot see grouping in the payload it is looking at. The open book is the
     other witness: a multi-contract position that has not closed yet is still
     grouping the reader will meet. */
  return SCORING()===SCORINGS[1]
    ? true
    : alt.closed_episodes!==alt.decided_campaigns
      ||alt.open_episodes!==alt.open_positions;
}
function scoringLabel(unit){
  return unit===SCORINGS[1]?'Per contract':'Per position';
}
function scoringTip(unit){
  return unit===SCORINGS[1]
    ? 'Score every contract round trip on its own: each leg of a strangle, and '
      +'each leg of a roll, counts as its own win or loss. This is what a '
      +'broker trade log shows, so it is the reading to use when reconciling '
      +'against one.'
    : 'Score the decision: a multi-leg structure and every roll of it count '
      +'once, and the outcome is the sum of their contracts. A hedge leg cannot '
      +'be a loss inside a winning position, and a loser cannot be rolled out '
      +'and scratched into a win.';
}
/* The noun for one outcome, taken from the PAYLOAD's scoring rather than the
   control's. The two are the same once a load settles, and differ for exactly
   the moment that matters: a payload counted in the old unit must not be
   labelled with the new one. Both helpers take the stats block for that reason,
   so a caller cannot accidentally read the control instead.

   `n` for the plural, because "1 decided positions" is the kind of detail that
   makes a reader distrust every other figure on the card. */
function unitWord(s,n){
  const one=(s||{}).scoring===SCORINGS[1]?'contract round trip':'position';
  return n===1?one:one+'s';
}
function unitNote(s){
  return `decided ${unitWord(s,2)}`;
}
/* Rendered inside the cog panel rather than the header, and the header is why:
   nine tabs, a theme chip, the currency pair and two icons already wrap onto a
   second line, so a fourth control there cost more legibility than it bought. A
   scoring unit is also a SET-ONCE preference -- unlike the display currency,
   which a reader flips to check a figure against the broker -- and set-once
   belongs behind the settings button.

   What that costs, and how it is paid: the control is no longer on screen beside
   the figures it governs, so a reader could forget which unit they are in. Every
   surface therefore NAMES the unit in place -- the stat cards' notes via
   `unitWord`, the Annual footnote, and `scoringBanner` below whenever the
   reading is not the default. The rule the header placement was protecting was
   never "the control must be visible", it was "the numbers must never be
   unlabelled", and that one still holds. */
function scoringRow(){
  const matters=groupingMatters();
  const row=SCORINGS.map(unit=>{
    const on=unit===SCORING();
    const tip=matters?scoringTip(unit)
      :'Every position in this journal is a single contract, so both readings '
       +'count the same outcomes and this changes nothing yet.';
    return `<button data-scoring="${esc(unit)}" class="${on?'on':''}"
      ${matters?'':'disabled'} title="${esc(tip)}"
      >${esc(scoringLabel(unit))}</button>`;
  }).join('');
  /* Wrapped in a `.setrow` so the toggle sizes to its content like every other
     control in this panel. Bare, `.ccytog` is a block-level flex container and
     stretched the full width of the card -- two buttons on the left and a metre
     of empty border to the right, which reads as a layout that broke rather than
     as a segmented control. */
  return `<h2 class="sub3 mt-5">Scoreboard</h2>
    <div class="setrow"><div class="ccytog">${row}</div></div>
    <div class="note">Which unit <b>W</b>, <b>L</b>, win rate and the averages
      count, on every tab. ${esc(scoringTip(SCORING()))}${infoTip(
      `The money never moves: net P&amp;L, commission and the fill counts are
       identical under both readings, so the two differ only in how many outcomes
       the same cash is divided into.`)}${matters?'':` Nothing in this journal is
      grouped yet, so both readings currently agree.`}</div>`;
}
/* Said out loud wherever the figures are, and ONLY when the reading is not the
   default. A per-contract scoreboard sitting under an unlabelled "Winning
   Trades" card is the one way this feature can mislead now that its control
   lives behind a button -- and the default needs no announcement, for the same
   reason it is the one value the hash omits. */
function scoringBanner(s){
  return (s||{}).scoring===SCORINGS[1]
    ? ` Scored <b>per contract round trip</b>: each leg of a spread and each leg
       of a roll counts as its own win or loss.`
    : '';
}

/* One sentence telling the reader which currency they are looking at, and
   whether it is IBKR's own figure or a restatement of it. */
function ccyNote(){
  const q=QUOTE(), base=BASE();
  /* SILENT IN THE BASE CASE. This used to return "Amounts in EUR, the account base
     currency." on every panel of every tab, forever -- a sentence that every `€` on
     screen had already said, repeated six times per page. A caption whose content
     is identical on every load is read once and then permanently ignored, and it
     spends the reader's attention to say nothing.
     The restatement branch stays, and is the reason the function exists: those
     figures are NOT IBKR's, they are ours at a rate we should name. Something to
     say, so it says it. */
  return q
    ? `Totals restated from ${base} into ${q.code} at ${num(q.per_base,4)} `
      +`(${q.source} ${q.as_of}); IBKR's own figures are in ${base}.`
    : '';
}

/* ------------------------------------------------ filter bar

   There is no filter bar any more; the card that held Month, Trade type and
   Account is gone. The month is the header's stepper and the other two are in the
   view-options panel, so every tab starts at its own content instead of below a
   row of chrome. What survives here is what the three controls need to describe
   themselves. */
function accountLabel(){
  const stm=(S.state.statements||[])[0];
  return stm? 'Single account' : 'No statements';
}
/* Derived, not asserted. This read "No 0DTE trades in this account" as a
   hardcoded string -- the same defect as the tab's own disabled reason, which
   claimed the same thing while the data said otherwise. */
function odteSelectable(){
  const od=S.state.odte;
  return !!(od&&od.selectable);
}
/* Equities is offerable exactly when the database holds stock fills --
   derived from the per-category counts, not asserted in markup. The old
   button was hardcoded disabled with a tooltip blaming the ingest filter,
   which stopped being true the day ingest started storing everything. */
function equitiesSelectable(){
  return !!((S.state.asset_counts||{}).STK);
}
function equitiesNote(){
  const n=(S.state.asset_counts||{}).STK;
  return n
    ? `Show the ${n} stock fill(s) instead of options. Stocks are a different `
      +`asset category, not a subset — Dashboard, Calendar and Trades switch to `
      +`STK; other tabs stay on options.`
    : 'No stock trades in the journal. If some exist in the archive, run '
      +'`optjournal ingest` to fold them in.';
}
/* Rendered at the head of exactly the tabs the trade type drives -- Dashboard,
   Calendar and Trades, PERIOD_TABS -- and more necessary than it was, now that the
   control itself sits in a panel that is usually closed. A filter that silently changes
   every number is the same failure as a total that silently spans a wider
   scope than its label, and fees genuinely do not narrow, so naming which
   figures moved is the honest version. Equities gets its own wording: it is
   a category switch, not a subset of the options journal. */
function scopeNote(){
  if(!S.type) return '';
  if(S.type==='equities')
    return `<div class="note"><b>Equities.</b> Dashboard, Calendar and Trades show
      STK activity; Positions, Costs, Annual and 0DTE stay on options.${infoTip(
      `STK is a different asset category, not a subset of the options journal.
       <br><br>Stock P&amp;L uses IBKR's per-fill realisation: each lot sold is
       realised when it is sold.`)}</div>`;
  return `<div class="note"><b>${esc(S.state.trade_type_label)} only.</b> Positions,
    Costs, Annual and 0DTE are unaffected.${infoTip(
    `Fills, orders, P&amp;L, commission, win rate and the daily series are all
     restricted to this subset.
     <br><br>Months with no fills in it render as zeros rather than disappearing.`
    )}</div>`;
}
function odteFilterNote(){
  const od=S.state.odte;
  return odteSelectable()
    ? `Restrict this view to the ${od.cohort.episodes} round trip(s) opened on `
      +`their own expiry date.`
    : 'Nothing in the archive was opened on its own expiry date.';
}

/* ------------------------------------------------ dashboard */
/* A stat card is a label and a figure. The note -- scope, basis, denominator --
   moves to a tooltip rather than sitting under every card: the same six words
   ("closed round trips") repeated across five cards is noise that crowds the
   figures without telling a reader anything new the fifth time.

   The note is a real ELEMENT, not a `title` attribute. A native tooltip needs
   one to two seconds of stationary hover, is trivially missed, and does not
   exist on a touch device -- so putting always-visible text behind one deletes
   it in practice, which is exactly what happened on the first attempt. A hidden
   element appears instantly, is styled, stays in the DOM for a screen reader,
   and is markup a test can assert on.

   `tabindex` because a tooltip reachable only by mouse is still hidden from
   anyone driving the page from the keyboard. The dotted underline on the label
   is what advertises that there is anything to reach at all. */
/* THE `i` THAT CARRIES A PANEL'S EXPLANATION.
 *
 * This existed at four sites, written out by hand each time, and that is most of
 * why the page ended up explaining itself in standing prose instead: adding a
 * paragraph to a `.sub` was one line, and adding it to a tip was six. So the prose
 * went where it was cheap rather than where it belonged, and nine tabs accumulated
 * 897 words of it — 280 on the dashboard alone, including one 98-word note and one
 * of 80.
 *
 * `wide` by default, because everything routed here is a paragraph rather than a
 * caveat on one figure; the narrow 230px tip stays the default for `.stat` keys.
 *
 * The tip PINS: the trigger is `tabindex="0"` and `.tipped:focus>.tip` keeps it
 * open, so a click holds it there rather than it vanishing when the pointer drifts.
 * Verified in a browser before moving anything long behind it -- a 100-word
 * hover-only tooltip would have been worse than the paragraph it replaced.
 *
 * Takes HTML, not text, so callers can keep their `<b>` emphasis. Literal prose
 * only; payload values are escaped by the caller as everywhere else. */
function infoTip(html){
  return `<span class="info tipped" tabindex="0"><span class="tip wide"
    >${html}</span>i</span>`;
}

/* `tile` is the dashboard registry's key, emitted as `data-tile` so a rendered
   scoreboard names which tile is which -- the tests count and order them by it,
   and a data attribute rather than a class because it identifies rather than
   styles. It used to be `card`, a class for the one tile that needed to size its
   own box (`.stat.lead`); the lead went with the uniform grid, and with it the
   only reason for this function to write a class on the outer div. */
function statCard(k,v,note,klass,tile){
  return `<div class="stat${note?' tipped':''}"${tile?` data-tile="${tile}"`:''}${
    note?' tabindex="0"':''}>
    <div class="k${note?' hint':''}">${esc(k)}</div>
    <div class="v ${klass||''}">${v}</div>
    ${note?`<div class="tip">${esc(note)}</div>`:''}</div>`;
}

/* ------------------------------------------------ the dashboard's tiles

   [key, label], in the default order. Every key has a renderer in `dashboard()`;
   the labels are here so the tile chooser in Settings can list them without a
   payload to render against.

   THE VISIBLE COUNT IS A MULTIPLE OF FOUR, and that is the grid, not a taste.
   `.stats` runs 4, 2 and 1 columns across its breakpoints, and a count none of
   them divides leaves an empty cell -- the orphan app.css records as most of what
   once read as unpolished here. So a multiple of four shown: the chooser enforces it
   and `web._settings_write` refuses anything else. Twelve by default: the nine
   this tab always had, plus Profit Factor, Avg P&L per Trade and Open Premium. */
const TILES=[
  ['net_pnl','Net P&L'],['trades','Trades'],['win_rate','Win Rate'],
  ['profit_factor','Profit Factor'],
  ['wins','Winning Trades'],['losses','Losing Trades'],['avg_win','Avg Win'],
  ['avg_loss','Avg Loss'],
  ['commissions','Commissions'],['avg_pnl','Avg P&L / Trade'],
  ['gain','Gain % of Net Liq'],['open_premium','Open Premium'],
  ['open_positions','Open Positions'],['green_days','Green Days'],
  ['red_days','Red Days'],['inflight','In-flight Realised'],
  ['best_strategy','Best Strategy'],['worst_strategy','Worst Strategy'],
  ['largest_win','Largest Win'],['largest_loss','Largest Loss'],
];
const TILE_STEP=4;
/* Every count the grid can hold, up to showing them all, for the chooser to
   state rather than a sentence that goes stale when a tile is added. */
const TILE_COUNTS=()=>Array.from({length:Math.floor(TILES.length/TILE_STEP)},
  (_,i)=>(i+1)*TILE_STEP);
const TILE_DEFAULT=TILES.slice(0,12).map(t=>t[0]);
/* The tiles to render, in order: the stored choice if it still holds, else the
   default. Checked again here although the server refused a bad list on the way
   in, because the file is hand-editable and a tile can be retired from TILES
   after a reader chose it -- and a key with no renderer would throw halfway
   through the dashboard, which is a blank tab rather than a missing tile. */
function tileKeys(){
  const chosen=(S.state.settings||{}).tiles;
  const known=new Set(TILES.map(x=>x[0]));
  const ok=Array.isArray(chosen)&&chosen.length&&chosen.length%TILE_STEP===0
    &&new Set(chosen).size===chosen.length&&chosen.every(k=>known.has(k));
  return ok?chosen:TILE_DEFAULT;
}

/* THE TILE CHOOSER, in Settings. A draft is edited in `S.tiledraft` and saved in
   one request, rather than every tick writing through: a count that is not a
   multiple of four is a legitimate state to pass THROUGH on the way to the one
   you want -- untick two, tick two others -- and saving on each click would
   either refuse the middle step or store a grid with a hole in it.

   Two ways to reorder, both writing the same draft. Drag, which is how the
   reference app does it and how a pointer wants to; and the up and down buttons
   on each row, because native drag and drop has no keyboard path at all, and a
   reorder only a mouse can perform is a setting some readers cannot change.

   The draft is null until touched and holds {key,on} for EVERY tile, visible
   ones first in their order, so a hidden tile keeps its place in the list while
   it is off and comes back where the reader left it. */
function tileDraft(){
  if(S.tiledraft) return S.tiledraft;
  const shown=tileKeys();
  return shown.map(k=>({key:k,on:true}))
    .concat(TILES.map(t=>t[0]).filter(k=>!shown.includes(k)).map(k=>({key:k,on:false})));
}
function tileChooser(){
  const draft=tileDraft(), label=Object.fromEntries(TILES);
  const n=draft.filter(dr=>dr.on).length;
  const valid=n>0&&n%TILE_STEP===0;
  const dirty=!!S.tiledraft;
  const rows=draft.map((dr,i)=>`<li class="tilerow${dr.on?'':' off'}" draggable="true"
      data-tilerow="${dr.key}"><span class="grip" aria-hidden="true">⠿</span>
      <label><input type="checkbox" data-tilecheck="${dr.key}"${dr.on?' checked':''}>
        ${esc(label[dr.key])}</label>
      <span class="tilemove">
        <button data-tilemove="${dr.key}" data-dir="-1" ${i?'':'disabled'}
          aria-label="Move ${esc(label[dr.key])} up">↑</button>
        <button data-tilemove="${dr.key}" data-dir="1" ${i<draft.length-1?'':'disabled'}
          aria-label="Move ${esc(label[dr.key])} down">↓</button></span></li>`).join('');
  /* The status line says what the count must be BEFORE the reader tries to save,
     rather than letting Save fail: the rule is arithmetic a reader can satisfy
     at a glance once it is stated. */
  return `<h2 class="sub3 mt-5">Dashboard tiles</h2>
    <div class="note">Drag or use the arrows to reorder. The grid is four across,
      so show ${TILE_COUNTS().join(', ').replace(/, (\d+)$/,' or $1')}.</div>
    <ul class="tilelist">${rows}</ul>
    <div class="setrow"><span class="${valid?'dim':'warn2'}" id="tilestat">${n} shown${
      valid?'':` — choose a multiple of ${TILE_STEP}`}</span>
      <button class="btn sm" id="tilesave" ${valid&&dirty?'':'disabled'}>Save tiles</button>
      <button class="btn sm" id="tilereset"
        ${(S.state.settings||{}).tiles||dirty?'':'disabled'}>Default</button></div>`;
}
function dashboard(){
  const st=S.state, s=st.stats;
  const label=monthLabel(s.month);
  const opt=s.asset_category==='OPT';
  /* Options P&L counts fully closed round trips only, landing on the close
     date; premium on an open short is a liability, not profit. Stock P&L is
     IBKR's per-fill realisation. The note under the card says which rule the
