<!-- The favicon is a file under /static/, not a `data:` URI: the CSP is
     `default-src 'self'`, which permits a same-origin URL and blocks a
     `data:` one. Serving it also required the static handler to stop
     answering `text/javascript` for everything -- see web.py. -->
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css"></head><body>
<div class="wrap">

  <div class="brand">
    <!-- Decorative: the name sits in text immediately beside it, so an alt
         text here would only make a screen reader say it twice. -->
    <div class="logo">
      <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <!-- The binnacle ring. Nothing is drawn inside r=13 except the star,
             because an inner ring at this size crossed the needles and turned
             the whole mark to mud at 38px. -->
        <circle class="ring" cx="20" cy="20" r="16"/>
        <!-- Four ordinal ticks at the diagonals, short enough to sit between
             the ring and the star without touching either. -->
        <g class="ticks">
          <path d="M20 5.4 V8.2" transform="rotate(45 20 20)"/>
          <path d="M20 5.4 V8.2" transform="rotate(135 20 20)"/>
          <path d="M20 5.4 V8.2" transform="rotate(225 20 20)"/>
          <path d="M20 5.4 V8.2" transform="rotate(315 20 20)"/>
        </g>
        <!-- The star, as one kite rotated four times rather than four sets of
             hand-computed coordinates: the shape is defined once, so the arms
             cannot drift out of symmetry when it is tuned. Each arm is split
             along its spine into a lit and a shadowed half, which is what
             makes a flat mark read as a faceted compass card.

             Arms are listed N, S, E, W so the vertical pair paints UNDER the
             horizontal pair -- north stays the most legible thing in the mark
             at favicon size, where everything else collapses. -->
        <g class="star">
          <g transform="rotate(180 20 20)"><path class="fl" d="M20 6 L20 20 L16.4 17.6 Z"/><path class="fd" d="M20 6 L20 20 L23.6 17.6 Z"/></g>
          <g transform="rotate(90 20 20)"><path class="fl" d="M20 6 L20 20 L16.4 17.6 Z"/><path class="fd" d="M20 6 L20 20 L23.6 17.6 Z"/></g>
          <g transform="rotate(270 20 20)"><path class="fl" d="M20 6 L20 20 L16.4 17.6 Z"/><path class="fd" d="M20 6 L20 20 L23.6 17.6 Z"/></g>
          <path class="fl" d="M20 6 L20 20 L16.4 17.6 Z"/><path class="fd" d="M20 6 L20 20 L23.6 17.6 Z"/>
        </g>
        <circle class="pivot" cx="20" cy="20" r="1.5"/>

    <div>
      <!-- Not "Cuaderno de Bitácora": a kicker that translates the title
           directly beneath it spends the page's most prominent small slot
           saying what the next line already says. This states what the journal
           is made of instead, in the vocabulary the tabs use. -->
      <div class="kicker">Strikes · Fills · Round trips</div>
      <div class="title">Bitácora <span class="edition" id="edition">Leather Edition</span></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="hdr-actions">
      <div id="ccywrap"></div>
      <div class="hdr-icons">
        <button class="icobtn" id="sync" title="Sync from IBKR">⟳</button>
        <button class="icobtn" id="cog" title="Journal details">⚙</button>
      </div>
    </div>
  </div>

  <div id="msg"></div>
  <div id="body"></div>
  <div class="note" id="foot"></div>
</div>

<!-- A module, not a classic script: the chart's arithmetic lives in
     /static/replay.js so `node --test` can import and unit-test it, which
     rendering the page in a browser cannot do. Module scripts are deferred and
     execute in order, so the import resolves before anything below runs. There
     are no inline on* attributes anywhere in this page, so nothing depended on
     these functions being global. -->
<script type="module">
/* Only what the page actually calls. `clampIndex`, `domainOf` and `markAt` were
   imported here and never used: each is called INSIDE replay.js (by frameAt and
   plotGeometry) and unit-tested there directly, so they stay exported -- it was
   only this import list that had gone stale. A stale name here reads as "the
   page uses this", which is how the reader's map of what the page does drifts
   from what it does. test_frontend pins the list against the calls. */
import {
  MIN_POINTS, bandEdges, barsPerMs, deltaDomain, deltaSegments, frameAt,
  indexOfTs, nextStop, reachedEvents, plotGeometry, sessionBreaks, strikeSpan,
} from '/static/replay.js';

/* ===================== the payload contract =====================
   Everything this page reads, declared beside the code that reads it. The
   suite DERIVES its guards from these blocks (tests/test_web.py) instead of
   keeping a registry of its own:

     * every typedef below is checked BOTH WAYS against a real /api/state
       payload -- a required key the API stops sending fails, and a key the
       API sends but these blocks omit fails, so the contract can neither
       rot optimistic nor fall behind the server;
     * every `binding.key` read in this script must be a declared key of
       the shape that binding is bound to in the tables at the end;
     * every binding name read with a dot must appear in those tables, and
       every name in the tables must still exist in the code -- a stale
       entry fails, so the table cannot outlive the code it describes.

   Types and |null are documentation for the reader (the nullability is
   real: format a null without guarding and the cell renders junk); key
   PRESENCE and [optional] brackets are what the suite enforces. A name
   whose only reads are camelCase methods (x.forEach) is invisible to the
   read-scanner -- the same blindness the guards have always had -- and
   needs no declaration.

   Change recipe: a new payload key is one line here plus its serializer;
   a new binding is one token in the tables below, in the same diff as the
   code that introduces it. */

/** @typedef {Object} State -- the /api/state payload (web.build_state)
 * @property {string} version
 * @property {string} generated_at
 * @property {string} asset_category -- the journal's home category, OPT
 * @property {Object} asset_counts -- fills per category; derives offerable Trade Types
 * @property {string} db
 * @property {string} archive
 * @property {Array} months -- months with fills in the current scope
 * @property {Array} month_range -- every month of the account's life, newest first
 * @property {string|null} selected_month -- null means the all-time view
 * @property {string} trade_type
 * @property {string} trade_type_label
 * @property {Stats} stats -- the selected period
 * @property {Stats} all_time
 * @property {Array} positions -- Position rows, newest snapshot
 * @property {Array} orders -- Order rows in scope
 * @property {Array} strategies -- StrategyGroup rows: same orders, grouped
 * @property {Array} lifecycles -- Lifecycle rows: strategies linked by episode
 * @property {History} history
 * @property {Array} statements -- Statement rows, the archive inventory
 * @property {Market} market -- the economic calendar (serialize.market_data)
 * @property {Array} watchlist -- Watch rows (serialize.watchlist_data)
 * @property {Scheduler} scheduler -- what the jobs did, and whether the loop is
 *   alive (serialize.jobs_data). Two separate questions: see the typedef
 * @property {Audit} audit -- did the last session's perishable bars land
 *   (serialize.audit_data). Computed on EVERY load, because when this was a cron
 *   the watchdog and the thing it watched stopped together
 * @property {Array} annual -- Stats per year, ignores both filters
 * @property {Array} monthly -- Stats per month, ignores both filters
 * @property {Stats} annual_total -- whole-book total row, deliberately not all_time
 * @property {Object} replays -- Replay by key; rows resolve into it (web._attach_replays)
 * @property {OdteBlock} odte
 * @property {FxBlock} fx
 * @property {Array} costs -- Costs per statement section, may be empty
 * @property {string} [costs_source] -- only when an archive statement was readable
 * @property {string} [costs_error] -- only when reading it failed
 * @property {Sync} sync
 */

/** @typedef {Object} Stats -- one period's numbers (stats.month_stats via stats_data)
 * @property {string} month -- "ALL" or "YYYY-MM" or "YYYY"
 * @property {string} base_currency
 * @property {string} asset_category
 * @property {number} total_trades -- FILLS: how many executions, not outcomes
 * @property {number} orders
 * @property {Money} net_pnl -- options: closed round trips only, net of commission
 * @property {Money} commissions -- options: commission of round trips CLOSED here
 * @property {Money} fees -- account-level, not attributable to the journal
 * @property {number} closed_episodes -- the headline trade count for options
 * @property {number} open_episodes -- open CONTRACTS; a strangle is two
 * @property {number} open_positions -- open positions, grouping a multi-leg
 *   strategy into one. Attached by web.build_state, not month_stats: it needs
 *   the lifecycle grouping, which is built after the stats are
 * @property {number} wins
 * @property {number} losses
 * @property {number|null} win_rate -- null until anything closed
 * @property {Money|null} avg_win -- null without wins; an average of no
 *   outcomes is undefined, and zero would read as break-even
 * @property {Money|null} avg_loss -- null without losses
 * @property {Money} open_premium -- excluded from P&L until positions close
 * @property {Money} open_commission -- excluded the same way
 * @property {number|null} net_liq_base -- null until equity summaries exist
 * @property {string|null} net_liq_date
 * @property {number|null} gain_pct_of_net_liq
 * @property {Money} options_friction -- magnitude of commissions, currency carried
 * @property {number} account_friction_base
 * @property {number} total_friction_base
 * @property {number} green_days
 * @property {number} red_days
 * @property {Array} days -- Day rows for the calendar
 */

/** @typedef {Object} Day -- one calendar cell (stats.DayPnl)
 * @property {string} day
 * @property {number} trades
 * @property {Money} realized
 */

/** @typedef {Object} Position -- one open-position snapshot row (serialize.positions_data)
 * @property {string} report_date
 * @property {string} conid
 * @property {string} account_id
 * @property {string} broker -- which broker the row came from ('ibkr' today)
 * @property {string} symbol
 * @property {string} asset_category
 * @property {string|null} underlying_symbol -- null on stock rows
 * @property {string|null} put_call
 * @property {number|null} strike
 * @property {string|null} expiry
 * @property {number} multiplier
 * @property {number} position
 * @property {number} mark_price
 * @property {number} position_value
 * @property {number} position_value_base -- raw column; read `value` instead
 * @property {number} cost_basis_money -- raw column; read `cost_basis` instead
 * @property {number} cost_basis_price
 * @property {number} fifo_pnl_unrealized -- raw column; read `unrealized` instead
 * @property {Money} value -- market value, native and base
 * @property {Money} cost_basis -- falls back to the open episode's basis
 * @property {Money} unrealized -- no base column exists; derived at the row rate
 * @property {string} side
 * @property {string|null} open_date_time
 * @property {string} currency
 * @property {number} fx_rate_to_base
 * @property {string} raw
 * @property {string} source_file
 * @property {string} ingested_at
 */

/** @typedef {Object} Order -- one broker order with its fills folded (serialize.orders_data)
 * @property {string} broker -- which broker filled it; an order id is only unique within one
 * @property {string} ib_order_id
 * @property {string} account_id
 * @property {string} asset_category
 * @property {number} leg_count
 * @property {number} fills
 * @property {string} first_fill_at
 * @property {string} last_fill_at
 * @property {string} underlyings
 * @property {string} expiries
 * @property {Money} proceeds
 * @property {Money} commission
 * @property {Money} realized_pnl
 * @property {Array} legs -- Leg rows
 */

/** @typedef {Object} Leg -- one contract's fills within an order
 * @property {string} broker -- see Order.broker; the leg is grouped per broker too
 * @property {string} ib_order_id
 * @property {string} conid
 * @property {string} account_id
 * @property {string} asset_category
 * @property {string} symbol
 * @property {string|null} underlying_symbol -- null on stock legs
 * @property {string|null} put_call
 * @property {number|null} strike
 * @property {string|null} expiry
 * @property {number} multiplier
 * @property {string} buy_sell
 * @property {string} open_close
 * @property {string} currency
 * @property {number} fills
 * @property {string} first_fill_at
 * @property {string} last_fill_at
 * @property {number} quantity
 * @property {number} avg_price -- always in the contract's own currency
 * Raw leaf columns. Kept because every level above re-aggregates them; read
 * `money` to DISPLAY a figure, so the as-charged rule applies.
 * @property {number} proceeds
 * @property {number} proceeds_base
 * @property {number} commission
 * @property {number} commission_base
 * @property {number} realized_pnl
 * @property {number} realized_pnl_base
 * @property {LegMoney} money
 */

/** @typedef {Object} Episode -- one FIFO round trip per conid (serialize.history_data)
 * @property {string} symbol
 * @property {string} conid
 * @property {string|null} underlying_symbol
 * @property {string|null} put_call
 * @property {number|null} strike
 * @property {string|null} expiry
 * @property {string} status
 * @property {boolean} entry_outside_window
 * @property {boolean} snapshot_only
 * @property {number|null} cost_basis
 * @property {number|null} unrealized
 * @property {string|null} opened_at
 * @property {string|null} closed_at -- null while open
 * @property {number|null} holding_days
 * @property {boolean} is_odte
 * @property {number} contracts
 * @property {number} open_fills
 * @property {number} close_fills
 * @property {number} net_qty
 * @property {Money} realized_pnl -- already net of every leg's commission
 * @property {boolean} realized_is_net_of_commission
 * @property {Money} commission
 * @property {Money} proceeds
 * @property {string} currency
 * @property {Array} notes
 */

/** @typedef {Object} History -- the episode report (serialize.history_data)
 * @property {string} asset_category
 * @property {string} base_currency
 * @property {string|null} snapshot_date
 * @property {number} partial_record
 * @property {Array} closed -- Episode rows
 * @property {Array} open -- Episode rows
 * @property {Object} totals
 */

/** @typedef {Object} Costs -- one statement section's cost report (serialize.costs_data)
 * @property {string} base_currency
 * @property {string} from_date
 * @property {string} to_date
 * @property {string} fx_caveat
 * @property {Array} fx -- FxRow per conversion pair
 * @property {Array} commissions
 * @property {Array} fees
 * @property {Array} withholding
 * @property {string} journal_asset
 * @property {CostsTotals} totals
 */

/** @typedef {Object} LegMoney -- a leaf row's figures, interpreted
 * @property {Money} proceeds
 * @property {Money} commission
 * @property {Money} realized_pnl
 */

/** @typedef {Object} Money -- an amount and the currency it was charged in
 * Two readings of one figure. `base` is the accounting translation: every
 * contributing row converted at IBKR's own rate for ITS OWN date, then summed
 * -- always available, always addable, never exactly what left the account.
 * `native` is the amount as charged: exact, but unaddable across currencies,
 * so it is withheld (null) the moment a second currency contributes. The page
 * prefers `native` when the reader is already looking at that currency, which
 * is the whole of `moneyOf`.
 * @property {number} base
 * @property {number|null} native -- null when no single currency accounts for it
 * @property {string|null} ccy -- null exactly when `native` is null
 */

/** @typedef {Object} CostsTotals
 * Account-wide unless prefixed `journal_`, which narrows to the journalled
 * asset. Reading an account figure under a journal heading was the defect the
 * split exists to prevent.
 * @property {Money} commission
 * @property {Money} fees
 * @property {Money} taxes
 * @property {number} autofx_notional_base
 * @property {number} autofx_spread_base
 * @property {Money} stated_friction -- commission+taxes+fees, all real charges
 * @property {number} friction_base -- stated_friction PLUS the AutoFX estimate, so
 *   base-only by nature: the markup was never billed as a line item in any currency
 * @property {number} fx_notional_base
 * @property {Money} fx_commission
 * @property {Money} journal_commission
 * @property {Money} journal_taxes
 * @property {Money} journal_friction -- commission + taxes
 * @property {Money|null} journal_per_unit -- per contract; null without quantity.
 *   Both halves share a divisor, so an as-charged numerator never sits over a
 *   restated denominator
 * @property {Money} other_commission -- non-journal asset categories
 * @property {Money} other_taxes
 * @property {number} account_friction_base -- includes the AutoFX estimate, so base only
 * @property {number} credit_fills
 */

/** @typedef {Object} FxRow -- one currency pair's conversion costs
 * @property {string} symbol
 * @property {number} conversions
 * @property {number} notional_base
 * @property {number} commission_base
 * @property {number} commission_bps
 * @property {number} autofx_conversions
 * @property {number} autofx_notional_base
 * @property {number} autofx_spread_base
 */

/** @typedef {Object} Statement -- one archived statement (serialize.statements_data)
 * @property {string} file
 * @property {number} bytes
 * @property {boolean} ingested
 * @property {string|null} from_date
 * @property {string|null} to_date
 * @property {string|null} asset_filter
 */

/** @typedef {Object} Market -- the economic calendar (serialize.market_data)
 * @property {Array} week -- MarketDay rows, always seven; a gap would read as
 *   missing data rather than as a quiet Tuesday
 * @property {Array} events -- MarketEvent rows over the window, oldest first
 * @property {string} from_day
 * @property {string} to_day
 * @property {string} today
 * @property {string} impact_source -- WHOSE judgement `impact` is. Shown, not
 *   implied: an assessment without attribution reads as a measurement
 * @property {string} zone -- the zone `day`/`at` are already rendered in
 * @property {string} default_scope -- what the Key view narrows to, in words,
 *   so the toggle's label comes from the server that applied it
 * @property {number} total_events -- every row in the window
 * @property {number} key_events -- of those, how many survive the Key view
 */

/** @typedef {Object} MarketDay -- one cell of the week strip
 * @property {string} day
 * @property {string} label -- Mon..Sun
 * @property {number} dom -- day of month
 * @property {number} events
 * @property {number} high -- of those, how many the feed calls High
 * @property {number} key_events -- of those, how many survive the Key view. The
 *   strip counts what the rows will show, so a day cannot display three dots
 *   and then open empty -- which reads as broken rather than as filtered
 * @property {boolean} today
 */

/** @typedef {Object} MarketEvent -- one release or meeting
 * @property {string} event_id
 * @property {string} source
 * @property {string} day -- already in `Market.zone`, so the page parses no zone
 * @property {string} at -- HH:MM, likewise
 * @property {number} starts_at -- epoch UTC, for ordering
 * @property {string} country
 * @property {string} title
 * @property {string} impact -- High|Medium|Low|Holiday, the FEED's word
 * @property {string|null} forecast -- null when unpublished, which is not zero
 * @property {string|null} previous
 * @property {boolean} key -- survives the default view. Decided server-side from
 *   the same constants the CLI uses, so the page never holds its own copy of
 *   "USD high-impact" to drift from
 */

/** @typedef {Object} Scheduler -- the scheduler's own state (serialize.jobs_data)
 *
 *  TWO SEPARATE QUESTIONS, and conflating them is the failure this exists for.
 *  `jobs[].last_status` answers "did the last run succeed"; `running` answers "is
 *  anything driving the schedule at all". The MeshClaw crons answered the first
 *  with ok for two days while the second was false -- three bars jobs green while
 *  no bars were collected, including the audit job whose purpose was to notice. So
 *  a row can be green on outcome and red on freshness simultaneously.
 * @property {Array} jobs -- JobRow per registered job
 * @property {number|null} heartbeat_at -- epoch UTC, written by the TICK LOOP
 *   rather than by a job, so a dead loop reads as a dead heartbeat
 * @property {number|null} heartbeat_age_s
 * @property {boolean} running -- heartbeat fresher than stale_after_s
 * @property {boolean} ever_ran -- false when no scheduler has EVER written a
 *   heartbeat here. Distinct from stale: a CLI-only journal is not broken, and
 *   rendering it as an alarm would be the noise this project avoids
 * @property {number} stale_after_s
 */

/** @typedef {Object} JobRow -- one registered job's state (serialize.jobs_data)
 * @property {string} job
 * @property {string|null} last_status
 * @property {number|null} last_fired_for -- the newest scheduled instant claimed
 * @property {number} consecutive_failures
 * @property {Object|null} last_run -- the newest job_runs row, or null
 */

/** @typedef {Object} Audit -- the perishable-bar check (serialize.audit_data)
 *
 *  The one question no later run can fix: an option's intraday series exists only
 *  while its own session runs, so a missed session is missed permanently.
 * @property {string} day -- the ET session examined
 * @property {boolean} market_traded -- false on a holiday, when no bars is correct
 * @property {Array} covered -- contracts asked for that HAVE hourly bars
 * @property {Array} missing -- contracts asked for that have none
 * @property {boolean} ok -- nothing for a human to do: no missing, or no session.
 *   DO NOT render this alone: it is green in a total collection blackout, because
 *   `market_traded` is answered by "does any underlying have bars", which fails the
 *   same way the thing it certifies does. Read `witnesses`/`blackout` instead
 * @property {number} witnesses -- contracts actually checked. Zero means the audit
 *   proved nothing, which a boolean cannot say
 * @property {boolean} blackout -- nothing traded anywhere in the 10-day lookback.
 *   Nine US holidays a year do not fall in a ten-day row, so this is a dead poll
 */

/** @typedef {Object} Watch -- one watched symbol (serialize.watchlist_data)
 * @property {string} symbol
 * @property {string|null} note
 * @property {string} added_at
 * @property {number|null} last -- null until bars are stored for it
 * @property {number} closes -- daily closes held, so the page can say WHY a
 *   vol is missing rather than showing a bare dash
 * @property {number|null} change_1d -- percent
 * @property {number|null} change_5d -- percent
 * @property {number|null} realised_vol -- percent. REALISED, not implied: see
 *   vol.py. Named for what it is, because a column headed IV showing realised
 *   vol would be a well-formed number under a label that does not describe it
 * @property {number|null} expected_move_5d -- one stdev of what the stock HAS
 *   been doing, over five sessions. Not the market's expected move
 * @property {Array} options -- WatchOption rows: what this journal holds on it
 * @property {boolean} held
 */

/** @typedef {Object} WatchOption -- an open option position on a watched name
 * @property {string} symbol
 * @property {number} quantity
 * @property {string|null} put_call
 * @property {number|null} strike
 * @property {string|null} expiry
 */

/** @typedef {Object} Replay -- one trade's chart data (web._attach_replays)
 * @property {string} key -- "lc:<conids>@<date>" or "pos:<conid>"
 * @property {string|null} underlying -- the symbol the price line belongs to
 * @property {string|null} label -- the strategy name, or "Open position"
 * @property {string|null} bar_size -- "1h" or "1d"; the panel states which, so a
 *   flat stretch reads as a quiet week rather than a coarser grid
 * @property {Array} points -- [ts, close] pairs of the UNDERLYING, oldest first
 * @property {Array} strikes -- Strike rows, one per distinct contract
 * @property {string|null} opened_at -- null for a snapshot-only contract
 * @property {string|null} closed_at -- null while the position is open
 * @property {number|null} opened_ts -- entry as an epoch, US Eastern (bars.epoch_et)
 * @property {number|null} closed_ts -- exit as an epoch; null while open
 * @property {Array} fills -- epochs of each fill, for the dots on the line
 * @property {Array} marks -- [ts, pnl, delta] modelled mark-to-market per bar,
 *   in the CONTRACT's currency and gross of commission; shorter than `points`
 *   wherever a leading bar had no solvable vol, so it is joined by timestamp
 * @property {Array} band -- [ts, low, high] one-standard-deviation expected move,
 *   from the implied vol backed out of the option's own closes; EMPTY where no
 *   vol could be solved, which is honest rather than a narrow range
 * @property {Array} events -- Annotation rows, one per lifecycle event, oldest
 *   first; empty for a snapshot-only contract, which has no fills to annotate
 */

/** @typedef {Object} Annotation -- one decision on the timeline (web._annotations)
 * @property {number} ts -- the event's first fill, as an epoch (US Eastern)
 * @property {string} at -- the same instant as "YYYY-MM-DD HH:MM", for display
 * @property {string|null} label -- the strategy name from strategies.classify
 * @property {string} kind -- "open", "close" or "roll", from the legs' open/close
 *   markers rather than parsed out of the prose label
 * @property {Array} legs -- {strike, put_call, buy_sell, open_close, quantity,
 *   avg_price} per leg; enough for one line each and nothing more
 * @property {Money|null} cash -- proceeds: positive is a credit taken in
 * @property {Money|null} commission
 * @property {Money|null} realized -- null on an opening event, where the
 *   episode layer's 0.0 would read as "this trade made nothing"
 * @property {number|null} delta_before -- effective delta before the event; null
 *   when no position existed, which is not the same as delta-neutral
 * @property {number|null} delta_after
 */

/** @typedef {Object} Strike -- one contract as a horizontal reference line
 * @property {number} strike
 * @property {string} put_call
 * @property {string} side -- "short" or "long", from the OPENING fill
 * @property {number|null} frm -- epoch the contract was opened; null when unknown
 *   (a snapshot-only contract), which the page draws full width
 * @property {number|null} to -- epoch it went flat; null while still held
 */

/** @typedef {Object} FxBlock -- presentation rates (stats.fx_quotes)
 * @property {string} base
 * @property {Array} quotes -- FxQuote rows; empty hides the currency toggle
 */

/** @typedef {Object} FxQuote
 * @property {string} code
 * @property {number} per_base
 * @property {string} as_of
 * @property {string} source
 */

/** @typedef {Object} OdteBlock -- 0DTE cohort comparison (stats.odte_cohorts)
 * @property {Cohort} cohort
 * @property {Cohort} rest
 * @property {number} unknown_dte
 * @property {boolean} selectable -- whether the 0DTE filter is offerable at all
 */

/** @typedef {Object} Cohort
 * @property {string} label
 * @property {number} episodes
 * @property {number} wins
 * @property {number} losses
 * @property {number|null} win_rate
 * @property {Money} net_pnl
 * @property {Money|null} avg_pnl -- null with no episodes
 * @property {number} commission_base
 * @property {number} contracts
 */

/** @typedef {Object} StrategyGroup -- orders placed as one strategy (strategies.strategy_groups)
 * @property {string} underlying
 * @property {string} label -- derived from the combined legs, never assumed
 * @property {Array} order_ids
 * @property {string} first_fill_at
 * @property {number} fills
 * @property {Money} proceeds
 * @property {Money} commission
 * @property {Money} realized_pnl
 * @property {Array} orders -- the member Order rows, fully visible
 */

/** @typedef {Object} Lifecycle -- strategy events linked by episode (strategies.position_groups)
 * @property {string} underlying
 * @property {string} label -- the shape the position was OPENED as
 * @property {string} status
 * @property {string|null} opened_at
 * @property {string|null} closed_at
 * @property {Array} conids
 * @property {number} episodes
 * @property {number} fills
 * @property {Money} proceeds
 * @property {Money|null} realized_pnl -- null until the lifecycle is closed
 * @property {Money|null} commission -- same rule
 * @property {Array} events -- StrategyGroup rows
 * @property {string} replay_key -- index into State.replays
 */

/** @typedef {Object} Sync -- fetch machinery state (web.build_state)
 * @property {string|null} query_id
 * @property {boolean} configured
 * @property {string|null} last_fetch
 * @property {number} cooldown_s
 * @property {number} cooldown_remaining_s
 */

/** @typedef {Object} SyncResponse -- the /api/sync reply (web._do_sync); no
 *  /api/state sample exists (building one spends an IBKR request), so its
 *  keys are pinned against _do_sync's source instead
 * @property {boolean} ok
 * @property {string} kind
 * @property {string} [message]
 * @property {number} [retry_after_s]
 * @property {string} [archive]
 * @property {boolean} [reused_archive]
 * @property {boolean} [already_ingested]
 * @property {string} [duplicate_of]
 * @property {number} [new_trades]
 * @property {number} [new_cash]
 * @property {Array} [warnings]
 */

/** @typedef {Object} MarketFetch -- the /api/market/fetch reply
 *  (web._Handler._market_fetch). Its own shape rather than SyncResponse's: this
 *  spends no IBKR request and cannot report a cooldown, an archive or a
 *  duplicate, and sharing that typedef would declare six keys it never sends
 * @property {boolean} ok
 * @property {string} kind -- market|throttled|feed
 * @property {string} [message]
 * @property {number} [fetched] -- events the feed returned
 * @property {number} [stored] -- of those, how many were written
 */

/** @typedef {Object} WatchWrite -- the /api/watchlist reply
 *  (web._Handler._watchlist_write)
 * @property {boolean} ok
 * @property {string} kind -- watchlist|symbol|action
 * @property {string} [message]
 * @property {string} [action] -- add|remove, echoed so the toast can say which
 * @property {string} [symbol] -- as STORED (upper-cased), not as typed
 * @property {number} [changed] -- rows affected; 0 on removing what was absent,
 *   which the page reports rather than claiming a removal that did nothing
 */

/** @typedef {Object} Quote -- one symbol's last trade, from QuoteReply.quotes
 *  (marketdata.Quote). Never stored: a live intraday price is not a settled
 *  close, and writing one into price_bars would feed a half-formed session into
 *  realised_vol
 * @property {number|null} price -- null when the source gave no dated price
 * @property {number|null} at -- epoch UTC of the last trade. The page renders the
 *   AGE from this; a price without it is discarded server-side rather than shown
 * @property {number|null} previous_close -- the source's own prior settle
 * @property {string|null} currency
 */

/** @typedef {Object} QuoteReply -- the /api/quotes reply
 *  (web._Handler._quotes)
 * @property {boolean} ok
 * @property {Object} quotes -- symbol -> {price, at, previous_close, currency}
 * @property {Array} failed -- symbols the source would not answer for. One dead
 *   ticker must not blank the others, so it is a list rather than an error
 * @property {number} asked_at -- the SERVER's clock when it answered, so the page
 *   renders an age without trusting its own clock against the source's
 */

/** @typedef {Object} ChartPoint -- page-side: built from Stats.days for the equity curve
 * @property {number} x
 * @property {number} y
 * @property {number} n
 */

/** @typedef {Object} Bucket -- page-side: a Lifecycle paired with its Position rows
 * @property {Lifecycle|null} lc -- null for the Ungrouped bucket
 * @property {Array} rows
 */

/** Which binding holds which shape, and which names are page machinery.
 *  One name per shape, deliberately: reusing one name for two shapes blinds
 *  the guard to both. Declared here, in the file being edited, in the same
 *  diff as the code that introduces the name.
 * @payload st:State s:Stats best:Stats x:Episode ep:Episode dy:Day
 * @payload pos:Position o:Order l:Leg h:History c:Costs T:CostsTotals
 * @payload f:FxRow stm:Statement fx:FxBlock q:FxQuote qo:FxQuote
 * @payload mo:Money
 * @payload od:OdteBlock co:Cohort g:StrategyGroup lc:Lifecycle
 * @payload res:SyncResponse pt:ChartPoint bkt:Bucket rp:Replay sk:Strike
 * @payload e:Annotation
 * @payload mk:Market d:MarketDay mev:MarketEvent
 * @payload w:Watch wo:WatchOption
 * @payload mres:MarketFetch wres:WatchWrite qres:QuoteReply wq:Quote
 * @local Math S TABS b sel m r el location window qs hs
 * @local cells days buckets evs glegs jrows lcs legs mons month months
 * @local odtes open opts out ps pts range rows yrs active shown
 * @local RGEO geo edges fr xy sks dd sp dsegs seg
 * @local play scrub speed loop ev reached stops at dismiss
 * @local chosen withEvents ws opts thin
 * @local JSON Object ages input mine qb wf behind was
 */

const $=s=>document.querySelector(s);
const S={tab:'dashboard',month:null,state:null,showCog:false,ccy:null,type:null,
  /* Selected calendar day for the drill-down, and the open replay's key. Both
     ARE in the URL hash: which drill-down is open is navigational -- a link to
     "that day" or "that trade's chart" should survive a reload, and before the
     day was recorded a refresh silently dropped the panel while leaving the
     calendar looking untouched. Both are healed in draw() against the payload,
     because a selection from another month or another scope means nothing here.
     A future scrubber POSITION would not belong in the hash: that is an
     inspection inside an open panel, not which panel is open. */
  calday:null,replay:null,
  /* Which market day is expanded. NOT in the hash, unlike calday:
     the market strip always has a sensible default (today, or the
     first day with events), so there is no state a reload could
     silently lose -- and a link to "the calendar" means the week,
     not one cell of it. */
  marketday:null,
  /* Calendar filter: false (the default) shows `Market.default_scope`, true shows
     everything stored. Not in the hash for the same reason as marketday -- and
     deliberately DEFAULT-OFF rather than remembered, because "why is my calendar
     empty" is a worse first impression than one extra click. */
  mktall:false,
  /* Live quotes, keyed by symbol, and the server clock when they were asked for.
     NOT part of `state`: they come from their own endpoint because each one costs
     an HTTP request, so they must not ride along on every payload reload. Null
     until the Watchlist tab asks. */
  quotes:null,quotesAt:null};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(v,d=2)=>v==null?null:Number(v).toLocaleString(undefined,
  {minimumFractionDigits:d,maximumFractionDigits:d});
/* Currency glyphs for the majors. Anything else prefixes its ISO code, which
   reads better than an obscure glyph -- "SEK 1,921.39" beats "kr 1,921.39". */
const CCY={EUR:'€',USD:'$',GBP:'£',JPY:'¥',KRW:'₩'};
const sym=c=>{const k=String(c||'').toUpperCase();return CCY[k]||(k?k+' ':'');};

/* Two decimals. Four on a headline card is noise -- that precision belongs in
   the source data, not the display. One exception: an amount small enough to
   round to zero keeps enough digits to stay visible, because rendering a real
   0.004 fee as "0.00" would assert it was free. */
const dp=n=>Math.abs(n)>0&&Math.abs(n)<0.005?4:2;

/* Minus sits OUTSIDE the symbol -- −€1.84, not €−1.84.
   `ccy` is required in practice: omitting it yields a bare number, which is
   how every call site used to behave and is never what we want now. */
const money=(v,ccy,d)=>{
  if(v==null)return '—';
  const n=Number(v);
  if(!Number.isFinite(n))return '—';
  return (n<0?'−':'')+sym(ccy)+num(Math.abs(n),d==null?dp(n):d);
};

/* ---- display currency -------------------------------------------------
   Base is canonical: every *_base figure is IBKR's own conversion, performed
   at that row's own trade or snapshot date. Choosing another display currency
   RESTATES those totals at a single snapshot rate, so it is a presentation
   choice rather than a reconciliation -- on this account the order-implied USD
   rate and the snapshot rate differ by 1.4%. The header names the rate in use.

   Contract prices are never restated. A TSLA 270 strike is 270 dollars
   whatever currency you total in, so strike, mark and fill prices always
   render in the instrument's own currency. */
const BASE=()=>{const fx=(S.state&&S.state.fx)||{};
  return fx.base||(S.state&&S.state.stats&&S.state.stats.base_currency)||'';};
const QUOTES=()=>((S.state&&S.state.fx&&S.state.fx.quotes)||[]);
const DISP=()=>{const c=S.ccy;
  return c&&QUOTES().some(q=>q.code===c)?c:BASE();};
const QUOTE=()=>QUOTES().find(q=>q.code===DISP())||null;

/* Restate a base-currency amount into the display currency. */
const conv=v=>{if(v==null)return null;const q=QUOTE();
  return q?Number(v)*q.per_base:Number(v);};
/* An amount already in base currency: restate and symbol in one step. */
const cash=(v,d)=>money(conv(v),DISP(),d);

/* ---- commission: a charge, not an analytic total ----------------------
   Commission is billed in one currency and debited in that currency -- IBKR
   takes dollars for a US option, never euros. `commissions_base` is therefore
   an accounting translation, and restating it into a display currency sends a
   USD charge on a round trip through two different rates (its own trade-date
   rate to EUR at ingest, then one snapshot rate back out), which does not
   return: $6.9652 billed read $7.0021 on screen.

   So when the reader is already looking at the currency the commission was
   charged in, show the charge. `commissions_native` is null whenever the scope
   spans currencies -- this account's stock trades span USD, SEK, EUR and KRW,
   and those cannot share a number -- and then the restatement is the honest
   best available, exactly as before.

   One helper, used by the Dashboard card and both tables, because the same
   figure reading differently on two tabs is the defect this replaced. */
/* One rule for every as-charged figure: show the charge when the reader is
   already in the currency it was charged in, else the restatement. Written
   once because figures that share a sentence must share a basis -- "as charged
   · $2.83 on open positions" is a contradiction if only one of them is.

   `chargeOf` is the rule; `moneyOf` applies it to a Money-shaped payload key.
   Four near-identical wrappers (commissionOf, openCommissionOf, openPremiumOf,
   frictionOf) existed only to bind three flat field names each, and vanished
   when the payload started sending one nested object per figure. */
const isNativeCharge=(nat,ccy)=>nat!=null&&ccy===DISP();
const chargeOf=(nat,ccy,base)=>isNativeCharge(nat,ccy)
  ? money(Math.abs(nat),ccy) : cash(Math.abs(base));
/** @param {Money|null} mo */
const moneyOf=mo=>mo==null?cash(null):chargeOf(mo.native,mo.ccy,mo.base);
/** @param {Money|null} mo */
const isNative=mo=>mo!=null&&isNativeCharge(mo.native,mo.ccy);
/* Which basis the figure on screen actually uses -- three states, not two.
   "restated" is a claim, and it is false when the reader is looking at the
   base currency: that figure is IBKR's own conversion, unrestated, and saying
   otherwise undersells it. */
const basisOf=m=>isNative(m)?'as charged'
  :DISP()===BASE()?`IBKR's figure in ${BASE()}`:`restated from ${BASE()}`;

/* Sign class for a value, plus `signed` so CSS can prefix the glyph -- see
   `.pos.signed` in the stylesheet for why the glyph rather than the hue is the
   thing that makes a gain legible. Zero and null stay unmarked: an unsigned
   zero is the truth, and "+0.00" reads as a gain that did not happen.
   Call sites that hardcode 'pos'/'neg' for emphasis rather than for arithmetic
   (Commissions, Losing Trades) do not come through here and so get no glyph. */
const cls=v=>v==null||Number(v)===0?'':Number(v)>0?'pos signed':'neg signed';
/* A strike is an identifier as much as a number: 267.5 and 268 are different
   contracts. `num(v,0)` rounded, so a half-strike rendered as a contract that
   does not exist -- latent on this account only because every strike it has
   ever held is whole. Whole strikes still render bare ("270", not "270.00"),
   because padding every strike to two places to accommodate the rare half is
   noise on the common case. */
const strike=v=>v==null?'':Number.isInteger(Number(v))?num(v,0)
  :num(v,String(v).split('.')[1].length>2?2:String(v).split('.')[1].length);
const pct=(v,d=1)=>v==null?'—':num(v,d)+'%';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthLabel=m=>{if(!m||m==='ALL')return 'All time';
  const[y,mm]=m.split('-');return MONTHS[+mm-1]+' '+y;};

/* ------------------------------------------------ tabs */
/* [id, label]. There used to be a third slot carrying a per-tab "disabled
   reason", rendered as `disabled title="..."`. It was null in every entry, and
   deliberately so: the one real reason it ever held was a hardcoded "No 0DTE
   trades in this account" that contradicted the data -- the same defect
   `odteSelectable` was written to fix. Gating a VIEW is not the same question as
   gating a FILTER, and only the filter bar can answer it, because only it is
   re-derived from the payload on every render. The slot, the `disabled?` branch
   it fed, HASH_TABS' filter over it and `.tab:disabled` all went together; a
   mechanism kept "in case" is a mechanism nobody has tested. */
const TABS=[
  ['dashboard','Dashboard'],
  ['calendar','Calendar'],
  ['trades','Trades'],
  ['positions','Positions'],
  ['costs','Costs'],
  ['annual','Annual'],
  ['odte','0DTE'],
  ['market','Market'],
  ['watchlist','Watchlist'],
];
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([id,label])=>
    `<button class="tab${S.tab===id?' on':''}" data-tab="${id}"
      >${esc(label)}</button>`).join('');
  document.querySelectorAll('.tab[data-tab]').forEach(b=>
    b.onclick=()=>{S.tab=b.dataset.tab;draw(true);});
}

/* ------------------------------------------------ display-currency toggle */
function renderCcy(){
  const el=$('#ccywrap'); if(!el)return;
  const base=BASE(), quotes=QUOTES();
  if(!base){el.innerHTML='';return;}
  const opts=[{code:base}].concat(quotes);
  const row=opts.map(qo=>{
    const on=qo.code===DISP();
    const tip=qo.per_base
      ? `Totals restated from ${base} at ${num(qo.per_base,4)} ${qo.code} per `
        +`${base} (${qo.source} ${qo.as_of}). Contract prices stay in their own currency.`
      : `${base} is the account base currency — IBKR's own conversions, unrestated.`;
    return `<button data-ccy="${esc(qo.code)}" class="${on?'on':''}"
      title="${esc(tip)}">${esc(sym(qo.code)||'')}${esc(qo.code)}</button>`;
  }).join('');
  const q=QUOTE();
  el.innerHTML=`<div class="ccytog">${row}</div>`+(q
    ? `<div class="ccynote">restated at ${esc(num(q.per_base,4))}
       ${esc(q.code)}/${esc(base)} · ${esc(q.as_of)}</div>`
    : '');
  el.querySelectorAll('button[data-ccy]').forEach(b=>
    b.onclick=()=>{S.ccy=b.dataset.ccy;draw();});
}

/* One sentence telling the reader which currency they are looking at, and
   whether it is IBKR's own figure or a restatement of it. */
function ccyNote(){
  const q=QUOTE(), base=BASE();
  return q
    ? `Totals restated from ${base} into ${q.code} at ${num(q.per_base,4)} `
      +`(${q.source} ${q.as_of}); IBKR's own figures are in ${base}.`
    : `Amounts in ${base}, the account base currency.`;
}

/* ------------------------------------------------ filter bar */
function filters(){
  const st=S.state, months=st.months||[], range=st.month_range||months;
  /* The dropdown walks the account's whole life (month_range), not just months
     with fills in scope. With one traded month the old list had one entry, so
     "selecting different months" was impossible and the control looked broken.
     Months without fills are offered but say so, and render as honest zeros. */
  const opts=[`<option value="">All time</option>`].concat(
    range.map(m=>{const has=months.includes(m);
      return `<option value="${m}"${m===S.month?' selected':''}>${monthLabel(m)}${
        has?'':' — no fills'}</option>`;}));
  return `<div class="filters">
    <div><div class="flabel">Select Month</div>
      <select id="month">${opts.join('')}</select></div>
    <div class="center"><div class="flabel">Trade Types</div>
      <div class="seg">
        <button data-type="" class="${S.type?'':'on'}"
          title="Every ${esc(S.state.asset_category)} trade in the journal."
          >Options</button>
        <button data-type="equities" class="${S.type==='equities'?'on':''}"
          ${equitiesSelectable()?'':'disabled'} title="${esc(equitiesNote())}"
          >Equities</button>
        <button data-type="odte" class="${S.type==='odte'?'on':''}"
          ${odteSelectable()?'':'disabled'} title="${esc(odteFilterNote())}">0DTE</button>
      </div></div>
    <div><div class="flabel">Select Account</div>
      <select disabled><option>${esc(accountLabel())}</option></select></div>
  </div>${scopeNote()}`;
}
function accountLabel(){
  const stm=(S.state.statements||[])[0];
  return stm? 'Single account' : 'No statements';
}
/* Derived, not asserted. This read "No 0DTE trades in this account" as a
   hardcoded string -- the same defect as the tab's own disabled reason, which
   claimed the same thing while the data said otherwise. */
function odteSelectable(){
  const od=S.state.odte;
  return !!(od&&od.selectable);
}
/* Equities is offerable exactly when the database holds stock fills --
   derived from the per-category counts, not asserted in markup. The old
   button was hardcoded disabled with a tooltip blaming the ingest filter,
   which stopped being true the day ingest started storing everything. */
function equitiesSelectable(){
  return !!((S.state.asset_counts||{}).STK);
}
function equitiesNote(){
  const n=(S.state.asset_counts||{}).STK;
  return n
    ? `Show the ${n} stock fill(s) instead of options. Stocks are a different `
      +`asset category, not a subset — Dashboard, Calendar and Trades switch to `
      +`STK; other tabs stay on options.`
    : 'No stock trades in the journal. If some exist in the archive, run '
      +'`optjournal ingest` to fold them in.';
}
/* Rendered by `filters()`, so it appears on exactly the tabs that carry the
   control -- Dashboard, Calendar and Trades. A filter that silently changes
   every number is the same failure as a total that silently spans a wider
   scope than its label, and fees genuinely do not narrow, so naming which
   figures moved is the honest version. Equities gets its own wording: it is
   a category switch, not a subset of the options journal. */
function scopeNote(){
  if(!S.type) return '';
  if(S.type==='equities')
    return `<div class="note"><b>Equities.</b> Dashboard, Calendar and Trades now
      show STK activity — a different asset category, not a subset of the options
      journal. Stock P&amp;L uses IBKR's per-fill realisation: each lot sold is
      realised when it is sold. Positions, Costs, Annual and 0DTE stay on
      options.</div>`;
  return `<div class="note"><b>${esc(S.state.trade_type_label)} only.</b> Fills,
    orders, P&amp;L, commission, win rate and the daily series are restricted to this
    subset. Months without fills in it render as zeros rather than disappearing.
    Positions, Costs and the Annual and 0DTE tabs are unaffected.</div>`;
}
function odteFilterNote(){
  const od=S.state.odte;
  return odteSelectable()
    ? `Restrict this view to the ${od.cohort.episodes} round trip(s) opened on `
      +`their own expiry date.`
    : 'Nothing in the archive was opened on its own expiry date.';
}

/* ------------------------------------------------ dashboard */
/* A stat card is a label and a figure. The note -- scope, basis, denominator --
   moves to a tooltip rather than sitting under every card: the same six words
   ("closed round trips") repeated across five cards is noise that crowds the
   figures without telling a reader anything new the fifth time.

   The note is a real ELEMENT, not a `title` attribute. A native tooltip needs
   one to two seconds of stationary hover, is trivially missed, and does not
   exist on a touch device -- so putting always-visible text behind one deletes
   it in practice, which is exactly what happened on the first attempt. A hidden
   element appears instantly, is styled, stays in the DOM for a screen reader,
   and is markup a test can assert on.

   `tabindex` because a tooltip reachable only by mouse is still hidden from
   anyone driving the page from the keyboard. The dotted underline on the label
   is what advertises that there is anything to reach at all. */
function statCard(k,v,note,klass){
  return `<div class="stat${note?' tipped':''}"${note?' tabindex="0"':''}>
    <div class="k${note?' hint':''}">${esc(k)}</div>
    <div class="v ${klass||''}">${v}</div>
    ${note?`<div class="tip">${esc(note)}</div>`:''}</div>`;
}
function dashboard(){
  const st=S.state, s=st.stats;
  const label=monthLabel(s.month);
  const opt=s.asset_category==='OPT';
  /* Options P&L counts fully closed round trips only, landing on the close
     date; premium on an open short is a liability, not profit. Stock P&L is
     IBKR's per-fill realisation. The note under the card says which rule the
     number obeys rather than letting two definitions share one label. */
  const pnlNote=opt?'closed round trips only, net of commission'
               :'realised per fill, net of commission';
  const nl=s.net_liq_base;
  /* For options, the headline trade count is CLOSED ROUND TRIPS -- the same
     population every other card on this row measures. Counting fills here
     made a month claim trades it had no outcome for: open the position in
     July, close it in August, and July's card said "3 trades" while its P&L,
     wins and losses all correctly said the outcome was August's. A trade
     counts in the month it closed, full stop. Fills stay visible in the
     sub-note as what they are -- activity, not trades. */
  const cards=[
    opt
      ? statCard('Trades', s.closed_episodes,
          `closed round trips · ${s.total_trades} fill(s), ${s.orders} order(s)`)
      : statCard('Total Trades', s.total_trades,
          s.orders?`${s.orders} order(s)`:''),
    statCard('Net P&L', moneyOf(s.net_pnl), pnlNote,
      cls(s.net_pnl.base)+' '+(String(moneyOf(s.net_pnl)).length>10?'sm':'')),
    /* Commission rides the same attribution as the P&L it is already inside:
       for options, the round trip's whole commission lands in its close month.
       Fill-date commission here showed the same euros twice -- July displayed
       the opening legs' cost, August's net P&L contained it again. Commission
       on still-open positions is a sub-note, like open premium: real cash,
       no outcome yet. */
    /* `Math.abs`, matching the Annual and Month tables. The same all-time
       figure read "−€26.25" here and "€26.25" there, so a reader checking one
       against the other had to know which sign convention each surface chose.
       Commission is a cost by definition and the label says so, so the
       magnitude is the honest form.
       Tinted red unconditionally, and that is the point: this card is coloured
       by KIND, not by sign. An earlier version dropped the tint along with the
       sign, reasoning that colouring by an invisible sign was noise -- but the
       result was one plain figure in a row of green ones, which reads as a
       number the page forgot to finish rather than as a deliberate neutral.
       A commission is never a gain, so there is no sign to consult. */
    statCard('Commissions', moneyOf(s.commissions),
      basisOf(s.commissions)
      +(opt?` · closed round trips${s.open_commission.base?` · ${
        moneyOf(s.open_commission)} on open positions`:''}`
         :' · stated by IBKR'),
      /* Same length rule as Net P&L above, not an unconditional `sm`. Fixed at
         19px this was the only card on the dashboard permanently smaller than
         its neighbours, which read as a different typeface rather than as a
         deliberate size -- and the tint made it obvious. */
      'neg '+(String(moneyOf(s.commissions)).length>10?'sm':'')),
    /* No account-level Fees card here by request: market-data and custody
       charges carry no asset category and are not options information. The
       Costs tab remains the place that itemises them. */
    statCard('Winning Trades', s.wins, 'closed round trips', s.wins?'pos':''),
    statCard('Losing Trades', s.losses, 'closed round trips', s.losses?'neg':''),
    statCard('Win Rate', pct(s.win_rate),
      s.closed_episodes?`${s.closed_episodes} decided`:'nothing closed yet'),
    statCard('Avg Win', moneyOf(s.avg_win), 'per closed round trip',
      cls(s.avg_win?.base)),
    /* An em-dash on a card whose figure is genuinely absent reads as "this
       failed to load". `none yet` says the same thing as data: there have been
       no losses, which on this card is a fact rather than a gap. Only when the
       population is EMPTY -- no loss has happened -- so a real average loss
       still renders as the number it is, and the `—` remains for the case the
       payload truly has nothing to say. */
    statCard('Avg Loss',
      s.losses===0&&s.closed_episodes>0?'<span class="nil">none yet</span>'
        :moneyOf(s.avg_loss),
      s.losses===0&&s.closed_episodes>0
        ?`${s.closed_episodes} closed, none at a loss`
        :'per closed round trip',
      cls(s.avg_loss?.base)),
    nl!=null
      ? statCard('Gain % of Net Liq', pct(s.gain_pct_of_net_liq,2),
          `NAV ${cash(nl)} · ${s.net_liq_date||''}`, cls(s.gain_pct_of_net_liq))
      : statCard('Gain % of Net Liq', '—',
          'enable Equity Summary on the Flex query', 'dim2'),
  ].join('');

  return `${filters()}
  <div class="card">
    <div class="crow"><div><h2>${esc(label)} Statistics<span class="info tipped"
      tabindex="0"><span class="tip">${opt?`Options P&amp;L counts fully closed
      round trips only, on the day they closed — an open or partially closed
      position contributes nothing until it is flat.`:`Stock P&amp;L is IBKR's
      per-fill realisation, net of commission.`}</span>i</span></h2>
      <div class="sub">${esc(s.asset_category)} trades and commission only —
      account-level fees and other instruments live on the Costs tab.
      ${esc(ccyNote())}</div></div>
      <div class="pills">
        ${S.type?`<span class="pill" title="Every trade-derived figure below is
          restricted to this subset.">filter <b>${esc(st.trade_type_label)}</b></span>`:''}
        <span class="pill" title="Open positions, with a multi-leg strategy
          counted once. ${s.open_episodes} open contract(s) across ${
          s.open_positions} position(s) — the Positions tab groups the same book
          the same way."
          >open <b>${s.open_positions}</b></span>
        ${opt&&s.open_premium.base?`<span class="pill" title="Net premium sitting in
          positions that are still open — collected on shorts, paid on longs. Not
          in Net P&L: premium is a liability until the position closes, and it
          lands there, in full, on the day it does."
          >open premium <b class="${cls(s.open_premium.base)}">${
          moneyOf(s.open_premium)}</b></span>`:''}
        <span class="pill" title="Commission on ${esc(s.asset_category)} trades${
          opt?', closed round trips only -- commission on open positions is on the Commissions card':''}.
          Commission carries an asset category, so this figure is genuinely
          scoped to this journal."
          >${esc(s.asset_category)} <b>${moneyOf(s.options_friction)}</b></span>
      </div></div>
    <div class="stats">${cards}</div>
    ${s.closed_episodes===0?`<div class="note">No round trip has fully closed yet,
      so Net P&L, Win Rate, Avg Win and Avg Loss have nothing to measure — they are
      empty rather than zero. ${s.open_premium.base?`The ${cash(s.open_premium.base)}
      net premium in the ${s.open_positions} open position(s) is not profit until
      they close.`:`The ${s.open_positions} open position(s) are under
      <b>Positions</b>.`}</div>`:''}
  </div>
  <div class="card">
    <div class="crow"><div><h2>${esc(label)} Performance</h2>
      <div class="sub">Cumulative realised P&L with daily fill count.</div></div>
      <div class="v mono big ${cls(s.net_pnl.base)}"
        >${moneyOf(s.net_pnl)}</div>
    </div>
    ${chart(s.days)}
  </div>`;
}

/* ------------------------------------------------ chart (inline SVG) */
function chart(days){
  if(!days||!days.length) return `<div class="empty">no fills in this period</div>`;
  /* PL leaves room for a tick label that now carries a currency symbol as well
     as digits; at 54px "€4,138" collided with the plot area. */
  const W=1000,H=230,PL=68,PR=14,PT=14,PB=26;
  let run=0; const pts=days.map(dy=>({x:dy.day,y:(run+=dy.realized.base),n:dy.trades}));
  const ys=pts.map(pt=>pt.y).concat([0]);
  let lo=Math.min(...ys), hi=Math.max(...ys);
  if(lo===hi){lo-=1;hi+=1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const sx=i=>PL+(pts.length===1?(W-PL-PR)/2:i*(W-PL-PR)/(pts.length-1));
  const sy=v=>PT+(hi-v)*(H-PT-PB)/(hi-lo);
  const line=pts.map((pt,i)=>`${i?'L':'M'}${sx(i).toFixed(1)},${sy(pt.y).toFixed(1)}`).join('');
  const area=pts.length>1
    ? `${line}L${sx(pts.length-1).toFixed(1)},${sy(0).toFixed(1)}L${sx(0).toFixed(1)},${sy(0).toFixed(1)}Z`
    : '';
  /* `cash`, not `num`: the tick VALUES are base-currency (they come from
     realized_base), so labelling them raw left the axis in EUR while the
     headline, the cards and every dot tooltip on the same chart restated to
     USD -- the axis was the one figure on the page that ignored the toggle,
     and it carried no symbol to admit which currency it meant. The plotted
     shape is unaffected either way: conv() is a uniform scale factor, so it
     cancels out of sy()'s normalisation. */
  const ticks=[hi,(hi+lo)/2,lo].map(v=>
    `<line class="grid" x1="${PL}" y1="${sy(v).toFixed(1)}" x2="${W-PR}" y2="${sy(v).toFixed(1)}"/>
     <text class="axis" x="${PL-7}" y="${(sy(v)+3).toFixed(1)}" text-anchor="end">${cash(v,0)}</text>`).join('');
  /* Zero is the one line on this chart that means something -- above it the
     account is up, below it down -- so when the series actually crosses, it
     stops being a grid line and becomes a labelled dashed rule. Drawn as a grid
     line at .14 opacity it was indistinguishable from the two decorative
     gridlines either side of it, which is how a drawdown came to look like
     ordinary variation. */
  const crosses=lo<0&&hi>0;
  const zero=crosses?`<line class="zero" x1="${PL}" y1="${sy(0).toFixed(1)}"
     x2="${W-PR}" y2="${sy(0).toFixed(1)}"/>
   <text class="zerolab" x="${W-PR}" y="${(sy(0)-6).toFixed(1)}"
     text-anchor="end">break even</text>`:'';
  /* A dot below break-even takes the loss colour too, so a single day's marker
     states which side of zero it sits on without the reader tracing it back to
     the axis. */
  const dots=pts.map((pt,i)=>`<circle cx="${sx(i).toFixed(1)}" cy="${sy(pt.y).toFixed(1)}" r="3.5"
     fill="${pt.y<0?'#f0899a':'#c98a5c'}" stroke="#0a0806" stroke-width="1.5"><title>${esc(pt.x)} — cum ${cash(pt.y)} (${pt.n} fill(s))</title></circle>`).join('');
  const labels=pts.map((pt,i)=>i===0||i===pts.length-1
    ? `<text class="axis" x="${sx(i).toFixed(1)}" y="${H-8}" text-anchor="${i?'end':'start'}">${esc(pt.x)}</text>`:'').join('');
  /* Sign is encoded in the FILL, and the trick is that the area path is not cut
     up to do it. The one path is painted twice, each time clipped to a
     half-plane split at the zero line: brass above, red below. So the geometry
     stays a single expression -- no hunting for zero crossings, no interpolated
     junction points, and a series that dives and recovers three times needs no
     extra code. `y2` on the gradients is the zero line rather than the viewBox
     edge, so each fade is measured from break-even instead of being cropped
     mid-ramp.

     Both halves collapse harmlessly when the series stays one side of zero: the
     clip rect gets zero height and paints nothing, which is why this needs no
     `crosses` branch of its own. */
  const z=sy(0).toFixed(1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="gpos" gradientUnits="userSpaceOnUse"
        x1="0" x2="0" y1="${PT}" y2="${z}">
        <stop offset="0%" stop-color="#c98a5c" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#c98a5c" stop-opacity="0"/></linearGradient>
      <linearGradient id="gneg" gradientUnits="userSpaceOnUse"
        x1="0" x2="0" y1="${z}" y2="${H-PB}">
        <stop offset="0%" stop-color="#f0899a" stop-opacity="0"/>
        <stop offset="100%" stop-color="#f0899a" stop-opacity=".26"/></linearGradient>
      <clipPath id="cabove"><rect x="0" y="0" width="${W}" height="${z}"/></clipPath>
      <clipPath id="cbelow"><rect x="0" y="${z}" width="${W}"
        height="${(H-Number(z)).toFixed(1)}"/></clipPath>
    </defs>
    ${ticks}${zero}
    ${area?`<path d="${area}" fill="url(#gpos)" clip-path="url(#cabove)"/>
      <path d="${area}" fill="url(#gneg)" clip-path="url(#cbelow)"/>`:''}
    <path d="${line}" fill="none" stroke="#e0a877" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cabove)"/>
    <path d="${line}" fill="none" stroke="#f0899a" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cbelow)"/>
    ${dots}${labels}</svg>`;
}

/* ------------------------------------------------ calendar */
function calendar(){
  const s=S.state.stats;
  const by={}; (s.days||[]).forEach(dy=>by[dy.day]=dy);
  /* Under "All time" the payload's days span the whole account, but a grid can
     only draw one month -- and this fell back to month_range[0], the newest
     month of the account's LIFE. On the demo journal, whose activity ends in
     February, that drew a blank August beside pills reading "Green days 7":
     every one of those days was unreachable from the view claiming them. The
     newest month that actually HAS a day is the one worth landing on. */
  const active=(s.days||[]).map(dy=>dy.day.slice(0,7)).sort();
  /* A calday names the month to show, and outranks the month the dropdown
     would otherwise pick. Without this a link to #calday=2026-07-24 rendered
     AUGUST's grid with a panel captioned "2026-07-24 — 1 fill" beneath it and
     no cell highlighted: detail for a day that was not on screen. The day is
     the more specific instruction, and it only reaches here having survived
     draw()'s guard -- which proves it is in `s.days`, so the month it names is
     inside the period and its grid cannot come back empty. */
  const month=S.calday?S.calday.slice(0,7)
    :s.month!=='ALL'?s.month
    :(active[active.length-1]||(S.state.month_range||S.state.months||[])[0]);
  if(!month) return `${filters()}<div class="card"><div class="empty">no months with trades</div></div>`;
  const [Y,M]=month.split('-').map(Number);
  const first=new Date(Y,M-1,1), lead=first.getDay(), len=new Date(Y,M,0).getDate();
  /* Derived from the days actually ON the grid, not from the payload's
     period-wide totals. Those describe the whole selected period, so under
     "All time" a one-month grid sat next to an account-lifetime P&L and green
     and red day counts it could not account for. Deriving locally keeps this
     tab's own invariant -- its numbers move only with a control it displays --
     and for a specific month it reproduces s.green_days/s.red_days exactly,
     because the grid then holds every day the period has. */
  const shown=(s.days||[]).filter(dy=>dy.day.slice(0,7)===month);
  let total=0; shown.forEach(dy=>total+=dy.realized.base);
  const greenDays=shown.filter(dy=>dy.realized.base>0).length;
  const redDays=shown.filter(dy=>dy.realized.base<0).length;

  const cells=[];
  for(let i=0;i<lead;i++) cells.push(`<div class="day void"></div>`);
  for(let d=1;d<=len;d++){
    const key=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dy=by[key];
    const k=!dy?'':dy.realized.base>0?'g':dy.realized.base<0?'r':'';
    /* A day with fills is a drill-down target: clicking it lists that day's
       trades below the calendar. Only days with activity get the handler --
       an empty day has nothing to show, and making it clickable would
       promise detail that does not exist. */
    const sel=S.calday===key?' selected':'';
    cells.push(`<div class="day ${k}${dy?' clk':''}${sel}"${dy?` data-calday="${key}"`:''}>
      <div class="top"><span class="dnum">${d}</span>
        <span class="dct">${dy?dy.trades+(dy.trades===1?' fill':' fills'):''}</span></div>
      <div class="dpl ${dy&&!k?'dim':''}">${dy?(k?moneyOf(dy.realized):'—'):'<span class="dim2">—</span>'}</div>
    </div>`);
  }
  /* Prev/next walk month_range -- the account's life -- not the fills-only
     list. They mutate S.month through the same load() path as the dropdown, so
     the two controls cannot disagree. At either end the chevron disables. */
  const range=S.state.month_range||S.state.months||[];
  const idx=range.indexOf(month);
  const prev=idx>=0&&idx<range.length-1?range[idx+1]:null; /* newest-first */
  const next=idx>0?range[idx-1]:null;
  const nav=`<span class="calnav">
    <button data-calmonth="${prev||''}" ${prev?'':'disabled'} title="${prev?monthLabel(prev):'account start'}">‹</button>
    <button data-calmonth="${next||''}" ${next?'':'disabled'} title="${next?monthLabel(next):'current month'}">›</button></span>`;
  return `${filters()}
  <div class="card">
    <div class="crow"><div><h2>${esc(monthLabel(month))} ${nav}</h2>
      <div class="sub">Daily realised P&L. An options outcome lands, whole, on the
      day the round trip closed — so a day with only opening or partial-close
      fills shows the activity and a dash, not money.</div></div>
      <div class="pills">
        <span class="pill">Month P/L <b class="${cls(total)}">${cash(total)}</b></span>
        <span class="pill">Green days <b>${greenDays}</b></span>
        <span class="pill">Red days <b>${redDays}</b></span>
      </div></div>
    ${s.month==='ALL'&&active.length?`<div class="note">Showing <b>${esc(monthLabel(month))}</b>,
      the most recent month with activity. The pills describe this month; the
      account-wide figures are on <b>Dashboard</b> and <b>Annual</b>. Use the
      chevrons or the month selector to walk the rest.</div>`:''}
    <div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
      .map(d=>`<div class="dow">${d}</div>`).join('')}</div>
    <div class="cal mt-1">${cells.join('')}</div>
    ${dayDetail(by)}
  </div>`;
}

function dayDetail(by){
  /* The clicked day's trades, from the leg data already in the payload --
     no extra request. Legs are matched by their own fill date, so this shows
     the day's ACTIVITY; the day cell's money remains close-attributed P&L,
     and the two can legitimately differ (an opening day shows fills and a
     dash). The panel says which day it describes rather than leaving the
     reader to infer it from the highlight. */
  const key=S.calday;
  if(!key) return `<div class="note">Click a day with fills to see its trades.</div>`;
  if(!by[key]){S.calday=null;return '';} /* heal: selection from another month */
  const groups=S.state.strategies||[];
  const rows=[];
  groups.forEach(g=>(g.orders||[]).forEach(o=>(o.legs||[]).forEach(l=>{
    if(String(l.first_fill_at||'').slice(0,10)===key)
      rows.push({g,o,l});
  })));
  if(!rows.length) return `<div class="note">No leg detail for ${esc(key)} —
    fills exist but their orders are outside the current filter.</div>`;
  return `<div class="grp mt-3">
    <div class="gh"><span class="gl">${esc(key)} — ${rows.length} fill(s)</span>
      <button class="linkish" data-calday-clear="1">clear</button></div>
    ${rows.map(({g,l})=>legRow(l,
      `<span class="dim lbl-sm">${esc(g.label)}</span>`)).join('')}
  </div>`;
}

/* ------------------------------------------------ trades / strategy */
function actClass(a){const s=String(a||'').toUpperCase();
  return s==='BUY'?'buy':s==='SELL'?'sell':'';}
function actLabel(l){
  const bs=String(l.buy_sell||'').toUpperCase(), oc=String(l.open_close||'').toUpperCase();
  if(bs==='SELL') return oc==='O'?'STO':'STC';
  if(bs==='BUY')  return oc==='O'?'BTO':'BTC';
  return oc||'—';
}
function legRow(l,extra=''){
  /* One fill line, shared by the Trades cards and the calendar drill-down --
     the same leg must read identically wherever it appears, and this line
     had already been copied once. `extra` is the one real divergence: the
     drill-down wedges the strategy label between contract and quantity,
     because there the leg appears outside its strategy card; the Trades
     card, already under its strategy header, passes nothing. */
  return `<div class="leg${extra?' ctx':''}">
    <span class="act ${actClass(l.buy_sell)}">${esc(actLabel(l))}</span>
    <span class="mono">${esc(l.underlying_symbol||l.symbol||'')}
      <b>${strike(l.strike)}${esc(l.put_call||'')}</b>
      <span class="dim">${esc(l.expiry||'')}</span></span>
    ${extra}
    <span class="mono dim">×${Math.abs(l.quantity)}</span>
    <span class="mono" title="fill price, always in the contract's own currency"
      >${money(l.avg_price,l.currency)}</span>
    <span class="mono ${cls(l.money.proceeds.base)}">${moneyOf(l.money.proceeds)}</span>
  </div>`;
}
/* ------------------------------------------------ replay */
/* Bars are stored epoch UTC and read in EXCHANGE time, not the reader's. The
   x axis of a trading chart has to agree with the session: a 09:30 ET open
   rendered in Irish local time reads 14:30, and every "what happened at the
   open" question then needs mental arithmetic. Every contract in this journal
   is US-listed, so one zone covers it; a non-US underlying would need its own
   exchange zone rather than this constant. */
const MKT='America/New_York';
const rstamp=(ts,size)=>new Date(ts*1000).toLocaleString(undefined,
  size==='1h'?{timeZone:MKT,month:'short',day:'numeric',hour:'numeric'}
             :{timeZone:MKT,year:'2-digit',month:'short',day:'numeric'});
/* The bar's calendar day at the exchange, for finding session boundaries.
   'en-CA' because it yields YYYY-MM-DD, so string equality is date equality. */
const etday=ts=>new Date(ts*1000).toLocaleDateString('en-CA',{timeZone:MKT});

/* Geometry of the panel currently on screen, so the scrubber can move a clip
   rect and a crosshair without re-rendering the page. Only ONE panel is ever
   open (S.replay is a single key), so fixed element ids are unambiguous.
   Everything else on this page redraws wholesale on interaction, which is right
   for a click and wrong for a continuous drag. */
let RGEO=null, RTIMER=null;
/* The events a replay can place on the timeline: those carrying a real epoch.
   ONE filter, because two readers must agree about the set -- the geometry
   decides which cards `replaySeek` reveals, and the renderer decides which cards
   exist to be revealed. Spelled twice, a card could exist and never be reached,
   or be reached and not exist. `Number.isFinite` rather than the bare global:
   `isFinite("")` is true, so a blank stamp used to pass as a timestamp. */
const timedEvents=rp=>(rp.events||[]).filter(e=>e&&Number.isFinite(e.ts));

/* Wall-clock a whole replay takes at 1x, whatever its length -- the constant the
   speed control is a multiplier OF. What a reader asks for is "watch this trade",
   so the duration is the thing to fix and the bars-per-second is what follows;
   see barsPerMs. 20s is long enough to follow a 24-bar strangle bar by bar and
   short enough that 10x (2s) is still a glance rather than a jump. */
const REPLAY_SECONDS=20;

/* cancelAnimationFrame, since playback is a rAF loop rather than an interval --
   it used to step one whole bar per setInterval tick, which is what made the
   marker jump between data points. RTIMER is nulled BEFORE the cancel so a frame
   already queued sees the null and returns instead of scheduling another. */
function replayStop(){ if(RTIMER!==null){const h=RTIMER;RTIMER=null;cancelAnimationFrame(h);} }

function replayChart(rp){
  const pts=(rp.points||[]).filter(p=>p&&isFinite(p[1]));
  if(pts.length<MIN_POINTS) return `<div class="empty">no price bars stored for ${
    esc(rp.underlying||'this underlying')} yet — run <code>optjournal bars</code></div>`;
  const sks=(rp.strikes||[]).filter(sk=>sk&&isFinite(sk.strike));
  const W=920,H=280,L=52,R=46,T=22,B=30, iw=W-L-R, ih=H-T-B;
  const mks=rp.marks||[];
  /* Every scale below comes from /static/replay.js, which node unit-tests. The
     page keeps only the markup: a wrong <text> shows up in the sweep's rendered
     DOM, whereas a wrong scale renders perfectly and is simply untrue. */
  const geo=plotGeometry(pts,sks,rp.band||[],{left:L,top:T,width:iw,height:ih});
  const dp=geo.span>40?0:2;
  const yticks=[0,0.25,0.5,0.75,1].map(f=>geo.lo+f*geo.span).map(v=>
    `<line class="gr" x1="${L}" y1="${geo.yOf(v).toFixed(1)}" x2="${L+iw}" y2="${
      geo.yOf(v).toFixed(1)}"/><text class="tk" x="${L-7}" y="${
      (geo.yOf(v)+3.5).toFixed(1)}" text-anchor="end">${num(v,dp)}</text>`).join('');
  /* Ticks land on real bars, not on an even split of the span: an interpolated
     label can name a timestamp that has no bar -- a weekend midnight. */
  const xticks=[0,0.5,1].map(f=>Math.round(f*(pts.length-1))).map((ix,i)=>
    `<text class="tk" x="${geo.xs[ix].toFixed(1)}" y="${H-10}" text-anchor="${
      i===0?'start':i===2?'end':'middle'}">${esc(rstamp(pts[ix][0],rp.bar_size))}</text>`
  ).join('');
  /* Only for hourly: on a daily series every bar IS a session, so a rule per
     bar would be a picket fence rather than information. */
  const breaks=rp.bar_size!=='1h'?'':sessionBreaks(pts,etday).map(i=>{
    const x=((geo.xs[i-1]+geo.xs[i])/2).toFixed(1);
    return `<line class="sess" x1="${x}" y1="${T}" x2="${x}" y2="${T+ih}"/>`;
  }).join('');
  const line=pts.map((p,i)=>`${geo.xs[i].toFixed(1)},${geo.yOf(p[1]).toFixed(1)}`).join(' ');
  /* SEGMENTS, not full-width rules: a strike drawn edge to edge claims to have
     existed for the whole chart, including the context before entry and every
     bar after a roll moved it elsewhere. Coloured by right and dashed by side,
     so put/call and short/long are two independent readings of one line -- the
     encoding the reference implementation uses, which is why it needs no label
     per line beyond the strike itself. */
  const strikes=sks.map(sk=>{
    const y=geo.yOf(sk.strike), sp=strikeSpan(sk,geo,{left:L,width:iw});
    const kind=String(sk.put_call||'').toUpperCase()==='C'?'call':'put';
    return `<line class="sk ${kind}${sk.side==='long'?' long':''}" x1="${
      sp.x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${sp.x2.toFixed(1)}" y2="${
      y.toFixed(1)}"/><text class="sklab ${kind}" x="${(sp.x1+4).toFixed(1)}" y="${
      (y-5).toFixed(1)}">${strike(sk.strike)}${esc(sk.put_call||'')}</text>`;
  }).join('');
  /* Effective delta on its OWN axis, because it is not a price: the sum of signed
     quantity times delta, so a delta-neutral strangle sits on the centre line and
     a short put rides above it. Dotted to stay subordinate -- a derived
     sensitivity, not something that traded. */
  const dd=deltaDomain(mks);
  const y2=v=>T+ih/2-(v/dd.reach)*(ih/2);
  /* One polyline PER HOLDING PERIOD, not one across the whole series. Delta is
     null on any bar holding nothing, and a single line over those would glide
     from the last real delta to the first one after the gap -- drawing exposure
     across a stretch that had none. The split is deltaSegments', in the tested
     module. A one-bar holding gets a dot, because a polyline of one point draws
     nothing and a position held for a single bar is not nothing. */
  const dsegs=!dd?[]:deltaSegments(mks,geo,y2);
  const dline=dsegs.map(seg=>seg.length<2
    ?`<circle class="ddot" cx="${seg[0][0].toFixed(1)}" cy="${
      seg[0][1].toFixed(1)}" r="1.6"/>`
    :`<polyline class="dline" points="${
      seg.map(q=>`${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' ')}"/>`).join('');
  const dax=!dd?'':[dd.reach,0,-dd.reach].map(v=>
    `<text class="tk dax" x="${L+iw+6}" y="${(y2(v)+3.5).toFixed(1)}">${
      num(v,2)}</text>`).join('')
    +`<line class="zero" x1="${L}" y1="${y2(0).toFixed(1)}" x2="${L+iw}" y2="${
      y2(0).toFixed(1)}"/>`;
  /* Expected move, one standard deviation to the position's expiry, from the
     implied vol backed out of the option's OWN closes. Spot and time-to-expiry
     are per bar so the envelope moves and tapers hourly; the vol input steps
     daily, because the source serves no intraday option history at all. */
  const edges=bandEdges(rp.band||[],geo);
  const fmt=xy=>xy.map(q=>`${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' ');
  const band=!edges.upper.length?'':
    `<polygon class="emband" points="${fmt(edges.upper.concat(
      edges.lower.slice().reverse()))}"/>`
    +`<polyline class="emedge" points="${fmt(edges.upper)}"/>`
    +`<polyline class="emedge" points="${fmt(edges.lower)}"/>`;
  /* Entry and exit as labelled rules rather than a shaded span: the band is
     already a filled region, and a second translucent fill over it went muddy
     without telling the reader anything the two rules do not. */
  const edge=(m,cls,label)=>!m?'':`<line class="${cls}" x1="${m.x.toFixed(1)}" y1="${
    T}" x2="${m.x.toFixed(1)}" y2="${T+ih}"/><text class="edgelab" x="${
    (m.x+4).toFixed(1)}" y="${T+11}">${label}</text>`;
  const dots=(rp.fills||[]).map(ts=>geo.at(ts)).filter(Boolean).map(m=>
    `<circle class="fill" cx="${m.x.toFixed(1)}" cy="${m.y.toFixed(1)}" r="3.2"/>`).join('');
  RGEO={points:pts,marks:rp.band?rp.marks||[]:[],xs:geo.xs,size:rp.bar_size,dp:dp,
    events:timedEvents(rp)};
  const opening=frameAt(RGEO,pts.length-1);
  /* The legend states the encoding rather than making the reader infer it: a
     dashed line means two different things on this chart (a long strike, and the
     expected-move edge), and hue means put or call rather than profit or loss.
     Rendered only for what is actually drawn -- a legend entry for an absent
     series is a promise the picture does not keep. */
  const key=[
    sks.some(sk=>String(sk.put_call).toUpperCase()==='P')
      ?'<span class="lg put">—</span> put strike':'',
