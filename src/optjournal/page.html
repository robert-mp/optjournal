        <td class="n mono">${fxr.auto.notional_base?cash(fxr.auto.notional_base):'—'}</td>
        <td class="n mono ${fxr.auto.markup_base?'dim':''}">${
          fxr.auto.markup_base?'≈'+cash(fxr.auto.markup_base):'—'}</td></tr>`).join('')}
    </tbody></table>
    ${A.notional_base?`<div class="note">The markup column is an ESTIMATE: IBKR
      reports no commission on an auto-conversion because the cost is in the rate
      it gave you. ${A.bps} bps is the published figure and this account's own year
      of conversions implied ${A.measured_bps}, so the true total sits near ${
      cash(A.notional_base*A.bps/10000)}–${
      cash(A.notional_base*A.measured_bps/10000)}.</div>`
      :`<div class="note">No conversion carries the AutoFX flag, so no rate markup
        is estimated; the commission shown is what IBKR reported.</div>`}
  </div>`;
}

/** Fees and withholding: real money, attributable to nothing. Always shown,
 * because a total that hid them under a narrow scope would be measuring less
 * than the tab claims -- and set apart, because they are a different KIND of
 * figure rather than a warning about the ones above. */
function costAside(bc){
  const fees=bc.fees||[], wh=(bc.withholding||[]).filter(whr=>whr.withheld.base);
  if(!fees.length&&!wh.length) return '';
  const U=bc.totals.unattributable;
  return `<div class="aside">
    <h2>Account-level — attributable to nothing</h2>
    <div class="sub">Levied on the account, not on a trade: no fee row carries a
      contract or trade id, so these cannot be split across instruments and do
      not narrow with the selection above.</div>
    ${fees.length?`<table><thead><tr><th>fee</th><th class="n">n</th>
      <th class="n">total</th><th>example</th></tr></thead><tbody>
      ${fees.map(fee=>`<tr><td>${esc(fee.name)}</td>
        <td class="n mono">${fee.count}</td>
        <td class="n mono">${chargeFig(fee.total)}</td>
        <td class="dim2">${esc((fee.examples||[])[0]||'')}</td></tr>`).join('')}
    </tbody></table>
    ${ledger(U)}`:''}
    ${wh.length?`<h2 class="mt-2">Dividend withholding</h2>
    <div class="sub">Not a broker charge — the broker forwards it — but a
      recurring loss, and the effective rate is how a non-treaty rate shows up.</div>
    <table><thead><tr><th>symbol</th><th>ccy</th><th class="n">gross</th>
      <th class="n">withheld</th><th class="n">effective</th></tr></thead><tbody>
      ${wh.map(whr=>`<tr><td class="mono">${esc(whr.symbol||'—')}</td>
        <td class="mono">${esc(whr.currency||'')}</td>
        <td class="n mono">${whr.gross.base?chargeFig(whr.gross):'—'}</td>
        <td class="n mono">${chargeFig(whr.withheld)}</td>
        <td class="n mono">${whr.effective_rate==null
          ?`<span class="nil tipped" tabindex="0">n/a<span class="tip">No matching
            dividend, so there is no gross to take a percentage of — withholding
            on credit interest arrives without one.</span></span>`
          :pct(whr.effective_rate)}</td></tr>`).join('')}
    </tbody></table>`:''}
  </div>`;
}

/* ------------------------------------------------ annual */
/* The Annual and Month tables print the same stats payload, and used to spell
   the row and the header out twice each -- ten to twelve <td>s in the same order,
   diverging only in the first cell and in whether the avg-win/avg-loss pair is
   shown. Two copies of a column ORDER is the dangerous kind: swap two <th>s in
   one table and every figure below them still renders, just under the wrong
   heading, which no test and no glance catches.

   `wide` adds the avg pair to both the header and the row together, which is
   what makes them impossible to disagree about.

   `closed` and `decided` are both here, side by side, because they are two
   units and the reader has to be able to reconcile them: `closed` counts
   contract round trips (what net P&L is attributed by), `decided` counts
   positions (what W, L and win rate are). `closed` is never below `decided`,
   and a row where they differ is a row where a roll was in flight. */
const statsHead=(first,wide)=>`<tr><th>${first}</th><th class="n">fills</th>
  <th class="n">orders</th><th class="n">closed</th><th class="n">decided</th>
  <th class="n">W</th>
  <th class="n">L</th><th class="n">win rate</th><th class="n">net P&amp;L</th>
  ${wide?`<th class="n">avg win</th><th class="n">avg loss</th>`:''}
  <th class="n">commission</th><th class="n">green/red</th></tr>`;

function statsRow(s,{label,wide=false,klass=''}={}){ return `<tr${klass?` class="${klass}"`:''}>
  <td class="mono">${esc(label)}</td>
  <td class="n mono">${s.total_trades}</td>
  <td class="n mono">${s.orders}</td>
  <td class="n mono">${s.closed_episodes}</td>
  <td class="n mono">${s.decided_campaigns}</td>
  <td class="n mono pos">${s.wins}</td>
  <td class="n mono neg">${s.losses}</td>
  <td class="n mono">${pct(s.win_rate)}</td>
  <td class="n mono ${cls(s.net_pnl.base)}">${moneyOf(s.net_pnl)}</td>
  ${wide?`<td class="n mono">${s.avg_win==null?'—':moneyOf(s.avg_win)}</td>
  <td class="n mono">${s.avg_loss==null?'—':moneyOf(s.avg_loss)}</td>`:''}
  <td class="n mono">${moneyOf(s.commissions)}</td>
  <td class="n mono"><span class="pos">${s.green_days}</span>/<span
    class="neg">${s.red_days}</span></td></tr>`; }

function annual(){
  const yrs=S.state.annual||[], tot=S.state.annual_total||{};
  if(!yrs.length) return `<div class="card"><div class="empty">no trades to summarise</div></div>`;
  /* Every row is a stats payload of the same shape the Dashboard reads, built
     by the same summations over a year-wide period rather than a parallel
     aggregation. The total row is `annual_total`, computed independently of the
     years -- so if they ever stop accounting for everything the discrepancy is
     on screen. Not `all_time`: that one follows the Trade Types filter, which
     this tab does not show, and using it made the total shrink below the sum
     of its own rows whenever the filter was on. */
  let best=yrs[0];
  yrs.forEach(s=>{if(s.net_pnl.base>best.net_pnl.base)best=s;});
  /* The footnote's `decided` sentence names the unit the rows were counted in.
     It asserted POSITIONS unconditionally, which under the per-contract reading
     claimed the grouping the reader had just switched off -- the one mislabel
     this toggle must not commit, and worst here, where the two counts sit in
     adjacent columns and the note is what reconciles them. */
  const row=(s,klass)=>statsRow(s,{
    label:s.month==='ALL'?'all time':s.month, wide:true, klass:klass||''});
  return `<div class="card">
    <div class="crow"><div><h2>Year by year</h2>
      <div class="sub">${esc(ccyNote())} A round trip counts in the year it
      <b>closed</b>, the same rule the month selector uses — so a position opened in
      December and closed in January is a January outcome.</div></div>
      <div class="pills">
        <span class="pill">years <b>${yrs.length}</b></span>
        ${yrs.length>1?`<span class="pill">best <b>${esc(best.month)}</b>
          <b class="${cls(best.net_pnl.base)}">${moneyOf(best.net_pnl)}</b></span>`:''}
      </div></div>
    <table><thead>${statsHead('year',true)}</thead><tbody>
      ${yrs.map(s=>row(s)).join('')}
      ${row(tot,'grp')}
    </tbody></table>
    <div class="note">Three units, narrowing left to right. <b>fills</b> counts
      executions: an order filled in two parts is two fills but one outcome.
      <b>closed</b> counts contract round trips, and is what <b>net P&amp;L</b> is
      attributed by. ${SCORING()===SCORINGS[1]
        ? `<b>decided</b> counts the same round trips, each scored on its own:
           every leg of a spread and every leg of a roll is its own W or L, which
           is what a broker trade log shows. The two columns agree by
           construction — switch to <b>Per position</b> to group a rolled or
           multi-leg position into one outcome.`
        : `<b>decided</b> counts POSITIONS, and is what W, L and win
           rate measure — a roll closes one contract and opens the next, so one
           continuing decision would otherwise be scored twice. <b>closed</b> is
           never below <b>decided</b>, and a row where they differ is a row where a
           roll was in flight or finished in another period.`} A year that traded
      without deciding anything shows no rate rather than 0%.</div>
    ${monthlyTable()}
  </div>`;
}

function monthlyTable(){
  /* The same rows the month selector produces one at a time -- one call, one
     period string -- so a reader who picks March on the Dashboard sees the
     figures printed here. Deliberately does not repeat the year totals: they
     are in the table directly above, which is what makes the month rows
     checkable against them. */
  const mons=S.state.monthly||[];
  if(mons.length<2) return '';
  let year=null; const out=[];
  mons.forEach(s=>{
    const y=String(s.month).slice(0,4);
    if(y!==year){year=y;
      out.push(`<tr class="grp"><td class="mono dim" colspan="10">${esc(y)}</td></tr>`);}
    out.push(statsRow(s,{label:monthLabel(s.month)}));
  });
  return `<h2 class="sub2 mt-6">Month by month</h2>
    <div class="note">Grouped under the year each month belongs to, so the rows
      above them can be checked by adding these up. A month with fills but nothing
      closed shows no win rate rather than 0%.</div>
    <table><thead>${statsHead('month',false)}</thead>
      <tbody>${out.join('')}</tbody></table>`;
}

/* ------------------------------------------------ 0DTE */
/* Market Awareness: the week ahead, and what lands on each day.
 *
 * Read-only. The page never fetches the calendar -- `optjournal market --fetch`
 * does, from the nightly cron, because the feed rate limits (429 with a
 * retry-after) and a tab reload is not a reason to spend a request against it.
 *
 * Every timestamp arrives ALREADY RENDERED in the payload's zone (`mk.zone`), so
 * this function parses no dates and knows nothing about timezones. Deriving the
 * week here would put a second calendar in a second language; serialize owns it.
 */
function market(){
  const mk=S.state.market;
  if(!mk) return `<div class="card"><div class="empty">no calendar data</div></div>`;

  /* THE FILTER, on two independent axes. 82 of a real week's 99 events are Low
     impact and 25 are EUR rows that are all Low, so showing everything buries the
     releases an options book reacts to -- but a single "key or all" toggle could
     not express "USD, every impact", which is the question a USD book actually
     asks. Currency and impact are filtered separately.

     The VOCABULARY and the defaults are the server's (`mk.countries`,
     `mk.impacts`, each row carrying `default`), so the page holds no copy of
     which currencies exist or which ones matter -- both would drift from the feed
     the moment either side changed. `seed()` takes those defaults on first draw
     and respects an empty Set thereafter; see `S.mkcountries`. */
  const seed=(chosen,facets)=>chosen instanceof Set?chosen
    :new Set((facets||[]).filter(mf=>mf.default).map(mf=>mf.value));
  const countries=seed(S.mkcountries,mk.countries);
  const impacts=seed(S.mkimpacts,mk.impacts);
  /* An axis with nothing selected filters nothing OUT, rather than emptying the
     calendar: "no currency chosen" reads as a question not yet asked, and a blank
     panel with every button dark looks broken. Same convention as
     `events.upcoming`, where an empty filter tuple means no filter. */
  const passes=mev=>(countries.size===0||countries.has(mev.country))
    &&(impacts.size===0||impacts.has(mev.impact));
  const evs=(mk.events||[]).filter(passes);
  /* Counted from the FILTERED events rather than from a per-filter total the
     server precomputed. There are 2^n filter combinations and the page already
     holds every row, so counting here is both cheaper and the only way the strip
     cannot disagree with the rows a day opens. */
  const shownByDay=new Map();
  evs.forEach(mev=>shownByDay.set(mev.day,(shownByDay.get(mev.day)||0)+1));
  const countOf=d=>shownByDay.get(d.day)||0;
  /* Whether this is still the server's default view, so the reset control can be
     disabled rather than offered as a no-op. Compared by value: same size, same
     members, on both axes. */
  const isDefault=(chosen,facets)=>{
    const want=(facets||[]).filter(mf=>mf.default).map(mf=>mf.value);
    return chosen.size===want.length&&want.every(v=>chosen.has(v));
  };
  const atDefault=isDefault(countries,mk.countries)&&isDefault(impacts,mk.impacts);

  /* Which day is expanded, chosen from the days that have events UNDER THE
     CURRENT FILTER -- otherwise switching to Key could leave a day selected that
     is now empty, which reads as the calendar being broken rather than filtered.

     FORWARD FIRST, then back. Today when it qualifies, else the next qualifying
     day, and only then the most recent past one. A calendar is consulted to learn
     what is COMING, so the earliest cell of the week is the worst default: seen
     in the browser on a Saturday, the Key view opened Monday the 3rd -- five days
     gone -- purely because it was first in the array. Falling back to the LATEST
     past day rather than the earliest also means a week whose events have all
     happened opens on the most recent one. */
  const withEvents=(mk.week||[]).filter(d=>countOf(d)>0).map(d=>d.day);
  const ahead=withEvents.filter(d=>d>=mk.today);
  const behind=withEvents.filter(d=>d<mk.today);
  const sel=S.marketday&&withEvents.includes(S.marketday)?S.marketday
    :(ahead[0]||behind[behind.length-1]||null);

  const cells=(mk.week||[]).map(d=>{
    /* The dot row is a preview, capped at three: a 20-event day would otherwise
       make one cell taller than the rest and break the strip's grid. */
    const mine=evs.filter(mev=>mev.day===d.day);
    const shown=mine.slice(0,3);
    const dots=shown.map(mev=>
      `<div class="mkdot"><span class="mkimp ${
        mev.impact==='High'?'hi':mev.impact==='Medium'?'md':'lo'}"></span>${
        esc(mev.title.length>22?mev.title.slice(0,21)+'…':mev.title)}</div>`).join('');
    const more=mine.length>shown.length?
      `<div class="mkdot dim">+${mine.length-shown.length} more</div>`:'';
    const quiet=mine.length?'':`<div class="mkdot dim">—</div>`;
    return `<div class="day${d.day===sel?' selected':''}${
      d.today?' mktoday':''}" data-marketday="${d.day}" role="button" tabindex="0">
      <div class="top"><span class="dim">${esc(d.label)}</span><b>${d.dom}</b></div>
      <div class="mkdots">${dots}${more}${quiet}</div></div>`;
  }).join('');

  const chosen=evs.filter(mev=>mev.day===sel);
  const rows=chosen.map(mev=>{
    /* forecast and previous are null when unpublished, which is NOT zero -- a
       holiday has no forecast and a release forecast of 0 would be a number. */
    const figs=[['fc',mev.forecast],['prev',mev.previous]]
      .filter(([,v])=>v!=null&&v!=='')
      .map(([k,v])=>`${k} <b>${esc(v)}</b>`).join(' · ');
    return `<div class="mkrow">
      <div class="mkrow-h">
        <span class="mkimp ${mev.impact==='High'?'hi':mev.impact==='Medium'?'md':'lo'}"
          ></span><b>${esc(mev.title)}</b>
        <span class="pill">${esc(mev.country)}</span>
        <span class="dim">${esc(mev.at)}</span>
      </div>${figs?`<div class="dim mkfig">${figs}</div>`:''}</div>`;
  }).join('');

  /* How many rows the filter is holding back, so the reader knows the calendar is
     narrowed rather than quiet. */
  const hidden=(mk.total_events||0)-evs.length;

  /* One row of chips per axis. Each states its own count, so choosing is not a
     guess -- and each is `aria-pressed`, because a chip that only signals
     selection by colour says nothing to a screen reader. */
  const chips=(facets,axis,picked)=>(facets||[]).map(mf=>{
    const on=picked.has(mf.value);
    return `<button class="chip${on?' on':''}" data-mkaxis="${axis}"
      data-mkvalue="${esc(mf.value)}" aria-pressed="${on?'true':'false'}"
      >${esc(mf.value)} <span class="dim">${mf.events}</span></button>`;
  }).join('');

  const filters=`<div class="mkfilter">
    <div class="mkaxis"><span class="dim mkaxlabel">currency</span>
      <div class="chips">${chips(mk.countries,'country',countries)}</div></div>
    <div class="mkaxis"><span class="dim mkaxlabel">impact</span>
      <div class="chips">${chips(mk.impacts,'impact',impacts)}</div></div>
    <div class="mkaxis"><span class="dim mkaxlabel">show</span>
      <div class="mkbtns">
        <button class="btn sm" data-mkreset="1" ${atDefault?'disabled':''}
          >Default (${mk.default_events||0})</button>
        <button class="btn sm" data-mkall="1" ${hidden===0?'disabled':''}
          >All ${mk.total_events||0}</button>
      </div></div></div>`;

  /* Three distinguishable empty states, not one, because they need different
     actions: nothing stored needs a FETCH, nothing matching the filter needs a
     WIDER filter, and a quiet day under a filter that does match elsewhere needs
     nothing at all. Conflating any two is how a working calendar reads as
     broken -- which is what the old single message did. */
  const empty=(mk.total_events||0)===0
    ? `<div class="empty">no events stored for this week —
        <b>Refresh</b> above, or run <code>optjournal market --fetch</code></div>`
    : evs.length===0
    ? `<div class="empty">no events match this filter.
        ${hidden} of ${mk.total_events||0} stored event(s) are hidden — widen a row
        above, or press <b>All ${mk.total_events||0}</b>.</div>`
    : `<div class="empty">no events on this day under the current filter.</div>`;

  return `<div class="card">
    <div class="crow"><h3>Economic Calendar</h3>
      <span class="pill">${esc(mk.from_day)} – ${esc(mk.to_day)}</span>
      <button id="mkfetch" class="btn sm">Refresh</button></div>
    ${filters}
    <div class="cal">${cells}</div>
    ${sel?`<div class="crow mksel"><h3>${esc(sel)}</h3>
      <span class="dim">${chosen.length} event(s)${
        hidden?` · ${hidden} hidden by the filter`:''}</span></div>${rows}`
      :empty}
    <div class="dim mkattr">impact is ${esc(mk.impact_source)}'s assessment, not
      this journal's · times in ${esc(mk.zone)}</div>
  </div>`;
}

/* Watchlist: a list of watched symbols beside a detail pane for the open one.
 *
 * A MASTER-DETAIL panel, which is this page's one two-pane shape -- Calendar,
 * Market and Replay all put detail under master, and this does too below 1180px.
 * It replaced a nine-column table because that table had honestly run out of
 * room: five derived figures now arrive on the wire and each one needs its
 * window, its periods or its count stated beside it, and a caption per cell is
 * not something a table row has space for.
 *
 * THE TABLE HOLDS THE FIVE COLUMNS WORTH SCANNING; the pane is where a figure
 * explains itself. What left the table -- 1d, 5d, the expected move and the
 * option positions -- moved into the pane rather than being deleted. The options
 * block in particular is the reason this is not a quote screen: a broker app
 * shows a price, and only this journal can say "you are short the 520 put on it".
 *
 * `realised_vol` and `rv_rank` are REALISED, and every label here says so.
 * Implied vol is not reachable for a symbol this journal does not hold -- it is
 * solved from an OPTION's own closes, and a watched name has none (see vol.py).
 * Labelling realised vol as IV would fit the column and be wrong, and carrying IV
 * rank's conventional 30 onto this rank would be the same defect one level up, in
 * a threshold rather than in a value.
 */

/* The two gates the payload's counts are measured against. Mirrored here because
   a dash has to say what it is WAITING for, and a count cannot do that alone:
   "43" means nothing without "of 120". Not on the wire, because they are
   constants of the arithmetic rather than facts about a symbol -- so the page
   holds a copy and `test_the_gate_counts_on_screen_match_the_python_constants`
   binds each to its own leaf. Two names for one value, exactly as `trend.py` and
   `vol.py` spell them separately: they share 120 on purpose (see vol.py's
   RANK_MIN_WINDOWS) and a retune of one is not a retune of the other. */
const BX_SETTLED=120;
const RVR_WINDOWS=120;

/* The indicator's periods, as the tile prints them. Generated in Python from the
   constants themselves (`trend.PARAMS_CAPTION`) and copied here because the page
   holds no Python; a test binds the two, so a retune cannot leave the screen
   claiming the old numbers. B-Xtrender at 5/20/5 and B-Xtrender at other
   settings are different figures, so a value with no periods stated is one its
   reader cannot reproduce -- the gap `impact_source` closes for the calendar.
   ONE string literal, not two concatenated: the test compares it against the
   Python constant, and a sentence split across a `+` is a sentence that guard
   cannot see. */
const PARAMS_CAPTION='B-Xtrender, short arm 5/20/5, centred on 50; Jhunjhunwala 2019';

/* The three cut points the filter row offers, and the two sentences saying where
   each came from. Every one of them is a copy of a Python constant, bound by test
   (`test_the_band_caption_matches_the_constants_that_produced_it` and
   `test_the_rvr_chips_and_the_ring_tick_read_one_constant`) for the reason
   BX_SETTLED is: a chip labelled "below -20" beside a bucket cut somewhere else is
   a control that lies about what it does, and a retune in `trend.py` would leave
   this row offering the old band with nothing on screen to say so.

   ONE constant per cut point, spent EVERYWHERE that point appears: `IVR_HIGH` sets
   both chip labels AND the ring's threshold tick, so the picture and the filter
   cannot end up disagreeing about where 30 is. The bucketing itself is not done
   here at all -- `trend.bucket` and `iv.band` decide it server-side and the page
   filters on `bx_bucket` and the band on the fetched rank -- so these numbers are
   LABELS, and that is the strongest reason they must be the same numbers.

   The two SOURCE sentences are one double-quoted literal each: their Python
   originals contain apostrophes, and a `\'` escape or a `+` join is a sentence the
   guard cannot see, which is the point PARAMS_CAPTION's comment makes above. */
const BX_LO=-30;
const BX_HI=30;
const BX_BANDS="band at +/-30, the reference implementation's default and the outer fifth of sessions measured here; 'oversold' and 'overbought' are the RSI convention's words for below and above it, not this journal's view of what a share is worth";
/* The IV rank cut, a copy of `iv.IVR_HIGH` and bound to it by
   `test_the_ivr_chips_read_ivs_own_constant`. THIRTY IS THE READER'S CHOSEN LINE,
   which is why the caption says so instead of citing anyone: tastytrade publish 50
   as the level premium selling leans on, 80 as extreme and 20 as depressed, and 30
   is none of those. A chip is allowed to cut where its reader wants; what it is not
   allowed to do is imply someone else's research put the line there. */
const IVR_HIGH=30;
const IVR_BANDS="your own screening line, not tastytrade's: they lean on 50 for selling premium, call 80 and above extreme and under 20 depressed. 30 is the wider net";
/* WHOSE number the rank is, printed wherever the rank is. CBOE computes iv30 and
   computes the year's high and low of its own iv30 series, so all this journal does
   is divide -- which is the whole reason an implied number can sit on this tab at
   all without the modelled-number quarantine growing (see iv.py). Attributed for
   `market_events.impact`'s reason: a figure this journal did not measure says so. */
const IVR_SOURCE="CBOE's own 30-day implied vol, ranked between the high and low of that same series over the trailing year. tastytrade's formula, CBOE's numbers, delayed";
/* How near is "reporting soon", for the one filter that reads a typed date. 28
   days rather than a month because it is four whole weeks of expiries, which is
   the unit an options seller actually holds; a calendar month would make the
   filter's reach depend on which month it is. It is a filter's threshold and
   nothing else -- no figure on this tab is computed from it, and the countdown
   itself is `serialize`'s. */
const WEARN_SOON=28;

/* How each bucket and each band is WORDED, once, so the chip a reader presses and
   the sentence naming what is hidden say the same thing. Derived from the cut
   points above rather than typed, which is what stops a chip reading "below -20"
   after the band moved.
   The keys are the server's -- `trend.bucket` returns low/mid/high and
   `vol.rank_band` returns upper/lower -- and they carry no valuation vocabulary on
   purpose: "oversold" and "overbought" are claims about what a share is WORTH, and
   an RSI of an EMA difference is a statement about the shape of recent closes. Those
   two words appear on this tab exactly once each, inside `BX_BANDS`, attributed to
   the convention they come from. */
const WBX_LABEL={low:'below '+num(BX_LO,0),mid:'mid',high:'above +'+num(BX_HI,0)};
const WIVR_LABEL={upper:'IVR > '+num(IVR_HIGH,0),lower:'IVR <= '+num(IVR_HIGH,0)};

/* One symbol's IV rank, and WHY it is absent when it is.
 *
 * Three absences, told apart, because they have three different remedies and a
 * single dash would send the reader looking for the wrong one. Not fetched yet is a
 * button press away; not carried by CBOE is permanent and nothing to fix; a failed
 * request is worth retrying. `/api/quotes` returns the three separately for exactly
 * this -- see `web._iv_ranks`, which refuses to collapse the last two because a
 * server having a bad minute would otherwise render as "this symbol has no options",
 * a false statement about the reader's own watchlist.
 *
 * Absent until Refresh, like the company name and for the same reason: this costs
 * two HTTP requests per symbol, so nothing on a page load may trigger it. */
const ivrOf=sym=>(S.ivr&&S.ivr.ranks||{})[sym]||null;
const ivrWhy=sym=>{
  if(!S.ivr) return 'no IV rank yet: press Refresh prices. It costs two requests '
    +'per symbol, so no page load spends them';
  if((S.ivr.ranks_failed||[]).includes(sym)) return 'the IV rank request for '+sym
    +' failed. Press Refresh prices to try again';
  if((S.ivr.unranked||[]).includes(sym)) return 'CBOE does not carry '+sym
    +', so it has no implied vol to rank. Nothing to fix';
  return 'no IV rank for '+sym;
};

/* The meter's box AND its domain, as one object, because the two must not drift:
   the numbers printed at the ends of the scale and the knob's position between
   them are read from the same four fields, so a picture that disagrees with its own
   labels is unrepresentable.
   `lo` and `hi` are B-Xtrender's OWN bounds, not a range measured off the visible
   rows: the arm is an RSI minus 50, so it lives in [-50, +50] by construction, and
   measured over 756 real closes for four symbols the widest excursion was -37.7 and
   +41.6 (see watch.js for the figures) -- headroom rather than a fit, which is what
   makes the scale stable. Auto-scaling to the rows on screen would make one knob
   position mean a different reading per refresh, and `meterKnob` clamps rather than
   extrapolating so an impossible input reads as "at the limit" instead of as a knob
   off the end of its track.
   The geometry is in viewBox units: 6 units of margin at each end is the knob's own
   radius plus one, so a knob pinned at either bound is fully inside the picture. */
const WMETER={x:6,w:156,lo:-50,hi:50};
/* The ring, likewise in viewBox units. `r` is spent three times -- the track, the
   arc's dasharray and both ends of the threshold tick -- so a resize moves all four
   together. 34 centres a 26-radius ring inside a 68-unit box, leaving 8 units for
   the 6-unit stroke and the tick's overhang. */
const WRING={cx:34,cy:34,r:26};

/* An absent figure, with the reason within reach. Never 0, and never a bare dash:
   in a column of measurements a bare dash reads as "nothing to report", where what
   it means here is "not enough history yet" -- a different sentence, and one with a
   remedy attached. Escaped here rather than at each call site, so a symbol
   interpolated into a reason cannot slip through unescaped. */
const wdash=why=>`<span class="dim" title="${esc(why)}">&mdash;</span>`;
/* The direction glyph, one per state name from `bxDirection`. A GLYPH and not a
   fourth colour: app.css's own rule is that hue alone does not survive red-green
   colour blindness, and two shades of green meaning "rising" and "falling" is a
   harder discrimination than green against rose. */
const WDIR={up:'↑',down:'↓',flat:'→'};

/* The price as BOTH surfaces print it: the figure, plus the stale marker and its
   title when what is on screen is a stored close rather than a fetched quote.
   The derivation is `shownPrice`'s (in watch.js, unit-tested); this is only its
   rendering, shared so the row and the pane cannot mark the same price
   differently. The marker names the SESSION, from `closes_through`: "stored
   close" alone left the reader to guess whether it was yesterday's or a
   fortnight's, and an undated price is the one thing `marketdata.parse_quote`
   discards outright rather than storing. */
function wprice(px,w){
  if(px.price==null) return wdash(`no close stored for ${w.symbol} yet: run `
    +`optjournal bars`);
  const stamped=w.closes_through?`stored close from ${w.closes_through}`
    :'stored close';
  return num(px.price,2)+(px.live?'':`<span class="dim wstale" title="${
    esc(stamped)}; press Refresh prices for a quote">*</span>`);
}

/* The table's order: one column, one direction, nulls last in BOTH of them.
 *
 * NULLS LAST IS THE RULE WORTH STATING. An absent B-Xtrender is not a small one:
 * it means the symbol has not stored enough sessions to have a reading. So a
 * symbol holding nothing must never top an ascending sort, where it would read as
 * the most extreme value in the column. Measured rows first in both directions,
 * unmeasured after them.
 *
 * The tie-break is always the symbol, so equal values -- and the block of nulls,
 * which is every value tied -- come out in a stable readable order rather than in
 * whatever order the payload happened to arrive in.
 *
 * The close column sorts on what is SHOWN, through the same `shownPrice` the cell
 * prints, so the column deciding the order cannot disagree with the figures in
 * it once quotes have arrived.
 *
 * A COPY is sorted. `Array.sort` is in place, and sorting `S.state.watchlist`
 * itself would permanently reorder the payload, whose order is the serializer's
 * own `ORDER BY symbol` that the CLI prints.
 */
function watchSort(rows){
  const qs=S.quotes||{};
  const[col,dir]=String(S.wsort||'symbol:asc').split(':');
  const asc=dir!=='desc';
  const value=w=>col==='close'?shownPrice(w,qs[w.symbol]).price
    :col==='bxtrender'?w.bx_daily
    :col==='ivr'?(ivrOf(w.symbol)||{}).rank
    :col==='earn'?w.earnings_in_days
    :w.symbol;
  return rows.slice().sort((wa,wb)=>{
    const va=value(wa), vb=value(wb);
    if(va==null||vb==null){
      if(va==null&&vb==null) return wa.symbol<wb.symbol?-1:1;
      return va==null?1:-1;
    }
    if(va===vb) return wa.symbol<wb.symbol?-1:1;
    return (va<vb?-1:1)*(asc?1:-1);
  });
}

/* The one TYPED cell in the row, and the only one whose input is the reader.
   Both halves are shown -- the date and the derived countdown -- because the date
   alone makes the reader do the arithmetic and a bare countdown is a number with
   no provenance in a row of measured figures.
   A past date says so in words rather than rendering a negative day count, which
   would read as a countdown running backwards; the date STANDS until the next one
   is recorded, so the cell says that instead of hiding it.
   The dash's title points at the panel, which is where the field that records one
   lives: an empty cell here means none RECORDED, never none due, and a blank in a
   column of measurements would say the other thing. */
const wearn=w=>{
  if(!w.earnings_on) return wdash(`no earnings date recorded for ${w.symbol}; `
    +`add one in the panel`);
  const days=w.earnings_in_days;
  const when=days==null?'':days<0?'recorded, now past'
    :days===0?'today':`in ${days}d`;
  return `${esc(w.earnings_on)}${when?
    ` <span class="dim">${esc(when)}</span>`:''}`;
};

/* Why the rank is absent, in the count that explains it -- and the two reasons are
   different, so they are two sentences. Below the gate the year is not there yet;
   at or above it with no answer, the year IS there and every reading in it is
   identical, so there is no range to place today inside. `vol.rank` returns None
   for that case rather than the midpoint of a range that does not exist. */
const wrankwhy=w=>w.rv_rank_windows>=RVR_WINDOWS
  ?`${w.rv_rank_windows} windows measured and they do not differ, so there is no `
    +`low and high to place today between`
  :`${w.rv_rank_windows} of ${RVR_WINDOWS} windows measured: a rank is a position `
    +`between a low and a high, and each of those is a single reading`;

/* The row button's title, and the ONLY place the held marker's meaning is written.
 *
 * `Watch.held` was on the wire and read by nothing, so the marker the mockup draws
 * before each symbol was declared and never rendered -- a payload key with no reader
 * is a contract nobody checks. It renders now, and it renders as the one thing this
 * tab can say that a quote screen cannot: you have options open on this name.
 *
 * The glyph itself is `aria-hidden`, because a mark is not a word. What a screen
 * reader and a hover both get is this sentence, on the button that already owned a
 * title -- rather than a second `title` nested inside the first, which is a tooltip
 * whose winner depends on where the pointer stopped. The count comes from `options`,
 * the same rows the detail pane lists contract by contract, so the row and the pane
 * cannot disagree about whether the name is held. */
const wselwhy=(w,name)=>{
  const what=name||w.symbol;
  if(!w.held) return what;
  const n=(w.options||[]).length;
  return `${what}; you hold ${n} option position(s) on it`;
};

/* Whether a company NAME exists to search against yet.
 *
 * The name is not stored: it rides in the `/api/quotes` reply (`Quote.name`, at no
 * extra request), so before Refresh has run this tab knows only symbols. That is a
 * designed consequence rather than a gap -- `watchlist` is the user-input table and
 * a cached name would need an age story like every other fetched figure here -- but
 * it means a search box offering "symbol or company" would silently match nothing
 * on half a page load. So the placeholder says which, from this one derivation, and
 * the search itself reads the same answer.
 *
 * Asked of the QUOTES rather than of `S.quotesAt`, because a reply can come back
 * with prices and no names for a symbol the source is thin on: what matters is
 * whether there is a name to match. */
function wnamed(){
  return Object.values(S.quotes||{}).some(wq=>!!(wq&&wq.name));
}

/* Which rows the table shows: the four filters, then slice 5's sort.
 *
 * NARROWING ONLY. Every figure is already in the payload, so filtering is a pure
 * function of state -- no request, no server round trip, and the same reason
 * `S.wbx` and its three siblings stay out of the hash.
 *
 * A ROW WITH NO BUCKET OR NO BAND IS HIDDEN by a chosen bucket or band, and that is
 * the honest reading rather than the convenient one: a symbol inside its warm-up
 * window has no B-Xtrender reading, so it is not "in the mid bucket" -- it is
 * unmeasured, and quietly including it would put an unmeasured row inside a set the
 * reader believes was measured. Whichever control is doing the hiding is named on
 * screen when the result is empty, which is what keeps that defensible.
 *
 * EARNINGS IS THE ONE FILTER THAT WORKS THE OTHER WAY, because its input is typed
 * rather than measured: it excludes only dates you recorded. A row with no date is
 * KEPT, since "nothing here reports within 28 days" and "nothing here reports
 * within 28 days that you have told me about" are different claims and only the
 * second one is true. That rule is `earningsSoon` in watch.js rather than a
 * comparison here, and the reason is executable: `null >= 0` is TRUE in JavaScript,
 * so the obvious inline spelling hides every dateless row the moment the filter goes
 * on, and only a node test over the three cases catches it. */
function watchRows(){
  const ws=S.state.watchlist||[];
  const qs=S.quotes||{};
  const needle=String(S.wsearch||'').trim().toUpperCase();
  const named=wnamed();
  const finds=w=>{
    if(!needle) return true;
    if(String(w.symbol).toUpperCase().includes(needle)) return true;
    const wq=qs[w.symbol];
    return named&&!!wq&&String(wq.name||'').toUpperCase().includes(needle);
  };
  return watchSort(ws.filter(w=>finds(w)
    &&(!S.wbx||w.bx_bucket===S.wbx)
    /* The band is the SERVER's (`iv.band`), never a comparison spelled here, so
       the cut point cannot end up in two places at different values. A symbol with
       no rank has a null band and matches NEITHER chip -- which is the honest
       answer: an unmeasured row does not belong in a set the reader believes was
       measured, and it does not belong in that set's complement either. */
    &&(!S.wivr||(ivrOf(w.symbol)||{}).band===S.wivr)
    &&!(S.wearn&&earningsSoon(w.earnings_in_days,WEARN_SOON))));
}

/* Which controls are narrowing the table right now, worded as the row words them.
   Used only to explain an empty result, and it has to name the CONTROL rather than
   say "the filters": a reader who typed a symbol into the search box and then
   pressed a bucket chip cannot see which of the two emptied the table, and a blank
   pane with a live filter row above it reads as a broken tab rather than a narrowed
   one. The search term is quoted verbatim, because a typo is the likeliest cause. */
function wactive(){
  const on=[];
  const needle=String(S.wsearch||'').trim();
  if(needle) on.push(`the search box ("${needle}")`);
  if(S.wbx) on.push(`the BXTRENDER filter (${WBX_LABEL[S.wbx]})`);
  if(S.wivr) on.push(`the IV rank filter (${WIVR_LABEL[S.wivr]})`);
  if(S.wearn) on.push(`the EARNINGS filter (exclude ≤ ${WEARN_SOON}d)`);
  return on;
}

/* The sentence BOTH panes print when the filtered set is empty, from one function
   so the table's colspan row and the detail pane's block cannot describe two
   different situations. `sweep.check_no_junk_bindings` is what makes this a state
   rather than an edge to be found at runtime: the accidental implementation is an
   empty <tbody> beside a pane reading from `undefined`. */
function wnorows(){
  const total=(S.state.watchlist||[]).length;
  const on=wactive();
  return `nothing matches: all ${total} watched symbol(s) are hidden by `
    +`${on.join(' and ')||'the filter row'}`;
}

/* The filter row: four controls, each captioned with where its numbers came from,
 * plus the count that replaced the header's symbol pill.
 *
 * `.filters` is the page's existing filter-bar shape and `.wf` is the modifier that
 * makes it a five-track row inside a card -- see the CSS, which carries the two
 * specificity gotchas.
 *
 * WHY EACH CAPTION EXISTS. B-Xtrender at 5/20/5 and B-Xtrender at other settings
 * are different numbers, and the published indicator states NO oversold or
 * overbought level at all (no hline, no level inputs, only zero crossed with
 * rising-or-falling) -- so every band on this row is imported, and an imported band
 * with no provenance is a threshold its reader cannot audit. That is the gap
 * `impact_source` closes for the calendar, and the same answer applies twice here.
 * Both sentences are the Python constants' own, so a retune cannot leave the screen
 * quoting the old ones.
 *
 * The RVR caption carries a REFUSAL as well as a source, and it is the load-bearing
 * half: every reader arrives at a 0-to-100 gauge in an options journal expecting IV
 * rank's conventional 30, and this figure is one symbol's own realised vol against
 * its own year. Saying so is cheaper than being misread. */
function watchFilters(shown,total){
  const named=wnamed();
  const dated=(S.state.watchlist||[]).some(w=>!!w.earnings_on);
  const hidden=total-shown;
  /* One builder for both segmented controls, so "pick one" behaves identically on
     each and All is the same absence of a value in both: the empty string, which is
     what `dataset` gives back for `data-wbx=""` and what the handler maps to null.
     The DOT is the bucket's own colour, and only the bucket rows carry one: a band
     is a side of one number and has no third state to distinguish, so a dot there
     would be decoration standing where information stands two tracks left. */
  const seg=(attr,picked,items)=>`<div class="seg">${items.map(it=>
    `<button data-${attr}="${it.val}" class="${(picked||'')===it.val?'on':''}"
      title="${esc(it.hint)}">${it.dot?`<span class="wdot ${it.dot}"></span>`:''
      }${esc(it.label)}</button>`).join('')}</div>`;
  const bx=seg('wbx',S.wbx,[
    {val:'',label:'all',dot:'',
     hint:'every reading, and the symbols that have none yet'},
    {val:'low',label:WBX_LABEL.low,dot:'lo',
     hint:`the daily short arm at or below ${num(BX_LO,0)}`},
    {val:'mid',label:WBX_LABEL.mid,dot:'mid',
     hint:`the daily short arm between ${num(BX_LO,0)} and +${num(BX_HI,0)}`},
    {val:'high',label:WBX_LABEL.high,dot:'hi',
     hint:`the daily short arm at or above +${num(BX_HI,0)}`}]);
  const ivr=seg('wivr',S.wivr,[
    {val:'',label:'all',dot:'',
     hint:'every rank, and the symbols that have none yet'},
    {val:'upper',label:WIVR_LABEL.upper,dot:'',
     hint:`implied vol more than ${num(IVR_HIGH,0)}% of the way up its own year: `
       +`where premium is dear for THIS name, whatever the absolute level. `
       +`Measured live: LOW ranked 78.7 on an iv30 of 33.6% while TSLA ranked 0.8 `
       +`on a HIGHER 37.4%, because each is judged against its own year`},
    {val:'lower',label:WIVR_LABEL.lower,dot:'',
     hint:`at or below ${num(IVR_HIGH,0)}, the line itself included`}]);
  return `<div class="filters wf">
    <div><div class="flabel">search</div>
      <input id="wsearch" value="${esc(S.wsearch||'')}" maxlength="40"
        autocomplete="off" spellcheck="false" placeholder="${esc(named
          ?'symbol or company…'
          :'symbol… (company names arrive with Refresh prices)')}"></div>
    <div><div class="flabel">bxtrender</div>${bx}
      <div class="wcap">${esc(`bands at ${num(BX_LO,0)} and +${num(BX_HI,0)} on `
        +`the daily short arm, ${BX_BANDS}`)}</div></div>
    <div><div class="flabel">iv rank</div>${ivr}
      <div class="wcap">${esc(`cut at ${num(IVR_HIGH,0)}, ${IVR_BANDS}. `
        +IVR_SOURCE)}</div></div>
    <div><div class="flabel">earnings</div>
      <button class="chip${S.wearn?' on':''}" data-wearn="1" ${dated?'':'disabled'}
        aria-pressed="${S.wearn?'true':'false'}" title="${esc(dated
          ?`hide the symbols reporting within ${WEARN_SOON} days. It excludes only `
            +`dates YOU recorded: a row with no earnings date is kept, because an `
            +`unknown date is not a known-clear one, and a date already past is `
            +`kept too`
          :'no watched symbol carries an earnings date yet, so this would hide '
            +'nothing. Record one in the panel')}">exclude ≤ ${WEARN_SOON}d</button>
      </div>
    <div><div class="flabel">showing</div>
      <div class="wshow">${shown} of ${total}${hidden>0
        ?` <span class="dim">${hidden} hidden</span>`:''}</div></div>
  </div>`;
}

/* The detail pane when the filters match nothing. A block that says so, not a
   half-populated card: the pane's every figure comes from an open row, and there is
   no open row to read.
   `S.wsym` is deliberately LEFT STANDING while this shows, so clearing the filter
   brings back the row that was open rather than resetting to the first one. */
function watchNone(){
  return `<div class="wdpane"><div class="wnone">
    <div class="wk">nothing to show</div>
    <div>${esc(wnorows())}</div>
    <div class="wcap">the row you had open is remembered — clearing the filter
      brings it back</div>
    <div class="mt-3"><button class="btn sm" data-wclear="1">Clear filters</button>
    </div></div></div>`;
}

/* The master pane: five columns, one row per watched symbol.
 *
 * The symbol cell holds a real `<button>`, which is what makes the list reachable
 * from the keyboard: it brings the accessible name, the role, Enter and Space and
 * the page's global `:focus-visible` ring with it, none of which a `tabindex` on
 * the `<tr>` would. The whole row carries the same `data-wsel`, so a click
 * anywhere in it selects and one handler serves both paths.
 *
 * The company name appears only once quotes have arrived (`Quote.name`, at no
 * extra request), and the cell TRUNCATES rather than widening the pane:
 * "CrowdStrike Holdings, Inc." beside a symbol exceeds any share of a split card.
 * The `title` carries the full name, so the ellipsis loses nothing.
 */
function watchTable(rows,chosen){
  const qs=S.quotes||{};
  const[col,dir]=String(S.wsort||'symbol:asc').split(':');
  const asc=dir!=='desc';
  /* `aria-sort` because a glyph is not available to a screen reader, and an
     INACTIVE double arrow on every unsorted column because one state cannot say
     which column is deciding the order -- the reader would be left guessing
     whether the unmarked columns are unsortable or merely not sorted. */
  const th=(key,label,hint,klass)=>`<th class="${klass}" aria-sort="${
    col===key?(asc?'ascending':'descending'):'none'}"><button class="wsb"
      data-wsort="${key}" title="${esc(hint)}">${esc(label)}<span class="wsg">${
      col===key?(asc?'↑':'↓'):'⇅'}</span></button></th>`;
  const body=rows.map(w=>{
    const wq=qs[w.symbol];
    const px=shownPrice(w,wq);
    const name=wq&&wq.name?wq.name:'';
    const on=w.symbol===chosen;
    const way=bxDirection(w.bx_daily_delta);
    return `<tr class="${on?'wsel':''}" data-wsel="${esc(w.symbol)}"${
      on?' aria-current="true"':''}>
      <td><button class="wselb" data-wsel="${esc(w.symbol)}"
        title="${esc(wselwhy(w,name))}">${w.held
          ?'<span class="whold" aria-hidden="true">◉</span>':''}<b>${
        esc(w.symbol)}</b> ${
        name?`<span class="dim">${esc(name)}</span>`:''}</button></td>
      <td class="n mono">${wprice(px,w)}</td>
      <td class="n mono ${cls(w.bx_daily)}">${w.bx_daily==null
        ?wdash(`${w.closes} of ${BX_SETTLED} sessions stored: inside that window `
          +`the reading is a warm-up figure and its sign can be wrong. Run `
          +`optjournal bars`)
        :num(w.bx_daily,1)+(way?`<span class="wway" title="${
          esc(num(w.bx_daily_delta,1)+' since the previous session')
          }">${WDIR[way]}</span>`:'')}</td>
      <td class="n mono">${(()=>{const ir=ivrOf(w.symbol);
        return ir?num(ir.rank,1):wdash(ivrWhy(w.symbol));})()}</td>
      <td class="n mono">${wearn(w)}</td>
    </tr>`;
  }).join('');
  /* An empty filtered set is a STATE, not an edge to discover at runtime: the
     careless implementation is a blank <tbody>, which reads as a broken tab under a
     live filter row. One row of prose naming the control that is hiding everything,
     and the control to undo it, beside the header that is still standing. The
     `colspan` tracks the header list above it -- five columns, one cell. */
  const none=`<tr><td colspan="5" class="empty">${esc(wnorows())}
    <button class="btn sm" data-wclear="1">Clear filters</button></td></tr>`;
  return `<table class="wtab"><thead><tr>
    ${th('symbol','symbol','the ticker as stored, and the company name once a '
      +'quote has been fetched','')}
    ${th('close','close','the fetched quote when there is one, else the newest '
      +'stored session close, marked with *','n')}
    ${th('bxtrender','bxtrender',PARAMS_CAPTION,'n')}
    ${th('ivr','ivr','IV rank, 1y: where implied vol sits between this symbol\'s '
      +'own yearly low and high, 0 to 100. NOT the absolute level -- a name can '
      +'rank high on a modest implied vol, which is the whole point of a rank. '
      +IVR_SOURCE,'n')}
    ${th('earn','earnings','a date you recorded, not a fetched one: nothing this '
      +'journal reaches publishes an earnings date','n')}
  </tr></thead><tbody>${body||none}</tbody></table>`;
}

/* One tile. Label left, figure right, plus the two things a figure on this tab
   needs and `statCard` has nowhere to put: a DELTA beside the value (the
   indicator's second published state) and a CAPTION under it naming the window,
   the periods or the count the figure came from.
   The BOX is `.stat`'s, through its own class rather than through copies of its
   values, so the padding, radius, ground and border cannot drift from the
   dashboard's cards; `.wtile` adds only the layout.
   `kids` is the slot the two gauges sit in, and it comes BEFORE the caption on
   purpose: figure, then the picture of it, then where the figure came from. A
   provenance line wedged between a number and its own gauge separates the two
   things a reader is comparing, and the caption is the part they read last. */
function wtile(label,value,opts){
  const tile=opts||{};
  return `<div class="stat wtile ${tile.klass||''}">
    <div class="wth"><span class="wk">${esc(label)}</span>
      <span class="wtv"><span class="v ${tile.big?'':'sm'} ${tile.tint||''}"
        >${value}</span>${tile.delta?
        `<span class="wdelta">${tile.delta}</span>`:''}</span></div>
    ${tile.kids||''}
    ${tile.cap?`<div class="wcap">${esc(tile.cap)}</div>`:''}</div>`;
}

/* THE METER: one reading placed on the indicator's own fixed scale.
 *
 * It earns its place by making the position readable without reading the number --
 * which is the gradient's job, and the reason the track is not a plain bar: the
 * knob's distance from the centre says how far the arm has run, and the hue behind
 * it says which way. Both scale ends are printed, because a picture whose bounds are
 * not on screen is a picture that could be showing anything.
 *
 * GEOMETRY ATTRIBUTES, NEVER A `style`. Inline styles are forbidden anywhere in this
 * page (a rule with a test behind it), and they are also invisible to the layout
 * assertions, so a knob positioned by CSS would be a knob nothing could check. SVG
 * attributes are what the performance chart and the replay chart already use.
 *
 * NO COLOUR IN THE MARKUP EITHER, which is why the gradient's three stops carry
 * CLASSES and no `stop-color` attribute. A presentation attribute cannot hold a
 * `var()`, so a hex in one is a colour that survives a theme swap unchanged -- the
 * exact defect the performance chart shipped, with Leather's own background
 * hardcoded into a stroke and worn on every theme.
 *
 * `meterKnob` returns null for an absent reading rather than a knob at the left end,
 * because that end is a POSITION and the strongest reading the meter can show. A
 * symbol inside its warm-up window gets the dash and its reason, and no picture. */
function wmeter(w){
  const knob=meterKnob(w.bx_daily,WMETER);
  if(knob==null) return '';
  const mid=WMETER.x+WMETER.w/2;
  return `<svg class="wmeter" viewBox="0 0 168 30" role="img"
    aria-label="${esc(`${num(w.bx_daily,1)} on a fixed scale from ${
      num(WMETER.lo,0)} to +${num(WMETER.hi,0)}`)}">
    <defs><linearGradient id="wmg" x1="0" y1="0" x2="1" y2="0">
      <stop class="lo" offset="0"/><stop class="mid" offset="0.5"/>
      <stop class="hi" offset="1"/></linearGradient></defs>
    <rect x="${WMETER.x}" y="6" width="${WMETER.w}" height="7" rx="3.5"
      fill="url(#wmg)"/>
    <line class="wmzero" x1="${mid}" y1="3" x2="${mid}" y2="16"/>
    <circle class="wmknob ${w.bx_daily>0?'pos':w.bx_daily<0?'neg':''}"
      cx="${knob.toFixed(2)}" cy="9.5" r="5"/>
    <text class="wmend" x="${WMETER.x}" y="28">${num(WMETER.lo,0)}</text>
    <text class="wmend wmr" x="${WMETER.x+WMETER.w}" y="28">+${
      num(WMETER.hi,0)}</text></svg>`;
}

/* THE RING: the rank as a proportion, drawn from 12 o'clock clockwise.
 *
 * Three elements, and each is load-bearing. The TRACK, because an arc with nothing
 * behind it cannot be read as a proportion -- 40% of a circle and 40% of nothing
 * look identical. The ARC, whose length is a fraction of the circumference
 * (`ringArc`), rotated -90 degrees about its own centre so it begins at the top and
 * runs clockwise: a dasharray carries a length and says nothing about where the
 * stroke starts, so the direction is stated here and pinned by `ringPoint`'s tests.
 * The TICK, because the picture and the filter chips must agree about where the cut
 * point is, and it comes from the same `IVR_HIGH` the chips are labelled from.
 *
 * THE TRACK AND THE TICK ARE DRAWN EVEN WITH NO RANK, and the arc is not. An empty
 * ring beside a dash reads as "the scale exists, the reading does not", which is the
 * honest picture on a symbol whose year is still filling in; drawing nothing at all
 * would leave the tile's caption explaining an absence with no shape to attach it
 * to. A rank of 0 draws the same empty arc and is a different fact, so the two are
 * told apart where it counts: the figure beside the ring, and this element's own
 * accessible name. */
function wring(w){
  const ir=ivrOf(w.symbol);
  const value=ir?ir.rank:null;
  const arc=ringArc(value,WRING.r);
  const tin=ringPoint(IVR_HIGH/100,WRING.r-5);
  const tout=ringPoint(IVR_HIGH/100,WRING.r+5);
  return `<svg class="wring" viewBox="0 0 68 68" role="img"
    aria-label="${esc(value==null
      ?'no IV rank yet, so the ring is empty'
      :`${num(value,1)} of 100, with a mark at ${num(IVR_HIGH,0)}`)}">
    <circle class="wrtrack" cx="${WRING.cx}" cy="${WRING.cy}" r="${WRING.r}"/>
    ${arc?`<circle class="wrarc" cx="${WRING.cx}" cy="${WRING.cy}" r="${WRING.r}"
      stroke-dasharray="${arc.on.toFixed(2)} ${arc.off.toFixed(2)}"
      transform="rotate(-90 ${WRING.cx} ${WRING.cy})"/>`:''}
    <line class="wrtick" x1="${(WRING.cx+tin.x).toFixed(2)}"
      y1="${(WRING.cy+tin.y).toFixed(2)}" x2="${(WRING.cx+tout.x).toFixed(2)}"
      y2="${(WRING.cy+tout.y).toFixed(2)}"/></svg>`;
}

/* The detail pane: the open row, with every figure's provenance beside it.
 *
 * Its own grid (`.wdet`), not `.stats`: that row is `display:flex` with an 18%
 * basis and lays equal tiles across one line, and `statCard` emits label ABOVE
 * value with no slot for a delta beside the figure and no way to make one tile
 * wider than its neighbours.
 *
 * Every absent figure is an em dash whose title names the count it waits on,
 * because `sweep.check_no_junk_bindings` fails on `undefined` or `NaN` anywhere in
 * the rendered text and the sweep is the only executed check of this tab.
 */
function watchDetail(w){
  const wq=(S.quotes||{})[w.symbol];
  /* The SAME derivation the row uses, from the same module and with the same
     marker. A pane reading `w.last` beside a row reading `qs[sym].price` is the
     strongest rule in this codebase broken, not a cosmetic slip -- see watch.js
     for the browser-caught defect that produced the rule. */
  const px=shownPrice(w,wq);
  const name=wq&&wq.name?wq.name:'';
  /* Read ONCE per render and passed nowhere: `wring` reads it again through the
     same helper rather than taking it as an argument, so the tile's figure and the
     ring's arc are two reads of one object and cannot describe different symbols. */
  const ivr=ivrOf(w.symbol);
  const way=bxDirection(w.bx_daily_delta);
  const pc=v=>v==null?wdash('not enough stored sessions to measure a change over '
    +'that span'):num(v,2)+'%';

  const daily=wtile('bxtrender · daily',
    w.bx_daily==null?wdash(`${w.closes} of ${BX_SETTLED} sessions stored: inside `
      +`that window the reading is a warm-up figure and its sign can be wrong. `
      +`Run optjournal bars`):num(w.bx_daily,1),
    {klass:'wide',big:true,tint:cls(w.bx_daily),cap:PARAMS_CAPTION,kids:wmeter(w),
     delta:w.bx_daily_delta==null?'':`<span class="${cls(w.bx_daily_delta)}">${
       num(w.bx_daily_delta,1)}</span>${way?WDIR[way]:''}`});
  /* The rank, with the sentence it can print about itself: a min-max rank states
     its own meaning in one line, which is most of why it is the statistic here
     rather than a percentile. The ring above the caption is the same figure as a
     picture; the caption is what makes it readable, and what a ring cannot say. */
  const ring=wtile('ivr · iv rank, 1y',
    ivr?num(ivr.rank,1):wdash(ivrWhy(w.symbol)),
    {klass:'tall',big:true,kids:wring(w),
     /* Every term of the rank, because the rank alone is unfalsifiable: the same
        76.7 inside a two-point year is a different fact from one inside a
        seventy-point year, and the reader cannot tell which without the bounds.
        The provenance sentence rides here too -- this is CBOE's figure, and the
        one place it is guaranteed to be read is beside the number itself. */
     cap:ivr?`implied vol is ${num(ivr.iv30,1)}%, ${num(ivr.rank,1)}% of the way `
       +`from this year's low, ${num(ivr.low,1)}%, to its high, `
       +`${num(ivr.high,1)}%. ${IVR_SOURCE}, as of ${ivr.as_of}`
       :ivrWhy(w.symbol)});
  /* The typed date, and the field that records one. The panel is where the table's
     dash sends the reader, so the field has to be here or that title is a lie. An
     empty value CLEARS: `_watchlist_write` reads a present-and-empty field as
     NULL, which is how a date that has gone by is removed. */
  const earnings=wtile('earnings',
    w.earnings_on?esc(w.earnings_on):wdash(`no earnings date recorded for ${
      w.symbol}; the field below records one`),
    {delta:w.earnings_in_days==null?'':`<span class="dim">${esc(
       w.earnings_in_days<0?'recorded, now past'
       :w.earnings_in_days===0?'today':'in '+w.earnings_in_days+'d')}</span>`,
     cap:'recorded by you, not fetched: no source this journal reaches publishes '
       +'an earnings date, so the days beside it are counted from the ET trading '
       +'day on every load and never stored',
     kids:`<form class="wed" data-wsave="${esc(w.symbol)}"
       data-wfield="earnings_on"><input id="wearn" data-subject="${esc(w.symbol)}"
       value="${esc(w.earnings_on||'')}" placeholder="YYYY-MM-DD" maxlength="10"
       autocomplete="off" spellcheck="false">
       <button class="btn sm" type="submit">Save</button></form>`});
  /* The weekly arm, and its week NAMED and COUNTED. The newest ISO week is
     normally partial and a figure over it repaints every session -- measured on
     TSLA: -19.02, -18.63, -19.71 across one week's three sessions -- so the count
     travels with the value and this tile never prints a bare figure. */
  const weekly=wtile('bxtrender · weekly',
    w.bx_weekly==null?wdash(`${w.weeks} of ${BX_SETTLED} ISO weeks stored`)
      :num(w.bx_weekly,1),
    {tint:cls(w.bx_weekly),
     cap:w.bx_weekly_week==null?'no closes stored yet, so there is no week to read'
       :`${w.bx_weekly_week}, ${w.bx_weekly_sessions||0} session(s) stored of a `
         +`full week's five: the newest week is usually partial, and a figure over `
         +`it repaints as its sessions land`});

  /* Which contracts, not just "held": the strike and the side are the reason to
     look at this name rather than at a chart. Through `strike()`, which keeps a
     half-strike -- 267.5 and 268 are different contracts, and the table cell this
     replaced rounded them together. */
  const opts=(w.options||[]).map(wo=>
    `<div class="mono">${wo.quantity>0?'+':''}${wo.quantity} ${
      wo.strike!=null?strike(wo.strike):''}${wo.put_call||''}${wo.expiry?
      ` <span class="dim">expires ${esc(wo.expiry)}</span>`:''}</div>`).join('');
  return `<div class="wdpane">
    <div class="kicker">underlying</div>
    <div class="wdh"><span class="wdsym">${esc(w.symbol)}</span>
      <span class="big mono">${wprice(px,w)}</span>
      ${name?`<span class="dim">${esc(name)}</span>`
        :`<span class="dim2">press Refresh prices for the company name</span>`}</div>
    <div class="wdet">${daily}${ring}${earnings}${weekly}</div>
    <div class="stats mt-3">
      ${wtile('1d',pc(px.chg1),{tint:cls(px.chg1),cap:px.live
        ?'from the quote\'s own previous close, so it describes the same session '
          +'as the price above'
        :'from the stored closes, the same series as the price above'})}
      ${wtile('5d',pc(w.change_5d),{tint:cls(w.change_5d),
        cap:'over five stored sessions, from the closes'})}
      ${wtile('realised vol',w.realised_vol==null
        ?wdash(`${w.closes} session(s) stored; six closes is the fewest a `
          +`standard deviation is worth reporting over`)
        :num(w.realised_vol,1)+'%',
        /* The REALISED rank lives here, in the caption of the realised figure it
           ranks, rather than in a second ring. Two rings cut at two different
           points would be a reader's problem, not a feature -- and the pairing is
           the useful part: an implied rank high while the realised rank is low is
           the market charging more than this stock has lately delivered, which is
           the comparison the two numbers exist to support. */
        {cap:'annualised from the stored daily closes'
          +(w.expected_move_5d==null?''
            :`, which implies ±${num(w.expected_move_5d,2)} over five sessions `
              +`-- one standard deviation of what the stock DID`)
          +(w.rv_rank==null?`. No realised rank: ${wrankwhy(w)}`
            :`. That is ${num(w.rv_rank,1)} of 100 against its own year, `
              +`${num(w.rv_rank_low,1)}% to ${num(w.rv_rank_high,1)}% over `
              +`${w.rv_rank_windows} windows`)})}
    </div>
    <div class="wblk"><div class="wk">your positions</div>
      ${opts||`<div class="dim">no open option position on ${esc(w.symbol)} —
        a name you are watching, not one you hold</div>`}</div>
    <div class="mt-3"><button class="wrm" data-wrm="${esc(w.symbol)}"
      title="stop watching ${esc(w.symbol)}: the note and the earnings date go
      with it">stop watching ${esc(w.symbol)}</button></div>
  </div>`;
}

function watchlist(){
  const ws=S.state.watchlist||[];
  /* The add field lives in the header, so editing happens where you are looking.
     Rendered even when the list is empty -- an empty state that only tells you to
     run a CLI command is a dead end when the control could be right there. */
  const adder=`<form id="waddf" class="wadd">
    <input id="wadd" placeholder="+ add symbol" maxlength="24"
      autocomplete="off" spellcheck="false">
    <button class="btn sm" type="submit">Add</button></form>`;
  /* EXACTLY TWO children in the `.crow`: a title cluster and an actions cluster.
     It is `justify-content:space-between` with a two-child assumption, and the old
     header's four children are why the "3 symbol(s)" pill floated to the middle of
     it. That pill is retired rather than moved: once a filter row exists,
     "12 symbol(s)" beside a table showing 7 rows contradicts itself.
     `<h2>`, not the old `<h3>`: app.css styles `.card h2` and styles no h3 at all,
     so this title wore the user agent's size and its 1em margins. BETA is the
     `.pill.gap` the lifecycle headings already use for an inline label, and
     Refresh is a labelled `.btn.sm` -- the Economic Calendar's precedent for a
     section action, and a control whose accessible name is its own text. */
  const header=`<div class="crow">
    <div class="wtitle"><h2>Watchlist</h2><span class="pill gap">BETA</span></div>
    <div class="wacts">${adder}
      <button id="wquote" class="btn sm">Refresh prices</button></div></div>`;

  if(!ws.length) return `<div class="card">${header}
    <div class="empty">nothing watched yet — add a symbol above, or run
      <code>optjournal watch AAPL</code></div></div>`;

  /* Filtered THEN sorted, in `watchRows`, so the row that opens is the first row of
     what is actually on screen. */
  const rows=watchRows();
  /* Which row is open: the reader's choice when they have made one, else the first
     row of the list AS IT IS SORTED AND FILTERED. Derived rather than stored, so the
     URL stays clean until a row is clicked and a re-sort carries the default with it.
     draw() has already healed a symbol the payload no longer holds, so the find can
     only miss when the reader has chosen nothing -- or when the filter is hiding the
     row they chose, which is the one case with NO first row to fall back to and the
     reason both panes have an empty state. `S.wsym` is left standing through it. */
  const wopen=rows.find(w=>w.symbol===S.wsym)||rows[0]||null;
  /* The symbols with no realised vol at all, named in the footer. With the read
     window at 1100 calendar days this is the one instruction that turns this tab's
     dashes into numbers, so it stays a sentence rather than only a title.
     Counted over the WHOLE list rather than the filtered one: the remedy is a `bars`
     run, which is about what the journal stores and not about what is on screen. */
  const thin=ws.filter(w=>w.realised_vol==null).map(w=>w.symbol);
  return `<div class="card">${header}
    ${quoteNote()}
    ${watchFilters(rows.length,ws.length)}
    <div class="wsplit">
      <div class="wtpane">${watchTable(rows,wopen?wopen.symbol:'')}</div>
      ${wopen?watchDetail(wopen):watchNone()}
    </div>
    <div class="dim mkattr">realised vol is what the stock DID; IVR is what the
      market CHARGES for what it might do, ranked against its own year${
      thin.length?` · no vol yet for ${esc(thin.join(', '))}: run
      <code>optjournal bars</code>`:''} · earnings dates are ones you recorded, not
      fetched ones — the days beside them are counted on every load</div>
  </div>`;
}

/* Open one row in the detail pane. A pure redraw and no request: every figure is
   already in the payload.
   Re-selecting the OPEN row does nothing rather than clearing it -- the market
   strip's rule rather than the calendar's toggle, because this panel always shows
   SOME row and clearing would leave the pane empty with no way back but a reload.
   That early return is also what makes the row's own click and the bubbled click
   from the button inside it one selection instead of two renders. */
function selectWatch(symbol){
  if(!symbol||symbol===S.wsym) return;
  S.wsym=symbol;
  draw();
}

/* How old the fetched quotes are, in words.
 *
 * A price with no age is the whole problem this feature could introduce. Run on a
 * Saturday the source returns Friday's 16:00 close for every symbol -- 22 hours
 * old, perfectly correct, and nothing a page may call "live". So the age is
 * stated, and past a session's length it says the DATE instead of a duration:
 * "22h ago" invites you to read a stale number as nearly current.
 *
 * Deliberately not "market open/closed": the chart response carries no such
 * field (checked), so that would be inferred from a clock this page does not
 * own -- a guess presented beside measurements. */
function quoteNote(){
  const meta=S.quotesAt;
  if(!meta) return `<div class="dim wnote">prices are stored daily closes —
    press <b>Refresh prices</b> for a quote</div>`;
  const ages=Object.values(S.quotes||{}).map(wq=>wq.at).filter(a=>a!=null);
  if(!ages.length) return `<div class="dim wnote">no quote came back</div>`;
  const newest=Math.max.apply(null,ages), age=meta-newest;
  const when=age<90?'just now'
    :age<3600?Math.round(age/60)+'m ago'
    :age<6*3600?Math.round(age/3600)+'h ago'
    :new Date(newest*1000).toISOString().slice(0,16).replace('T',' ')+' UTC';
  const stale=age>=6*3600;
  return `<div class="dim wnote">quotes ${esc(when)}${
    stale?' — <b>the market was closed</b>, so this is the last session\'s close'
    :''}</div>`;
}

/* The pre-open planner: the day's expected range, before the cohort history.
   Index LEVELS, never money -- an S&P close is 5,000 points in every display
   currency, so `num` and not `cash`, which would restate it at an FX rate that
   has no business touching an index. Null context is a real state (no `bars`
   fetch has landed the closes yet) and says how to fix it rather than drawing an
   empty gauge. The 1σ caption states the ~68% reading out loud: a band a reader
   could otherwise take as a limit is a probability, and an unlabelled one lies
   by omission. */
function odtePlanner(oc){
  const lvl=v=>v==null?'—':num(v,2);
  if(!oc) return `<div class="card">
    <div class="crow"><div><h2>0DTE planner</h2>
      <div class="sub">The day's expected range from the S&amp;P 500 and the VIX,
      before the open.</div></div></div>
    <div class="note"><b>Not available yet.</b> The planner reads the S&amp;P and
      VIX daily closes, which arrive with the price bars — run
      <code>optjournal bars</code> (the daily job fetches them too) and it fills
      in from the next session.</div></div>`;
  /* A VIX read on an older session than the S&P close is a fact, not an error:
     say which sessions each came from and let the reader judge, rather than
     printing one date over two figures. */
  const stale=oc.vix_date!==oc.spx_date;
  const events=(oc.events_today||[]);
  return `<div class="card">
    <div class="crow"><div><h2>0DTE planner</h2>
      <div class="sub">Expected range for <b>${esc(oc.today)}</b>, from the prior
      S&amp;P 500 close and the current VIX. Index levels, not ${esc(BASE())}.</div></div>
      <div class="pills"><span class="pill">S&amp;P <b>${lvl(oc.spx_prev_close)}</b>
        <span class="dim">${esc(oc.spx_date)}</span></span>
        <span class="pill">VIX <b>${lvl(oc.vix)}</b>
        <span class="${stale?'neg':'dim'}">${esc(oc.vix_date)}</span></span></div></div>
    <table><thead><tr><th>expected range</th><th class="n">±</th>
      <th class="n">low</th><th class="n">high</th></tr></thead><tbody>
      ${oc.bands.map(ob=>`<tr>
        <td>${esc(ob.label)}</td>
        <td class="n mono">${pct(ob.pct,2)}</td>
        <td class="n mono">${lvl(ob.low)}</td>
        <td class="n mono">${lvl(ob.high)}</td></tr>`).join('')}
    </tbody></table>
    <div class="note">The <b>VIX 1σ</b> range is the VIX read as one session
      (annualised vol over the root of 252 trading days): about a
      <b>${pct(oc.vix_daily_move_pct,2)}</b> move, inside which roughly two closes
      in three land — a probability, not a limit. The <b>2%</b> and <b>3%</b>
      rails are fixed, the desk's habitual "normal" and "big" day, and where the
      VIX band sits against them is the read.${stale?` The VIX is from
      ${esc(oc.vix_date)} while the S&amp;P close is ${esc(oc.spx_date)}; the next
      fetch aligns them.`:''}</div>
    ${events.length?`<h2 class="sub2 mt-4">On the calendar today</h2>
    <div class="note">A scheduled release is the most common reason a quiet tape
      turns into a 2% day. Times in the market zone.</div>
    <table><tbody>
      ${events.map(oe=>`<tr>
        <td class="mono dim">${esc(oe.at)}</td>
        <td><span class="mkimp ${oe.impact==='High'?'hi':oe.impact==='Medium'?'md':'lo'}"></span>
          ${esc(oe.country)}</td>
        <td>${esc(oe.title)}</td></tr>`).join('')}
    </tbody></table>`
    :`<div class="note mt-3">No scheduled releases today on the journal's
      calendar — a lighter tape than a print day, though nothing rules out an
      intraday headline.</div>`}
  </div>`;
}

function odte(){
  const od=S.state.odte, h=S.state.history||{};
  if(!od) return `<div class="card"><div class="empty">no data</div></div>`;
  const odtes=(h.closed||[]).filter(x=>x.is_odte===true);
  /* Classified server-side: 0DTE means the contract expired on the day it was
     opened, which is not the same question as holding_days === 0. A 45-day
     option opened and closed in one afternoon is a day trade at 45 DTE. The
     two coincide often enough that deriving this from the holding period would
     look right on most data and be wrong on exactly the trades that matter. */
  const block=(co,klass)=>`<div class="card">
    <h2 class="sub2">${esc(co.label)}</h2>
    <div class="stats">
      ${statCard('Round trips',co.episodes,`${co.contracts} contracts`,'sm')}
      ${statCard('Win rate',pct(co.win_rate),`${co.wins}W / ${co.losses}L`,'sm')}
      ${statCard('Net P&L',moneyOf(co.net_pnl),'realised, net of commission',
        'sm '+cls(co.net_pnl.base))}
      ${statCard('Avg per trip',co.avg_pnl==null?'—':moneyOf(co.avg_pnl),
        'wins and losses together','sm '+cls(co.avg_pnl?.base))}
    </div></div>`;
  const closedTotal=od.cohort.episodes+od.rest.episodes+od.unknown_dte;
  /* A cohort of one against a cohort of eight will always show a difference in
     win rate, and it means nothing. Flagged rather than hidden, because the
     numbers are real and worth showing -- what is not real is the comparison.
     Ten is a judgement call, stated as such on screen: a defensible threshold
     would need a significance test this tool has no business claiming to run. */
  const thin=Math.min(od.cohort.episodes,od.rest.episodes)<10;
  /* Two different empty states, because they are different facts. With nothing
     closed at all there is no cohort to compare and the two all-zero blocks are
     noise; with closed trips but no same-day expiries among them, the count is
     the informative part. Saying "nothing was opened on its expiry date" in the
     first case implies a search that found nothing, when nothing was searched. */
  if(!closedTotal) return `<div class="card">
    <div class="crow"><div><h2>Zero days to expiration</h2>
      <div class="sub">Contracts opened on their own expiry date.</div></div></div>
    <div class="empty">no closed round trips yet, so there is no cohort to compare</div>
    <div class="note">A 0DTE trade is one opened on the day its contract expires —
      not simply one opened and closed the same day, which is a day trade at whatever
      the contract's remaining life happens to be. This tab fills in once a round trip
      opened on an expiry date has closed.</div>
  </div>`;
  return `${odtePlanner(od.context)}<div class="card">
    <div class="crow"><div><h2>Zero days to expiration</h2>
      <div class="sub">Contracts opened on their own expiry date. ${esc(ccyNote())}</div></div>
      <div class="pills"><span class="pill">0DTE <b>${od.cohort.episodes}</b></span>
        <span class="pill dim">rest of book <b>${od.rest.episodes}</b></span></div></div>
    <div class="note">A high 0DTE win rate means nothing on its own, so the rest of
      the book is shown beside it. <b>Avg per trip</b> is the figure that decides
      whether the cohort is worth trading: a better win rate with a worse average is
      a losing strategy. Counted per contract ROUND TRIP here, not per position as
      on the Dashboard — a 0DTE cohort is defined by a contract's expiry, and a
      rolled position spans several, so it has no single DTE to sort it by. The two
      win rates are therefore different questions and need not match.</div>
    ${thin?`<div class="note"><b>Too few round trips to conclude anything.</b>
      ${od.cohort.episodes} 0DTE against ${od.rest.episodes} other — a difference in
      win rate across samples this small is noise, not evidence. The threshold is a
      rule of thumb, not a significance test.</div>`:''}
    <div class="duo">
      ${block(od.cohort)}${block(od.rest)}
    </div>
    ${odtes.length?`<h2 class="sub2 mt-4">0DTE round trips</h2>
    <table><thead><tr><th>contract</th><th>opened</th><th>closed</th>
      <th class="n">qty</th><th class="n">realised</th><th class="n">commission</th>
      <th>how</th></tr></thead><tbody>
      ${odtes.map(ep=>`<tr><td class="mono">${esc(ep.symbol)}</td>
        <td class="dim mono">${esc(String(ep.opened_at||'').slice(0,16))}</td>
        <td class="dim mono">${esc(String(ep.closed_at||'').slice(0,16))}</td>
        <td class="n mono">${ep.contracts}</td>
        <td class="n mono ${cls(ep.realized_pnl.base)}">${moneyOf(ep.realized_pnl)}</td>
        <td class="n mono">${moneyOf(ep.commission)}</td>
        <td class="dim2">${esc(ep.status)}</td></tr>`).join('')}
    </tbody></table>`
    :`<div class="empty mt-4">none of the ${closedTotal} closed
      round trips was opened on its own expiry date</div>`}
    ${od.unknown_dte?`<div class="note">${od.unknown_dte} closed round trip(s) carry no
      expiry, so their DTE is unknown rather than non-zero. They are excluded from both
      columns above.</div>`:''}
  </div>`;
}

/* ------------------------------------------------ settings panel

   TWO CARDS, and the split is the point. This panel was one card holding version
   strings, absolute paths, a 25-row archive inventory and a timestamp -- every
   one of them read-only. It was labelled Settings and let a reader change
   nothing, which is a worse answer than having no panel: someone looking for
   where to put their Flex query id found a table that displayed it.

   So: SETTINGS is the things a person can change, and each control writes
   through and says so. ADVANCED is the diagnostics that were here before, behind
   a <details> because their audience is someone debugging, not someone
   configuring -- and the archive table is 25 rows on this journal, which is a
   scroll nobody asked for on the way to two buttons. */
function settingsPanel(){
  const st=S.state, se=st.settings||{};
  const src=se.query_id_source;
  const overridden=src==='override';
  const tok=se.token;
  /* The token is PRESENCE only, fetched on demand -- see the Settings typedef on
     why it is not on the payload. Three states, not two: null means nobody has
     asked yet, and rendering that as "missing" would tell a reader with a
     perfectly good token to go and re-enter it. */
  const tokLine=tok===null||tok===undefined
    ? `<span class="dim2">not checked</span>`
    : tok.present===true
      ? `<span class="pos">stored</span> <span class="dim">for ${esc(tok.account||'')}</span>`
      : tok.present===false
        ? `<span class="neg">missing</span> <span class="dim">— run
           <code>optjournal setup</code></span>`
        : `<span class="neg">unreadable</span> <span class="dim">${esc(
           tok.message||'')}</span>`;
  return `<div class="card">
    <div class="crow"><div><h2>Settings</h2>
      <div class="sub">Stored beside the journal in <code>.optjournal.json</code>,
      so they survive a restart. The Flex <b>token</b> is never here — it lives in
      the OS keyring, and <code>optjournal setup</code> is the only thing that
      writes it.</div></div></div>

    <h2 class="sub3 mt-5">IBKR connection</h2>
    <div class="setrow">
      <label class="flabel" for="qid">Flex Query ID</label>
      <input id="qid" class="tin mono" inputmode="numeric" maxlength="32"
        value="${esc(se.query_id||'')}" placeholder="1591754"
        ${overridden?'disabled':''}>
      <button id="qidsave" ${overridden?'disabled':''}>Save</button>
      <span id="qidmsg" class="dim"></span>
    </div>
    ${overridden?`<div class="note">This id comes from a
      <code>--query-id</code> flag or <code>$OPTJOURNAL_QUERY_ID</code>, which
      outrank anything saved here — so the field is read-only rather than
      accepting a value that would not take effect. Drop the flag to edit it
      from this page.</div>`
      :src==='unset'?`<div class="note"><b>No query id yet.</b> Client Portal →
        Performance &amp; Reports → Flex Queries. Sync stays disabled until this
        is set.</div>`:''}
    <div class="setrow mt-4">
