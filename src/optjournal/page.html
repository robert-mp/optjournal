  /* One row per registered job. `last_status` is rendered as itself rather than
     collapsed to a colour: `nothing` (a legitimately empty run) and `ok` are both
     healthy and must stay distinguishable, because conflating them is exactly what
     let three cron jobs report health while collecting nothing.

     EACH ROW CARRIES A RUN BUTTON, which is the point of the whole exercise --
     nothing here should need a terminal. `sync` gets a confirm() and the others do
     not, and the line between them is not caution but COST: sync spends one of
     IBKR's rate-limited Flex requests against a lockout budget, and the other
     three hit a public chart endpoint or a calendar feed where the penalty for an
     extra call is nothing. A dialogue on all four would train you to click through
     dialogues, which is how the one that matters stops being read. */
  const rows=(sc.jobs||[]).map(j=>{
    const run=j.last_run;
    const busy=j.last_status==='running';
    const tint=j.last_status==='failed'||j.last_status==='interrupted'?'neg'
      :j.last_status==='ok'?'pos':'';
    const detail=run&&run.detail?run.detail:'';
    /* `finished_at` over `started_at`: for a job that is still running the
       former is null, and "started 3m ago" is the honest thing to say then. */
    const when=run?(run.finished_at||run.started_at||''):'';
    return `<div class="jrow">
      <span class="jname mono">${esc(j.job)}</span>
      <span class="jstat ${tint}">${esc(j.last_status||'never run')}</span>
      <span class="dim jdet">${esc(detail)}</span>
      <span class="dim2 jwhen mono">${esc(when.slice(0,16).replace('T',' '))}</span>
      ${j.consecutive_failures>1?`<span class="pill gap neg"
        title="Consecutive failures since the last healthy run."
        >×${j.consecutive_failures}</span>`:''}
      ${j.retired
        /* No button: the job left the registry, so there is nothing to run. Its
           history stays visible and labelled rather than disappearing, because a
           row that vanishes reads as "this never happened". */
        ? `<span class="dim2 lbl-sm" title="This job is no longer registered. Its
            history is kept so a rename does not erase what it did."
            >retired</span>`
        : `<button class="btn sm jrun" data-job="${esc(j.job)}"${busy?' disabled':''}
        title="${j.spends_request
          ? 'Spends one IBKR Flex request against a rate-limited budget.'
          : 'Costs no IBKR request.'}">${busy?'running':'run'}</button>`}
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="crow"><div><h2>Collection</h2>
      <div class="sub">Whether this journal is still being fed — and by what.</div></div>
      <div class="pills">${beat}${audit}</div></div>
    ${rows||`<div class="empty">no job has recorded a run in this journal yet —
      today the bars and sync commands are driven by cron, and they write here
      from now on</div>`}
    <div class="dim mkattr">a green status means the last run succeeded, which is a
      different question from whether anything is running at all — the two were
      conflated for two days while nothing was collected</div>
  </div>`;
}

/* Seconds, in words. Small enough to inline, and the wording matters: an age with
   no unit reads as a timestamp. Mirrors the vocabulary quoteNote() uses so two
   freshness readouts on the same page do not describe time differently. */
function ago(secs){
  if(secs==null) return 'never';
  if(secs<90) return 'just now';
  if(secs<3600) return Math.round(secs/60)+'m ago';
  if(secs<48*3600) return Math.round(secs/3600)+'h ago';
  return Math.round(secs/86400)+'d ago';
}

/* ------------------------------------------------ chart (inline SVG) */
function chart(days){
  if(!days||!days.length) return `<div class="empty">no fills in this period</div>`;
  /* W MATCHES THE CSS HEIGHT'S ASPECT, and the SVG scales UNIFORMLY. This was
     `viewBox="0 0 1000 230"` with `preserveAspectRatio="none"` and `width:100%`,
     which is why the axis read blurry and the digits looked stretched: the card
     is ~1400px wide, so a 1000-unit viewBox was scaled 1.40x horizontally and
     1.00x vertically. Every glyph came out 40% wider than tall -- not a font
     problem, a geometry one -- and strokes landed on fractional pixels.
     Measured, not guessed: 1400/1000 against 230/230.

     Fixed by letting the SVG scale as a unit (`.chart` sets no width, so the
     viewBox's own ratio governs) and by declaring the box at the width the card
     actually gets. The replay panel already did this -- `xMidYMid meet` -- which
     is why its labels were always crisp and these were not.

     PL leaves room for a tick label carrying a currency symbol as well as
     digits; at 54px "€4,138" collided with the plot area. */
  const W=1400,H=230,PL=76,PR=18,PT=16,PB=28;
  let run=0; const pts=days.map(dy=>({x:dy.day,y:(run+=dy.realized.base),n:dy.trades}));
  const ys=pts.map(pt=>pt.y).concat([0]);
  let lo=Math.min(...ys), hi=Math.max(...ys);
  if(lo===hi){lo-=1;hi+=1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const sx=i=>PL+(pts.length===1?(W-PL-PR)/2:i*(W-PL-PR)/(pts.length-1));
  const sy=v=>PT+(hi-v)*(H-PT-PB)/(hi-lo);
  const line=pts.map((pt,i)=>`${i?'L':'M'}${sx(i).toFixed(1)},${sy(pt.y).toFixed(1)}`).join('');
  const area=pts.length>1
    ? `${line}L${sx(pts.length-1).toFixed(1)},${sy(0).toFixed(1)}L${sx(0).toFixed(1)},${sy(0).toFixed(1)}Z`
    : '';
  /* ROUND TICKS, CHOSEN IN DISPLAY SPACE. Two decisions here, and the order of
     them is the whole point.

     The values used to be `[hi, (hi+lo)/2, lo]` -- the data's own padded extremes
     -- so the axis read "€1,626 / €726 / −€174": three numbers nobody chose, all
     of which move on every fill. `niceTicks` picks round multiples instead (see
     replay.js), which is what every charting platform does, and it puts zero on a
     gridline for free whenever zero is in range.

     And the ticks are picked from the CONVERTED domain, then mapped back through
     `unconv` to position them. Choosing them in base and labelling with `cash`
     would have rounded the wrong quantity: at 1.13 USD per EUR a round €500 tick
     renders "$568.63", so under a non-base toggle the axis would have looked
     exactly as arbitrary as before. Rounding has to happen in the space the
     reader is actually reading.

     `cash`, not `num`, for the label: the values are base-currency, so labelling
     them raw left the axis in EUR while the headline and every dot tooltip on the
     same chart restated to USD -- the axis was the one figure on the page that
     ignored the toggle. The plotted SHAPE is unaffected either way, since conv()
     is a uniform scale factor and cancels out of sy()'s normalisation. */
  const ticks=niceTicks(conv(lo),conv(hi)).map(dv=>{
    const v=unconv(dv), y=sy(v).toFixed(1);
    return `<line class="grid" x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"/>
     <text class="axis" x="${PL-8}" y="${(sy(v)+3.5).toFixed(1)}"
       text-anchor="end">${cash(v,0)}</text>`;
  }).join('');
  /* NO BREAK-EVEN RULE. There was a labelled dashed line at zero whenever the
     series crossed it, on the argument that a drawdown should not read as
     ordinary variation. Removed by request, and the argument it rested on was
     already carried twice over: the area fill is clipped at zero and painted in
     the LOSS colour below it, and every dot below zero takes that colour too. So
     the sign of the series is stated by the two things a reader is already
     looking at, and a third dashed rule with a caption was the only element on
     this card competing with the line itself.
     The axis still labels its lowest tick, so the scale remains readable. */
  /* A dot below break-even takes the loss colour too, so a single day's marker
     states which side of zero it sits on without the reader tracing it back to
     the axis. */
  /* CLASSES, not literal fills. These were `#f0899a`/`#c98a5c` with a
     `stroke="#0a0806"` halo -- Leather's own background, hardcoded into an SVG
     attribute, so on any other theme the dots were ringed in a colour the page
     no longer uses. An SVG presentation attribute is also unreachable from the
     stylesheet, which is why the whole chart sat out the theme swap. */
  const dots=pts.map((pt,i)=>`<circle class="cdot ${pt.y<0?'neg':'pos'}"
     cx="${sx(i).toFixed(1)}" cy="${sy(pt.y).toFixed(1)}" r="3.5"
     ><title>${esc(dayLabel(pt.x,true))} — cum ${cash(pt.y)} (${pt.n} fill(s))</title></circle>`).join('');
  /* The year appears only when the span crosses one, decided from the data rather
     than always shown or always hidden: on a two-week chart "'26" twice is noise,
     and on one running from December into January its absence makes the axis lie
     about the order of its own ends. */
  const spansYears=pts.length>1
    &&String(pts[0].x).slice(0,4)!==String(pts[pts.length-1].x).slice(0,4);
  const labels=pts.map((pt,i)=>i===0||i===pts.length-1
    ? `<text class="axis" x="${sx(i).toFixed(1)}" y="${H-9}"
        text-anchor="${i?'end':'start'}">${esc(dayLabel(pt.x,spansYears))}</text>`:'').join('');
  /* Sign is encoded in the FILL, and the trick is that the area path is not cut
     up to do it. The one path is painted twice, each time clipped to a
     half-plane split at the zero line: brass above, red below. So the geometry
     stays a single expression -- no hunting for zero crossings, no interpolated
     junction points, and a series that dives and recovers three times needs no
     extra code. `y2` on the gradients is the zero line rather than the viewBox
     edge, so each fade is measured from break-even instead of being cropped
     mid-ramp.

     Both halves collapse harmlessly when the series stays one side of zero: the
     clip rect gets zero height and paints nothing, which is why this needs no
     `crosses` branch of its own. */
  const z=sy(0).toFixed(1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"
    preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="gpos" gradientUnits="userSpaceOnUse"
        x1="0" x2="0" y1="${PT}" y2="${z}">
        <stop class="gpos" offset="0%" stop-opacity=".28"/>
        <stop class="gpos" offset="100%" stop-opacity="0"/></linearGradient>
      <linearGradient id="gneg" gradientUnits="userSpaceOnUse"
        x1="0" x2="0" y1="${z}" y2="${H-PB}">
        <stop class="gneg" offset="0%" stop-opacity="0"/>
        <stop class="gneg" offset="100%" stop-opacity=".26"/></linearGradient>
      <clipPath id="cabove"><rect x="0" y="0" width="${W}" height="${z}"/></clipPath>
      <clipPath id="cbelow"><rect x="0" y="${z}" width="${W}"
        height="${(H-Number(z)).toFixed(1)}"/></clipPath>
    </defs>
    ${ticks}
    ${area?`<path d="${area}" fill="url(#gpos)" clip-path="url(#cabove)"/>
      <path d="${area}" fill="url(#gneg)" clip-path="url(#cbelow)"/>`:''}
    <path class="cline pos" d="${line}" fill="none"
      clip-path="url(#cabove)"/>
    <path class="cline neg" d="${line}" fill="none"
      clip-path="url(#cbelow)"/>
    ${dots}${labels}</svg>`;
}

/* ------------------------------------------------ calendar */
function calendar(){
  const s=S.state.stats;
  const by={}; (s.days||[]).forEach(dy=>by[dy.day]=dy);
  /* Under "All time" the payload's days span the whole account, but a grid can
     only draw one month -- and this fell back to month_range[0], the newest
     month of the account's LIFE. On the demo journal, whose activity ends in
     February, that drew a blank August beside pills reading "Green days 7":
     every one of those days was unreachable from the view claiming them. The
     newest month that actually HAS a day is the one worth landing on. */
  const active=(s.days||[]).map(dy=>dy.day.slice(0,7)).sort();
  /* A calday names the month to show, and outranks the month the dropdown
     would otherwise pick. Without this a link to #calday=2026-07-24 rendered
     AUGUST's grid with a panel captioned "2026-07-24 — 1 fill" beneath it and
     no cell highlighted: detail for a day that was not on screen. The day is
     the more specific instruction, and it only reaches here having survived
     draw()'s guard -- which proves it is in `s.days`, so the month it names is
     inside the period and its grid cannot come back empty. */
  const month=S.calday?S.calday.slice(0,7)
    :s.month!=='ALL'?s.month
    :(active[active.length-1]||(S.state.month_range||S.state.months||[])[0]);
  if(!month) return `${filters()}<div class="card"><div class="empty">no months with trades</div></div>`;
  const [Y,M]=month.split('-').map(Number);
  const first=new Date(Y,M-1,1), lead=first.getDay(), len=new Date(Y,M,0).getDate();
  /* Derived from the days actually ON the grid, not from the payload's
     period-wide totals. Those describe the whole selected period, so under
     "All time" a one-month grid sat next to an account-lifetime P&L and green
     and red day counts it could not account for. Deriving locally keeps this
     tab's own invariant -- its numbers move only with a control it displays --
     and for a specific month it reproduces s.green_days/s.red_days exactly,
     because the grid then holds every day the period has. */
  const shown=(s.days||[]).filter(dy=>dy.day.slice(0,7)===month);
  let total=0; shown.forEach(dy=>total+=dy.realized.base);
  const greenDays=shown.filter(dy=>dy.realized.base>0).length;
  const redDays=shown.filter(dy=>dy.realized.base<0).length;

  const cells=[];
  for(let i=0;i<lead;i++) cells.push(`<div class="day void"></div>`);
  for(let d=1;d<=len;d++){
    const key=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dy=by[key];
    const k=!dy?'':dy.realized.base>0?'g':dy.realized.base<0?'r':'';
    /* A day with fills is a drill-down target: clicking it lists that day's
       trades below the calendar. Only days with activity get the handler --
       an empty day has nothing to show, and making it clickable would
       promise detail that does not exist. */
    const sel=S.calday===key?' selected':'';
    cells.push(`<div class="day ${k}${dy?' clk':''}${sel}"${dy?` data-calday="${key}"`:''}>
      <div class="top"><span class="dnum">${d}</span>
        <span class="dct">${dy?dy.trades+(dy.trades===1?' fill':' fills'):''}</span></div>
      <div class="dpl ${dy&&!k?'dim':''}">${dy?(k?moneyOf(dy.realized):'—'):'<span class="dim2">—</span>'}</div>
    </div>`);
  }
  /* Prev/next walk month_range -- the account's life -- not the fills-only
     list. They mutate S.month through the same load() path as the dropdown, so
     the two controls cannot disagree. At either end the chevron disables. */
  const range=S.state.month_range||S.state.months||[];
  const idx=range.indexOf(month);
  const prev=idx>=0&&idx<range.length-1?range[idx+1]:null; /* newest-first */
  const next=idx>0?range[idx-1]:null;
  const nav=`<span class="calnav">
    <button data-calmonth="${prev||''}" ${prev?'':'disabled'} title="${prev?monthLabel(prev):'account start'}">‹</button>
    <button data-calmonth="${next||''}" ${next?'':'disabled'} title="${next?monthLabel(next):'current month'}">›</button></span>`;
  return `${filters()}
  <div class="card">
    <div class="crow"><div><h2>${esc(monthLabel(month))} ${nav}</h2>
      <div class="sub">Daily realised P&L. An options outcome lands, whole, on the
      day the round trip closed — so a day with only opening or partial-close
      fills shows the activity and a dash, not money.</div></div>
      <div class="pills">
        <span class="pill">Month P/L <b class="${cls(total)}">${cash(total)}</b></span>
        <span class="pill">Green days <b>${greenDays}</b></span>
        <span class="pill">Red days <b>${redDays}</b></span>
      </div></div>
    ${s.month==='ALL'&&active.length?`<div class="note">Showing <b>${esc(monthLabel(month))}</b>,
      the most recent month with activity. The pills describe this month; the
      account-wide figures are on <b>Dashboard</b> and <b>Annual</b>. Use the
      chevrons or the month selector to walk the rest.</div>`:''}
    <div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
      .map(d=>`<div class="dow">${d}</div>`).join('')}</div>
    <div class="cal mt-1">${cells.join('')}</div>
    ${dayDetail(by)}
  </div>`;
}

function dayDetail(by){
  /* The clicked day's trades, from the leg data already in the payload --
     no extra request. Legs are matched by their own fill date, so this shows
     the day's ACTIVITY; the day cell's money remains close-attributed P&L,
     and the two can legitimately differ (an opening day shows fills and a
     dash). The panel says which day it describes rather than leaving the
     reader to infer it from the highlight. */
  const key=S.calday;
  if(!key) return `<div class="note">Click a day with fills to see its trades.</div>`;
  if(!by[key]){S.calday=null;return '';} /* heal: selection from another month */
  const groups=S.state.strategies||[];
  const rows=[];
  groups.forEach(g=>(g.orders||[]).forEach(o=>(o.legs||[]).forEach(l=>{
    if(String(l.first_fill_at||'').slice(0,10)===key)
      rows.push({g,o,l});
  })));
  if(!rows.length) return `<div class="note">No leg detail for ${esc(key)} —
    fills exist but their orders are outside the current filter.</div>`;
  return `<div class="grp mt-3">
    <div class="gh"><span class="gl">${esc(key)} — ${rows.length} fill(s)</span>
      <button class="linkish" data-calday-clear="1">clear</button></div>
    ${rows.map(({g,l})=>legRow(l,
      `<span class="dim lbl-sm">${esc(g.label)}</span>`)).join('')}
  </div>`;
}

/* ------------------------------------------------ trades / strategy */
function actClass(a){const s=String(a||'').toUpperCase();
  return s==='BUY'?'buy':s==='SELL'?'sell':'';}
function actLabel(l){
  const bs=String(l.buy_sell||'').toUpperCase(), oc=String(l.open_close||'').toUpperCase();
  if(bs==='SELL') return oc==='O'?'STO':'STC';
  if(bs==='BUY')  return oc==='O'?'BTO':'BTC';
  return oc||'—';
}
function legRow(l,extra=''){
  /* One fill line, shared by the Trades cards and the calendar drill-down --
     the same leg must read identically wherever it appears, and this line
     had already been copied once. `extra` is the one real divergence: the
     drill-down wedges the strategy label between contract and quantity,
     because there the leg appears outside its strategy card; the Trades
     card, already under its strategy header, passes nothing. */
  return `<div class="leg${extra?' ctx':''}">
    <span class="act ${actClass(l.buy_sell)}">${esc(actLabel(l))}</span>
    <span class="mono">${esc(l.underlying_symbol||l.symbol||'')}
      <b>${strike(l.strike)}${esc(l.put_call||'')}</b>
      <span class="dim">${esc(l.expiry||'')}</span></span>
    ${extra}
    <span class="mono dim">×${Math.abs(l.quantity)}</span>
    <span class="mono" title="fill price, always in the contract's own currency"
      >${money(l.avg_price,l.currency)}</span>
    <span class="mono ${cls(l.money.proceeds.base)}">${moneyOf(l.money.proceeds)}</span>
  </div>`;
}
/* ------------------------------------------------ replay */
/* Bars are stored epoch UTC and read in EXCHANGE time, not the reader's. The
   x axis of a trading chart has to agree with the session: a 09:30 ET open
   rendered in Irish local time reads 14:30, and every "what happened at the
   open" question then needs mental arithmetic. Every contract in this journal
   is US-listed, so one zone covers it; a non-US underlying would need its own
   exchange zone rather than this constant. */
const MKT='America/New_York';
const rstamp=(ts,size)=>new Date(ts*1000).toLocaleString(undefined,
  size==='1h'?{timeZone:MKT,month:'short',day:'numeric',hour:'numeric'}
             :{timeZone:MKT,year:'2-digit',month:'short',day:'numeric'});
/* The bar's calendar day at the exchange, for finding session boundaries.
   'en-CA' because it yields YYYY-MM-DD, so string equality is date equality. */
const etday=ts=>new Date(ts*1000).toLocaleDateString('en-CA',{timeZone:MKT});

/* Geometry of the panel currently on screen, so the scrubber can move a clip
   rect and a crosshair without re-rendering the page. Only ONE panel is ever
   open (S.replay is a single key), so fixed element ids are unambiguous.
   Everything else on this page redraws wholesale on interaction, which is right
   for a click and wrong for a continuous drag. */
let RGEO=null, RTIMER=null;
/* The events a replay can place on the timeline: those carrying a real epoch.
   ONE filter, because two readers must agree about the set -- the geometry
   decides which cards `replaySeek` reveals, and the renderer decides which cards
   exist to be revealed. Spelled twice, a card could exist and never be reached,
   or be reached and not exist. `Number.isFinite` rather than the bare global:
   `isFinite("")` is true, so a blank stamp used to pass as a timestamp. */
const timedEvents=rp=>(rp.events||[]).filter(e=>e&&Number.isFinite(e.ts));

/* Wall-clock a whole replay takes at 1x, whatever its length -- the constant the
   speed control is a multiplier OF. What a reader asks for is "watch this trade",
   so the duration is the thing to fix and the bars-per-second is what follows;
   see barsPerMs. 20s is long enough to follow a 24-bar strangle bar by bar and
   short enough that 10x (2s) is still a glance rather than a jump. */
const REPLAY_SECONDS=20;

/* cancelAnimationFrame, since playback is a rAF loop rather than an interval --
   it used to step one whole bar per setInterval tick, which is what made the
   marker jump between data points. RTIMER is nulled BEFORE the cancel so a frame
   already queued sees the null and returns instead of scheduling another. */
function replayStop(){ if(RTIMER!==null){const h=RTIMER;RTIMER=null;cancelAnimationFrame(h);} }

function replayChart(rp){
  const pts=(rp.points||[]).filter(p=>p&&isFinite(p[1]));
  if(pts.length<MIN_POINTS) return `<div class="empty">no price bars stored for ${
    esc(rp.underlying||'this underlying')} yet — run <code>optjournal bars</code></div>`;
  const sks=(rp.strikes||[]).filter(sk=>sk&&isFinite(sk.strike));
  const W=920,H=280,L=52,R=46,T=22,B=30, iw=W-L-R, ih=H-T-B;
  const mks=rp.marks||[];
  /* Every scale below comes from /static/replay.js, which node unit-tests. The
     page keeps only the markup: a wrong <text> shows up in the sweep's rendered
     DOM, whereas a wrong scale renders perfectly and is simply untrue. */
  const geo=plotGeometry(pts,sks,rp.band||[],{left:L,top:T,width:iw,height:ih});
  const dp=geo.span>40?0:2;
  const yticks=[0,0.25,0.5,0.75,1].map(f=>geo.lo+f*geo.span).map(v=>
    `<line class="gr" x1="${L}" y1="${geo.yOf(v).toFixed(1)}" x2="${L+iw}" y2="${
      geo.yOf(v).toFixed(1)}"/><text class="tk" x="${L-7}" y="${
      (geo.yOf(v)+3.5).toFixed(1)}" text-anchor="end">${num(v,dp)}</text>`).join('');
  /* Ticks land on real bars, not on an even split of the span: an interpolated
     label can name a timestamp that has no bar -- a weekend midnight. */
  const xticks=[0,0.5,1].map(f=>Math.round(f*(pts.length-1))).map((ix,i)=>
    `<text class="tk" x="${geo.xs[ix].toFixed(1)}" y="${H-10}" text-anchor="${
      i===0?'start':i===2?'end':'middle'}">${esc(rstamp(pts[ix][0],rp.bar_size))}</text>`
  ).join('');
  /* Only for hourly: on a daily series every bar IS a session, so a rule per
     bar would be a picket fence rather than information. */
  const breaks=rp.bar_size!=='1h'?'':sessionBreaks(pts,etday).map(i=>{
    const x=((geo.xs[i-1]+geo.xs[i])/2).toFixed(1);
    return `<line class="sess" x1="${x}" y1="${T}" x2="${x}" y2="${T+ih}"/>`;
  }).join('');
  const line=pts.map((p,i)=>`${geo.xs[i].toFixed(1)},${geo.yOf(p[1]).toFixed(1)}`).join(' ');
  /* SEGMENTS, not full-width rules: a strike drawn edge to edge claims to have
     existed for the whole chart, including the context before entry and every
     bar after a roll moved it elsewhere. Coloured by right and dashed by side,
     so put/call and short/long are two independent readings of one line -- the
     encoding the reference implementation uses, which is why it needs no label
     per line beyond the strike itself. */
  const strikes=sks.map(sk=>{
    const y=geo.yOf(sk.strike), sp=strikeSpan(sk,geo,{left:L,width:iw});
    const kind=String(sk.put_call||'').toUpperCase()==='C'?'call':'put';
    return `<line class="sk ${kind}${sk.side==='long'?' long':''}" x1="${
      sp.x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${sp.x2.toFixed(1)}" y2="${
      y.toFixed(1)}"/><text class="sklab ${kind}" x="${(sp.x1+4).toFixed(1)}" y="${
      (y-5).toFixed(1)}">${strike(sk.strike)}${esc(sk.put_call||'')}</text>`;
  }).join('');
  /* Effective delta on its OWN axis, because it is not a price: the sum of signed
     quantity times delta, so a delta-neutral strangle sits on the centre line and
     a short put rides above it. Dotted to stay subordinate -- a derived
     sensitivity, not something that traded. */
  const dd=deltaDomain(mks);
  const y2=v=>T+ih/2-(v/dd.reach)*(ih/2);
  /* One polyline PER HOLDING PERIOD, not one across the whole series. Delta is
     null on any bar holding nothing, and a single line over those would glide
     from the last real delta to the first one after the gap -- drawing exposure
     across a stretch that had none. The split is deltaSegments', in the tested
     module. A one-bar holding gets a dot, because a polyline of one point draws
     nothing and a position held for a single bar is not nothing. */
  const dsegs=!dd?[]:deltaSegments(mks,geo,y2);
  const dline=dsegs.map(seg=>seg.length<2
    ?`<circle class="ddot" cx="${seg[0][0].toFixed(1)}" cy="${
      seg[0][1].toFixed(1)}" r="1.6"/>`
    :`<polyline class="dline" points="${
      seg.map(q=>`${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' ')}"/>`).join('');
  const dax=!dd?'':[dd.reach,0,-dd.reach].map(v=>
    `<text class="tk dax" x="${L+iw+6}" y="${(y2(v)+3.5).toFixed(1)}">${
      num(v,2)}</text>`).join('')
    +`<line class="zero" x1="${L}" y1="${y2(0).toFixed(1)}" x2="${L+iw}" y2="${
      y2(0).toFixed(1)}"/>`;
  /* Expected move, one standard deviation to the position's expiry, from the
     implied vol backed out of the option's OWN closes. Spot and time-to-expiry
     are per bar so the envelope moves and tapers hourly; the vol input steps
     daily, because the source serves no intraday option history at all. */
  const edges=bandEdges(rp.band||[],geo);
  const fmt=xy=>xy.map(q=>`${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' ');
  const band=!edges.upper.length?'':
    `<polygon class="emband" points="${fmt(edges.upper.concat(
      edges.lower.slice().reverse()))}"/>`
    +`<polyline class="emedge" points="${fmt(edges.upper)}"/>`
    +`<polyline class="emedge" points="${fmt(edges.lower)}"/>`;
  /* Entry and exit as labelled rules rather than a shaded span: the band is
     already a filled region, and a second translucent fill over it went muddy
     without telling the reader anything the two rules do not. */
  const edge=(m,cls,label)=>!m?'':`<line class="${cls}" x1="${m.x.toFixed(1)}" y1="${
    T}" x2="${m.x.toFixed(1)}" y2="${T+ih}"/><text class="edgelab" x="${
    (m.x+4).toFixed(1)}" y="${T+11}">${label}</text>`;
  const dots=(rp.fills||[]).map(ts=>geo.at(ts)).filter(Boolean).map(m=>
    `<circle class="fill" cx="${m.x.toFixed(1)}" cy="${m.y.toFixed(1)}" r="3.2"/>`).join('');
  RGEO={points:pts,marks:rp.band?rp.marks||[]:[],xs:geo.xs,size:rp.bar_size,dp:dp,
    events:timedEvents(rp)};
  const opening=frameAt(RGEO,pts.length-1);
  /* The legend states the encoding rather than making the reader infer it: a
     dashed line means two different things on this chart (a long strike, and the
     expected-move edge), and hue means put or call rather than profit or loss.
     Rendered only for what is actually drawn -- a legend entry for an absent
     series is a promise the picture does not keep. */
  const key=[
    sks.some(sk=>String(sk.put_call).toUpperCase()==='P')
      ?'<span class="lg put">—</span> put strike':'',
    sks.some(sk=>String(sk.put_call).toUpperCase()==='C')
      ?'<span class="lg call">—</span> call strike':'',
    sks.some(sk=>sk.side==='long')?'<span class="dim2">dashed = bought</span>':'',
    '<span class="lg px">—</span> underlying',
    dd?'<span class="lg dl">···</span> eff Δ (right)':'',
    edges.upper.length?'<span class="lg em">▬</span> expected move (1 SD)':'',
  ].filter(Boolean).join('<span class="dim2"> · </span>');
  return `<div class="rkey">${key}</div>
  <div class="rwrap">
  <svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet"
    ><title>${esc(rp.underlying||'')} ${num(pts[0][1],dp)} → ${
      num(pts[pts.length-1][1],dp)} across ${pts.length} ${
      rp.bar_size==='1h'?'hourly':'daily'} bars</title>
    <defs><clipPath id="rclip"><rect id="rclipr" x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>
    ${yticks}${dax}${breaks}
    <line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${T+ih}"/>
    <line class="ax" x1="${L}" y1="${T+ih}" x2="${L+iw}" y2="${T+ih}"/>
    <g clip-path="url(#rclip)">${band}${strikes}${
      edge(geo.at(rp.opened_ts),'edge in','entry')}${
      edge(geo.at(rp.closed_ts),'edge out','exit')}${dline}<polyline class="pxline" points="${
      line}"/>${dots}</g>
    <line id="rcross" class="cross" x1="${geo.xs[pts.length-1].toFixed(1)}" y1="${T}" x2="${
      geo.xs[pts.length-1].toFixed(1)}" y2="${T+ih}"/>
    ${xticks}</svg>
  <div class="rfocus" id="rfocus"></div></div>
  <div class="rctl">
    <button class="rbtn" data-rseek="0" title="to the start">|◀</button>
    <button class="rbtn" data-rplay="1">▶ play</button>
    <button class="rbtn" data-rseek="${pts.length-1}" title="to the end">▶|</button>
    <input class="rscrub" id="rscrub" type="range" min="0" max="${pts.length-1}"
      value="${pts.length-1}" step="1" aria-label="replay position">
    <!-- A MULTIPLIER of the whole replay's duration, not milliseconds per bar.
         The old values were ms/bar, which made one setting mean a different
         promise on every trade: at "1x" a 24-bar strangle took 6s and a 461-bar
         LEAP took nearly two minutes. Now 1x is REPLAY_SECONDS end to end
         whatever the length, and the multiplier divides it -- see barsPerMs. -->
    <select class="rspeed" id="rspeed" aria-label="playback speed">
      <option value="1">1×</option><option value="2">2×</option>
      <option value="4">4×</option><option value="10">10×</option>
    </select>
    <label class="rauto"><input type="checkbox" id="rloop"> loop</label>
    <!-- Halting at each decision is the DEFAULT: the cards exist to be read, and
         at 4x an event card used to be lit for a third of a second. Unchecking
         it plays the trade straight through. -->
    <label class="rauto" title="halt at each decision so its card can be read"
      ><input type="checkbox" id="rstops" checked> stop on events</label>
    <span class="rread mono" id="rread">${replayReadout(opening,rp.bar_size,dp)}</span>
  </div>${replayEvents(rp,pts)}`;
}

/* One card per decision on the timeline. Rendered once and toggled by class as
   the replay reaches each one -- rebuilding the strip on every scrub tick would
   discard the DOM 240 times a second during playback to change one attribute.

   Each card seeks to its own event, which makes the strip a table of contents
   for the trade: click "Short put close" to jump the chart to the buyback. */
function replayEvents(rp,pts){
  const evs=timedEvents(rp);
  if(!evs.length) return '';
  return `<div class="evs">${evs.map(e=>{
    const legs=(e.legs||[]).map(l=>
      `<div><span class="${actClass(l.buy_sell)}">${esc(actLabel(l))}</span> ${
        num(l.quantity,0)} × ${strike(l.strike)}${esc(l.put_call||'')} @ ${
        num(l.avg_price,2)}</div>`).join('');
    /* Credit or debit named rather than shown as a signed number: "−$780" is
       ambiguous about whether the trade received or paid, and which one it was
       is the first thing you want off a closing card. */
    const flow=!e.cash?'':`${Number(e.cash.native)<0?'debit':'credit'} ${
      moneyOf(e.cash)}`;
    /* Δ before → after, where NULL on either side means "no position", not zero:
       an opening event has no before, and a closing one has no after. Naming the
       empty side "flat" rather than dropping the row is what makes a close state
       the exposure it removed -- the row used to vanish entirely whenever `after`
       was null, which is exactly the closing event whose delta matters most. */
    const dnum=v=>v==null?'flat':num(v,2);
    const dl=(e.delta_before==null&&e.delta_after==null)?''
      :`Δ ${e.delta_before==null?'':dnum(e.delta_before)+' → '}${
        dnum(e.delta_after)}`;
    const bits=[flow,
      e.commission?`comm ${moneyOf(e.commission)}`:'',
      e.realized?`realised <b class="${cls(e.realized.native)}">${
        moneyOf(e.realized)}</b>`:'',
      dl].filter(Boolean).join('<span class="dim2"> · </span>');
    return `<div class="evc" data-rts="${e.ts}" data-rseek="${
      indexOfTs(pts,e.ts)}" role="button" tabindex="0"
      title="jump the replay here"><div class="evh"><span class="evk ${
      esc(e.kind)}">${esc(e.kind)}</span><span class="evt">${
      esc(e.label||'')}</span><span class="evw mono">${esc(e.at||'')}</span></div>
      <div class="evl mono">${legs}</div><div class="evm">${bits}</div></div>`;
  }).join('')}</div>`;
}

/* The event the replay is PARKED on, over the chart.

   An overlay rather than only the strip below, because playback now halts here:
   a stop the reader has to look away from the chart to understand is a stop that
   reads as a stall. It states what changed at this instant and waits.

   One node, rewritten per stop, rather than one per event kept in the DOM. The
   strip is already the full table of contents; this is the single card for the
   single moment playback is holding, so there is nothing to toggle and no set to
   keep in sync -- and the reader dismisses it to see the chart underneath.

   Every figure is the strip card's, read off the same event object. Two
   renderers over one event could disagree about a roll's credit, and the panel
   would then contradict itself depending on where you looked. */
function replayFocus(e,resume){
  const host=$('#rfocus');
  if(!host) return;
  if(!e){host.innerHTML='';host.classList.remove('on');return;}
  /* Strikes as the roll itself reads: what closed, then what opened. A roll's
     whole content is that substitution, and naming both sides is what makes the
     card answer "why did that line move" without the reader inferring it. */
  const legOf=m=>(e.legs||[]).filter(l=>
    String(l.open_close||'').toUpperCase()===m)
    .map(l=>`${strike(l.strike)}${esc(l.put_call||'')}`).join(' + ');
  const closed=legOf('C'), opened=legOf('O');
  const moved=closed&&opened?`${closed} <span class="fa">→</span> ${opened}`
    :(opened||closed);
  /* Same rule as the strip card, and the same reason: null is "no position", so
     it reads "flat" rather than dropping the row or printing 0.00. A closing
     event's whole point is the exposure it removed. */
  const dnum=v=>v==null?'flat':num(v,2);
  const rows=[
    (e.delta_before==null&&e.delta_after==null)?null:['eff Δ', `${
      e.delta_before==null?'':dnum(e.delta_before)+' <span class="fa">→</span> '
      }${dnum(e.delta_after)}`],
    moved?['strikes', moved]:null,
    /* Named, not signed: "−$780" is ambiguous about who paid whom, and that is
       the first thing wanted off a closing card. Matches the strip exactly. */
    !e.cash?null:[Number(e.cash.native)<0?'debit':'credit',
      `<b class="${Number(e.cash.native)<0?'neg':'pos'}">${moneyOf(e.cash)}</b>`],
    !e.realized?null:['realised',
      `<b class="${cls(e.realized.native)}">${moneyOf(e.realized)}</b>`],
    !e.commission?null:['commission', moneyOf(e.commission)],
  ].filter(Boolean).map(([k,v])=>
    `<div class="fr"><span class="fk">${k}</span><span class="fv mono">${v}</span></div>`
  ).join('');
  host.innerHTML=`<div class="fcard" role="dialog" aria-label="${
    esc(e.label||'event')}"><div class="fh"><span class="ft">${esc(e.label||'')}</span>
    <button class="fx" id="rfx" aria-label="dismiss and continue">×</button></div>
    <div class="fw mono">${esc(e.at||'')}</div>${rows}</div>`;
  host.classList.add('on');
  /* Dismissing RESUMES. The card is what playback stopped for, so closing it is
     the reader saying "read it, carry on" -- and the aria-label has always said
     "dismiss and continue". Leaving it merely cleared meant the only way onward
     was the play button, which put the one control that matters at this moment
     somewhere other than where the reader is already looking.

     Guarded on `resume` so this stays true only of the parked-by-playback case:
     a card raised by CLICKING an event in the strip is a lookup, not a pause, and
     starting playback from it would march the chart away from the bar just asked
     for. replayFocus(null) also passes no resume, so every programmatic clear
     (a scrub, pressing play) still just hides the card.

     Not `x` for the button -- that name is bound to an Episode in the payload
     contract, and one name for two shapes blinds the binding guard to both. */
  const dismiss=$('#rfx');
  if(dismiss) dismiss.onclick=()=>{replayFocus(null);if(resume) resume();};
}

/* The scrubbed bar in words. Shared by the initial render and every seek, so the
   two cannot drift into disagreeing about the same frame. */
function replayReadout(fr,size,dp){
  const when=`${esc(rstamp(fr.ts,size))} · ${num(fr.price,dp)}`;
  if(fr.pnl==null) return `${when} · <span class="dim2">no mark</span>`;
  /* money(), not cash(): the modelled figure is in the CONTRACT's currency, and
     cash() restates a base-currency amount into the display one. Running a USD
     model output through it would relabel dollars as euros without converting
     them -- the exact class of error the Money type exists to prevent, which is
     why this figure is never mixed into a base-currency total. */
  /* "flat" rather than "Δ 0.00" off-position. Delta is null on a bar holding
     nothing, and num(null) is null -- which would print the word "null" beside a
     real P&L. Naming the state is also the more useful readout: the figure is
     absent because there is no position, not because the exposure was zero. */
  const dl=fr.delta==null?'<span class="dim2">flat</span>':`Δ ${num(fr.delta,2)}`;
  return `${when} · <b class="${cls(fr.pnl)}">${money(fr.pnl,'USD',2)}</b> `
    +`<span class="dim2">est. P&L · </span>${dl}`;
}

/* Scrubber, playback and readout. These mutate the open panel IN PLACE rather
   than going through draw(): a click is a state change worth re-rendering for,
   a continuous drag is not, and re-rendering the whole page per scrub tick
   would rebuild every card to move one rect. */
function replaySeek(i){
  if(!RGEO) return;
  /* All the arithmetic is frameAt's, in the unit-tested module. This function is
     the DOM half and nothing else: which attributes to set, on which elements.
     That division is what lets "scrubbing to bar 7 selects bar 7" be a test
     rather than something only a human clicking can confirm. */
  const fr=frameAt(RGEO,i);
  const clip=$('#rclipr'), cross=$('#rcross'), read=$('#rread');
  if(clip) clip.setAttribute('width', fr.revealWidth.toFixed(1));
  if(cross){cross.setAttribute('x1',fr.x.toFixed(1));
    cross.setAttribute('x2',fr.x.toFixed(1));}
  if(read) read.innerHTML=replayReadout(fr,RGEO.size,RGEO.dp);
  /* Which cards the replay has reached is reachedEvents' decision, in the tested
     module -- it is the half that has to agree with the clip on the fill dots.
     `now` marks the most recent one, so during playback the strip reads as a
     cursor moving through the trade rather than as a set that only grows. */
  const reached=reachedEvents(RGEO.events||[],fr.ts);
  const latest=reached.length?reached[reached.length-1]:null;
  document.querySelectorAll('.evc').forEach(el=>{
    const ts=Number(el.dataset.rts);
    el.classList.toggle('on',reached.includes(ts));
    el.classList.toggle('now',ts===latest);
  });
  return fr.index;
}
function bindReplayControls(){
  const scrub=$('#rscrub'), speed=$('#rspeed'), play=document.querySelector('[data-rplay]');
  if(!scrub) return;
  /* Sync once on open. The cards render hidden and are revealed by replaySeek, so
     without this the strip would stay blank until the first interaction even
     though the scrubber already sits at the end with everything reached. One
     source of truth for "what is revealed at frame i" rather than two. */
  replaySeek(Number(scrub.value));
  /* Dragging dismisses the parked card: the reader has taken the timeline back
     into their own hands, and a card naming the instant they scrubbed away from
     would be describing somewhere the chart no longer is. */
  scrub.oninput=()=>{replayStop();if(play)play.textContent='▶ play';
    replayFocus(null);replaySeek(Number(scrub.value));};
  if(play) play.onclick=()=>{
    if(RTIMER!==null){replayStop();play.textContent='▶ play';return;}
    /* Restart from the beginning when the cursor is already at the end,
       otherwise pressing play on a finished replay does nothing visible. */
    if(Number(scrub.value)>=Number(scrub.max)) scrub.value='0';
    play.textContent='❚❚ pause';
    /* Pressing play dismisses the parked card. It is the answer to "I have read
       this, continue" -- leaving it up would have it hang over a moving chart
       and describe an instant the replay has left. */
    replayFocus(null);
    const max=Number(scrub.max);
    let position=Number(scrub.value), last=null;
    /* Bars per millisecond from the LENGTH, so the setting means "this replay in
       REPLAY_SECONDS/speed" rather than "this many ms per bar". A fixed ms/bar
       made 1x take 6s on a strangle and nearly two minutes on the LEAP. */
    const rate=barsPerMs(RGEO?RGEO.points.length:max+1,
                         REPLAY_SECONDS, Number((speed&&speed.value)||1));
    /* The bar to halt on, decided once per play rather than tested per frame:
       nextStop is exclusive of where we stand, so re-deriving it mid-flight
       would keep finding the same stop and never move. null means run to the
       end. Unchecking the box opts out entirely.

       `from` is the CURRENT bar, not one behind it. nextStop is already
       exclusive, so passing position-1 asked "what comes after the bar before
       this one" and got back the stop we are parked ON -- play halted instantly
       at the same bar and the replay could never be resumed past its first
       event. Caught by driving the real page, which is why this is the value the
       test now pins. */
    const stops=$('#rstops');
    const halt=(stops&&stops.checked)&&RGEO
      ?nextStop(RGEO.events||[],RGEO.points,Math.round(position)):null;
    const tick=(now)=>{
      if(RTIMER===null) return;                    /* stopped mid-frame */
      if(last===null) last=now;
      position+=(now-last)*rate;
      last=now;
      /* A stop is honoured BEFORE the end check, so an event on the last bar
         parks on its card instead of being overtaken by the finish. */
      if(halt!==null&&position>=halt){
        scrub.value=String(halt);replaySeek(halt);
        replayStop();play.textContent='▶ play';
        /* The card for the bar just landed on, by the same timestamp the strip
           uses -- one lookup, so the overlay cannot describe a different event
           than the one highlighted below it. */
        const at=(RGEO.events||[]).filter(e=>
          indexOfTs(RGEO.points,e.ts)===halt);
        /* Closing THIS card carries on, because playback is what raised it. The
           resume is `play.onclick` itself rather than a copy of the loop: one
           entry point, so dismissing a card and pressing play cannot diverge --
           and the handler already re-derives the next stop from where we now
           stand, which is what carries the replay to the following event. */
        replayFocus(at.length?at[at.length-1]:null,()=>play.onclick());
        return;
      }
      if(position>=max){
        /* Loop rather than stop, when asked. A short trade is 20-odd bars, which
           is over in a few seconds -- watching it twice is often how the shape
           registers. */
        const loop=$('#rloop');
        if(loop&&loop.checked){position=0;}
        else{scrub.value=String(max);replaySeek(max);
             replayStop();play.textContent='▶ play';return;}
      }
      /* The range input is integral, so it tracks the nearest bar while the
         drawing follows the fraction -- the scrubber stays a bar selector. */
      scrub.value=String(Math.round(position));
      replaySeek(position);
      RTIMER=requestAnimationFrame(tick);
    };
    RTIMER=requestAnimationFrame(tick);
  };
  if(speed) speed.onchange=()=>{ if(RTIMER!==null&&play){play.onclick();play.onclick();} };
  /* Jump to either end, or to an event. Stops playback first: leaving a timer
     running would have it march away from the position just asked for. The
     annotation cards carry data-rseek too, which makes the strip a table of
     contents -- and since they are role=button, Enter and Space have to work. */
  document.querySelectorAll('[data-rseek]').forEach(el=>{
    const seek=()=>{replayStop();if(play)play.textContent='▶ play';
      scrub.value=el.dataset.rseek;replaySeek(Number(scrub.value));
      /* Clicking an event's own card raises the overlay for it; the end/start
         buttons carry no timestamp and simply clear it. Same lookup as the
         playback halt, so both routes to a card show the identical one. */
      const ts=Number(el.dataset.rts);
      const at=(RGEO&&Number.isFinite(ts))
        ?(RGEO.events||[]).filter(e=>e.ts===ts):[];
      replayFocus(at.length?at[0]:null);};
    el.onclick=seek;
    if(el.getAttribute('role')==='button')
      el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();seek();}};
  });
}

function replayPanel(rp,label,valueHtml){
  const bars=rp.bar_size==='1h'?'hourly bars':rp.bar_size==='1d'?'daily bars':'no bars';
  const when=rp.opened_at?`${esc(String(rp.opened_at).slice(0,16))}${
    rp.closed_at?` → ${esc(String(rp.closed_at).slice(0,16))}`:' → open'}`
    :'entry date unknown — every bar held';
  return `<div class="replay"><div class="crow">
    <div><div class="kicker">replay · ${esc(rp.underlying||'?')} underlying</div>
      <div class="sub mono">${when} · ${esc(bars)} · times ET</div></div>
    <div class="pills"><span class="pill">${esc(label)} ${valueHtml}</span></div>
  </div>${replayChart(rp)}
  <div class="note">The line is the UNDERLYING's price, not the option's — it is
    what the strikes are read against. Each strike spans only the period it was
    held; hue says put or call, and a dashed one was bought rather than sold.
    Everything that states a fact about the trade is hidden ahead of the
    scrubber, so a replay cannot show you its own outcome. Expected move and
    eff Δ are modelled from the vol implied by the option's own closes AND by
    your fills, so they are estimates: the card above states the figure the
    broker billed.</div></div>`;
}

function trades(){
  /* One card per POSITION LIFECYCLE: a short put opened in July and bought
     back in August is one position with two events, not two unrelated
     trades. The linkage is the episode layer's, not a display heuristic --
     the open and the close share a FIFO episode keyed by conid, so the
     grouping can never join two different contracts or split one. Below the
     lifecycle, each EVENT (the strategy-grouped orders from strategies.py)
     stays fully visible with its legs, so the order-level truth is intact.
     Realised P&L and commission are episode-sourced and appear only once
     the lifecycle is closed -- the same rule the Dashboard follows. */
  const lcs=S.state.lifecycles||[];
  if(!lcs.length) return `${filters()}<div class="card"><div class="empty">no option orders</div></div>`;
  return filters()+lcs.map(lc=>{
    const evs=lc.events||[];
    const legs=evs.flatMap(g=>(g.orders||[]).flatMap(o=>o.legs||[]));
    const nat=legs[0]?legs[0].currency:'';
    const openLc=lc.status==='open';
    const when=openLc?`opened ${esc((lc.opened_at||'').slice(0,10))} · still open`
      :`${esc((lc.opened_at||'').slice(0,10))} → ${esc((lc.closed_at||'').slice(0,10))}`;
    /* Unrealised for an open lifecycle comes from the position snapshot, summed
       over the legs this lifecycle holds -- realised money does not exist until
       the position is flat, the same rule the Dashboard and the stat cards
       follow. Summed in base through `.base` because two legs can be quoted in
       different currencies, which is what the Money gate exists to catch. */
    const rp=(S.state.replays||{})[lc.replay_key];
    const shown=S.replay===lc.replay_key;
    let uz=0; (S.state.positions||[]).forEach(pos=>{
      if((lc.conids||[]).map(String).includes(String(pos.conid)))
        uz+=(pos.unrealized.base||0);});
    const score=openLc?['Unrealised',`<b class="${cls(uz)}">${cash(uz)}</b>`]
      :['Realised',`<b class="${cls(lc.realized_pnl?.base)}">${
        lc.realized_pnl!=null?moneyOf(lc.realized_pnl):'—'}</b>`];
    return `<div class="card">
      <div class="crow${rp?' rk':''}"${rp?` data-replay="${esc(lc.replay_key)}"`:''}><div><h2>${
        esc(lc.underlying||'?')}
        <span class="dim lbl">${esc(lc.label)}</span>
        <span class="pill gap"
          >${openLc?'OPEN':'CLOSED'}</span></h2>
        <div class="sub mono">${when} · ${lc.fills} fill(s) · ${evs.length} event(s)</div></div>
        ${rp?`<div class="rhint">${shown?'hide replay':'replay'
          } <span class="caret${shown?' open':''}">▸</span></div>`:''}
      </div>
      ${shown&&rp?replayPanel(rp,score[0],score[1]):''}
      <div class="stats">
        ${statCard('Proceeds', moneyOf(lc.proceeds),
          nat&&nat!==DISP()?`${money(legs.reduce((a,l)=>a+(l.proceeds||0),0),nat)} as filled`:'',
          'sm '+cls(lc.proceeds.base))}
        ${statCard('Comms & Fees',
          lc.commission!=null?moneyOf(lc.commission):'—',
          openLc?'lands with the outcome, on close':'all legs, whole lifecycle',
          'sm '+cls(lc.commission?.base))}
        ${statCard('Realised P&L',
          lc.realized_pnl!=null?moneyOf(lc.realized_pnl):'—',
          openLc?'nothing counts until the position is flat':'net of commission',
          'sm '+cls(lc.realized_pnl?.base))}
      </div>
      ${evs.map(g=>{
        const glegs=(g.orders||[]).flatMap(o=>o.legs||[]);
        /* Inside its own card, an event whose shape merely repeats the
           card's is noise: a "Short put" lifecycle does not need its events
           captioned "Short put" and "Short put close" -- those are "Opened"
           and "Closed" here. An event that carries NEW information (a Roll,
           a different shape added to a campaign) keeps its full name. Pure
           presentation: g.label itself is unchanged everywhere else the
           payload is read (the calendar drill-down has no card context, so
           it needs the full name). */
        const evl=g.label===lc.label?'Opened'
          :g.label===lc.label+' close'?'Closed':g.label;
        return `<div class="grp">
        <div class="gh"><span class="gl">${esc((g.first_fill_at||'').slice(0,10))} — ${
          esc(evl)} <span class="dim2 mono">order${(g.order_ids||[]).length>1?'s':''} ${
          esc((g.order_ids||[]).join(', '))}</span></span>
          <span class="mono ${cls(g.proceeds.base)}">${moneyOf(g.proceeds)}</span></div>
        ${glegs.map(l=>legRow(l)).join('')}
      </div>`;}).join('')}
      ${legs.length>1?'':`<div class="note">One leg, so this is a single-leg
        position rather than a strategy. Legs placed together on one underlying
        group into a named strategy the day it happens.</div>`}
      ${journalRow(lc)}
    </div>`;
  }).join('');
}

/* ------------------------------------------------ the journal layer */
/* The one thing on this page that is not derived from a statement.
 *
 * Everything else here can be rebuilt by re-ingesting `raw/`; a plan cannot, so
 * the editor is deliberately hard to lose text in. It opens on click and stays
 * open until the reader closes it, `draw()` never re-renders it from under them
 * (see `jrnl` in S on why it is not in the hash), and Save reports what the
 * server stored rather than assuming.
 */
const JENTRY=a=>((S.state.journal||{}).entries||{})[a]||null;
const JTRIGGERS=()=>((S.state.journal||{}).triggers||[]);
const JADHERE=()=>((S.state.journal||{}).adherence||['yes','no','na']);

/* Which of the fields carry something, so a card can say "written up" without
   the reader opening it. Counted rather than boolean: "4 notes" tells a reader
   whether they wrote a sentence or a whole review, and a badge that reads the
   same for both is a badge worth ignoring. */
function jcount(je){
  if(!je) return 0;
  return JFIELDS.filter(jf=>je[jf.name]!=null&&String(je[jf.name])!=='').length;
}

/* Every writable field, ONE list, in the order the form shows them. The names
   are `journal.FIELDS` and the server refuses anything else, so a typo here
   fails loudly rather than posting into nothing -- which is the whole reason the
   endpoint stopped filtering unknown names. */
const JFIELDS=[
  {name:'plan_target',at:'entry',label:'Exit plan — target',kind:'text',
   hint:'Where this comes off in profit. Written before the trade, so the version you can trust.'},
  {name:'plan_invalidation',at:'entry',label:'Exit plan — invalidation',kind:'text',
   hint:'What would say the idea was wrong. Not a price you fear: a condition you would act on.'},
  {name:'entry_note',at:'entry',label:'Why this trade',kind:'text',hint:''},
  {name:'followed_target',at:'close',label:'Followed the target plan?',kind:'choice',hint:''},
  {name:'why_not_target',at:'close',label:'If not, why',kind:'text',hint:''},
  {name:'followed_invalidation',at:'close',label:'Followed the invalidation plan?',
   kind:'choice',
   hint:'N/A is a real answer: a trade taken off at target never reached it.'},
  {name:'why_not_invalidation',at:'close',label:'If not, why',kind:'text',hint:''},
  {name:'exit_trigger',at:'close',label:'What actually took it off',kind:'trigger',hint:''},
  {name:'exit_trigger_other',at:'close',label:'Other — what',kind:'text',hint:''},
  {name:'lessons',at:'close',label:'Key lessons',kind:'text',hint:''},
  {name:'close_note',at:'close',label:'Closing notes',kind:'text',hint:''},
];

/* The badge on a card, and the button that opens the editor. Three states, not
   two: a decision with no anchor cannot be journalled at all, and saying so is
   better than a button that fails -- the position is held only as a snapshot, so
   there is no order to file writing under. */
function journalRow(lc){
  const a=lc.anchor;
  if(!a) return `<div class="note">No opening fills on record for this position,
    only a snapshot, so there is no order to attach a journal entry to.</div>`;
  const je=JENTRY(a), n=jcount(je), shownj=S.jrnl===a;
  const badge=n?`<span class="pill ok">written up <b>${n}</b></span>`
    :`<span class="pill dim">not written up</span>`;
  return `<div class="jrow">
    <div class="jsum">${badge}${je&&je.updated_at?`<span class="dim2 mono"
      >last written ${esc(String(je.updated_at).slice(0,10))}</span>`:''}</div>
    <button class="jbtn" data-jopen="${esc(a)}">${
      shownj?'close':(n?'edit the write-up':'write this up')}</button>
  </div>${shownj?journalForm(lc,je):''}`;
}

/* `data-subject` is the anchor, and it is not decoration. An id is unique per
   RENDER, not per subject: `#j-lessons` is the lessons box whichever decision is
   open, so opening another card's editor while text sits unsaved in this one would
   restore THIS decision's sentence under THAT decision's heading -- and Save would
   then file it there. `restoreInputs` refuses a restore across subjects, which is
   the same mechanism `#wearn` needed when selecting another watched symbol carried
   the previous symbol's typed date across. */
function jfield(jf,je,anchor){
  const v=(je&&je[jf.name]!=null)?String(je[jf.name]):'';
  const id='j-'+jf.name;
  const subj=` data-subject="${esc(anchor)}"`;
  const hint=jf.hint?`<span class="jh">${esc(jf.hint)}</span>`:'';
  /* A SELECT and not three radios, for a reason that outranks the nicer layout:
     `preserveInputs` is keyed by `id`, and radios sharing one `name` have no id
     to be keyed by -- so a pick made and not yet saved reverted on the next
     redraw, silently, and Save then wrote the answer the reader had replaced.
     Text was protected and a one-word answer was not, which is the worse half to
     lose: it lands in the adherence count. One control, one id, one mechanism,
     and the same shape as the trigger immediately below it. */
  const options=jf.kind==='choice'
    ?JADHERE().map(ans=>({key:ans,label:ans==='na'?'N/A':ans}))
    :JTRIGGERS();
  if(jf.kind!=='text')
    return `<label class="jf"><span class="jl">${esc(jf.label)}</span>
      <select id="${esc(id)}"${subj}><option value=""${v?'':' selected'}>—</option>
      ${options.map(trg=>`<option value="${esc(trg.key)}"${
        v===trg.key?' selected':''}>${esc(trg.label)}</option>`).join('')}</select>
      ${hint}</label>`;
  return `<label class="jf"><span class="jl">${esc(jf.label)}</span>
    <textarea id="${esc(id)}" rows="2"${subj}>${esc(v)}</textarea>
    ${hint}</label>`;
}

/* Two sections, because the two halves are written weeks apart and a form that
   mixes them asks a reader at entry to answer questions only the close can. Both
   are always shown -- hiding the review until a lifecycle closes would hide the
   plan's own review from anyone reading an old trade -- but the captions say
   which moment each belongs to. */
function journalForm(lc,je){
  const entered=JFIELDS.filter(jf=>jf.at==='entry');
  const closed=JFIELDS.filter(jf=>jf.at==='close');
  return `<div class="jform">
    <div class="jsec"><h3>At entry</h3>
      <div class="jsub">Written before the outcome is known, which is what makes it
        worth reading afterwards.</div>
      ${entered.map(jf=>jfield(jf,je,lc.anchor)).join('')}</div>
    <div class="jsec"><h3>At the close</h3>
      <div class="jsub">The review. Whether the plan was followed is a different
        question from whether the trade won.</div>
      ${closed.map(jf=>jfield(jf,je,lc.anchor)).join('')}</div>
  </div>
  <div class="jact">
    <button class="jsave" data-jsave="${esc(lc.anchor)}">Save</button>
    <span class="dim2">Only what you changed is written. Emptying every field
      deletes the entry.</span>
  </div>`;
}

/* Reads every field and posts them ALL, which is safe only because the server
   merges on key presence rather than replacing the row: an empty box here means
   "clear this", which is exactly what a reader deleting a sentence intends. The
   two are the same act from the form's side, and the server's rule is what keeps
   the entry form and the review from erasing each other across separate opens. */
function bindJournal(){
  document.querySelectorAll('[data-jopen]').forEach(b=>
    b.onclick=()=>{const a=b.dataset.jopen;
      S.jrnl=S.jrnl===a?null:a; draw();});
  document.querySelectorAll('[data-jsave]').forEach(b=>
    b.onclick=async()=>{
      const anchor=b.dataset.jsave;
      const body={anchor};
      /* Every field is one element with an id -- textarea or select -- so this
         reads them all the same way. That uniformity is the point: it is what lets
         `preserveInputs` protect the whole form with one selector. */
      JFIELDS.forEach(jf=>{
        const el=$('#j-'+jf.name);
        body[jf.name]=el?el.value:'';
      });
      b.disabled=true; b.classList.add('busy');
      let jnres;
      try{
        const r=await fetch('/api/journal',{method:'POST',
          headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        jnres=await r.json();
      }catch(err){
        b.disabled=false; b.classList.remove('busy');
        note('Could not save: '+esc(err)+' — your text is still on screen.','bad');
        return;
      }
      if(!jnres.ok){
        b.disabled=false; b.classList.remove('busy');
        note(esc(jnres.message||'the journal write was refused')
          +' Nothing was saved, and your text is still on screen.','bad');
        return;
      }
      /* Closed on success, because the reader has finished the act. Reopening is
         one click and the badge above it now says what landed. */
      S.jrnl=null;
      note(jnres.entry?'Written up.':'Entry deleted — every field was empty.','ok');
      await load();
    });
}

/* ------------------------------------------------ positions */
function positions(){
  const ps=S.state.positions||[], h=S.state.history||{};
  const open=(h.open||[]);
  /* Cost basis comes from the snapshot row itself, which carries it for every
     position. This used to read only from the history payload's open episodes,
     where cost_basis is set exclusively for snapshot-only ones -- so the short
     put, which has fills on record, rendered a dash even though the snapshot
     held -1569.907847. The history lookup stays as a fallback for a snapshot
     row that lacks the column. */
  let val=0; ps.forEach(pos=>val+=(pos.value.base||0));
  /* Snapshot rows grouped by the LIFECYCLE that opened them, via conid --
     the same episode-exact linkage the Trades tab uses, so the strangle is
     one position with two contract rows beneath it. Rows no open lifecycle
     claims (snapshot-only contracts from before the archive) group under
     their own heading rather than being forced into a strategy story the
     data cannot back. */
  const lcByConid={};
  (S.state.lifecycles||[]).forEach(lc=>{
    if(lc.status==='open') (lc.conids||[]).forEach(cid=>lcByConid[cid]=lc);});
  const buckets=[]; const seen={};
  ps.forEach(pos=>{
    const lc=lcByConid[String(pos.conid)];
    const key=lc?'lc:'+lc.conids.join(','):'solo:'+pos.conid;
    if(!seen[key]){seen[key]={lc,rows:[]};buckets.push(seen[key]);}
    seen[key].rows.push(pos);
  });
  /* A row resolves to its LIFECYCLE's replay where an open one claims it, so
     clicking either leg of a strangle opens one chart showing both strikes --
     the position is the strategy, not the contract. `lcByConid` is the same map
     the grouping above uses and carries the same open-only rule the payload
     applied, so the two agree on who claims what by construction. A row nothing
     claims falls back to its own single-strike replay: that is the snapshot-only
     case, which has no lifecycle anywhere and is otherwise the position with the
     most history and no way to see it. */
  const rkeyOf=pos=>{const lc=lcByConid[String(pos.conid)];
    const key=(lc&&lc.replay_key)||('pos:'+pos.conid);
    return (S.state.replays||{})[key]?key:null;};
  /* Which row OWNS the open panel, when several share one replay. A strangle is
     two position rows pointing at ONE trade, so both used to render the panel and
     the page emitted two charts of the same position -- and with them two
     #rscrub, two #rfocus and two #rclipr. `$()` takes the first, so the second
     chart was inert: dragging its scrubber moved the first one's crosshair.
     Panels are addressed by fixed id precisely because only one is ever open, so
     the guard belongs here at the only place that can open two.

     The FIRST row in table order claims it, which is also the one whose subtotal
     the reader is reading down from. */
  const owner={};
  ps.forEach(pos=>{const k=rkeyOf(pos);
    if(k&&owner[k]===undefined) owner[k]=String(pos.conid);});
  const row=pos=>{const ep=open.find(x=>x.conid===pos.conid)||{};
    const key=rkeyOf(pos);
    const shown=key&&S.replay===key&&owner[key]===String(pos.conid);
    return `<tr${key?` class="rk" data-replay="${esc(key)}"`:''}><td class="mono">${
      esc(pos.symbol)}</td>
    <td class="side ${String(pos.side).toLowerCase()==='short'?'sell':'buy'}">${esc(pos.side)}</td>
    <td class="n mono ${cls(pos.position)}">${pos.position}</td>
    <td class="n mono">${money(pos.mark_price,pos.currency)}</td>
    <td class="n mono">${moneyOf(pos.value)}</td>
    <td class="n mono">${moneyOf(pos.cost_basis)}</td>
    <td class="n mono ${cls(pos.unrealized.base)}">${moneyOf(pos.unrealized)}</td>
    <td class="dim">${esc(pos.currency)}</td>
    <td class="dim2">${ep.snapshot_only?'snapshot only':ep.entry_outside_window?'partial':'complete'}</td>
  </tr>${shown?`<tr class="rpanel"><td colspan="9">${
    replayPanel((S.state.replays||{})[key],'Unrealised',
      `<b class="${cls(pos.unrealized.base)}">${moneyOf(pos.unrealized)}</b>`)}</td></tr>`:''}`;};
  const grpRow=bkt=>{
    /* Not `b` -- that name is the DOM button binding elsewhere in this page,
       and one name for two shapes blinds the payload guard to both. */
    const label=bkt.lc?`${bkt.lc.underlying||''} — ${bkt.lc.label}, opened ${
      String(bkt.lc.opened_at||'').slice(0,10)}`:'Ungrouped — no opening fills in the archive';
    let uv=0; bkt.rows.forEach(pos=>uv+=(pos.value.base||0));
    /* The subtotal sums `value`, so it sits in the `value` column. It used to
       ride a colspan=8 label and land in column 9 -- under `record` -- four
       columns adrift of the figures it totals, which is exactly the "total in
       a column that is not its own" failure this table is meant to make
       checkable. Label spans contract..mark, the subtotal takes value, and a
       trailing span covers cost basis..record.

       The label span covers contract..mark, so it must equal the count of
       columns before `value`. It is derived from the header in a test rather
       than trusted, because a column added or removed anywhere to the left
       slides the subtotal into a neighbouring column -- which is exactly the
       "total in a column that is not its own" defect this comment records
       fixing, and it has already happened once. */
    return `<tr class="grp"><td colspan="4" class="dim">${esc(label)}</td>
      <td class="n mono ${cls(uv)}">${cash(uv)}</td>
      <td colspan="4"></td></tr>${bkt.rows.map(row).join('')}`;};
  return `<div class="card">
    <div class="crow"><div><h2>Option book</h2>
      <div class="sub">From the ${esc((ps[0]&&ps[0].report_date)||'latest')} position
      snapshot — the only cost-basis source for anything opened before the archive
      starts. Grouped by the strategy each position was opened as.</div></div>
      <div class="pills"><span class="pill">book value
        <b class="${cls(val)}">${cash(val)}</b></span></div></div>
    ${ps.length?`<table><thead><tr><th>contract</th><th>side</th><th class="n">qty</th>
      <th class="n">mark</th><th class="n">value</th><th class="n">cost basis</th>
      <th class="n">unrealised</th><th>price ccy</th><th>record</th></tr></thead><tbody>
      ${buckets.map(grpRow).join('')}</tbody></table>`:'<div class="empty">no open options</div>'}
    ${open.some(ep=>ep.snapshot_only)?`<div class="note">A position marked
      <b>snapshot only</b> was opened before the earliest archived statement, so no
      opening fill exists anywhere and its entry price and holding period are
      unknown. The cost basis shown comes from the snapshot.</div>`:''}
  </div>`;
}

/* ------------------------------------------------ costs */
/* This tab answers one question -- what has the broker cost me -- and its whole
   design is about not overstating the answer. Three rules run through it:

   1. THE SCOPE IS THE READER'S. Four selectable options, and they are not
      mutually exclusive, so the control is a multi-select (`.multi`) rather than
      the segmented `.seg` every other tab uses. The server owns the default and
      echoes back the scope it measured, so a caption can never name a scope the
      figures did not come from.
   2. CHARGED AND ESTIMATED NEVER MERGE SILENTLY. Roughly a quarter of this
      account's friction is the AutoFX rate markup, which IBKR never itemised in
      any currency. The headline prints the midpoint of its range because a
      headline has to print something, and the range sits immediately beneath it.
   3. A COST IS SHOWN IN THE CURRENCY IT WAS BILLED IN. `Charge` carries the whole
      per-currency ledger, so widening the scope adds columns instead of
      collapsing four exact charges into one restatement. The base total is
      labelled as the translation it is. */

/** The scope selector. Options that ARE asset categories, plus 0DTE, which is
 * not -- it is a subset of options, so it renders as a modifier (dashed) and
 * narrows whatever categories are in scope rather than adding a fifth. */
const COST_OPTIONS=[
  ['OPT','Options',false],
  ['STK','Stocks',false],
  ['CASH','FX conversions',false],
  ['0DTE','0DTE',true],
];
function costScope(){
  /* The SERVER's answer, not S.cost: with nothing chosen S.cost is null and the
     server applied its own default, so reading local state would leave every
     chip unlit on first load while the figures below described a real scope. */
  const csc=(S.state.broker_costs||{}).scope||{};
  const on=new Set(csc.categories||[]);
  if(csc.subset) on.add(csc.subset);
  return `<div class="filters">
    <div><div class="flabel">Costs to include</div>
      <div class="multi">${COST_OPTIONS.map(([key,label,sub])=>{
        const sel=on.has(key);
        const n=(S.state.asset_counts||{})[key];
        /* 0DTE is offerable exactly when the journal HAS 0DTE round trips,
           derived from the payload the 0DTE tab already reads -- not asserted
           here, which is the defect its own tab's disabled reason once carried. */
        const live=key==='0DTE'?odteSelectable():(key==='OPT'||n>0);
        return `<button data-cost="${esc(key)}" class="${sel?'on':''}${
          sub?' subset':''}" ${live?'':'disabled'} title="${esc(
          costOptionNote(key,label,sub,live))}">${esc(label)}</button>`;
      }).join('')}</div></div>
  </div>${costScopeNote(csc)}`;
}
function costOptionNote(key,label,sub,live){
  if(!live) return key==='0DTE'
    ? 'Nothing in the archive was opened on its own expiry date.'
    : `No ${label.toLowerCase()} in the journal.`;
  if(sub) return 'A subset of options, not a fourth category: narrows whichever '
    +'categories are selected to the round trips opened on their own expiry date.';
  if(key==='CASH') return 'Currency conversions. Includes the AutoFX rate markup, '
    +'which IBKR never itemises -- an estimate, shown as a range.';
  return `Commission and taxes on ${label.toLowerCase()}, as billed.`;
}
/* Says what a selection did NOT change, which is the honest half. Fees carry no
   asset category, so no selection narrows them; a reader who ticks Options and
   sees the total move but the fee block stand still deserves to know why here
   rather than by inferring it. */
function costScopeNote(csc){
  const bits=[];
  if(csc.is_subset) bits.push(`<b>${esc(csc.subset)} only.</b> Commission and taxes
    are restricted to those round trips.`);
  bits.push(`Account fees and withholding carry no asset category, so they are
    shown whole at every selection and never narrow with it.`);
  return `<div class="note">${bits.join(' ')}</div>`;
}

/** One line per currency a cost was actually billed in, plus the base
 * translation labelled as derived. This is what `Charge` buys over `Money`:
 * under a mixed scope the ledger survives where a single figure cannot. */
function ledger(ch,{calc=true}={}){
  const rows=Object.entries((ch&&ch.charged)||{})
    .sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  if(!rows.length) return '';
  /* One charge in the display currency needs no reconciliation line: the charge
     IS the figure, and adding "= €15.16" beside "$17.46" when the reader asked
     for dollars would restate the very number they came for. */
  const single=rows.length===1&&rows[0][0]===DISP();
  return `<div class="ledger">
    ${rows.map(([c,a])=>`<span class="amt"><span class="c">${esc(c)}</span>${
      esc(num(Math.abs(a),dp(a)))}</span>`).join('')}
    ${calc&&!single?`<span class="amt calc tipped" tabindex="0">= ${
      cash(Math.abs(ch.base))}<span class="tip">The base-currency translation:
      each charge converted at IBKR's own rate for its own date, then summed.
      Addable, and never exactly what left the account.</span></span>`:''}
  </div>`;
}

function costs(){
  const bc=S.state.broker_costs;
  if(!bc) return costScope()
    +`<div class="card"><div class="empty">no cost data</div></div>`;
  const CT=bc.totals, F=CT.friction;
  const nothing=!CT.fills&&!CT.unattributable.base;
  if(nothing) return costScope()
    +`<div class="card"><div class="empty">nothing in this selection</div></div>`;
  /* The headline is ONE figure, and it is the midpoint when any of it is
     estimated. Its range and its composition are both one hover away, and the
     line under it states the split unconditionally -- so the number can be read
     quickly and cannot be mistaken for a measurement. */
  const headline=F.is_estimated?F.total_mid_base:F.total_low_base;
  const est=F.estimated_mid_base;
  return `${costScope()}
  <div class="card">
    <div class="crow"><div><h2>Broker cost${F.is_estimated?`<span
      class="info tipped" tabindex="0"><span class="tip">Part of this total was
      never itemised by IBKR. The AutoFX rate markup is estimated from a
      published rate, so the figure shown is the midpoint of
      ${cash(F.total_low_base)}–${cash(F.total_high_base)}.</span>i</span>`:''}</h2>
      <div class="sub">${esc(costPeriod(bc))} ·
        ${CT.fills} fill(s) · ${esc(costScopeLabel(bc.scope))} · ${esc(ccyNote())}</div></div>
      <div class="pills">
        <span class="pill tipped" tabindex="0">charged <b>${
          cash(F.stated.base)}</b><span class="tip">What IBKR billed, summed from
          the per-currency charges below. A measurement, not an estimate.</span></span>
        ${F.is_estimated?`<span class="pill tipped" tabindex="0">estimated <b>${
          cash(est)}</b><span class="tip">The AutoFX rate markup on ${
          num(CT.autofx.notional_base,0)} ${esc(BASE())} converted across ${
          CT.autofx.conversions} auto-conversion(s). IBKR publishes ${
          CT.autofx.bps} bps and describes it as typical and at its discretion; a
          year of this account's conversions implied ${CT.autofx.measured_bps} bps.
          Shown here as the midpoint of ${cash(F.estimated_low_base)}–${
          cash(F.estimated_high_base)}.</span></span>`:''}
      </div>
    </div>
    <div class="hero">
      <div class="fig${F.is_estimated?' est':''}">${cash(headline)}</div>
      <div class="split">${cash(F.stated.base)} charged${F.is_estimated
        ?` · ${cash(F.estimated_low_base)}–${cash(F.estimated_high_base)} estimated`
        :` · nothing estimated`}</div>
    </div>
    ${ledger(F.stated)}
    ${costCategories(bc)}
    ${costFx(bc)}
    ${costAside(bc)}
  </div>`;
}
/* The span the figures cover, from the first and last fill IN SCOPE. With
   nothing in scope there are no dates, and "→" alone read as a range that failed
   to load rather than as a selection matching no trade -- the fees below it are
   real, so the caption has to say which of the two it is. */
function costPeriod(bc){
  return bc.from_date&&bc.to_date
    ? `${bc.from_date} → ${bc.to_date}`
    : 'no trades in this selection';
}
/* Names the scope in the same vocabulary the chips use, from the payload's own
   echo -- so the caption and the figures cannot describe different selections. */
function costScopeLabel(csc){
  const names=(csc.categories||[]).map(c=>{
    const found=COST_OPTIONS.find(o=>o[0]===c);
    return found?found[1]:c;
  });
  const base=names.length?names.join(' + '):'everything';
  return csc.subset?`${base}, ${csc.subset} only`:base;
}

/** Per category: what it was billed, and what that is per contract or share.
 * A table rather than stat cards because the interesting reading is a COMPARISON
 * down the per-unit column, and cards put the figures on separate lines. */
function costCategories(bc){
  const rows=bc.by_category||[];
  if(!rows.length) return '';
  const anyQty=rows.some(cc=>cc.per_unit!=null);
  return `<div class="card inner">
    <h2 class="sub2">Charged per category</h2>
    <table><thead><tr><th>category</th><th class="n">fills</th>
      <th class="n">orders</th><th class="n">quantity</th>
      <th class="n">commission</th><th class="n">taxes</th>
      ${anyQty?`<th class="n">per unit</th>`:''}</tr></thead><tbody>
      ${rows.map(cc=>`<tr><td class="mono">${esc(cc.category)}</td>
        <td class="n mono">${cc.fills}</td>
        <td class="n mono">${cc.orders}</td>
        <td class="n mono">${cc.quantity?num(cc.quantity,cc.quantity%1?4:0):'—'}</td>
        <td class="n mono">${chargeFig(cc.commission)}</td>
        <td class="n mono">${cc.taxes.base?chargeFig(cc.taxes):'—'}</td>
        ${anyQty?`<td class="n mono">${cc.per_unit==null
          /* Not a gap: a conversion's quantity is an amount of money, so cost
             per unit would be commission per euro. The dash says "not a rate". */
          ?`<span class="nil tipped" tabindex="0">n/a<span class="tip">A
            conversion's quantity is an amount of money, so a per-unit cost would
            be commission per euro -- not a rate anyone charges.</span></span>`
          :chargeFig(cc.per_unit,4)}</td>`:''}</tr>`).join('')}
    </tbody></table>
    ${bc.totals.credit_fills?`<div class="note">${bc.totals.credit_fills} fill(s)
      carried a commission CREDIT, netted off rather than added — IBKR issues one
      when it adjusts a per-order minimum across a split order.</div>`:''}
  </div>`;
}
/* A charge as one figure: the amount as billed when one currency accounts for
   it, else the base translation. Same rule as `moneyOf`, which it delegates to --
   a Charge payload carries Money's three keys precisely so this can. */
const chargeFig=(ch,places)=>ch==null?'—'
  :(places!=null&&isNative(ch)?money(Math.abs(ch.native),ch.ccy,places)
   :places!=null?cash(Math.abs(ch.base),places):moneyOf(ch));

/** Conversions, with the two legs kept apart: a manual conversion pays a stated
 * commission, an auto-conversion pays a markup buried in the rate. Both in bps,
 * because that is the only way to see that the "free" one is not cheaper. */
function costFx(bc){
  const rows=bc.fx||[];
  if(!rows.length) return '';
  const A=bc.totals.autofx;
  return `<div class="card inner">
    <h2 class="sub2">Currency conversions</h2>
    <div class="sub">A manual conversion pays commission; an auto-conversion pays
      a rate markup instead, which IBKR does not itemise. Both shown in bps so
      they are comparable.</div>
    <table><thead><tr><th>pair</th><th class="n">n</th>
      <th class="n">notional</th><th class="n">commission</th><th class="n">bps</th>
      <th class="n">auto n</th><th class="n">auto notional</th>
      <th class="n">markup @${A.bps}bps</th></tr></thead><tbody>
      ${rows.map(fxr=>`<tr><td class="mono">${esc(fxr.symbol)}</td>
        <td class="n mono">${fxr.conversions}</td>
        <td class="n mono">${cash(fxr.notional_base)}</td>
        <td class="n mono">${fxr.commission.base?chargeFig(fxr.commission):'—'}</td>
        <td class="n mono">${fxr.commission_bps==null?'—':num(fxr.commission_bps,2)}</td>
        <td class="n mono">${fxr.auto.conversions||'—'}</td>
