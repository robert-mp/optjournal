name: quality

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The 104 JS unit tests run from pytest, via subprocess, and are SKIPPED
      # rather than failed when no node is on PATH -- deliberately, so the Python
      # half stays testable on a machine with no JavaScript runtime. That skip is
      # right locally and wrong in CI: the runner images happen to ship node today,
      # so the suite has been running by luck, and the day an image drops it the
      # frontend tests would go quiet with the build still green.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests cron
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
