[project]
name = "optjournal"
version = "0.1.0"
description = "Options trading journal backed by IBKR Flex Web Service"
requires-python = ">=3.12"
dependencies = [
    # py_ibkr provides both Flex transport (async statement generation,
    # reference-code redemption, rate-limit and lockout handling) and
    # Pydantic-typed parsing. It models 85 of the 86 Trade attributes our
    # query emits; the only gap is `requestID`, a Flex request artefact
    # rather than trade data.
    #
    # Its models use extra="ignore", so attributes IBKR adds later are
    # dropped silently rather than raising. tests/test_flex.py guards that.
    "py-ibkr==0.1.7",
    "keyring==25.7.0",
]

[project.scripts]
optjournal = "optjournal.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest==8.4.2",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optjournal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/optjournal"]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear (real bug patterns),
# UP outdated idioms, SIM simplifications. N (naming) is deliberately absent:
# the code mirrors IBKR's camelCase attribute names at the parsing boundary,
# and renaming them would put a translation layer between the statement and
# the reader for zero safety.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    # One-letter and short names are idiomatic in this codebase's tight
    # numeric code; ruff has no rule for that, but E741 (ambiguous l/I/O)
    # does fire on the order-leg binding `l` mirrored from the page JS.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# Tests re-import private helpers on purpose; that is what they test.
"tests/*" = ["SIM117"]
